<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B0A0D">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="description" content="Eles aprenderam a imitar as vozes de quem você deixou entrar.">

<link rel="apple-touch-icon" href="icon-192.png">
<title>NÃO ABRA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--txt:16.5px;
  --breu:#0B0A0D;--parede:#16131A;--lampiao:#C9A227;--mofo:#7A8B7F;
  --ferrugem:#8C2F1E;--papel:#E8E2D4;
  --display:'Bodoni Moda',Georgia,serif;
  --corpo:'Crimson Pro',Georgia,serif;
  --mostrador:'Share Tech Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100dvh;max-height:100dvh;height:100%;overflow:hidden;background:var(--breu)}
body{font-family:var(--corpo);color:var(--papel);font-size:17px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
#chama{position:fixed;inset:0;pointer-events:none;z-index:60;
  background:radial-gradient(ellipse 125% 82% at 50% 42%,transparent 28%,rgba(0,0,0,.78) 100%);
  mix-blend-mode:multiply}
#grao{position:fixed;inset:0;pointer-events:none;z-index:61;opacity:.05;width:100%;height:100%}
#flutuantes{position:fixed;top:96px;right:14px;z-index:70;pointer-events:none;
  display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.flut{font-family:var(--mostrador);font-size:13px;letter-spacing:.06em;
  text-shadow:0 1px 6px #000;animation:sobe 2.2s ease-out both}
@keyframes sobe{0%{opacity:0;transform:translateY(8px)}12%{opacity:1;transform:none}
  70%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}

#boot{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:26px;padding:30px;text-align:center;background:var(--breu)}
#boot h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,16vw,74px);
  letter-spacing:.06em;line-height:.92}
#boot h1 em{display:block;font-style:normal;color:var(--ferrugem);font-weight:700}
#boot p{max-width:31ch;color:var(--mofo);font-size:16px;font-style:italic}
.aviso{font-family:var(--mostrador);font-size:11px;letter-spacing:.14em;color:var(--lampiao);
  text-transform:uppercase;opacity:.78;max-width:29ch;line-height:1.95;font-style:normal!important}

#painel{flex:0 0 auto;padding:9px 13px 8px;background:linear-gradient(180deg,#1B1721,#0F0D13);
  border-bottom:1px solid #2A232E;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.med{display:flex;align-items:center;gap:9px}
.rot{font-family:var(--mostrador);font-size:9px;letter-spacing:.17em;color:var(--mofo);
  text-transform:uppercase;width:48px;flex:0 0 auto}
.barra{flex:1;height:6px;background:#09070B;border:1px solid #2A232E;overflow:hidden}
.barra i{display:block;height:100%;transition:width .6s ease}
#b-comb i{background:linear-gradient(90deg,#5E4810,var(--lampiao))}
#b-ruido i{background:linear-gradient(90deg,#3A1610,var(--ferrugem))}
#b-porta i{background:linear-gradient(90deg,#3A2A1C,#8B6A45)}
.val{font-family:var(--mostrador);font-size:11px;width:30px;text-align:right}
#extras{grid-column:1;font-family:var(--mostrador);font-size:10px;letter-spacing:.1em;
  color:var(--mofo);display:flex;gap:14px;padding-top:2px}
#extras b{color:var(--papel);font-weight:400}
#relogio{grid-row:1/5;font-family:var(--mostrador);text-align:right;
  border-left:1px solid #2A232E;padding-left:12px}
#relogio b{display:block;font-size:19px;color:var(--lampiao);font-weight:400;letter-spacing:.04em}
#relogio span{font-size:9px;letter-spacing:.15em;color:var(--mofo);text-transform:uppercase}

#cena{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:0}
#tela{width:100%;flex:0 0 auto;display:block;background:#000;touch-action:none}
#texto{font-size:var(--txt);flex:1 1 auto;overflow-y:auto;padding:16px 46px 6px 21px;-webkit-overflow-scrolling:touch;min-height:19vh;overscroll-behavior:contain}
#texto p{margin-bottom:12px;animation:surge .5s ease both}
@keyframes surge{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fala{border-left:2px solid var(--ferrugem);padding-left:13px;font-style:italic;
  color:#F3EDDF;font-size:19px;line-height:1.45}
.narr{color:#BEB6A7}
.sist{font-family:var(--mostrador);font-size:11.5px;letter-spacing:.08em;
  color:var(--lampiao);text-transform:uppercase}
.perigo{color:#B84B33;font-weight:600}
.bom{color:var(--mofo)}
.alerta{color:#E0703F;font-weight:600;background:rgba(140,47,30,.13);
  border-left:3px solid var(--ferrugem);padding:8px 11px}
.sinais{border:1px solid #3A2A24;background:rgba(140,47,30,.07);padding:11px 13px;
  margin:14px 0 4px;display:flex;flex-direction:column;gap:6px}
.sinais b{font-family:var(--mostrador);font-size:11px;letter-spacing:.13em;
  text-transform:uppercase;color:#E0703F;font-weight:400}
.sinais span{font-size:14.5px;color:#C6A99E;line-height:1.4}
.sinais .dica{color:var(--mofo);font-style:italic;font-size:13.5px}
.cap{font-family:var(--display);font-size:12.5px;letter-spacing:.27em;text-transform:uppercase;
  color:var(--mofo);border-bottom:1px solid #262029;padding-bottom:9px;margin-bottom:15px}
.gente{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid #1E1922;align-items:baseline}
.gente.com-rosto{align-items:center;gap:12px}
.gente-txt{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.gente-txt b{font-family:var(--display);font-size:17px;font-weight:400}
.gente-txt small{font-family:var(--mostrador);font-size:9.5px;color:var(--lampiao);
  letter-spacing:.08em;text-transform:uppercase}
.gente-txt span{color:var(--mofo);font-size:13.5px;font-style:italic;margin:0;text-align:left}
canvas.rosto{flex:0 0 auto;border:1px solid #2A2330;background:#0C0A10;image-rendering:auto}
button.bt-rosto{gap:10px}
button.bt-rosto canvas.rosto{margin-right:2px}
.fraco{color:#6A6273;font-style:italic;font-size:15px}
.sonho{color:#8E86A0;font-style:italic;font-size:19px;line-height:1.6;
  text-align:center;letter-spacing:.02em;animation:surge 1.6s ease both}
.gente b{font-family:var(--display);font-size:17px;font-weight:400;flex:0 0 auto}
.gente small{font-family:var(--mostrador);font-size:9.5px;color:var(--lampiao);
  letter-spacing:.08em;text-transform:uppercase}
.gente span{color:var(--mofo);font-size:14px;font-style:italic;margin-left:auto;
  text-align:right;flex:1 1 auto}

#acoes{flex:0 0 auto;padding:11px 13px calc(13px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:7px;background:linear-gradient(180deg,transparent,#0B0A0D 20%);
  max-height:34vh;overflow-y:auto;overscroll-behavior:contain}
button{font-family:var(--corpo);font-size:16.5px;color:var(--papel);background:#1A161F;
  border:1px solid #322A38;padding:12px 14px;text-align:left;cursor:pointer;transition:.15s;
  line-height:1.3;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%}
button:active{background:#251F2B;transform:translateX(2px)}
button:disabled{opacity:.3;pointer-events:none}
button .custo{font-family:var(--mostrador);font-size:9.5px;letter-spacing:.09em;
  color:var(--mofo);flex:0 0 auto;text-transform:uppercase;text-align:right}
button.prim{background:#251A18;border-color:var(--ferrugem);color:#F0D8CE}
button.chave{background:transparent;border-color:var(--lampiao);color:var(--lampiao);
  font-family:var(--display);letter-spacing:.15em;text-transform:uppercase;font-size:13.5px;
  justify-content:center;padding:14px}
button:focus-visible{outline:2px solid var(--lampiao);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== LER O QUE JÁ PASSOU ===== */
#cena{position:relative}
#texto .passado{opacity:.38}
#texto .passado.fala{opacity:.45}
.separa{height:1px;background:linear-gradient(90deg,transparent,#2E2636 30%,#2E2636 70%,transparent);
  margin:16px 0 14px;flex:0 0 auto}
#seta-cima,#seta-baixo{
  position:absolute;right:9px;z-index:12;
  width:34px;height:34px;min-height:34px;padding:0;margin:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(12,10,16,.82);border:1px solid #322B3E;border-radius:50%;
  color:var(--lampiao);font-size:15px;line-height:1;cursor:pointer;
  opacity:0;pointer-events:none;transform:scale(.85);
  transition:opacity .22s ease,transform .22s ease;
  backdrop-filter:blur(2px);
}
#seta-cima{top:10px}
#seta-baixo{bottom:10px}
#seta-cima.vis,#seta-baixo.vis{opacity:.85;pointer-events:auto;transform:scale(1)}
#seta-baixo.novo{
  opacity:1;border-color:var(--lampiao);background:rgba(201,162,39,.30);
  animation:pisca 1.1s ease-in-out infinite;
}
@keyframes pisca{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
#seta-cima:active,#seta-baixo:active{opacity:1;background:rgba(201,162,39,.22)}

#acoes button.travado{
  opacity:.42;border-style:dashed;border-color:#4A3A3A;
}
#acoes button.travado .custo{color:#8C4A3A}
#acoes button.negado{
  animation:nega .34s ease;border-color:var(--ferrugem);
}
@keyframes nega{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-5px)}
  75%{transform:translateX(5px)}
}

/* ===== BARRA DE AÇÕES RECOLHÍVEL ===== */
#barra-topo{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:5px 13px 0;gap:8px;
}
#barra-cont{
  font-family:var(--mostrador);font-size:10px;letter-spacing:.14em;
  color:#5E5769;text-transform:uppercase;
}
#barra-x{
  width:30px;height:30px;min-height:30px;padding:0;margin:0;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  background:transparent;border:1px solid #322A38;border-radius:50%;
  color:#6A6273;font-size:13px;line-height:1;
}
#barra-x:active{background:#251F2B;color:var(--papel)}
#barra-aba{
  display:none;flex:0 0 auto;margin:0;width:100%;
  padding:9px 13px calc(9px + env(safe-area-inset-bottom));
  background:#12101A;border:none;border-top:1px solid #2A2432;
  justify-content:center;align-items:center;gap:8px;
  font-family:var(--mostrador);font-size:11px;letter-spacing:.16em;
  color:#6A6273;text-transform:uppercase;
}
#barra-aba::before{content:'▲';font-size:9px;color:var(--lampiao);opacity:.7}
#barra-aba.tem{color:var(--lampiao)}
#barra-aba.tem::before{opacity:1}
#barra-aba.novo{animation:abaPulsa .9s ease}
@keyframes abaPulsa{
  0%,100%{background:#12101A}
  40%{background:rgba(201,162,39,.22)}
}
body.barra-off #acoes{display:none}
body.barra-off #barra-topo{display:none}
body.barra-off #barra-aba{display:flex}
body.barra-off #texto{padding-bottom:14px}

#versao{
  position:fixed;left:6px;top:4px;z-index:80;
  font-family:var(--mostrador);font-size:9px;letter-spacing:.12em;
  color:#4A4454;pointer-events:none;
}
</style>
</head>
<body>
<canvas id="grao"></canvas>
<div id="flutuantes"></div>
<div id="chama"></div>
<div id="app">
  <div id="versao">v48</div>
<div id="painel" hidden>
    <div class="med"><span class="rot">Diesel</span><div class="barra" id="b-comb"><i style="width:100%"></i></div><span class="val" id="v-comb">100</span></div>
    <div class="med"><span class="rot">Ruído</span><div class="barra" id="b-ruido"><i style="width:0%"></i></div><span class="val" id="v-ruido">0</span></div>
    <div class="med"><span class="rot">Porta</span><div class="barra" id="b-porta"><i style="width:88%"></i></div><span class="val"></span></div>
    <div id="extras">
      <span>latas <b id="v-lata">12</b></span>
      <span>gente <b id="v-gente">1</b></span>
      <span>casa <b id="v-moral">firme</b></span>
      <span>rem <b id="v-rem">1</b></span>
      <span>água <b id="v-agua">2</b></span>
    </div>
    <div id="relogio"><b id="r-hora">07:00</b><span id="r-dia">Dia 1</span></div>
  </div>
  <div id="cena"><canvas id="tela"></canvas><div id="texto"></div></div>
  <div id="acoes"></div>
</div>
<div id="boot">
  <h1>NÃO<em>ABRA</em></h1>
  <p>Eles aprenderam a imitar as vozes de quem você deixou entrar.</p>
  <p class="aviso">Use fones.<br>O jogo fala com você.</p>
  <button class="chave" id="btn-boot" style="max-width:280px">Acender o lampião</button>
</div>
<script>
/* ================= ÁUDIO v2 ================= */
const A={ctx:null,ruido:null,master:null,seco:null,molhado:null,conv:null,
  ger:null,vozes:[],amb:{},tensao:0,batimento:null,ambNivel:1};

function iniciarAudio(){
  if(A.ctx)return;
  const C=window.AudioContext||window.webkitAudioContext;
  A.ctx=new C();
  const sr=A.ctx.sampleRate;

  // ruído rosa
  const buf=A.ctx.createBuffer(1,sr*3,sr),d=buf.getChannelData(0);
  let b0=0,b1=0,b2=0;
  for(let i=0;i<d.length;i++){
    const w=Math.random()*2-1;
    b0=.99765*b0+w*.0990460; b1=.96300*b1+w*.2965164; b2=.57000*b2+w*1.0526913;
    d[i]=(b0+b1+b2+w*.1848)*.28;
  }
  A.ruido=buf;

  // cadeia principal
  const comp=A.ctx.createDynamicsCompressor();
  comp.threshold.value=-14; comp.ratio.value=4; comp.attack.value=.004; comp.release.value=.25;
  A.master=A.ctx.createGain(); A.master.gain.value=.9;
  A.master.connect(comp); comp.connect(A.ctx.destination);

  // reverberação da casa (impulso procedural)
  A.conv=A.ctx.createConvolver();
  A.conv.buffer=gerarImpulso(1.9,3.2);
  A.molhado=A.ctx.createGain(); A.molhado.gain.value=.30;
  A.seco=A.ctx.createGain(); A.seco.gain.value=1;
  A.molhado.connect(A.conv); A.conv.connect(A.master); A.seco.connect(A.master);

  carregarVozes();
}
function gerarImpulso(dur,decai){
  const sr=A.ctx.sampleRate, n=Math.floor(sr*dur);
  const imp=A.ctx.createBuffer(2,n,sr);
  for(let c=0;c<2;c++){
    const ch=imp.getChannelData(c);
    for(let i=0;i<n;i++){
      const t=i/n;
      ch[i]=(Math.random()*2-1)*Math.pow(1-t,decai)*(1-t*.3);
    }
    // reflexões discretas: dá impressão de paredes próximas
    [0.011,0.019,0.031,0.047].forEach((r,k)=>{
      const p=Math.floor(sr*r); if(p<n) ch[p]+= (0.5-k*.1)*(c?1:-1);
    });
  }
  return imp;
}
function ambienteCasa(){ if(A.conv) A.conv.buffer=gerarImpulso(1.9,3.2), A.molhado.gain.value=.30; }
function ambienteRua(){ if(A.conv) A.conv.buffer=gerarImpulso(3.4,1.6), A.molhado.gain.value=.46; }
function ambientePorao(){ if(A.conv) A.conv.buffer=gerarImpulso(2.6,2.2), A.molhado.gain.value=.55; }

function carregarVozes(){
  if(!('speechSynthesis'in window))return;
  const p=()=>{const v=speechSynthesis.getVoices();A.vozes=v.filter(x=>/pt/i.test(x.lang)).concat(v).slice(0,12);};
  p(); speechSynthesis.onvoiceschanged=p;
}
function src(){const s=A.ctx.createBufferSource();s.buffer=A.ruido;s.loop=true;return s;}

/* roteia um nó com panorâmica e envio de reverb */
function saida(no,{pan=0,rev=.35,vol=1}={}){
  const g=A.ctx.createGain(); g.gain.value=vol;
  let p=null;
  if(A.ctx.createStereoPanner){p=A.ctx.createStereoPanner();p.pan.value=Math.max(-1,Math.min(1,pan));}
  no.connect(g);
  const alvo=p?(g.connect(p),p):g;
  const env=A.ctx.createGain(); env.gain.value=rev;
  alvo.connect(A.seco); alvo.connect(env); env.connect(A.molhado);
  return g;
}

/* ---- eventos sonoros ---- */
function batida(qtd=3,forca=1,pan=0){
  if(!A.ctx)return;
  for(let i=0;i<qtd;i++){
    const t=A.ctx.currentTime+i*(.30+Math.random()*.14);
    // impacto seco
    const s=src(),f=A.ctx.createBiquadFilter(),g=A.ctx.createGain();
    f.type='lowpass'; f.frequency.value=190+Math.random()*130; f.Q.value=7;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.9*forca,t+.006);
    g.gain.exponentialRampToValueAtTime(.001,t+.26);
    s.connect(f); f.connect(g); saida(g,{pan,rev:.5});
    s.start(t); s.stop(t+.32);
    // corpo da madeira
    const o=A.ctx.createOscillator(),og=A.ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(84,t); o.frequency.exponentialRampToValueAtTime(34,t+.18);
    og.gain.setValueAtTime(.55*forca,t); og.gain.exponentialRampToValueAtTime(.001,t+.21);
    o.connect(og); saida(og,{pan,rev:.4}); o.start(t); o.stop(t+.24);
    // ressonância do batente
    const r=A.ctx.createOscillator(),rg=A.ctx.createGain();
    r.type='triangle'; r.frequency.value=143+Math.random()*30;
    rg.gain.setValueAtTime(.10*forca,t+.01); rg.gain.exponentialRampToValueAtTime(.001,t+.5);
    r.connect(rg); saida(rg,{pan,rev:.6}); r.start(t); r.stop(t+.52);
  }
}
function ligarGerador(){
  if(!A.ctx||A.ger)return;
  const s=src(),f=A.ctx.createBiquadFilter(),g=A.ctx.createGain();
  f.type='lowpass'; f.frequency.value=150; f.Q.value=2;
  g.gain.value=0; g.gain.linearRampToValueAtTime(.10,A.ctx.currentTime+2.5);
  s.connect(f); f.connect(g); saida(g,{pan:-.25,rev:.5});
  const o=A.ctx.createOscillator(),og=A.ctx.createGain();
  o.type='sawtooth'; o.frequency.value=42; og.gain.value=.026;
  const lfo=A.ctx.createOscillator(),lg=A.ctx.createGain();
  lfo.type='sine'; lfo.frequency.value=4.9; lg.gain.value=10;
  lfo.connect(lg); lg.connect(o.frequency); lfo.start();
  o.connect(og); saida(og,{pan:-.25,rev:.4});
  // pistão: pulso rítmico que dá vida à máquina
  const pist=A.ctx.createOscillator(),pg=A.ctx.createGain(),pf=A.ctx.createBiquadFilter();
  pist.type='square'; pist.frequency.value=9.6;
  pf.type='lowpass'; pf.frequency.value=95; pg.gain.value=.05;
  pist.connect(pf); pf.connect(pg); saida(pg,{pan:-.3,rev:.35});
  s.start(); o.start(); pist.start();
  A.ger={s,o,lfo,pist,g,f,pf,pist_o:pist};
}
function ajustarGerador(pct){
  if(!A.ger)return;
  const t=A.ctx.currentTime,p=pct/100;
  A.ger.g.gain.linearRampToValueAtTime(.03+.08*p,t+1);
  A.ger.f.frequency.linearRampToValueAtTime(78+80*p,t+1);
  A.ger.o.frequency.linearRampToValueAtTime(29+15*p,t+1);
  A.ger.pist_o.frequency.linearRampToValueAtTime(5.5+4.6*p,t+1);
}
function desligarGerador(){
  if(!A.ger)return; const t=A.ctx.currentTime,G=A.ger; A.ger=null;
  G.g.gain.linearRampToValueAtTime(0,t+2);
  G.o.frequency.exponentialRampToValueAtTime(8,t+2);
  G.pist_o.frequency.exponentialRampToValueAtTime(.6,t+2);
  setTimeout(()=>{[G.s,G.o,G.lfo,G.pist].forEach(x=>{try{x.stop()}catch(e){}})},2600);
}

    }
    if(!('speechSynthesis'in window)||!A.vozes.length){setTimeout(res,txt.length*58+700);return;}
    speechSynthesis.cancel();

  CV.width=Math.round(l*DPR);CV.height=Math.round(alt*DPR);

function desenharVazio(w,h,t){
  CX.fillStyle='#050406';CX.fillRect(0,0,w,h);
  const bruxa=.5+Math.sin(t*2.4)*.16+Math.sin(t*7.9)*.08;
  const g=CX.createRadialGradient(w/2,h*.5,6,w/2,h*.5,h*.85);
  g.addColorStop(0,`rgba(201,162,39,${.085*bruxa})`);
  g.addColorStop(.4,`rgba(140,90,30,${.03*bruxa})`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  CX.fillStyle=g;CX.fillRect(0,0,w,h);
}

let _modoAnt=null;
function laco(ts){
  cena.t=ts/1000;
  if(cena.modo!==_modoAnt){_modoAnt=cena.modo;dimensionar();pedirFade();}
  /* tem que ser o MESMO fator do dimensionar. Quando eram
     diferentes, a cena era desenhada em 67% do canvas e o resto
     ficava com lixo de buffer — as listras. */
  const w=CV.width/DPR,h=CV.height/DPR;
  /* apaga o quadro anterior inteiro: sem isso, qualquer cena
     que não pinte tudo deixa resto do quadro passado */
  CX.clearRect(0,0,w,h);
  CX.fillStyle='#050406';CX.fillRect(0,0,w,h);
  CX.save();
  if(['casa','porta','rua','casafora'].includes(cena.modo))respiraImagem(w,h,cena.t);
  if(cena.modo==='porta')desenharPorta(w,h,cena.t);
  else if(cena.modo==='casa')desenharCasa(w,h,cena.t);
  else if(cena.modo==='fim')pintarFim(w,h,cena.t);
  else if(cena.modo==='olho')desenharLente(w,h,cena.t);
  else if(cena.modo==='rua')desenharRua(w,h,cena.t);
  else if(cena.modo==='escuta')desenharEscuta(w,h,cena.t);
  else if(cena.modo==='mapa')desenharMapa(w,h,cena.t);
  else if(cena.modo==='conversa')desenharPessoa(w,h,cena.t);
  else if(cena.modo==='mochila')desenharMochila(w,h,cena.t);
  else if(cena.modo==='casafora')desenharCasaFora(w,h,cena.t);
  else desenharVazio(w,h,cena.t);
  CX.restore();
  if(!['olho','escuta','mapa','fim','mochila'].includes(cena.modo)){
    if(cena.modo==='rua'||cena.modo==='casa'||cena.modo==='casafora')aplicarTom(w,h);

    if(S.chuva&&cena.modo==='casa'&&cena.casa&&cena.casa.voce===8)desenharChuva(w,h,cena.t);

    cena.clarao-=.06;
  }
  requestAnimationFrame(laco);
}

S.porta={reforco:1,tranca:false,olho:false,dano:0};

const MAX_REFORCO=6;
Object.defineProperty(S,'reforco',{configurable:true,
  get(){return S.porta.reforco},
  set(v){S.porta.reforco=trava(v,0,MAX_REFORCO)}});

function pregar(q){
  const antes=S.porta.reforco;
  S.porta.reforco=trava(S.porta.reforco+q,0,MAX_REFORCO);

}

function riscoInvasao(){
  let base=S.ruido/150+S.porta.dano/400;
  if(S.diesel<18)base+=.30;
  else if(S.diesel<40)base+=.10;
  let def=Math.pow(.90,S.porta.reforco);
  if(S.porta.tranca)def*=.85;
  if(S.armadilha)def*=.90;
  def*=Math.pow(.92,S.muro||0);
  if(S.chuva)def*=.65;
  if(S.cachorro&&S.cachorro.vivo)def*=.93;
  return trava(base*def,.02,.85);
}

<script>
/* ================= ROSTOS ================= */
function hashNome(n){
  let h=2166136261;
  for(let i=0;i<n.length;i++){h^=n.charCodeAt(i);h=Math.imul(h,16777619);}
  return Math.abs(h);
}
function semente(h,i){const x=Math.sin((h%9973)+i*127.1)*43758.5453;return x-Math.floor(x);}

const PELE=['#6B5044','#7E6152','#5A4238','#8A6C58','#4E3A31','#93755F'];
const CABELO=['#1A1418','#2B2019','#3E2C1E','#141014','#4A3A2A','#5C5058'];

function pintarRosto(x,tam,p,estado){
  const h=hashNome(p.n+p.id),s=i=>semente(h,i);
  const q=tam/100;
  x.clearRect(0,0,tam,tam);
  x.fillStyle='#0C0A10';x.fillRect(0,0,tam,tam);

  const quebrado=estado==='quebrado';
  const off=(i)=>quebrado?(s(i)-.5)*tam*.22:0;
  const pele=PELE[Math.floor(s(1)*PELE.length)];
  const cab=CABELO[Math.floor(s(2)*CABELO.length)];
  const larg=(52+s(3)*20)*q, alt=(64+s(4)*16)*q;
  const cx=tam/2, cy=tam*.56;

  // pescoço e ombros
  x.fillStyle='#241C22';
  x.fillRect(cx-larg*.28,cy+alt*.34,larg*.56,tam);
  x.beginPath();x.ellipse(cx,tam*1.12,larg*1.15,tam*.38,0,0,7);x.fill();

  // cabeça
  x.save();x.translate(off(20),off(21));
  x.fillStyle=pele;
  x.beginPath();
  x.ellipse(cx,cy,larg/2,alt/2,0,0,7);
  x.fill();
  // queixo
  const qx=s(5);

  x.moveTo(cx-larg*.34,cy+alt*.12);
  x.quadraticCurveTo(cx,cy+alt*(.5+qx*.16),cx+larg*.34,cy+alt*.12);
  x.fill();
  // sombra lateral
  x.fillStyle='rgba(0,0,0,.28)';
  x.beginPath();x.ellipse(cx+larg*.22,cy,larg*.24,alt*.42,0,0,7);x.fill();
  x.restore();

  // cabelo
  x.save();x.translate(off(22),off(23));
  x.fillStyle=cab;
  const tipo=Math.floor(s(6)*5);
  if(tipo===0){
    x.beginPath();x.ellipse(cx,cy-alt*.30,larg*.54,alt*.30,0,Math.PI,0);x.fill();
  }else if(tipo===1){
    x.beginPath();x.ellipse(cx,cy-alt*.22,larg*.58,alt*.40,0,Math.PI,0);x.fill();
    x.fillRect(cx-larg*.58,cy-alt*.22,larg*.16,alt*.5);
    x.fillRect(cx+larg*.42,cy-alt*.22,larg*.16,alt*.42);
  }else if(tipo===2){
    x.beginPath();x.ellipse(cx,cy-alt*.34,larg*.48,alt*.22,0,Math.PI,0);x.fill();
  }else if(tipo===3){
    x.beginPath();x.ellipse(cx,cy-alt*.26,larg*.56,alt*.34,0,Math.PI,0);x.fill();
    x.beginPath();x.ellipse(cx-larg*.3,cy+alt*.05,larg*.2,alt*.3,0,0,7);x.fill();
    x.beginPath();x.ellipse(cx+larg*.3,cy+alt*.05,larg*.2,alt*.3,0,0,7);x.fill();
  }else{
    x.fillStyle='rgba(0,0,0,.5)';
    x.beginPath();x.ellipse(cx,cy-alt*.32,larg*.5,alt*.2,0,Math.PI,0);x.fill();
  }

  // olhos
  const oy=cy-alt*.06, sep=larg*(.19+s(7)*.05), oa=alt*.045+q*.5;
  [-1,1].forEach((d,i)=>{
    x.save();x.translate(off(30+i),off(32+i));
    x.fillStyle='#E6DFD2';
    x.beginPath();x.ellipse(cx+d*sep,oy,larg*.10,oa,0,0,7);x.fill();
    if(estado!=='morto'){
      x.fillStyle='#15100F';
      x.beginPath();x.arc(cx+d*sep+(s(8)-.5)*2*q,oy,oa*.62,0,7);x.fill();
    }else{
      x.strokeStyle='#15100F';x.lineWidth=1.6*q;
      x.beginPath();x.moveTo(cx+d*sep-larg*.1,oy);x.lineTo(cx+d*sep+larg*.1,oy);x.stroke();
    }
    // sobrancelha
    x.strokeStyle=cab;x.lineWidth=(2+s(9)*2.2)*q;
    x.beginPath();
    x.moveTo(cx+d*sep-larg*.11,oy-alt*.13-s(10)*alt*.04);
    x.lineTo(cx+d*sep+larg*.11,oy-alt*.12+(s(11)-.5)*alt*.06);
    x.stroke();
    x.restore();
  });

  // nariz e boca
  x.save();x.translate(off(40),off(41));
  x.strokeStyle='rgba(0,0,0,.4)';x.lineWidth=1.6*q;
  x.beginPath();
  x.moveTo(cx-q*1.5,oy+alt*.04);
  x.lineTo(cx-larg*.05,oy+alt*.17);
  x.lineTo(cx+larg*.04,oy+alt*.17);
  x.stroke();
  const bl=larg*(.16+s(12)*.1), by=cy+alt*.26;
  x.strokeStyle='rgba(30,12,12,.75)';x.lineWidth=(2+s(13)*1.5)*q;

  x.quadraticCurveTo(cx,by+(s(14)-.6)*alt*.09,cx+bl/2,by);
  x.stroke();
  x.restore();

  // marca característica
  const m=Math.floor(s(15)*6);
  if(m===0){ // barba
    x.fillStyle='rgba(20,15,18,.55)';
    x.beginPath();x.ellipse(cx,cy+alt*.30,larg*.30,alt*.20,0,0,7);x.fill();
  }else if(m===1){ // óculos
    x.strokeStyle='rgba(190,180,170,.5)';x.lineWidth=1.4*q;
    [-1,1].forEach(d=>{x.beginPath();x.arc(cx+d*sep,oy,larg*.15,0,7);x.stroke();});
    x.beginPath();x.moveTo(cx-sep+larg*.15,oy);x.lineTo(cx+sep-larg*.15,oy);x.stroke();

  // sujeira

<script>
/* ================= MIXAGEM POR PRIORIDADE =================
   voz > drone > evento > ambiente > gerador.
   Cada camada abaixa as de baixo automaticamente. */
const BARRA={voz:5,drone:4,evento:3,ambiente:2,gerador:1};
A.mix={ativo:{},gan:{}};
function montarBarramentos(){
  if(!A.ctx||A.mix.pronto)return;
  ['voz','drone','evento','ambiente','gerador'].forEach(k=>{
    const g=A.ctx.createGain();g.gain.value=1;g.connect(A.master);
    A.mix.gan[k]=g;A.mix.ativo[k]=0;
  });
  A.mix.pronto=true;
}
function reduzirAbaixo(nivel,fator,seg){
  if(!A.ctx||!A.mix.pronto)return;
  const t=A.ctx.currentTime;
  Object.keys(BARRA).forEach(k=>{
    if(BARRA[k]>=nivel)return;
    const g=A.mix.gan[k];
    g.gain.cancelScheduledValues(t);
    g.gain.linearRampToValueAtTime(fator,t+.18);
    if(seg)g.gain.linearRampToValueAtTime(1,t+seg+.7);
  });
}
function marcarCamada(nome,seg){
  if(!A.mix.pronto)montarBarramentos();
  const n=BARRA[nome];if(!n)return;
  const fator=nome==='voz'?.30:nome==='drone'?.62:.55;
  reduzirAbaixo(n,fator,seg);
}

/* ================= ASSINATURA SONORA POR BICHO =================
   Dá pra aprender qual é antes de ver. */
function assinatura(bicho,pan,vol){
  if(!A.ctx)return;
  const t=A.ctx.currentTime,v=vol==null?1:vol;
  marcarCamada('evento',1.5);
  if(bicho==='magro'){
    // estalo seco de articulação, três vezes
    for(let i=0;i<3;i++){
      const tt=t+i*.14;
      const s=src(),f=A.ctx.createBiquadFilter(),g=A.ctx.createGain();
      f.type='bandpass';f.frequency.value=2400-i*300;f.Q.value=14;
      g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(.11*v,tt+.004);
      g.gain.exponentialRampToValueAtTime(.001,tt+.07);
      s.connect(f);f.connect(g);saida(g,{pan,rev:.5});s.start(tt);s.stop(tt+.08);
    }
  }else if(bicho==='rastejante'){
    const s=src(),f=A.ctx.createBiquadFilter(),g=A.ctx.createGain();
    f.type='bandpass';f.frequency.value=760;f.Q.value=1.1;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(.055*v,t+.4);
    for(let i=0;i<8;i++)g.gain.linearRampToValueAtTime(.02*v+Math.random()*.045*v,t+.4+i*.22);
    g.gain.linearRampToValueAtTime(0,t+2.5);
    s.connect(f);f.connect(g);saida(g,{pan,rev:.65});s.start(t);s.stop(t+2.6);
  }else if(bicho==='inchado'){
    // fole: respiração enorme e lenta
    for(let i=0;i<2;i++){
      const tt=t+i*1.5;
      const s=src(),f=A.ctx.createBiquadFilter(),g=A.ctx.createGain();
      f.type='lowpass';f.frequency.setValueAtTime(280,tt);
      f.frequency.linearRampToValueAtTime(140,tt+.9);
      g.gain.setValueAtTime(0,tt);
      g.gain.linearRampToValueAtTime(.10*v,tt+.45);

    }
  }else if(bicho==='coro'){
    // duas vozes no mesmo compasso, levemente desafinadas
    [0,.04].forEach((off,i)=>{
      const o=A.ctx.createOscillator(),g=A.ctx.createGain();
      o.type='sawtooth';o.frequency.value=104+i*3.5;
      g.gain.setValueAtTime(0,t+off);

      g.gain.linearRampToValueAtTime(0,t+off+1.5);

      o.start(t+off);o.stop(t+off+1.6);
    });
  }else if(bicho==='imitador'){
    sussurro(7,pan,.05);
  }else if(bicho==='primordial'){
    // infrassom: você sente antes de ouvir
    const o=A.ctx.createOscillator(),g=A.ctx.createGain(),f=A.ctx.createBiquadFilter();
    o.type='sine';o.frequency.setValueAtTime(24,t);
    o.frequency.linearRampToValueAtTime(17,t+3.5);
    f.type='lowpass';f.frequency.value=90;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(.16*v,t+1.2);
    g.gain.linearRampToValueAtTime(0,t+4);
    o.connect(f);f.connect(g);saida(g,{pan:0,rev:.95});o.start(t);o.stop(t+4.1);
    const s=src(),f2=A.ctx.createBiquadFilter(),g2=A.ctx.createGain();
    f2.type='highpass';f2.frequency.value=6000;
    g2.gain.setValueAtTime(0,t+.6);
    g2.gain.linearRampToValueAtTime(.02*v,t+1.6);
    g2.gain.linearRampToValueAtTime(0,t+3.6);
    s.connect(f2);f2.connect(g2);saida(g2,{pan:0,rev:.4});s.start(t+.6);s.stop(t+3.7);
  }
}

<script>

/* ducking: o ambiente abaixa enquanto alguém fala */
function abaixarAmbiente(v,tempo){
  if(!A.ctx)return;

  [A.amb.vento&&A.amb.vento.g,A.comodo&&A.comodo.g,A.chuva&&A.chuva.g,A.ger&&A.ger.g]
    .filter(Boolean).forEach(g=>{

      g._cheio=g._cheio??atual;
      g.gain.cancelScheduledValues(t);
      g.gain.linearRampToValueAtTime(g._cheio*v,t+.25);
    });
  if(tempo)setTimeout(devolverAmbiente,tempo*1000);
}
function devolverAmbiente(){
  if(!A.ctx)return;
  const t=A.ctx.currentTime;
  [A.amb.vento&&A.amb.vento.g,A.comodo&&A.comodo.g,A.chuva&&A.chuva.g,A.ger&&A.ger.g]
    .filter(Boolean).forEach(g=>{
      if(g._cheio==null)return;
      g.gain.cancelScheduledValues(t);
      g.gain.linearRampToValueAtTime(g._cheio,t+.9);

function chorar(pan){

function risada(pan){

      diz(p.doente>=3?`${p.n} está pior. A febre não baixa e ele não reconhece mais ninguém.`
        :`${p.n} continua de cama, com febre.`,'perigo');
    }
  });
}
function aproximar(a,b,d){
  a.lacos=a.lacos||{};b.lacos=b.lacos||{};
  a.lacos[b.n]=trava((a.lacos[b.n]||0)+d,-100,100);
  b.lacos[a.n]=trava((b.lacos[a.n]||0)+d,-100,100);
}
function amigos(p){
  return S.abrigo.filter(o=>o!==p&&(p.lacos&&p.lacos[o.n]>40));
}
function morreuAlguem(p,como){
  p.comoMorreu=como;
  if(typeof mexerTrilho==='function')mexerTrilho('culpa',9);
  if(typeof marcarNoite==='function'&&(S.hora>=19||S.hora<7))
    marcarNoite({mortos:((S.ultimaNoite&&S.ultimaNoite.mortos)||[]).concat(p.n)});
  S.mortos.push(p);
  S.abrigo=S.abrigo.filter(x=>x!==p);
  registrarVoz(p,como);
  S.abrigo.forEach(o=>{
    const v=(o.lacos&&o.lacos[p.n])||0;
    if(v>40){
      o.moral=trava(o.moral-25,0,100);
      setTimeout(()=>{},0);
    }else o.moral=trava(o.moral-6,0,100);
  });
  const proximos=S.abrigo.filter(o=>o.lacos&&o.lacos[p.n]>60);
  if(proximos.length&&chance(.4)){
    const q=sortear(proximos);
    diz(`${q.n} era próximo de ${p.n}. Fica olhando a porta a noite toda sem falar nada.`,'perigo');
  }
}

/* ================= TAREFAS ================= */
const TAREFAS=[
 {id:'porta',n:'Reforçar a porta',hab:'carpintaria'},
 {id:'cozinha',n:'Cozinhar pra casa',hab:'cozinha'},
 {id:'agua',n:'Encher os galões',hab:null},
 {id:'vigia',n:'Vigiar a rua',hab:'ouvido fino'},
 {id:'gerador',n:'Cuidar do gerador',hab:'mecânica'},

function menuTarefas(){
  limpar();cap(`Dia ${S.dia} · o que cada um faz`);
  diz('Você distribui o dia. Eles fazem sozinhos e o resultado sai à noite.','sist');
  if(!S.abrigo.length){
    diz('Não tem ninguém pra mandar. Só você.','narr');
    AC.innerHTML='';return botao('Começar o dia',()=>irPara(4,true),{cls:'chave'});
  }
  const semTarefa=S.abrigo.filter(p=>!S.tarefas[p.n]);
  S.abrigo.forEach(p=>{
    const t=S.tarefas[p.n];
    const nome=t?TAREFAS.find(x=>x.id===t).n:'sem nada pra fazer';
    fichaRosto(p,p.hab,nome+(p.moral<25?' · no limite':''),'vivo');
  });
  AC.innerHTML='';
  if(semTarefa.length){
    semTarefa.slice(0,1).forEach(p=>{
      diz(`O que ${p.n} faz hoje?`,'sist');
      TAREFAS.forEach(t=>{
        if(t.id==='gerador'&&S.gerSaude>75)return;
        botao(t.n,()=>{S.tarefas[p.n]=t.id;menuTarefas();},
          {custo:t.hab&&p.hab===t.hab?'é a praia dele':(t.risco?'pode não voltar':'')});
      });
    });
  }else{
    botao('Começar o meu dia',()=>irPara(4,true),{cls:'chave'});
    botao('Trocar as tarefas',()=>{S.tarefas={};menuTarefas();});
  }
}

function resolverTarefas(){
  S.resultados=[];
  S.abrigo.slice().forEach(p=>{
    const id=S.tarefas[p.n];if(!id)return;
    const t=TAREFAS.find(x=>x.id===id);
    const bom=t.hab&&p.hab===t.hab;
    const falso=p===S.infiltrado;

    if(p.doente>0&&chance(.6)){
      S.resultados.push(`${p.n} está doente e não levantou da cama.`);
      return;
    }
    if(p.moral<20&&chance(.35)){
      S.resultados.push(`${p.n} não fez nada. Ficou sentado no quarto o dia inteiro.`);
      p.moral=trava(p.moral-3,0,100);return;
    }
    if(falso&&chance(.6)){
      S.resultados.push(`${p.n} diz que fez, mas não dá pra ver onde.`);
      return;
    }
    if(id!=='descanso')p.moral=trava(p.moral-4,0,100);

    if(id==='porta'){
      const q=pregar(bom?2:1);
      S.resultados.push(q?`${p.n} pregou ${q===2?'duas tábuas':'uma tábua'} na porta.`
        :`${p.n} olhou a porta, viu que não cabe mais tábua, e foi fazer outra coisa.`);
    }else if(id==='cozinha'){
      if(S.comida>=2){S.comida-=2;const m=bom?18:10;mexerMoral(m);
        S.resultados.push(`${p.n} cozinhou. A casa comeu junto e ficou melhor.`);}
      else S.resultados.push(`${p.n} não achou lata pra cozinhar.`);
    }else if(id==='agua'){
      const q=S.filtro?3:2;S.agua=Math.min(6,S.agua+q);
      S.resultados.push(`${p.n} encheu os galões. ${S.agua} de 6.`);
    }else if(id==='vigia'){
      S.vigiou=chance(bom?.55:.35)?{tipo:'monstro'}:{tipo:'gente'};
      S.resultados.push(S.vigiou.tipo==='monstro'
        ?`${p.n} viu uma delas rondando a rua de tarde.`
        :`${p.n} passou o dia na janela e não viu nada de anormal.`);
    }else if(id==='gerador'){
      const q=bom?32:14;S.gerSaude=Math.min(100,S.gerSaude+q);
      S.resultados.push(`${p.n} mexeu no gerador. Ele está rodando mais limpo.`);
    }else if(id==='descanso'){
      p.moral=trava(p.moral+8,0,100);
      S.resultados.push(`${p.n} descansou. Está com a cara menos ruim.`);
    }else if(id==='rua'){
      const morre=chance(bom?.17:.3);
      if(morre){
        morreuAlguem(p,`não voltou de uma saída que você mandou fazer sozinho, na noite ${S.dia}`);
        S.resultados.push(`${p.n} saiu de manhã e não voltou. Ninguém foi atrás.`);
        S.confianca=trava(S.confianca-14,0,100);
      }else{
        const d=Math.round(14+Math.random()*26),l=Math.round(2+Math.random()*6);
        S.diesel=trava(S.diesel+d,0,100);S.comida+=l;
        S.resultados.push(`${p.n} voltou com ${d} litros e ${l} latas. Não quis contar como foi.`);
        p.moral=trava(p.moral-6,0,100);
      }
    }
    // trabalhar junto aproxima
    const outros=S.abrigo.filter(o=>o!==p&&S.tarefas[o.n]===id);
    outros.forEach(o=>aproximar(p,o,9));
  });
  S.tarefas={};
}

async function caiUmaCasa(){
  if(!S.casas)return;
  const vivas=S.casas.filter(c=>c.viva);
  if(vivas.length<=1)return;
  const candidatas=vivas.filter(x=>x.ajuda<2);
  const c=candidatas.length?sortear(candidatas):sortear(vivas);
  c.viva=false;
  c.vivos.forEach(nome=>{
    const p={n:nome,id:30+(hashNome(nome)%30),alt:.45,hab:'ouvido fino',ef:'—',
      frase:'Aqui é '+nome+'. Tem alguém ouvindo?',mem:'o rádio',
      fala:['A gente ouvia vocês todo dia.']};
    registrarVoz(p,`estava em ${c.n} quando a casa caiu, na noite ${S.dia}`);
  });
  anotar(`${c.n} parou de transmitir.`);
  mexerMoral(-9);
  const m=quem('rádio');
  await pausa(900);
  if(m&&m!==S.infiltrado){
    diz(`${m.n} está com o rádio ligado quando ${c.n} para de transmitir. Não desligou. Parou no meio de uma palavra.`,'perigo');
    await pausa(1800);
    silencioSubito(2.5);
    await pausa(2600);
    diz('Chuvisco.','perigo');
    await pausa(900);reagir('radioCaiu');
  }else{
    diz(`Alguma coisa aconteceu com ${c.n} essa noite. Você só vai descobrir depois.`,'perigo');
  }
  await pausa(1400);
  diz(`Agora elas sabem imitar ${c.vivos.join(', ')}. Você nunca viu a cara de nenhum deles.`,'alerta');
}
function menuAjudarCasa(){
  const c=S.radioAlvo;
  if(!c||!c.viva)return false;
  botao(`Deixar comida pro pessoal de ${c.n.replace(/^(o|a|os|as|uma) /,'')}`,()=>{
    if(S.comida<4){limpar();cap('Rádio');diz('Você não tem quatro latas sobrando. Você mal tem as suas.','perigo');return menuComodo(0);}
    S.comida-=4;c.ajuda++;ganhou({comida:-4});
    gastarHoras(3);
    limpar();cap('Rádio');
    diz(`Você combina um ponto na esquina da Rua 7 e deixa quatro latas lá. Volta sem olhar pra trás.`,'bom');
    diz(`${c.n} agradece pelo rádio. A voz treme.`,'bom');
    mexerMoral(7);S.confianca=trava(S.confianca+8,0,100);
    anotar(`Deixou comida pra ${c.n}.`);
    menuComodo(0);
  },{custo:'3 horas · 4 latas'});
  return true;
}
function retribuicao(){
  const amigas=S.casas?S.casas.filter(c=>c.viva&&c.ajuda>0):[];
  if(!amigas.length||!chance(.3))return false;
  const c=sortear(amigas);

  diz(`Tem uma caixa no portão de manhã. Bilhete: "Vocês ajudaram primeiro." É ${c.n}.`,'bom');

}

/* ================= O GERADOR ================= */
S.gerSaude=100;S.peca=false;S.gerQuebrado=false;

function desgastarGerador(){
  let d=6+Math.random()*7;
  if(tem('mecânica')&&quem('mecânica')!==S.infiltrado)d*=.55;
  if(S.rafaelGer&&S.abrigo.some(p=>p.n==='Rafael'))d*=.5;
  if(S.gerBaixo)d*=.7;
  S.gerSaude=Math.max(0,S.gerSaude-d);
  if(A.ger){
    const p=S.gerSaude/100;
    A.ger.pist_o.frequency.linearRampToValueAtTime(trava(3+p*7,2,10),A.ctx.currentTime+2);
    A.ger.o.frequency.linearRampToValueAtTime(trava(24+p*20,20,45),A.ctx.currentTime+2);
  }
  if(S.gerSaude<=0&&!S.gerQuebrado){S.gerQuebrado=true;return true;}
  return false;
}
function estadoGerador(){
  const s=S.gerSaude;
  return s>70?['Rodando limpo.','bom']
       :s>45?['Batendo de leve. Dá pra ouvir uma peça folgada.','sist']
       :s>20?['Tossindo. Ele engasga umas duas vezes por hora.','perigo']
       :['Ele não passa dessa semana. Você ouve isso sem entender de motor.','perigo'];
}

function objetivoDe(p){return OBJETIVOS[p.n]||null;}
function talvezRevelar(p){
  const o=objetivoDe(p);
  if(!o)return false;
  p.conversas=(p.conversas||0)+1;
  if(p.objRevelado||p.conversas<2)return false;
  if(!chance(.55))return false;
  p.objRevelado=true;
  S.objetivos=S.objetivos||[];
  S.objetivos.push({dono:p.n,...o,feito:false,ignorado:0});
  diz(o.conta,'fala');
  diz(`Agora dá pra passar ${o.n} numa expedição.`,'sist');
  anotar(`${p.n} quer ${o.n}.`);
  return true;
}
function objetivosNoLocal(id){
  return (S.objetivos||[]).filter(o=>o.local===id&&!o.feito
    &&S.abrigo.some(p=>p.n===o.dono));
}

  diz(o.feito2||o.feito===true?OBJETIVOS[o.dono].feito:'',{});

  p.moral=100;p.objFeito=true;
  S.abrigo.forEach(x=>{if(x!==p)aproximar(p,x,10)});
  S.confianca=trava(S.confianca+18,0,100);

  anotar(`Atendeu ${o.dono}: ${o.n}.`);

async function eventoNoturno(){

  const e=sortear(validos);
  limpar();AC.innerHTML='';
  cap('Madrugada');
  const txt=typeof e.t==='function'?e.t():e.t;
  await pausa(700);
  diz(txt,'perigo');
  if(chance(.4))estalo(chance(.5)?-.6:.6);
  await pausa(900);

    AC.innerHTML='';

      AC.innerHTML='';

      await pausa(1500);

function carregar(){
  try{
    const d=JSON.parse(localStorage.getItem(CHAVE));
    if(!d)return false;
    /* ANTES: lista escrita à mão. Toda versão eu somava campo no
       salvar() e esquecia aqui — 33 campos estavam sendo salvos e
       jogados fora no carregamento. Agora copia tudo que veio, e
       só os que precisam de tratamento especial são tocados. */
    const ESPECIAIS=['abrigo','pool','mortos','vozesRoubadas','log'];
    Object.keys(d).forEach(k=>{
      if(ESPECIAIS.includes(k))return;
      if(d[k]!==undefined)S[k]=d[k];
    });
    /* garantias contra save meio velho ou meio quebrado */
    S.porta=S.porta||{reforco:1,tranca:false,olho:false,dano:0};
    S.avarias=Array.isArray(S.avarias)?S.avarias.filter(a=>a&&AVARIAS[a.id]):[];
    S.ferra=Array.isArray(S.ferra)?S.ferra.filter(f=>FERRA[f]):[];
    S.mat=(S.mat&&typeof S.mat==='object')?S.mat:{};
    S.cant=Array.isArray(S.cant)?S.cant.filter(c=>c&&CULT.some(x=>x.id===c.tipo)):[];
    S.veic=(S.veic&&typeof S.veic==='object')?S.veic:{};
    S.ameacas=Array.isArray(S.ameacas)?S.ameacas.filter(a=>a&&AMEACAS[a.id]):[];
    S.armas=Array.isArray(S.armas)?S.armas.filter(a=>ITENS.some(i=>i.id===a)):[];
    if(!CIDADES[S.cidade])S.cidade='cacoal';
    if(!CLIMAS[S.clima])S.clima=null;
    S.cidadesVistas=Array.isArray(S.cidadesVistas)?S.cidadesVistas:['cacoal'];
    S.objetivos=Array.isArray(S.objetivos)?S.objetivos.filter(o=>o&&OBJETIVOS[o.dono]):[];
    S.locaisLib=Array.isArray(S.locaisLib)?S.locaisLib.filter(k=>PERG_LOCAL[k]):[];
    S.saq=S.saq||{fase:0,tregua:0,mortos:[],dentro:0,visto:false};
    S.memAnom=S.memAnom||{metodo:{},local:{},pego:0,escapou:0,nivel:0};
    S.cfg=S.cfg||{fonte:1,velo:1,tela:false};
    /* as pessoas voltam com o que o jogo espera nelas */
    S.abrigo=(d.abrigo||[]).map(p=>({...p,lacos:p.lacos||{},moral:p.moral??60,
      doente:p.doente||0,local:PLANTA[p.local]?p.local:4}));
    S.pool=(d.pool||[]).map(p=>({...p,lacos:p.lacos||{},moral:p.moral??70}));
    S.mortos=d.mortos||[];
    S.vozesRoubadas=d.vozesRoubadas||[];
    if(typeof logDoSave==='function')logDoSave(d.log);
    if(typeof aplicarCfg==='function')aplicarCfg();
    return true;
  }catch(e){return false;}
}

function gravarHistorico(tipo){
  try{
    const h=lerHistorico();
    h.unshift({dia:S.dia,tipo,final:FINAIS[tipo]?FINAIS[tipo].t:'Fim',
      mortos:S.mortos.map(p=>({n:p.n,id:p.id})),vozes:S.vozesRoubadas.length,
      vivos:S.abrigo.map(p=>p.n)});
    localStorage.setItem(CHAVE_HIST,JSON.stringify(h.slice(0,5)));
  }catch(e){}
}
/* os mortos das partidas anteriores voltam */
function mortoDeAntes(){
  const h=lerHistorico();
  if(!h.length)return null;
  const todos=[];
  h.forEach(p=>(p.mortos||[]).forEach(m=>todos.push(m)));
  const novos=todos.filter(m=>!S.mortos.some(x=>x.n===m.n)&&!S.abrigo.some(x=>x.n===m.n));
  if(!novos.length)return null;
  const m=sortear(novos);
  const base=PESSOAS.find(p=>p.n===m.n);
  return base?{...base,deAntes:true}:null;
}

/* ================= FINAIS ================= */
function desenharFim(tipo){
  cena.modo='fim';cena.fimTipo=tipo;
}
function pintarFim(w,h,t){
  const tipo=cena.fimTipo||'fuga';
  CX.fillStyle='#050407';CX.fillRect(0,0,w,h);
  const amanhecer=['cheia','sozinho','ficar','ninguem'].includes(tipo);
  const g=CX.createLinearGradient(0,0,0,h);
  if(amanhecer){g.addColorStop(0,'#1B1520');g.addColorStop(.55,'#3A2A22');g.addColorStop(1,'#0A0709');}
  else{g.addColorStop(0,'#0A0810');g.addColorStop(1,'#050407');}
  CX.fillStyle=g;CX.fillRect(0,0,h>w?h*.62:h*.7,h);
  CX.fillStyle=g;CX.fillRect(0,0,w,h);

  // a casa
  const cw=w*.42,cx=w*.5-cw/2,ch=h*.4,cy=h*.52;
  CX.fillStyle=tipo==='deles'?'#0B0910':'#100D14';
  CX.fillRect(cx,cy,cw,ch);
  CX.beginPath();CX.moveTo(cx-cw*.1,cy);CX.lineTo(cx+cw/2,cy-ch*.4);
  CX.lineTo(cx+cw*1.1,cy);CX.closePath();CX.fill();
  // janelas
  const acesa=tipo!=='fuga'&&tipo!=='deles';
  for(let i=0;i<2;i++)for(let j=0;j<2;j++){
    const jx=cx+cw*(.2+i*.42),jy=cy+ch*(.16+j*.42);
    const bruxa=.6+Math.sin(t*2+i+j)*.2;
    CX.fillStyle=acesa?`rgba(201,162,39,${.5*bruxa})`:(tipo==='deles'?`rgba(140,47,30,${.35*bruxa})`:'#0A0810');
    CX.fillRect(jx,jy,cw*.18,ch*.2);
  }
  // porta
  CX.fillStyle=tipo==='deles'?'#000':'#1A1420';
  CX.fillRect(cx+cw*.42,cy+ch*.55,cw*.17,ch*.45);
  if(tipo==='deles'){
    CX.fillStyle=`rgba(140,47,30,${.2+Math.sin(t*3)*.15})`;
    CX.fillRect(cx+cw*.42,cy+ch*.55,cw*.17,ch*.45);
  }
  // as pessoas
  const gente=S.abrigo.length;
  const total=Math.min(6,gente+ (tipo==='virou'?0:1));
  for(let i=0;i<total;i++){
    const gx=w*.5+(i-(total-1)/2)*w*.075;
    const gy=cy+ch+h*.06;
    CX.fillStyle=tipo==='virou'&&i===total-1?'#8C2F1E':'#1C1720';
    CX.beginPath();CX.ellipse(gx,gy,w*.016,h*.045,0,0,7);CX.fill();
    CX.beginPath();CX.arc(gx,gy-h*.055,w*.014,0,7);CX.fill();
  }
  if(tipo==='virou'){
    const gx=w*.5+w*.24;
    CX.fillStyle='#8C2F1E';
    CX.beginPath();CX.ellipse(gx,cy+ch+h*.06,w*.016,h*.045,0,0,7);CX.fill();
    CX.beginPath();CX.arc(gx,cy+ch+h*.005,w*.014,0,7);CX.fill();
  }
  // chuva de grão / vinheta
  const v=CX.createRadialGradient(w/2,h*.5,h*.15,w/2,h*.5,h);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.9)');
  CX.fillStyle=v;CX.fillRect(0,0,w,h);
}

const FINAIS={
 cheia:{t:'Sobreviveu',c:'bom',x:()=>`Doze noites. No décimo terceiro dia passa um caminhão do Exército na rua e vocês sobem juntos, todos, sem olhar pra trás. ${S.abrigo.length} ${S.abrigo.length===1?'pessoa deve':'pessoas devem'} a vida a uma porta que você não abriu.`},

<script>
/* ================= O REPERTÓRIO ================= */
/* S.vozesRoubadas: [{p, noite, como}] */
function registrarVoz(p,como){
  if(S.vozesRoubadas.some(v=>v.p.n===p.n))return;
  S.vozesRoubadas.push({p,noite:S.dia,como:como||'você nunca soube como'});
  anotar(`Elas aprenderam a voz de ${p.n}. ${como||''}`.trim());
}
function vozesDisponiveis(){
  const vivos=new Set(S.abrigo.map(p=>p.n));
  return S.vozesRoubadas.filter(v=>!vivos.has(v.p.n));
}
function telaVozes(){
  limpar();cap('O que elas sabem imitar');
  const lista=S.vozesRoubadas;
  if(!lista.length){
    diz('Nenhuma voz ainda. Todo mundo que passou por essa porta ou está vivo aqui dentro, ou nunca chegou a falar.','bom');
  }else{
    diz(`${lista.length} ${lista.length===1?'voz':'vozes'}. Cada uma dessas pode bater na sua porta hoje à noite.`,'perigo');
    lista.forEach(v=>fichaRosto(v.p,'noite '+v.noite,v.como,'morto'));
    const vivos=lista.filter(v=>S.abrigo.some(p=>p.n===v.p.n));
    if(vivos.length){
      diz(' ','narr');
      diz(`${vivos.map(v=>v.p.n).join(', ')} ${vivos.length===1?'está':'estão'} vivo aqui dentro. Se essa voz bater na porta, tem duas dessa pessoa no mundo.`,'alerta');
    }
  }
  AC.innerHTML='';
  botao('Voltar',()=>irPara(cena.casa.voce),{cls:'chave'});
}

/* ================= O INFILTRADO ================= */
S.infiltrado=null;S.infiltradoDesde=0;S.pistasDadas=[];S.acusou=false;

function chanceInfiltrado(){
  if(S.infiltrado)return 0;
  if(S.dia<5)return 0;
  return trava(.08+(S.dia-5)*.017,.08,.20);
}
function talvezInfiltrar(p){
  if(!chance(chanceInfiltrado()))return false;
  S.infiltrado=p;S.infiltradoDesde=S.dia;S.pistasDadas=[];
  p.falso=true;
  return true;
}

const PISTAS=[
 p=>`A conta da despensa não fecha. Sobrou uma lata a mais, e a única pessoa que não pegou a dela hoje foi ${p.n}.`,
 p=>`${p.n} não estava em lugar nenhum às três da manhã. De manhã ninguém viu ${p.n} sair nem voltar.`,
 p=>{
   const m=S.mortos.filter(x=>x!==p);
   const alvo=m.length?sortear(m):null;
   return alvo?`${p.n} falou o nome de ${alvo.n} numa conversa. ${alvo.n} morreu antes de ${p.n} entrar nesta casa.`
              :`${p.n} descreveu o corredor do porão com detalhe demais pra quem chegou faz pouco tempo.`;
 },
 p=>{
   const o=S.abrigo.find(x=>x!==p);
   return o?`${o.n} te puxa de lado: “Eu passei na cozinha e tinha duas pessoas conversando. Quando eu entrei só tinha ${p.n}.”`
           :`Você ouve duas vozes conversando num cômodo vazio. Quando chega, só tem ${p.n}.`;
 },
 p=>`Você conversa com ${p.n} por uma hora. ${p.n} não hesita em nenhuma resposta. Nem quando você pergunta de coisa que dói.`,
 p=>`${p.n} está sentado no escuro sem lampião nenhum, olhando pra parede, e não pisca enquanto você fala.`,
 p=>`Faltou comida no prato de ${p.n} e ${p.n} não reclamou. Ninguém aqui deixa de reclamar de comida.`
];

async function pistaDoDia(){
  // depois de um save, a referência pode ter se perdido: p.falso é o backup
  if(!S.infiltrado){
    const f=S.abrigo.find(x=>x.falso);
    if(f)S.infiltrado=f;
  }
  if(await sabotagem())return;
  const p=S.infiltrado;
  if(!p||!S.abrigo.includes(p))return;
  const desde=S.dia-S.infiltradoDesde;
  if(desde<1)return;
  const quantas=Math.min(PISTAS.length,Math.floor(desde/(S.acusou?2:1.4))+1);
  if(S.pistasDadas.length>=quantas)return;
  const livres=PISTAS.map((_,i)=>i).filter(i=>!S.pistasDadas.includes(i));
  if(!livres.length)return;
  const i=sortear(livres);S.pistasDadas.push(i);
  await pausa(600);
  diz(PISTAS[i](p),'narr');
  anotar('Estranhou algo em '+p.n+'.');
  if(tem('ouvido fino')&&quem('ouvido fino')!==p&&S.pistasDadas.length>=2&&chance(.5)){
    diz(`${quem('ouvido fino').n} te olha e não fala nada. Depois fala: “Tem uma coisa aqui dentro que respira errado.”`,'perigo');
  }
}

function menuAcusar(){
  limpar();cap('Acusar alguém');
  diz('Você junta a casa na sala. Todo mundo entende o que isso significa antes de você falar.','narr');
  diz('Se você errar, você mata uma pessoa. E todo mundo vai ver.','alerta');
  AC.innerHTML='';
  S.abrigo.forEach(p=>{
    const b=botao(p.n,()=>confirmar(
      `Acusar ${p.n} na frente de todo mundo.`,

    b.classList.add('bt-rosto');
  });
  botao('Desistir disso',()=>irPara(cena.casa.voce),{cls:'chave'});
}

async function acusar(p){
  AC.innerHTML='';limpar();cap('A sala');S.acusou=true;
  gastarHoras(2);
  diz(`Você aponta ${p.n} na frente de todo mundo e diz o que está pensando.`,'sist');
  await pausa(1800);
  silencioSubito(2.2);
  await pausa(2400);

  if(S.infiltrado===p){
    rugido(.4);
    diz(`${p.n} não se defende. ${p.n} sorri, e o sorriso continua abrindo depois que devia ter parado.`,'perigo');
    await pausa(1600);
    await quebrarRosto(p);
    const alvo=S.abrigo.filter(x=>x!==p);
    S.abrigo=S.abrigo.filter(x=>x!==p);
    S.infiltrado=null;p.falso=false;
    if(alvo.length&&chance(.75)){
      const v=sortear(alvo);
      S.abrigo=S.abrigo.filter(x=>x!==v);S.mortos.push(v);
      registrarVoz(v,`morreu na sala quando a coisa caiu a máscara, na noite ${S.dia}`);
      diz(`Antes de sair pela janela dos fundos, leva ${v.n} junto. Ninguém consegue impedir.`,'perigo');
      mexerMoral(-10);
    }else{
      diz('Sai pela janela dos fundos sem levar ninguém. Vocês ficam parados no meio da sala por muito tempo.','sist');
    }
    await pausa(1500);
    mexerMoral(24);S.confianca=trava(S.confianca+30,0,100);
    diz('A casa inteira sabe que você acertou. Hoje é o dia em que eles passam a confiar em você de verdade.','bom');
    anotar(`Desmascarou ${p.n}. Não era gente.`);
  }else{
    diz(`${p.n} olha pra você sem entender. Depois entende.`,'perigo');
    await pausa(1900);
    S.abrigo=S.abrigo.filter(x=>x!==p);S.mortos.push(p);
    registrarVoz(p,`você acusou na noite ${S.dia}, e estava errado`);
    diz(`${p.n} pega as coisas e sai pelo portão sem falar mais nada com ninguém. Vocês ouvem o que acontece com ${p.n} na rua uns quinze minutos depois.`,'perigo');
    await pausa(1800);
    mexerMoral(-30);S.confianca=trava(S.confianca-40,0,100);
    diz('Ninguém olha na sua cara no jantar.','perigo');
    anotar(`Acusou ${p.n} sem provas. Era gente.`);
    if(S.abrigo.length&&chance(.5)){
      const q=sortear(S.abrigo);
      S.abrigo=S.abrigo.filter(x=>x!==q);S.mortos.push(q);
      registrarVoz(q,`foi embora depois que você acusou ${p.n}`);
      diz(`${q.n} arruma as coisas na mesma noite. “Eu não fico numa casa onde o dono decide sozinho quem é gente.”`,'perigo');
    }
  }
  atualizarPainel();
  await pausa(1200);
  AC.innerHTML='';
  botao('Continuar',()=>irPara(4),{cls:'chave'});
}

/* prazo do infiltrado */
function infiltradoNoPrazo(){
  return S.infiltrado&&S.abrigo.includes(S.infiltrado)&&(S.dia-S.infiltradoDesde)>=4;
}

/* ele estraga as coisas de madrugada — pista que dá pra medir */
async function sabotagem(){
  const p=S.infiltrado;
  if(!p||!S.abrigo.includes(p))return false;
  if(S.dia-S.infiltradoDesde<1)return false;
  if(!chance(S.acusou?.30:.45))return false;
  const opcoes=[];
  if(S.porta.reforco>1)opcoes.push('porta');
  if(S.diesel>25)opcoes.push('diesel');
  if(S.comida>3)opcoes.push('comida');
  if(S.armadilha)opcoes.push('armadilha');
  if(S.cachorro&&S.cachorro.vivo)opcoes.push('cachorro');
  if(!opcoes.length)return false;
  const o=sortear(opcoes);
  await pausa(900);
  if(o==='porta'){
    S.porta.reforco=Math.max(0,S.porta.reforco-1);danificarPorta(8);
    diz('Uma tábua da porta amanheceu no chão com os pregos entortados pra fora. Ninguém ouviu nada.','perigo');
  }else if(o==='diesel'){
    const q=Math.round(8+Math.random()*10);S.diesel=trava(S.diesel-q,0,100);ganhou({diesel:-q});
    diz(`Tem uma poça de diesel embaixo do tanque. A torneira estava meio aberta.`,'perigo');
  }else if(o==='comida'){
    const q=Math.min(S.comida,2+Math.floor(Math.random()*2));S.comida-=q;ganhou({comida:-q});
    diz(`Sumiram ${q} latas da despensa durante a noite. A porta da despensa estava encostada.`,'perigo');
  }else if(o==='armadilha'){
    S.armadilha=false;
    diz('O arame da armadilha do quintal está cortado. Cortado, não arrebentado.','perigo');
  }else{
    S.cachorro.fome+=2;
    diz(`${S.cachorro.n} passou a noite trancado no barracão. Alguém fechou a porta.`,'perigo');
  }
  anotar('Alguma coisa foi mexida durante a noite.');
  return true;
}
async function aberturaPorDentro(){
  const p=S.infiltrado;
  limpar();AC.innerHTML='';cena.modo='vazio';
  cap('Três e quarenta da manhã');
  silencioSubito(3);
  await pausa(2600);
  diz('Você acorda porque o gerador está mais alto. E o gerador só fica mais alto quando a porta da frente está aberta.','perigo');
  await pausa(2200);
  diz(`${p.n} está de pé no corredor, de costas, com a tranca na mão. A porta está escancarada.`,'perigo');
  await pausa(2000);
  await quebrarRosto(p);
  diz(`${p.n} vira a cabeça mais do que pescoço vira, e fala com a sua voz: “Eles estavam lá fora esse tempo todo esperando eu abrir.”`,'perigo');
  S.abrigo=S.abrigo.filter(x=>x!==p);
  S.infiltrado=null;
  danificarPorta(100);S.porta.reforco=0;
  anotar(`${p.n} abriu a porta por dentro.`);
  await pausa(2400);
  AC.innerHTML='';
  botao('Correr',()=>invasao(2),{cls:'prim'});
}

<script>
/* ================= A CASA (9 cômodos) ================= */
const PLANTA=[
 {id:0,nome:'SÓTÃO',gx:0,gy:0,esconde:true},
 {id:1,nome:'QUARTO',gx:1,gy:0,esconde:true},
 {id:2,nome:'DESPENSA',gx:2,gy:0,esconde:true},
 {id:3,nome:'OFICINA',gx:0,gy:1,esconde:true},
 {id:4,nome:'SALA',gx:1,gy:1},
 {id:5,nome:'COZINHA',gx:2,gy:1},
 {id:6,nome:'PORÃO',gx:0,gy:2,esconde:true},
 {id:7,nome:'ENTRADA',gx:1,gy:2,porta:true},
 {id:8,nome:'QUINTAL',gx:2,gy:2,saida:true}
];
/* qualquer id fora da planta cai na SALA em vez de derrubar o jogo */
const SALA=4;
const comodo=id=>PLANTA[id]||PLANTA[SALA];
const vizinhos=id=>{
  const q=comodo(id);
  return PLANTA.filter(b=>Math.abs(q.gx-b.gx)+Math.abs(q.gy-b.gy)===1).map(b=>b.id);
};
const distancia=(a,b)=>{
  const x=comodo(a),y=comodo(b);
  return Math.abs(x.gx-y.gx)+Math.abs(x.gy-y.gy);
};
const panDe=(a,b)=>trava((comodo(b).gx-comodo(a).gx)*.7,-1,1);

const AMBIENTE={
 0:'Telhado baixo, poeira e a janelinha que dá pra rua inteira.',
 1:'Colchões no chão e a janela tapada com compensado. Os galões de água ficam no canto.',
 2:'Prateleiras de metal. Dá pra contar o que sobrou de longe.',
 3:'A bancada. Ferramenta, prego, madeira empilhada e o cheiro de óleo.',
 4:'Sofá encostado na parede. É onde as pessoas ficam quando não têm o que fazer.',
 5:'Fogão a gás com meio botijão. O cheiro de comida ainda anima a casa.',
 6:'O gerador. Quente, barulhento e a única razão de vocês estarem vivos.',
 7:'A porta. Tábuas atravessadas, tranca, corrente. E o mundo do outro lado.',
 8:'Muro alto, portão soldado, terra batida. Daqui você sai pra rua.'
};

const CANTO={cozinha:5,mecânica:6,carpintaria:3,rádio:0,enfermagem:1,
  química:3,costura:4,caça:8,escalada:0,corrida:8,polícia:7,'ouvido fino':7};
function espalharGente(){
  S.abrigo.forEach(p=>{
    p.local=(chance(.6)&&CANTO[p.hab]!=null)?CANTO[p.hab]:sortear([1,2,4,4,5,7,8]);
  });
}

/* ================= CENAS DOS CÔMODOS ================= */
function paredeBase(w,h,cor,piso){
  const g=CX.createLinearGradient(0,0,0,h);
  g.addColorStop(0,cor[0]);g.addColorStop(.62,cor[1]);g.addColorStop(1,cor[2]);
  CX.fillStyle=g;CX.fillRect(0,0,w,h);
  // reboco
  for(let i=0;i<40;i++){
    const x=semente(7,i)*w,y=semente(19,i)*h*.7;
    CX.fillStyle='rgba(255,240,220,.012)';
    CX.fillRect(x,y,6+semente(3,i)*16,2);
  }
  // piso em tábuas
  const py=h*.72;
  CX.fillStyle=piso||'#140F12';CX.fillRect(0,py,w,h-py);
  CX.strokeStyle='rgba(0,0,0,.45)';CX.lineWidth=1;
  for(let i=0;i<7;i++){
    const t=i/6, y=py+(h-py)*t*t;
    CX.beginPath();CX.moveTo(0,y);CX.lineTo(w,y);CX.stroke();
  }
  for(let i=-3;i<9;i++){
    CX.beginPath();CX.moveTo(w/2+(i-3)*w*.05,py);CX.lineTo(w/2+(i-3)*w*.34,h);CX.stroke();
  }
  // rodapé
  CX.fillStyle='rgba(0,0,0,.5)';CX.fillRect(0,py-Math.max(4,h*.02),w,Math.max(4,h*.02));
}
function lampiao(w,h,t,x,y,forca){
  const b=(.7+Math.sin(t*2.3)*.09+Math.sin(t*7.1)*.05)*(forca||1);
  const g=CX.createRadialGradient(x,y,2,x,y,h*.85);
  g.addColorStop(0,'rgba(255,214,130,'+(.30*b)+')');
  g.addColorStop(.28,'rgba(201,162,39,'+(.11*b)+')');
  g.addColorStop(1,'rgba(0,0,0,0)');
  CX.fillStyle=g;CX.fillRect(0,0,w,h);
  CX.fillStyle='rgba(255,235,180,'+(.8*b)+')';
  CX.beginPath();CX.arc(x,y,Math.max(2.5,h*.011),0,7);CX.fill();
}
function vinheta(w,h,f){
  const v=CX.createRadialGradient(w/2,h*.5,h*.16,w/2,h*.5,h*(f||1));
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.92)');
  CX.fillStyle=v;CX.fillRect(0,0,w,h);
}

    if(mv==='carro'){CX.fillRect(vx,vy,w*.20,h*.09);

    else if(mv==='moto'){CX.fillRect(vx+w*.03,vy+h*.03,w*.11,h*.03);}

  // cisterna
  if(S.cisterna){

/* minimapa no canto */
function minimapa(w,h){
  const c=cena.casa;if(!c)return;
  const s=Math.min(w,h)*.055,pad=3;
  const ox=w-(s*3+pad*4)-6,oy=6;
  CX.fillStyle='rgba(5,4,8,.78)';
  CX.fillRect(ox-4,oy-4,s*3+pad*2+8,s*3+pad*2+8);
  CX.strokeStyle='rgba(58,50,70,.8)';CX.lineWidth=1;
  CX.strokeRect(ox-4,oy-4,s*3+pad*2+8,s*3+pad*2+8);
  PLANTA.forEach(q=>{
    const x=ox+q.gx*(s+pad),y=oy+q.gy*(s+pad);
    const aqui=q.id===c.voce,viz=vizinhos(c.voce).includes(q.id);
    CX.fillStyle=aqui?'#C9A227':(viz?'#2C2636':'#14111A');
    CX.fillRect(x,y,s,s);
    if(c.monstro!=null&&(q.id===c.monstro||q.id===c.monstro2)&&c.visivel){
      CX.fillStyle='rgba(140,47,30,.9)';CX.fillRect(x,y,s,s);
    }
    if(q.porta){CX.fillStyle='#8C2F1E';CX.fillRect(x+s-3,y+2,2,s-4);}
    if(q.saida){CX.fillStyle='#7A8B7F';CX.fillRect(x+2,y+2,3,3);}
    const g=S.abrigo?S.abrigo.filter(p=>p.local===q.id).length:0;
    if(g&&!aqui){CX.fillStyle='#7A8B7F';CX.fillRect(x+s/2-1,y+s-4,2,2);}
  });
}

<script>
/* ================= LUZ CONFORME A HORA ================= */
function tomDoDia(){
  const h=S.hora;
  if(h<6)return {r:.55,g:.62,b:1.0,f:.40};      // madrugada azul
  if(h<8)return {r:.85,g:.80,b:.95,f:.62};      // amanhecer
  if(h<11)return {r:1.0,g:.97,b:.90,f:.95};     // manhã
  if(h<16)return {r:1.0,g:1.0,b:.96,f:1.0};     // meio do dia
  if(h<18)return {r:1.05,g:.88,b:.70,f:.82};    // fim de tarde
  if(h<20)return {r:.90,g:.70,b:.62,f:.52};     // anoitecer
  return {r:.58,g:.64,b:1.0,f:.34};             // noite
}
function aplicarTom(w,h){
  const t=tomDoDia();
  CX.globalCompositeOperation='multiply';
  CX.fillStyle=`rgb(${Math.round(t.r*255)},${Math.round(t.g*255)},${Math.round(t.b*255)})`;
  CX.fillRect(0,0,w,h);
  CX.globalCompositeOperation='source-over';
  if(t.f<.7){
    CX.fillStyle=`rgba(4,6,18,${(.7-t.f)*.8})`;
    CX.fillRect(0,0,w,h);
  }
}

/* ================= CHUVA DESENHADA ================= */
let _pingos=null;
function desenharChuva(w,h,t,forca){
  if(!S.chuva&&!forca)return;
  if(!_pingos||_pingos.length<90){
    _pingos=[];
    for(let i=0;i<110;i++)_pingos.push({
      x:Math.random(),y:Math.random(),v:.55+Math.random()*.9,
      l:.04+Math.random()*.09,o:.10+Math.random()*.28
    });
  }
  CX.lineCap='round';
  _pingos.forEach(p=>{
    p.y+=p.v/60;
    if(p.y>1.05){p.y=-.05;p.x=Math.random();}
    CX.strokeStyle=`rgba(180,200,225,${p.o})`;
    CX.lineWidth=Math.max(1,w*.0022);
    CX.beginPath();
    CX.moveTo(p.x*w,p.y*h);
    CX.lineTo(p.x*w-w*.012,(p.y+p.l)*h);
    CX.stroke();
  });
  // respingo no chão
  for(let i=0;i<5;i++){
    const x=Math.random()*w,y=h*(.86+Math.random()*.12);
    CX.strokeStyle='rgba(180,200,225,.14)';CX.lineWidth=1;
    CX.beginPath();CX.ellipse(x,y,w*.012*Math.random(),h*.004,0,0,7);CX.stroke();
  }
  CX.lineCap='butt';
}

/* ================= TRANSIÇÃO ENTRE CENAS ================= */
let _fade={v:0,alvo:0};
function pedirFade(){_fade.v=1;}
function pintarFade(w,h){
  if(_fade.v<=0)return;
  CX.fillStyle=`rgba(3,2,5,${_fade.v})`;
  CX.fillRect(0,0,w,h);
  const n=Math.round(_fade.v*180);
  for(let i=0;i<n;i++){
    CX.fillStyle=`rgba(${180+Math.random()*60|0},${170+Math.random()*50|0},${160+Math.random()*50|0},${Math.random()*_fade.v*.35})`;
    CX.fillRect(Math.random()*w,Math.random()*h,2,2);
  }
  _fade.v=Math.max(0,_fade.v-.055);
}

/* ================= O ROSTO SE MEXENDO NA LENTE ================= */
/* Ele vira a cabeça, encosta mais perto do vidro, e às vezes encara. */
let R={ang:0,alvoAng:0,prox:0,alvoProx:0,prox2:0,encara:0,proxTrig:4};
function reiniciarMicro(){
  R={ang:0,alvoAng:0,prox:0,alvoProx:0,encara:0,proxTrig:2.5+Math.random()*3};
}
function micro(dt,mimico){
  R.proxTrig-=dt;
  if(R.proxTrig<=0){
    R.proxTrig=2.2+Math.random()*3.4;
    const r=Math.random();
    if(mimico&&r<.30){
      // encara a lente: para tudo e olha
      R.encara=1.6+Math.random();
      R.alvoAng=0;R.alvoProx=.55+Math.random()*.35;
    }else if(r<.55){
      R.alvoAng=(Math.random()-.5)*.5;
      R.alvoProx=Math.random()*.2;
    }else if(r<.8){
      R.alvoProx=.3+Math.random()*.4;   // encosta mais perto
      R.alvoAng=(Math.random()-.5)*.2;
    }else{
      R.alvoAng=0;R.alvoProx=0;
    }
  }
  if(R.encara>0)R.encara-=dt;
  R.ang+=(R.alvoAng-R.ang)*(R.encara>0?.16:.05);
  R.prox+=(R.alvoProx-R.prox)*(R.encara>0?.13:.045);
  return R;
}

/* ================= O MAPA DA CIDADE ================= */
const POS_MAPA={
 rua7:[.30,.62],posto:[.62,.70],mercado:[.44,.52],colegio:[.20,.38],
 igreja:[.52,.36],serraria:[.80,.24],hospital:[.68,.46],torre:[.86,.62],
 ferrovelho:[.14,.72],delegacia:[.38,.24],sitio:[.10,.16],obra:[.72,.14],
 lanchonete:[.56,.82]
};
function desenharMapa(w,h,t){
  const g=CX.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#0A0812');g.addColorStop(1,'#050408');
  CX.fillStyle=g;CX.fillRect(0,0,w,h);
  // grade de ruas
  CX.strokeStyle='rgba(90,80,100,.12)';CX.lineWidth=1;
  for(let i=1;i<7;i++){
    CX.beginPath();CX.moveTo(w*i/7,0);CX.lineTo(w*i/7-w*.05,h);CX.stroke();
    CX.beginPath();CX.moveTo(0,h*i/7);CX.lineTo(w,h*i/7+h*.02);CX.stroke();
  }
  // o rio
  CX.strokeStyle='rgba(60,88,110,.35)';CX.lineWidth=Math.max(3,w*.014);
  CX.beginPath();CX.moveTo(0,h*.90);
  CX.bezierCurveTo(w*.3,h*.80,w*.55,h*.96,w,h*.86);CX.stroke();
  CX.fillStyle='rgba(122,139,127,.4)';
  CX.font=Math.max(8,h*.028)+'px "Share Tech Mono",monospace';
  CX.textAlign='left';CX.fillText('rio machado',w*.04,h*.955);

  // o caminho que você já percorreu
  const trilha=S.trilha||[];
  if(trilha.length){
    CX.strokeStyle='rgba(201,162,39,.14)';CX.lineWidth=1.5;
    CX.setLineDash([3,4]);
    trilha.forEach(id=>{
      const p=POS_MAPA[id];if(!p)return;
      CX.beginPath();CX.moveTo(w*.5,h*.58);CX.lineTo(w*p[0],h*p[1]);CX.stroke();
    });
    CX.setLineDash([]);
  }
  // os locais
  const hoje=(S.locaisHoje||[]).map(l=>l.id);
  poolDeLocais().forEach(l=>{
    const p=POS_MAPA[l.id];if(!p)return;
    const x=w*p[0],y=h*p[1];
    const esg=(S.esgotados[l.id]||0);
    const disp=hoje.includes(l.id);
    let cor=esg>=2?'#2E2A30':esg?'#5A4A38':'#7A8B7F';
    if(disp)cor='#C9A227';
    CX.fillStyle=cor;
    CX.beginPath();
    CX.moveTo(x,y-h*.016);CX.lineTo(x+w*.014,y);
    CX.lineTo(x,y+h*.016);CX.lineTo(x-w*.014,y);CX.closePath();CX.fill();
    if(disp){
      CX.strokeStyle=`rgba(201,162,39,${.3+Math.sin(t*2.5)*.25})`;CX.lineWidth=1.4;
      CX.beginPath();CX.arc(x,y,w*.028,0,7);CX.stroke();
    }
    if(esg>=2){
      CX.strokeStyle='rgba(140,47,30,.5)';CX.lineWidth=1.2;
      CX.beginPath();CX.moveTo(x-w*.016,y-h*.016);CX.lineTo(x+w*.016,y+h*.016);CX.stroke();
    }
    CX.fillStyle='rgba(232,226,212,'+(disp?.75:.32)+')';
    CX.font=Math.max(7,h*.024)+'px "Share Tech Mono",monospace';
    CX.textAlign='center';
    CX.fillText(l.n.replace(/^(Casas d[ao] |Colégio |Hospital |Mercadinho d[ao] |Ferro-velho d[ao] |Lanchonete d[ao] |Torre d[ao] |Obra )/,'').slice(0,13),x,y+h*.045);
  });
  // as casas do rádio
  (S.casas||[]).forEach((c,i)=>{
    const a=(i/Math.max(1,(S.casas||[]).length))*Math.PI*2+.6;
    const x=w*.5+Math.cos(a)*w*.40,y=h*.58+Math.sin(a)*h*.33;
    if(c.viva){
      const b=.4+Math.sin(t*2+i*1.7)*.35;
      CX.fillStyle=`rgba(122,139,127,${b})`;
      CX.beginPath();CX.arc(x,y,Math.max(2.5,w*.008),0,7);CX.fill();
      CX.strokeStyle=`rgba(122,139,127,${b*.3})`;CX.lineWidth=1;
      CX.beginPath();CX.arc(x,y,w*.02+Math.sin(t*2+i)*w*.006,0,7);CX.stroke();
    }else{
      CX.fillStyle='rgba(60,52,58,.5)';
      CX.beginPath();CX.arc(x,y,Math.max(2,w*.006),0,7);CX.fill();
    }
  });
  // onde você viu monstro
  (S.vistosMonstro||[]).forEach(id=>{
    const p=POS_MAPA[id];if(!p)return;
    CX.strokeStyle='rgba(140,47,30,.55)';CX.lineWidth=1.4;
    const x=w*p[0],y=h*p[1];
    CX.beginPath();CX.arc(x,y,w*.038,0,7);CX.stroke();
    CX.beginPath();CX.arc(x,y,w*.048,0,7);CX.stroke();
  });

  // a sua casa
  const cx=w*.5,cy=h*.58;
  const b=.65+Math.sin(t*1.8)*.2;
  const lg=CX.createRadialGradient(cx,cy,2,cx,cy,w*.16);
  lg.addColorStop(0,`rgba(255,214,130,${.30*b})`);
  lg.addColorStop(1,'rgba(0,0,0,0)');
  CX.fillStyle=lg;CX.fillRect(cx-w*.2,cy-w*.2,w*.4,w*.4);
  CX.fillStyle='#1A1420';
  CX.fillRect(cx-w*.028,cy-h*.012,w*.056,h*.032);
  CX.beginPath();CX.moveTo(cx-w*.034,cy-h*.012);CX.lineTo(cx,cy-h*.036);
  CX.lineTo(cx+w*.034,cy-h*.012);CX.fill();
  CX.fillStyle=`rgba(244,208,116,${.8*b})`;
  CX.fillRect(cx-w*.010,cy-h*.004,w*.020,h*.014);
  CX.fillStyle='#E8E2D4';
  CX.font=Math.max(9,h*.030)+'px "Share Tech Mono",monospace';
  CX.textAlign='center';
  CX.fillText('AQUI',cx,cy+h*.055);

  // legenda
  CX.textAlign='left';
  CX.font=Math.max(7,h*.024)+'px "Share Tech Mono",monospace';
  const leg=[['#C9A227','dá pra ir hoje'],['#7A8B7F','intacto'],
    ['#5A4A38','revirado'],['#2E2A30','esgotado']];
  leg.forEach(([c,txt],i)=>{
    CX.fillStyle=c;CX.fillRect(w*.03,h*.05+i*h*.042,w*.018,h*.018);
    CX.fillStyle='rgba(232,226,212,.5)';
    CX.fillText(txt,w*.06,h*.065+i*h*.042);
  });
}

function telaMapa(){
