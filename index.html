<script>
/* ================= A PORTA ================= */
function veios(x,y,w,h,seed,cor,n){
  CX.strokeStyle=cor;CX.lineWidth=1;
  for(let i=0;i<n;i++){
    const yy=y+h*semente(seed,i*7);
    CX.beginPath();CX.moveTo(x,yy);
    CX.bezierCurveTo(x+w*.3,yy+(semente(seed+3,i)-.5)*9,
                     x+w*.65,yy+(semente(seed+5,i)-.5)*9,x+w,yy+(semente(seed+7,i)-.5)*5);
    CX.stroke();
  }
}
function painel(x,y,pw,ph,claro,escuro,prof){
  const p=prof||3;
  CX.fillStyle=escuro;CX.fillRect(x,y,pw,ph);
  // chanfro: luz em cima e à esquerda, sombra embaixo e à direita
  CX.fillStyle='rgba(0,0,0,.55)';
  CX.beginPath();CX.moveTo(x,y);CX.lineTo(x+pw,y);CX.lineTo(x+pw-p,y+p);CX.lineTo(x+p,y+p);CX.fill();
  CX.beginPath();CX.moveTo(x,y);CX.lineTo(x,y+ph);CX.lineTo(x+p,y+ph-p);CX.lineTo(x+p,y+p);CX.fill();
  CX.fillStyle='rgba(255,220,170,.07)';
  CX.beginPath();CX.moveTo(x+pw,y);CX.lineTo(x+pw,y+ph);CX.lineTo(x+pw-p,y+ph-p);CX.lineTo(x+pw-p,y+p);CX.fill();
  CX.beginPath();CX.moveTo(x,y+ph);CX.lineTo(x+pw,y+ph);CX.lineTo(x+pw-p,y+ph-p);CX.lineTo(x+p,y+ph-p);CX.fill();
  CX.fillStyle=claro;CX.fillRect(x+p,y+p,pw-p*2,ph-p*2);
}

function desenharPorta(w,h,t){
  const P=S.porta;
  // a folha treme de verdade quando batem
  const tr=cena.bater>0?cena.bater:0;
  const sx=tr>0?(Math.random()-.5)*tr*7:0;
  const sy=tr>0?(Math.random()-.5)*tr*4:0;
  CX.save();CX.translate(sx,sy);
  const bruxa=.72+Math.sin(t*2.1)*.06+Math.sin(t*6.7)*.035+Math.sin(t*13.3)*.014;
  const ab=cena.abertura;

  // parede da entrada
  const pg=CX.createLinearGradient(0,0,0,h);
  pg.addColorStop(0,'#100D13');pg.addColorStop(.6,'#1A1520');pg.addColorStop(1,'#0C0910');
  CX.fillStyle=pg;CX.fillRect(0,0,w,h);
  for(let i=0;i<50;i++){
    CX.fillStyle='rgba(255,240,220,.012)';
    CX.fillRect(semente(7,i)*w,semente(19,i)*h,5+semente(3,i)*14,2);
  }
  // piso
  const chao=h*.90;
  CX.fillStyle='#150F13';CX.fillRect(0,chao,w,h-chao);
  CX.strokeStyle='rgba(0,0,0,.5)';CX.lineWidth=1;
  for(let i=-4;i<10;i++){
    CX.beginPath();CX.moveTo(w/2+(i-3)*w*.06,chao);CX.lineTo(w/2+(i-3)*w*.30,h);CX.stroke();
  }

  const pw=Math.min(w*.60,h*.52),px=(w-pw)/2,py=h*.055,ph=chao-py;

  // batente em três degraus
  [[26,'#0B0910'],[17,'#191420'],[9,'#241C28']].forEach(([m,cor])=>{
    CX.fillStyle=cor;CX.fillRect(px-m,py-m*.7,pw+m*2,ph+m*.7);
  });
  CX.fillStyle='#0A0810';CX.fillRect(px-4,py-3,pw+8,ph+3);

  // vão atrás
  if(ab>0){
    const g=CX.createLinearGradient(px,0,px+pw*ab+18,0);
    g.addColorStop(0,'rgba(12,9,11,1)');g.addColorStop(1,'rgba(1,1,2,1)');
    CX.fillStyle=g;CX.fillRect(px,py,pw*ab+2,ph);
    const s=cena.sombra;
    const fh=trava(ph*s.alt*1.4,ph*.22,ph);
    CX.fillStyle='#000';
    CX.fillRect(px+1,py+ph-fh,Math.min(pw*ab,pw*s.larg*2.1),fh);
  }

  const dw=pw*(1-ab),ox=px+pw*ab;
  if(dw<6){CX.restore&&0;}

  CX.save();
  CX.beginPath();CX.rect(ox,py,Math.max(0,dw),ph);CX.clip();

  // folha
  const g=CX.createLinearGradient(ox,py,ox+pw,py+ph);
  g.addColorStop(0,'#2C2028');g.addColorStop(.4,'#382A30');g.addColorStop(1,'#1E1620');
  CX.fillStyle=g;CX.fillRect(ox,py,pw,ph);
  veios(ox,py,pw,ph,3,'rgba(255,228,190,.030)',30);
  veios(ox,py,pw,ph,91,'rgba(0,0,0,.30)',16);

  // quatro painéis rebaixados, estilo porta velha
  const mx=pw*.11,my=ph*.055;
  const cw=(pw-mx*3)/2;
  const alturas=[ph*.30,ph*.30,ph*.18,ph*.18];
  const ys=[my,my,my*2+ph*.30,my*2+ph*.30];
  const linhas=[[0,0],[1,0],[0,1],[1,1]];
  linhas.forEach(([col,lin],i)=>{
    const bx=ox+mx+col*(cw+mx);
    const by=py+(lin===0?my:my*2.2+ph*.30);
    const bh=lin===0?ph*.42:ph*.30;
    painel(bx,by,cw,bh,'#33262C','#241A20',Math.max(3,pw*.014));
  });
  // travessa do meio
  CX.fillStyle='rgba(255,220,170,.05)';
  CX.fillRect(ox,py+my*1.9+ph*.42,pw,2);
  CX.fillStyle='rgba(0,0,0,.4)';
  CX.fillRect(ox,py+my*1.9+ph*.42+2,pw,3);

  // dano
  if(P.dano>0){
    const nd=Math.min(16,Math.floor(P.dano/6));
    for(let i=0;i<nd;i++){
      const sx=ox+pw*(.10+semente(41,i)*.80),sy=py+ph*(.16+semente(53,i)*.68);
      CX.strokeStyle='rgba(8,5,7,'+(.5+semente(17,i)*.35)+')';
      CX.lineWidth=1+semente(23,i)*2.4;
      CX.beginPath();CX.moveTo(sx,sy);
      CX.lineTo(sx+(semente(29,i)-.5)*pw*.26,sy+(semente(37,i)-.3)*ph*.14);
      CX.stroke();
    }
    if(P.dano>45){
      CX.strokeStyle='rgba(4,3,4,.85)';CX.lineWidth=3;
      CX.beginPath();CX.moveTo(ox+pw*.44,py);
      CX.lineTo(ox+pw*.50,py+ph*.34);CX.lineTo(ox+pw*.41,py+ph*.72);CX.stroke();
    }
    if(P.dano>75){
      CX.fillStyle='#000';
      CX.beginPath();
      CX.moveTo(ox+pw*.55,py+ph*.30);CX.lineTo(ox+pw*.62,py+ph*.46);
      CX.lineTo(ox+pw*.54,py+ph*.52);CX.closePath();CX.fill();
    }
  }

  // tábuas atravessadas
  for(let i=0;i<Math.min(6,P.reforco);i++){
    const bh=Math.max(8,ph*.045);
    const by=py+ph*(.11+i*.135);
    const ang=(semente(13,i)-.5)*.05;
    CX.save();
    CX.translate(ox+pw/2,by+bh/2);CX.rotate(ang);
    const bw=pw*(1.03+semente(31,i)*.05);
    const tg=CX.createLinearGradient(0,-bh/2,0,bh/2);
    tg.addColorStop(0,'#5A4331');tg.addColorStop(.3,'#42301F');tg.addColorStop(1,'#251A11');
    CX.fillStyle=tg;CX.fillRect(-bw/2,-bh/2,bw,bh);
    CX.strokeStyle='rgba(0,0,0,.55)';CX.lineWidth=1;CX.strokeRect(-bw/2,-bh/2,bw,bh);
    CX.strokeStyle='rgba(255,220,170,.09)';
    for(let k=0;k<3;k++){
      const yy=-bh/2+bh*(k+.5)/3;
      CX.beginPath();CX.moveTo(-bw/2,yy);CX.lineTo(bw/2,yy+(semente(7,i+k)-.5)*2);CX.stroke();
    }
    [-bw*.42,-bw*.14,bw*.14,bw*.42].forEach(nx=>{
      CX.fillStyle='#7A6A55';CX.beginPath();CX.arc(nx,0,2.3,0,7);CX.fill();
      CX.fillStyle='rgba(0,0,0,.5)';CX.beginPath();CX.arc(nx+.8,.8,1.6,0,7);CX.fill();
    });
    CX.restore();
  }
  CX.restore();

  // dobradiças (lado esquerdo, fixo no batente)
  if(ab<.5)[.16,.5,.84].forEach(f=>{
    const hy=py+ph*f;
    CX.fillStyle='#3A3038';CX.fillRect(px-6,hy-ph*.035,16,ph*.07);
    CX.fillStyle='#4E4450';CX.fillRect(px-6,hy-ph*.035,16,2);
    CX.fillStyle='#15121A';
    CX.beginPath();CX.arc(px-2,hy-ph*.02,2,0,7);CX.fill();
    CX.beginPath();CX.arc(px-2,hy+ph*.02,2,0,7);CX.fill();
  });

  // tranca de ferro
  if(P.tranca&&dw>10){
    const by=py+ph*.545,bh=Math.max(10,ph*.045);
    CX.fillStyle='#0C0A10';CX.fillRect(ox-5,by-4,dw+10,bh+8);
    const fg=CX.createLinearGradient(0,by,0,by+bh);
    fg.addColorStop(0,'#635A64');fg.addColorStop(.35,'#3C353F');fg.addColorStop(1,'#1B171F');
    CX.fillStyle=fg;CX.fillRect(ox-3,by,dw+6,bh);
    CX.fillStyle='rgba(230,220,215,.16)';CX.fillRect(ox-3,by+1.5,dw+6,2);
    [ox+dw*.09,ox+dw*.91].forEach(sx=>{
      CX.fillStyle='#2C2530';CX.fillRect(sx-8,by-7,16,bh+14);
      CX.fillStyle='#4E4654';CX.fillRect(sx-6,by-5,12,3);
      CX.fillStyle='#141119';CX.beginPath();CX.arc(sx,by+bh/2,3.4,0,7);CX.fill();
    });
  }

  // maçaneta com espelho e fechadura
  if(ab<.55&&dw>20){
    const mx2=ox+dw-Math.max(20,pw*.11),my2=py+ph*.50;
    CX.fillStyle='#0D0B11';
    CX.beginPath();CX.ellipse(mx2,my2,pw*.045,ph*.055,0,0,7);CX.fill();
    const eg=CX.createLinearGradient(mx2-10,my2-10,mx2+10,my2+14);
    eg.addColorStop(0,'#6E6250');eg.addColorStop(.5,'#413728');eg.addColorStop(1,'#241C14');
    CX.fillStyle=eg;
    CX.beginPath();CX.ellipse(mx2,my2,pw*.038,ph*.048,0,0,7);CX.fill();
    const mg=CX.createRadialGradient(mx2-3,my2-4,1,mx2,my2,Math.max(7,pw*.028));
    mg.addColorStop(0,'#9A8A6E');mg.addColorStop(.55,'#5E5140');mg.addColorStop(1,'#241D14');
    CX.fillStyle=mg;
    CX.beginPath();CX.arc(mx2,my2-ph*.012,Math.max(6,pw*.027),0,7);CX.fill();
    CX.fillStyle='#08070A';
    CX.beginPath();CX.arc(mx2,my2+ph*.022,2.6,0,7);CX.fill();
    CX.fillRect(mx2-1.2,my2+ph*.022,2.4,6);
  }

  // olho mágico — sempre existe
  if(ab<.3&&dw>20){
    const ex=ox+dw*.5,ey=py+ph*.22;
    const r=Math.max(7,pw*.032);
    CX.fillStyle='#0A0810';CX.beginPath();CX.arc(ex,ey,r*1.35,0,7);CX.fill();
    const lg=CX.createRadialGradient(ex-r*.3,ey-r*.3,1,ex,ey,r*1.2);
    lg.addColorStop(0,S.porta.olho?'#D8B54A':'#8A7A52');
    lg.addColorStop(.55,'#6A5820');lg.addColorStop(1,'#302608');
    CX.fillStyle=lg;CX.beginPath();CX.arc(ex,ey,r,0,7);CX.fill();
    CX.fillStyle='#000';CX.beginPath();CX.arc(ex,ey,r*.42,0,7);CX.fill();
    if(cena.sombra.dentro){
      CX.fillStyle='rgba(180,60,40,'+(.35+Math.sin(t*3)*.25)+')';
      CX.beginPath();CX.arc(ex,ey,r*.42,0,7);CX.fill();
    }
  }

  // corrente
  if(ab>0&&ab<.4){
    CX.strokeStyle='rgba(170,162,150,.6)';CX.lineWidth=2.6;
    const cy=py+ph*.40;
    CX.beginPath();
    for(let i=0;i<12;i++){
      const xx=px+2+(ox-px)*(i/11);
      CX.moveTo(xx,cy+Math.sin(i*1.6)*2.6);
      CX.lineTo(xx+((ox-px)/11)*.8,cy+Math.sin((i+1)*1.6)*2.6);
    }
    CX.stroke();
    CX.fillStyle='#4E463C';CX.fillRect(px-3,cy-6,7,12);
  }

  // fresta e sombra
  const fy=py+ph,fh=Math.max(5,h*.022);
  const fg2=CX.createLinearGradient(0,fy,0,fy+fh);
  fg2.addColorStop(0,'rgba(201,162,39,'+(.36*bruxa)+')');
  fg2.addColorStop(1,'rgba(201,162,39,'+(.04*bruxa)+')');
  CX.fillStyle=fg2;CX.fillRect(px,fy,pw,fh);
  CX.fillStyle='rgba(244,208,116,'+(.62*bruxa)+')';CX.fillRect(px,fy,pw,2);

  const s=cena.sombra;
  if(s.dentro&&ab<.1){
    const osc=Math.sin(t*1.5)*.011+Math.sin(t*.63)*.007;
    for(let k=0;k<s.qtd;k++){
      const off=(k-(s.qtd-1)/2)*.24;
      const sw=pw*s.larg,sx=px+pw*(s.x+off+osc)-sw/2;
      CX.fillStyle='#000';CX.fillRect(trava(sx,px,px+pw-4),fy-1,Math.min(sw,pw),fh+2);
    }
    if(s.dedos)for(let i=0;i<s.dedos;i++)
      CX.fillStyle='#000',CX.fillRect(px+pw*(.32+i*.052),fy-1,pw*.026,fh+3);
    CX.fillStyle='rgba(0,0,0,'+(.22+.5*(1-trava(s.alt,0,1)))+')';
    CX.fillRect(px,fy+fh,pw,h-fy-fh);
    if(s.tremor>0){CX.fillStyle='rgba(0,0,0,'+s.tremor+')';CX.fillRect(px,fy-1,pw*Math.random()*.45,fh+2);}
  }

  if(cena.bater>0){
    CX.fillStyle='rgba(255,240,210,'+(cena.bater*.05)+')';CX.fillRect(ox,py,dw,ph);
    cena.bater-=.05;
  }
  // lampião de dentro
  lampiao(w,h,t,w*.16,h*.30,.8);
  for(let i=0;i<14;i++){
    const dx=(semente(3,i)*w+t*7*(semente(5,i)-.5))%w;
    const dy=(semente(9,i)*h+t*4)%h;
    CX.fillStyle='rgba(201,180,140,'+(.05+semente(11,i)*.05)+')';
    CX.fillRect(dx,dy,1.3,1.3);
  }
  CX.restore();
  vinheta(w,h,.97);
}
</script>
<script>
/* ================= O OLHO MÁGICO ================= */
const ROUPA=['#2A2028','#1E2422','#2E2620','#232028','#331F1C','#1A1E26'];
const ANOMALIAS=[
 {id:'olhos',t:'Os olhos não estão na mesma altura.'},
 {id:'brilho',t:'As pupilas devolvem a luz do lampião. Como as de um bicho.'},
 {id:'boca',t:'A boca é larga demais pro tamanho do rosto.'},
 {id:'pescoco',t:'O pescoço é comprido demais e não tem uma ruga.'},
 {id:'pele',t:'A pele tem cor de coisa que nunca pegou sol.'},
 {id:'sombra',t:'A cabeça não faz sombra na parede atrás.'},
 {id:'dentes',t:'Tem dente demais quando a boca abre.'},
 {id:'piscar',t:'Não piscou uma vez esse tempo todo.'},
 {id:'simetria',t:'Os dois lados do rosto são idênticos. Rosto de gente não é.'}
];

function modeloVisitante(v){
  const p=v.pessoa,h=hashNome(p.n+p.id),s=i=>semente(h,i);
  const m={
    h,pele:PELE[Math.floor(s(1)*PELE.length)],cabelo:CABELO[Math.floor(s(2)*CABELO.length)],
    roupa:ROUPA[Math.floor(s(16)*ROUPA.length)],
    larg:52+s(3)*20,alt:64+s(4)*16,
    capuz:s(17)<.3,gola:s(18)<.45,barba:s(15)<.3&&p.id>24,
    crianca:p.id<16,velho:p.id>55,sangue:v.tipo==='ferido',
    sujeira:.3+s(19)*.5,anomalias:[]
  };
  if(v.mimico){
    let qtd=S.dia<=3?3:S.dia<=7?2:(chance(.5)?1:2);
    if(S.porta.olho)qtd++;
    if(S.viradaDescobriram)qtd++;
    if(vicioPorta()==='olho'&&chance(.55))qtd=Math.max(0,qtd-1);
    m.anomalias=ANOM_TODAS().slice().sort(()=>Math.random()-.5).slice(0,Math.min(4,qtd));
  }
  return m;
}

function pintarVisitante(x,w,h,m,t){
  const s=i=>semente(m.h,i);
  const A_=id=>m.anomalias.some(a=>a.id===id);
  const q=Math.min(w,h)/100;
  const cx=w/2,cy=h*.54;
  const larg=m.larg*q*(m.crianca?.82:1),alt=m.alt*q*(m.crianca?.85:1);

  const bg=x.createRadialGradient(cx,cy*.7,alt*.2,cx,cy,Math.max(w,h)*.8);
  bg.addColorStop(0,'#1A1416');bg.addColorStop(.5,'#0E0B10');bg.addColorStop(1,'#050407');
  x.fillStyle=bg;x.fillRect(0,0,w,h);
  if(!A_('sombra')){
    x.fillStyle='rgba(0,0,0,.45)';
    x.beginPath();x.ellipse(cx+larg*.42,cy+alt*.08,larg*.52,alt*.56,-.12,0,7);x.fill();
  }

  x.fillStyle=m.roupa;
  const pesc=A_('pescoco')?alt*.42:alt*.16;
  x.fillRect(cx-larg*.17,cy+alt*.30,larg*.34,pesc+4);
  x.beginPath();x.ellipse(cx,cy+alt*.34+pesc+alt*.55,larg*1.15,alt*.62,0,0,7);x.fill();
  if(m.gola){
    x.fillStyle='rgba(255,255,255,.05)';
    x.beginPath();
    x.moveTo(cx-larg*.32,cy+alt*.34+pesc);
    x.lineTo(cx,cy+alt*.52+pesc);x.lineTo(cx+larg*.32,cy+alt*.34+pesc);x.fill();
  }

  const cyy=cy-(A_('pescoco')?alt*.16:0);
  x.fillStyle=A_('pele')?'#8E8B84':m.pele;
  x.beginPath();x.ellipse(cx,cyy,larg/2,alt/2,0,0,7);x.fill();
  x.beginPath();
  x.moveTo(cx-larg*.34,cyy+alt*.12);
  x.quadraticCurveTo(cx,cyy+alt*(.5+s(5)*.14),cx+larg*.34,cyy+alt*.12);x.fill();
  const lg=x.createLinearGradient(0,cyy-alt*.5,0,cyy+alt*.5);
  lg.addColorStop(0,'rgba(0,0,0,.5)');lg.addColorStop(.6,'rgba(0,0,0,0)');
  lg.addColorStop(1,'rgba(201,162,39,.13)');
  x.fillStyle=lg;
  x.beginPath();x.ellipse(cx,cyy,larg/2,alt/2,0,0,7);x.fill();
  if(!A_('simetria')){
    x.fillStyle='rgba(0,0,0,.26)';
    x.beginPath();x.ellipse(cx+larg*.24,cyy,larg*.22,alt*.42,0,0,7);x.fill();
  }

  if(m.capuz){
    x.fillStyle='#14111A';
    x.beginPath();x.ellipse(cx,cyy-alt*.10,larg*.66,alt*.60,0,Math.PI,0);x.fill();
    x.fillRect(cx-larg*.66,cyy-alt*.10,larg*.20,alt*.7);
    x.fillRect(cx+larg*.46,cyy-alt*.10,larg*.20,alt*.7);
  }else{
    x.fillStyle=m.cabelo;
    const tp=Math.floor(s(6)*4);
    x.beginPath();
    x.ellipse(cx,cyy-alt*(.22+tp*.04),larg*(.5+tp*.03),alt*(.26+tp*.05),0,Math.PI,0);x.fill();
    if(tp===1){x.fillRect(cx-larg*.56,cyy-alt*.22,larg*.14,alt*.46);
      x.fillRect(cx+larg*.42,cyy-alt*.22,larg*.14,alt*.40);}
  }

  const piscando=A_('piscar')?false:(Math.sin(t*1.7+s(21)*6)>.965);
  const oyB=cyy-alt*.06,sep=larg*(.19+s(7)*.04);
  [-1,1].forEach((d,i)=>{
    const oy=oyB+(A_('olhos')?(i===0?-alt*.075:alt*.055):0);
    if(piscando){
      x.strokeStyle='rgba(20,14,12,.85)';x.lineWidth=2*q;
      x.beginPath();x.moveTo(cx+d*sep-larg*.1,oy);x.lineTo(cx+d*sep+larg*.1,oy);x.stroke();
    }else{
      x.fillStyle='#E6DFD2';
      x.beginPath();x.ellipse(cx+d*sep,oy,larg*.105,alt*.05,0,0,7);x.fill();
      const pupx=cx+d*sep+(A_('simetria')?0:(s(8)-.5)*2.4*q);
      x.fillStyle='#12100E';
      x.beginPath();x.arc(pupx,oy,alt*.032,0,7);x.fill();
      if(A_('brilho')){
        const b=.5+Math.sin(t*2.2)*.35;
        x.fillStyle='rgba(210,190,120,'+b+')';
        x.beginPath();x.arc(pupx,oy,alt*.026,0,7);x.fill();
        x.fillStyle='rgba(255,240,200,'+(b*.9)+')';
        x.beginPath();x.arc(pupx-alt*.008,oy-alt*.008,alt*.010,0,7);x.fill();
      }else{
        x.fillStyle='rgba(255,240,210,.4)';
        x.beginPath();x.arc(pupx-alt*.010,oy-alt*.012,alt*.008,0,7);x.fill();
      }
    }
    x.strokeStyle=m.cabelo;x.lineWidth=(2.2+s(9)*2)*q;
    x.beginPath();
    x.moveTo(cx+d*sep-larg*.12,oy-alt*.14);
    x.lineTo(cx+d*sep+larg*.12,oy-alt*.13+(A_('simetria')?0:(s(11)-.5)*alt*.05));
    x.stroke();
  });

  x.strokeStyle='rgba(0,0,0,.42)';x.lineWidth=1.7*q;
  x.beginPath();
  x.moveTo(cx-q,oyB+alt*.05);
  x.lineTo(cx-larg*.05,oyB+alt*.18);
  x.lineTo(cx+larg*.045,oyB+alt*.18);x.stroke();

  const bl=larg*(A_('boca')?.44:.17+s(12)*.09);
  const by=cyy+alt*.27;
  const falando=cena.falando&&Math.sin(t*11)>0;
  if(A_('dentes')||falando){
    x.fillStyle='#0A0708';
    x.beginPath();x.ellipse(cx,by,bl/2,alt*(falando?.05:.035),0,0,7);x.fill();
    if(A_('dentes')){
      x.fillStyle='#CFC6B4';
      const n=Math.max(4,Math.floor(bl/(4*q)));
      for(let k=0;k<n;k++)x.fillRect(cx-bl/2+k*(bl/n)+.6,by-alt*.028,bl/n-1.2,alt*.026);
    }
  }else{
    x.strokeStyle='rgba(35,14,14,.8)';x.lineWidth=(2+s(13)*1.4)*q;
    x.beginPath();
    x.moveTo(cx-bl/2,by);
    x.quadraticCurveTo(cx,by+(A_('boca')?-alt*.06:(s(14)-.6)*alt*.08),cx+bl/2,by);
    x.stroke();
  }

  if(m.barba){
    x.fillStyle='rgba(18,13,16,.55)';
    x.beginPath();x.ellipse(cx,cyy+alt*.31,larg*.30,alt*.20,0,0,7);x.fill();
  }
  if(m.sangue){
    x.fillStyle='rgba(110,25,18,.62)';
    x.beginPath();
    x.moveTo(cx+larg*.16,cyy-alt*.30);
    x.lineTo(cx+larg*.26,cyy+alt*.10);
    x.lineTo(cx+larg*.13,cyy+alt*.05);x.fill();
    for(let i=0;i<4;i++)
      x.fillRect(cx+larg*(.05+s(30+i)*.3),cyy+alt*(.1+s(40+i)*.25),2.5*q,5*q);
  }
  x.fillStyle='rgba(45,33,22,'+(m.sujeira*.5)+')';
  for(let i=0;i<10;i++)
    x.fillRect(cx+(s(50+i)-.5)*larg*.85,cyy+(s(60+i)-.4)*alt*.75,2.4*q,1.8*q);
  if(!m.anomalias.length&&Math.sin(t*.9)>.4){
    const o=(Math.sin(t*.9)-.4)*.5;
    x.fillStyle='rgba(220,220,230,'+(o*.13)+')';
    x.beginPath();x.ellipse(cx,by+alt*.14,larg*.2*(1+o),alt*.1*(1+o),0,0,7);x.fill();
  }
}


</script>
<script>
/* ================= OLHO MÁGICO INTERATIVO =================
   Fora da lente: a porta por dentro, escura.
   Dentro da lente: o corredor lá fora e quem está batendo.
   Os defeitos do mímico ficam escondidos em ZONAS — você tem
   que passar a lente por cima pra achar. Nada é entregue. */

const ZONAS={
 olhos:{x:.50,y:.38,r:.17,n:'os olhos'},
 brilho:{x:.50,y:.38,r:.17,n:'os olhos'},
 piscar:{x:.50,y:.38,r:.17,n:'os olhos'},
 boca:{x:.50,y:.55,r:.14,n:'a boca'},
 dentes:{x:.50,y:.55,r:.14,n:'a boca'},
 pescoco:{x:.50,y:.70,r:.15,n:'o pescoço'},
 pele:{x:.34,y:.48,r:.16,n:'a pele do rosto'},
 simetria:{x:.66,y:.45,r:.16,n:'o lado direito do rosto'},
 sombra:{x:.80,y:.40,r:.20,n:'a parede atrás'},
 maos:{x:.30,y:.80,r:.16,n:'as mãos'},
 roupa:{x:.50,y:.88,r:.18,n:'a roupa'},
 pes:{x:.66,y:.92,r:.18,n:'o chão embaixo dele'}
};
const EXTRA_ANOM=[
 {id:'maos',t:'Os dedos são compridos demais e tem mais do que devia ter.'},
 {id:'roupa',t:'A roupa está limpa e passada. Ninguém lá fora tem roupa limpa.'},
 {id:'pes',t:'Não tem pegada nenhuma na poeira embaixo dele.'}
];
const ANOM_TODAS=()=>ANOMALIAS.concat(EXTRA_ANOM);

let L={x:.5,y:.45,r:.26,ativo:false,alvo:{x:.5,y:.45},zonas:[],
  achou:0,total:0,tempo:0,fim:null,arrastando:false};

function montarLente(v){
  if(!v._modelo)v._modelo=modeloVisitante(v);
  const m=v._modelo;
  L={x:.5,y:.30,r:.26,ativo:true,alvo:{x:.5,y:.30},achou:0,
     tempo:0,fim:null,arrastando:false,zonas:[]};
  m.anomalias.forEach(a=>{
    const z=ZONAS[a.id]||ZONAS.olhos;
    L.zonas.push({x:z.x,y:z.y,r:z.r,nome:z.n,txt:a.t,id:a.id,
      revelada:false,carga:0});
  });
  L.total=L.zonas.length;
}

function pontosDeInteresse(v){
  // pontos que sempre existem, pra ter o que olhar mesmo quando é gente
  const base=[
   {x:.50,y:.38,n:'os olhos'},{x:.50,y:.55,n:'a boca'},
   {x:.30,y:.80,n:'as mãos'},{x:.80,y:.40,n:'a parede atrás'},
   {x:.66,y:.92,n:'o chão'}
  ];
  return base;
}

/* ---------- desenho ---------- */
function desenharLente(w,h,t){
  const v=S.visitante;
  if(!v){CX.fillStyle='#050407';CX.fillRect(0,0,w,h);return;}
  if(!v._modelo)v._modelo=modeloVisitante(v);

  // MUNDO NORMAL: a porta por dentro, quase preta
  const g=CX.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#120E14');g.addColorStop(.5,'#1A1420');g.addColorStop(1,'#0C0910');
  CX.fillStyle=g;CX.fillRect(0,0,w,h);
  veios(0,0,w,h,3,'rgba(255,228,190,.022)',24);
  CX.strokeStyle='rgba(0,0,0,.5)';CX.lineWidth=1;
  for(let i=1;i<5;i++){CX.beginPath();CX.moveTo(w*i/5,0);CX.lineTo(w*i/5,h);CX.stroke();}
  lampiao(w,h,t,w*.12,h*.15,.55);

  // suavização do movimento
  L.x+=(L.alvo.x-L.x)*.28;
  L.y+=(L.alvo.y-L.y)*.28;
  const cx=L.x*w,cy=L.y*h,r=L.r*Math.min(w,h);

  // CAMADA OCULTA dentro do círculo
  CX.save();
  CX.beginPath();CX.arc(cx,cy,r,0,7);CX.clip();
  CX.save();
  // ele se mexe enquanto você olha
  const mm=micro(1/60,!!v.mimico);
  const zoom=1.22+mm.prox*.34;
  CX.translate(w*.5,h*.55);
  CX.rotate(mm.ang*.10);
  CX.translate(-w*.5,-h*.55);
  CX.translate(cx,cy);CX.scale(zoom,zoom);CX.translate(-cx,-cy);
  CX.translate(mm.ang*w*.07,mm.prox*h*.05);
  // o mundo lá fora é desenhado em tamanho fixo, independente da lente
  if(v.qtd>1)for(let k=v.qtd-1;k>=1;k--){
    CX.save();CX.globalAlpha=.4-k*.09;
    CX.translate((k%2?-1:1)*w*.16,h*.03*k);CX.scale(.84,.84);
    pintarVisitante(CX,w,h,v._modelo,t+k*1.7);
    CX.restore();
  }
  pintarVisitante(CX,w,h,v._modelo,t);
  CX.restore();

  // marcadores das zonas já reveladas
  L.zonas.forEach(z=>{
    if(!z.revelada)return;
    CX.strokeStyle='rgba(200,70,45,.75)';CX.lineWidth=2;
    CX.beginPath();CX.arc(z.x*w,z.y*h,z.r*Math.min(w,h)*.55,0,7);CX.stroke();
    CX.fillStyle='rgba(200,70,45,.10)';CX.fill();
  });
  // zona sendo carregada
  L.zonas.forEach(z=>{
    if(z.revelada||z.carga<=0)return;
    CX.strokeStyle='rgba(230,200,120,.8)';CX.lineWidth=2.5;
    CX.beginPath();
    CX.arc(z.x*w,z.y*h,z.r*Math.min(w,h)*.55,-Math.PI/2,-Math.PI/2+7*z.carga);
    CX.stroke();
  });
  // escurecimento na borda de dentro
  const bg=CX.createRadialGradient(cx,cy,r*.55,cx,cy,r);
  bg.addColorStop(0,'rgba(0,0,0,0)');bg.addColorStop(1,'rgba(3,2,5,.85)');
  CX.fillStyle=bg;CX.fillRect(cx-r,cy-r,r*2,r*2);
  CX.restore();

  // ARO DA LENTE
  const pulsa=.5+Math.sin(t*2.4)*.18;
  CX.strokeStyle='rgba(210,175,80,'+(.45+pulsa*.25)+')';
  CX.lineWidth=Math.max(2.5,r*.035);
  CX.beginPath();CX.arc(cx,cy,r,0,7);CX.stroke();
  CX.strokeStyle='rgba(70,56,28,.9)';CX.lineWidth=Math.max(6,r*.085);
  CX.beginPath();CX.arc(cx,cy,r*1.06,0,7);CX.stroke();
  CX.strokeStyle='rgba(30,24,14,.9)';CX.lineWidth=Math.max(2,r*.02);
  CX.beginPath();CX.arc(cx,cy,r*1.12,0,7);CX.stroke();
  // reflexo no vidro
  CX.fillStyle='rgba(230,220,200,.06)';
  CX.beginPath();CX.ellipse(cx-r*.33,cy-r*.4,r*.30,r*.15,-.6,0,7);CX.fill();
  // cruz de mira discreta
  CX.strokeStyle='rgba(210,175,80,.20)';CX.lineWidth=1;
  CX.beginPath();
  CX.moveTo(cx-r*.12,cy);CX.lineTo(cx+r*.12,cy);
  CX.moveTo(cx,cy-r*.12);CX.lineTo(cx,cy+r*.12);CX.stroke();

  if(R.encara>0){
    CX.fillStyle='rgba(140,47,30,'+(.06+Math.sin(t*9)*.04)+')';
    CX.fillRect(0,0,w,h);
  }
  // contador
  CX.textAlign='left';
  CX.font=Math.max(10,h*.038)+'px "Share Tech Mono",monospace';
  CX.fillStyle='rgba(232,226,212,.55)';
  CX.fillText('arraste pra procurar',10,h-12);
  if(L.total){
    CX.textAlign='right';
    CX.fillStyle=L.achou?'#B84B33':'rgba(232,226,212,.4)';
    CX.fillText(L.achou+' achado'+(L.achou===1?'':'s'),w-10,h-12);
  }
  // grão
  for(let i=0;i<26;i++){
    const a=Math.random()*7,d=Math.random()*r;
    CX.fillStyle='rgba(0,0,0,'+(Math.random()*.28)+')';
    CX.fillRect(cx+Math.cos(a)*d,cy+Math.sin(a)*d,2,2);
  }
}

/* ---------- interação ---------- */
function moverLente(cli){
  const rect=CV.getBoundingClientRect();
  L.alvo.x=trava((cli.clientX-rect.left)/rect.width,.06,.94);
  L.alvo.y=trava((cli.clientY-rect.top)/rect.height,.06,.94);
}
CV.addEventListener('pointerdown',e=>{
  if(cena.modo!=='olho')return;
  e.preventDefault();L.arrastando=true;moverLente(e);
  try{CV.setPointerCapture(e.pointerId)}catch(err){}
},{passive:false});
CV.addEventListener('pointermove',e=>{
  if(cena.modo!=='olho')return;
  e.preventDefault();
  if(L.arrastando||e.pointerType==='mouse')moverLente(e);
},{passive:false});
CV.addEventListener('pointerup',()=>{L.arrastando=false;});
CV.addEventListener('pointercancel',()=>{L.arrastando=false;});
CV.addEventListener('wheel',e=>{
  if(cena.modo!=='olho')return;
  e.preventDefault();
  L.r=trava(L.r+(e.deltaY>0?-.02:.02),.13,.42);
},{passive:false});
/* pinça de dois dedos pro raio */
let _pinca=null;
CV.addEventListener('touchstart',e=>{
  if(cena.modo!=='olho'||e.touches.length<2)return;
  const [a,b]=e.touches;
  _pinca=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
});
CV.addEventListener('touchmove',e=>{
  if(cena.modo!=='olho'||e.touches.length<2||!_pinca)return;
  e.preventDefault();
  const [a,b]=e.touches;
  const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
  L.r=trava(L.r*(d/_pinca),.13,.42);_pinca=d;
},{passive:false});
CV.addEventListener('touchend',()=>{_pinca=null;});

/* varredura: revela quando a lente fica em cima da zona */
function varrer(v){
  if(cena.modo!=='olho')return;
  const dt=1/30;
  L.zonas.forEach(z=>{
    if(z.revelada)return;
    const d=Math.hypot(L.x-z.x,L.y-z.y);
    const dentro=d<L.r*.75+z.r*.35;
    z.carga=trava(z.carga+(dentro?dt/.55:-dt/.4),0,1);
    if(z.carga>=1){
      z.revelada=true;L.achou++;
      const s='Pelo olho mágico, olhando '+z.nome+': '+z.txt.toLowerCase();
      if(!v.sinais.includes(s))v.sinais.push(s);
      diz('⚠ Olhando '+z.nome+': '+z.txt,'alerta');
      metalPesado(0);
      painelSinais(v);
    }
  });
}

async function olharPeloOlho(v){
  AC.innerHTML='';v.olhou=true;v.turnos++;
  metodoPorta().olho++;
  montarLente(v);reiniciarMicro();
  const antes=cena.modo;
  cena.modo='olho';dimensionar();
  correnteSom(0);
  diz(S.porta.olho?'A lente boa mostra o corredor inteiro do lado de fora.'
    :'Você encosta o olho no vidro riscado.','sist');
  diz('Arraste o dedo pela tela pra mover o olho mágico. Passe por cima do que quiser olhar de perto e segure ali.','fraco');
  if(!L.total)diz('Dá pra olhar: '+pontosDeInteresse(v).map(p=>p.n).join(', ')+'.','fraco');

  let parar=false;
  const timer=setInterval(()=>{if(!parar)varrer(v);},33);
  await new Promise(res=>{
    AC.innerHTML='';
    botao('Parar de olhar',()=>res(),{cls:'chave'});
    botao('Aumentar a abertura',()=>{L.r=trava(L.r+.06,.13,.42);},{custo:'vê mais, com menos detalhe'});
    botao('Fechar a abertura',()=>{L.r=trava(L.r-.06,.13,.42);},{custo:'vê menos, mais nítido'});
  });
  parar=true;clearInterval(timer);

  if(L.total&&L.achou===0){
    diz('Você olha por bastante tempo e não acha nada errado. Isso não quer dizer que não tenha.','fraco');
  }else if(!L.total){
    const m=v._modelo;
    diz(v.tipo==='ferido'?'Um rosto branco, suado, encostado na madeira. O sangue é de verdade.'
      :m.crianca?'Uma criança de verdade. Olha pro chão e mexe no zíper do casaco.'
      :'Rosto sujo, olhos fundos, a respiração fazendo vapor no frio. É gente.','bom');
  }else if(L.achou<L.total){
    diz(`Você achou ${L.achou} de alguma coisa. Pode ter mais que você não olhou.`,'sist');
  }else{
    diz('Você olhou tudo que tinha pra olhar.','sist');
  }
  cena.modo=antes;dimensionar();L.ativo=false;
  await pausa(600);
  await depoisDaResposta(v);
}
</script>
<script>
/* ================= ENCOSTAR O OUVIDO NA PORTA =================
   O som É a decisão. Nada de texto durante a escuta. */

const DEFEITOS_SOM=[
 {id:'rapida',camada:'resp',t:'A respiração estava rápida demais. Ninguém respira assim parado.'},
 {id:'lenta',camada:'resp',t:'Respirava devagar demais. Cinco vezes por minuto, no máximo.'},
 {id:'metronomo',camada:'resp',t:'A respiração era regular igual metrônomo. Não variava nunca.'},
 {id:'sempulmao',camada:'resp',t:'Era ar passando, mas não tinha peito enchendo atrás.'},
 {id:'sempeso',camada:'passo',t:'Se mexeu e a varanda não rangeu. Não tinha peso nenhum ali.'},
 {id:'gentedemais',camada:'passo',t:'Tinha passo de mais gente do que a sombra mostrava.'},
 {id:'semroupa',camada:'roupa',t:'Se mexeu inteiro e não teve som de tecido nenhum.'},
 {id:'semcorpo',camada:'corpo',t:'Não engoliu, não fungou, não tossiu. Nada de corpo.'},
 {id:'tossefora',camada:'corpo',t:'Tossiu, mas a sombra não mexeu quando tossiu.'}
];

function perfilEscuta(v){
  if(v._escuta)return v._escuta;
  const h=hashNome(v.pessoa.n+v.pessoa.id);
  const e={
    rpm:13+semente(h,4)*6,          // ciclos por minuto de gente
    variacao:.18+semente(h,5)*.14,  // gente varia o ritmo
    peso:.6+semente(h,6)*.4,
    defeitos:[]
  };
  if(v.mimico){
    let qtd=S.dia<=3?3:S.dia<=6?2:(chance(.72)?1:2);
    if(vicioPorta()==='ouvido'&&chance(.55))qtd=Math.max(1,qtd-1);
    e.defeitos=DEFEITOS_SOM.slice().sort(()=>Math.random()-.5).slice(0,qtd);
    e.defeitos.forEach(d=>{
      if(d.id==='rapida'){e.rpm=29+Math.random()*7;e.variacao=.05;}
      if(d.id==='lenta'){e.rpm=5+Math.random()*2;e.variacao=.06;}
      if(d.id==='metronomo')e.variacao=0;
      if(d.id==='sempulmao')e.sopro=true;
    });
  }
  v._escuta=e;
  return e;
}
const temDef=(e,id)=>e.defeitos.some(d=>d.id===id);

/* ---------- os sons ---------- */
function respirar(t0,e,ciclos){
  if(!A.ctx)return;
  const per=60/e.rpm;
  let t=t0;
  for(let i=0;i<ciclos;i++){
    const jit=1+(Math.random()-.5)*2*e.variacao;
    const dur=per*jit;
    // inspiração
    [[0,dur*.42,1],[dur*.5,dur*.42,.72]].forEach(([off,len,vol],k)=>{
      const s=src(),f=A.ctx.createBiquadFilter(),g=A.ctx.createGain();
      f.type='bandpass';
      f.frequency.setValueAtTime(e.sopro?1400:520,t+off);
      f.frequency.linearRampToValueAtTime(e.sopro?900:300,t+off+len);
      f.Q.value=e.sopro?.7:1.5;
      g.gain.setValueAtTime(0,t+off);
      g.gain.linearRampToValueAtTime(.055*vol*(e.sopro?.8:1),t+off+len*.35);
      g.gain.linearRampToValueAtTime(0,t+off+len);
      s.connect(f);f.connect(g);saida(g,{pan:.1,rev:.5});
      s.start(t+off);s.stop(t+off+len+.02);
      // gente tem um pouco de corda vocal na expiração
      if(k===1&&!e.sopro&&!temDef(e,'sempulmao')){
        const o=A.ctx.createOscillator(),g2=A.ctx.createGain();
        o.type='sine';o.frequency.value=88+Math.random()*22;
        g2.gain.setValueAtTime(0,t+off);
        g2.gain.linearRampToValueAtTime(.012,t+off+len*.3);
        g2.gain.linearRampToValueAtTime(0,t+off+len);
        o.connect(g2);saida(g2,{pan:.1,rev:.4});
        o.start(t+off);o.stop(t+off+len);
      }
    });
    t+=dur;
  }
  return t;
}
function pisada(t,peso,pan){
  if(!A.ctx)return;
  // o baque do corpo
  if(peso>0){
    const o=A.ctx.createOscillator(),g=A.ctx.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(78,t);
    o.frequency.exponentialRampToValueAtTime(34,t+.14);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(.14*peso,t+.012);
    g.gain.exponentialRampToValueAtTime(.001,t+.2);
    o.connect(g);saida(g,{pan,rev:.4});o.start(t);o.stop(t+.22);
  }
  // a tábua rangendo
  const s=src(),f=A.ctx.createBiquadFilter(),g=A.ctx.createGain();
  f.type='bandpass';f.frequency.setValueAtTime(700+Math.random()*500,t);
  f.frequency.linearRampToValueAtTime(340,t+.28);f.Q.value=7;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(.035*(peso||.3),t+.05);
  g.gain.exponentialRampToValueAtTime(.001,t+.3);
  s.connect(f);f.connect(g);saida(g,{pan,rev:.55});s.start(t);s.stop(t+.32);
}
function roupa(t,pan){
  if(!A.ctx)return;
  const s=src(),f=A.ctx.createBiquadFilter(),g=A.ctx.createGain();
  f.type='highpass';f.frequency.value=2600;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(.03,t+.04);
  g.gain.linearRampToValueAtTime(.014,t+.14);
  g.gain.exponentialRampToValueAtTime(.001,t+.34);
  s.connect(f);f.connect(g);saida(g,{pan,rev:.35});s.start(t);s.stop(t+.36);
}
function engolir(t,pan){
  if(!A.ctx)return;
  const o=A.ctx.createOscillator(),g=A.ctx.createGain(),f=A.ctx.createBiquadFilter();
  o.type='sine';
  o.frequency.setValueAtTime(190,t);
  o.frequency.exponentialRampToValueAtTime(95,t+.09);
  f.type='lowpass';f.frequency.value=900;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(.05,t+.015);
  g.gain.exponentialRampToValueAtTime(.001,t+.13);
  o.connect(f);f.connect(g);saida(g,{pan,rev:.4});o.start(t);o.stop(t+.15);
}
function tossir(t,pan){
  if(!A.ctx)return;
  const s=src(),f=A.ctx.createBiquadFilter(),g=A.ctx.createGain();
  f.type='bandpass';f.frequency.setValueAtTime(900,t);
  f.frequency.exponentialRampToValueAtTime(300,t+.16);f.Q.value=1.2;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(.15,t+.01);
  g.gain.exponentialRampToValueAtTime(.001,t+.22);
  s.connect(f);f.connect(g);saida(g,{pan,rev:.6});s.start(t);s.stop(t+.24);
  const o=A.ctx.createOscillator(),g2=A.ctx.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(120,t);
  o.frequency.exponentialRampToValueAtTime(60,t+.12);
  g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(.05,t+.015);
  g2.gain.exponentialRampToValueAtTime(.001,t+.16);
  o.connect(g2);saida(g2,{pan,rev:.5});o.start(t);o.stop(t+.18);
}
function fungar(t,pan){
  if(!A.ctx)return;
  const s=src(),f=A.ctx.createBiquadFilter(),g=A.ctx.createGain();
  f.type='bandpass';f.frequency.setValueAtTime(1800,t);
  f.frequency.linearRampToValueAtTime(2600,t+.1);f.Q.value=3;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.045,t+.03);
  g.gain.exponentialRampToValueAtTime(.001,t+.14);
  s.connect(f);f.connect(g);saida(g,{pan,rev:.35});s.start(t);s.stop(t+.16);
}
function arrastarLonge(t,pan){
  if(!A.ctx)return;
  const s=src(),f=A.ctx.createBiquadFilter(),g=A.ctx.createGain();
  f.type='lowpass';f.frequency.value=380;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(.022,t+.7);
  g.gain.linearRampToValueAtTime(.012,t+1.6);
  g.gain.linearRampToValueAtTime(0,t+2.4);
  s.connect(f);f.connect(g);saida(g,{pan,rev:.9});s.start(t);s.stop(t+2.5);
}

/* ---------- a sequência ---------- */
function tocarEscuta(v){
  if(!A.ctx)return 12;
  const e=perfilEscuta(v);
  const t0=A.ctx.currentTime+.4;
  abaixarAmbiente(.15,13);
  // respiração cobre os 12 segundos
  const ciclos=Math.ceil(12/(60/e.rpm))+1;
  respirar(t0,e,ciclos);
  // passos: ele se mexe 3 ou 4 vezes
  const nMex=3+Math.floor(Math.random()*2);
  for(let i=0;i<nMex;i++){
    const t=t0+1.2+i*(9/nMex)+Math.random()*.7;
    const pan=(Math.random()-.5)*.5;
    const peso=temDef(e,'sempeso')?0:e.peso;
    pisada(t,peso,pan);
    if(temDef(e,'gentedemais')){
      pisada(t+.22,peso*.8,pan-.4);
      pisada(t+.41,peso*.7,pan+.45);
    }
    if(!temDef(e,'semroupa'))roupa(t+.06,pan);
  }
  // corpo
  if(!temDef(e,'semcorpo')){
    engolir(t0+2.6+Math.random(),.05);
    if(chance(.6))fungar(t0+6.1+Math.random()*1.5,-.1);
    if(chance(.45))tossir(t0+8.4+Math.random(),0);
  }else if(temDef(e,'tossefora')){
    tossir(t0+5.2,0);
  }
  // fundo da rua
  arrastarLonge(t0+3.4,chance(.5)?-.85:.85);
  if(chance(.5))setTimeout(()=>latido(chance(.5)?-.9:.9,false),(t0-A.ctx.currentTime+7)*1000);
  if(chance(.4))setTimeout(()=>rocado(-.7),(t0-A.ctx.currentTime+10)*1000);
  return 12.6;
}

/* ---------- a tela ---------- */
function desenharEscuta(w,h,t){
  CX.fillStyle='#030204';CX.fillRect(0,0,w,h);
  const e=S.visitante?perfilEscuta(S.visitante):{rpm:16,variacao:.2};
  // a onda da respiração, sem dizer se está certa ou errada
  const per=60/e.rpm;
  CX.strokeStyle='rgba(201,162,39,.30)';CX.lineWidth=1.6;
  CX.beginPath();
  for(let x=0;x<w;x+=2){
    const fase=((t*.9+x/w*3.2)%per)/per;
    const y=h*.5-Math.sin(fase*Math.PI*2)*h*.16
      -Math.sin(fase*Math.PI*6)*h*.012;
    x?CX.lineTo(x,y):CX.moveTo(x,y);
  }
  CX.stroke();
  // eco fraco
  CX.strokeStyle='rgba(201,162,39,.07)';CX.lineWidth=6;CX.stroke();
  // a madeira em volta
  const g=CX.createRadialGradient(w/2,h*.5,h*.12,w/2,h*.5,h*.95);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.96)');
  CX.fillStyle=g;CX.fillRect(0,0,w,h);
  CX.fillStyle='rgba(232,226,212,.18)';
  CX.font=Math.max(10,h*.05)+'px "Share Tech Mono",monospace';
  CX.textAlign='center';
  CX.fillText('· · ·',w/2,h*.86);
  for(let i=0;i<30;i++){
    CX.fillStyle='rgba(255,255,255,'+(Math.random()*.05)+')';
    CX.fillRect(Math.random()*w,Math.random()*h,1.5,1.5);
  }
}

const PERG_ESCUTA=[
 {id:'resp',q:'A respiração dela.',
  op:[['Normal. Subia e descia como a de gente cansada.',null],
      ['Rápida demais.','rapida'],
      ['Devagar demais.','lenta'],
      ['Regular demais. Não variava nunca.','metronomo'],
      ['Era ar passando sem peito atrás.','sempulmao']]},
 {id:'passo',q:'Quando ela se mexeu.',
  op:[['A varanda rangeu com o peso. Normal.',null],
      ['Se mexeu e não teve peso nenhum.','sempeso'],
      ['Tinha passo de mais gente do que devia.','gentedemais']]},
 {id:'roupa',q:'O som de roupa.',
  op:[['Tecido roçando quando ela mexia. Normal.',null],
      ['Se mexeu inteira e não teve som de pano.','semroupa']]},
 {id:'corpo',q:'Coisa de corpo — engolir, fungar, tossir.',
  op:[['Engoliu e fungou como gente faz. Normal.',null],
      ['Não fez nada disso o tempo todo.','semcorpo'],
      ['Tossiu, mas a sombra não mexeu junto.','tossefora']]}
];

async function escutarPorta(v){
  AC.innerHTML='';v.escutou=true;v.turnos++;metodoPorta().ouvido++;
  S.ruido=trava(S.ruido+5,0,100);atualizarPainel();
  const e=perfilEscuta(v);
  const antes=cena.modo;
  cena.modo='escuta';dimensionar();limpar();
  cap('Você encosta o ouvido na madeira');

  if(!A.ctx||S.semVoz){
    diz('Sem som no aparelho. Dá pra ler o que você ouviria, mas escutar de verdade é metade da graça.','fraco');
    await pausa(1400);
    return escolherEscuta(v,e,antes,true);
  }
  const dur=tocarEscuta(v);
  await pausa(dur*1000);
  devolverAmbiente();
  await pausa(500);
  return escolherEscuta(v,e,antes,false);
}

function escolherEscuta(v,e,antes,escrito){
  limpar();cap('O que você ouviu');
  if(escrito){
    // versão sem som: descreve as camadas
    PERG_ESCUTA.forEach(p=>{
      const d=e.defeitos.find(x=>x.camada===p.id);
      const op=d?p.op.find(o=>o[1]===d.id):p.op[0];
      diz(op?op[0]:p.op[0][0],'narr');
    });
  }else{
    diz('Escolha a camada que te incomodou. Se você errar, você vai anotar uma coisa que não aconteceu.','fraco');
  }
  AC.innerHTML='';
  const usadas=PERG_ESCUTA.slice().sort(()=>Math.random()-.5).slice(0,3);
  usadas.forEach(p=>{
    botao(p.q,()=>responderEscuta(v,e,p,antes),{custo:'uma camada'});
  });
  botao('Não ouvi nada de errado',()=>{
    julgarEscuta(v,e,null,antes);
  },{cls:'chave'});
}

function responderEscuta(v,e,p,antes){
  limpar();cap(p.q);
  AC.innerHTML='';
  p.op.slice().sort(()=>Math.random()-.5).forEach(([txt,id])=>{
    botao(txt,()=>julgarEscuta(v,e,id,antes));
  });
}

async function julgarEscuta(v,e,escolha,antes){
  AC.innerHTML='';limpar();cap('A porta');
  cena.modo=antes;dimensionar();
  const real=e.defeitos.map(d=>d.id);
  if(escolha===null){
    if(!real.length){
      diz('Você não ouviu nada de errado. E não tinha nada de errado pra ouvir.','bom');
      v.sinais.push('◈ Você escutou e não achou nada. Corpo de gente.');
    }else{
      diz('Você não ouviu nada de errado. Isso não quer dizer que não tinha.','fraco');
    }
  }else if(real.includes(escolha)){
    const d=DEFEITOS_SOM.find(x=>x.id===escolha);
    diz('◈ '+d.t,'alerta');
    v.sinais.push('◈ Você escutou: '+d.t.toLowerCase());
    S.escutasCertas=(S.escutasCertas||0)+1;
  }else{
    const d=DEFEITOS_SOM.find(x=>x.id===escolha);
    diz('◈ '+(d?d.t:'Você jura que ouviu alguma coisa errada.'),'alerta');
    v.sinais.push('◈ Você escutou: '+(d?d.t.toLowerCase():'alguma coisa errada'));
    v.avisoFalso=true;
    S.escutasErradas=(S.escutasErradas||0)+1;
  }
  painelSinais(v);
  await pausa(900);
  await depoisDaResposta(v);
}
</script>
<script>
/* ================= PERGUNTAS QUE SÓ QUEM É DAQUI SABE ================= */
/* Cada uma é ensinada por um morador. O mímico só sabe o que ouviu de
   alguém — então acerta a pergunta de quem ele já pegou, e erra a de
   quem ainda está vivo na sua casa. */
const PERG_LOCAL={
 RIO:{p:'Qual o nome do rio que corta a cidade?',dono:'Damião',
   certo:'O Machado. Rio Machado.',
   errado:['O rio... o grande. O que passa perto da ponte.',
           'Rio Cacoal, oras.','Tem mais de um. Qual deles?'],
   aula:p=>`${p} falou do Rio Machado, de quando pescava lá de madrugada. Agora dá pra perguntar isso na porta.`},
 AVENIDA:{p:'Qual a avenida principal?',dono:'Marlene',

/* o mímico sabe a resposta local se pegou a voz de quem ensinou */
function mimicoSabeLocal(v,ch){
  const dono=PERG_LOCAL[ch].dono;
  const vivo=S.abrigo.some(p=>p.n===dono);
  const roubada=S.vozesRoubadas.some(x=>x.p.n===dono);
  if(vivo)return false;      // o dono está vivo aqui dentro: ele não teve como aprender
  if(roubada)return true;    // pegou a pessoa: aprendeu junto com a voz
  return chance(.35);        // aprendeu de outro morador qualquer
}

/* ================= OUVIR A VOZ DE PROPÓSITO ================= */
async function ouvirVoz(p,voltar){
  AC.innerHTML='';
  const vz=vozDe(p);
  p.vozOuvida=true;
  gastarHoras(0);
  S.minutos=(S.minutos||0)+10;
  if(S.minutos>=60){S.minutos-=60;gastarHoras(1);}
  limpar();cap('A voz de '+p.n);
  fichaRosto(p,p.hab,'você está guardando essa voz','vivo');
  await pausa(400);
  await falarV5(sortear(p.fala),{vozIdx:vz.vozIdx,pitch:vz.pitch,rate:vz.rate,dist:'perto'});
  await pausa(500);
  diz('Você guarda o jeito que ela fala. Se um dia isso bater na sua porta e ela não estiver mais aqui, você vai saber.','sist');
  AC.innerHTML='';
  botao('Ouvir de novo',()=>ouvirVoz(p,voltar),{custo:'10 minutos'});
  botao('Voltar',voltar,{cls:'chave'});
}

/* na porta: você reconhece de ouvido o que já escutou antes */
function reconheceVoz(v){
  const p=v.pessoa;
  if(!p.vozOuvida&&!S.vozesOuvidas.includes(p.n))return null;
  const vivo=S.abrigo.some(x=>x.n===p.n);
  return vivo
    ?`Você já escutou essa voz. É ${p.n}. E ${p.n} está dormindo lá dentro.`
    :`Você já escutou essa voz de perto. Era ${p.n}.`;
}

function latido(pan,bravo){
  if(!A.ctx)return;
  const t0=A.ctx.currentTime,n=bravo?7:3;
  for(let i=0;i<n;i++){
    const t=t0+i*(bravo?.19:.32);
    const o=A.ctx.createOscillator(),g=A.ctx.createGain(),f=A.ctx.createBiquadFilter();
    o.type='sawtooth';
    o.frequency.setValueAtTime(bravo?260:200,t);
    o.frequency.exponentialRampToValueAtTime(bravo?110:95,t+.14);
    f.type='bandpass';f.frequency.value=900;f.Q.value=1.6;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(bravo?.19:.11,t+.02);
    g.gain.exponentialRampToValueAtTime(.001,t+.19);
    o.connect(f);f.connect(g);saida(g,{pan:pan||0,rev:.5});o.start(t);o.stop(t+.21);
  }
}

/* ================= O MURO =================
   Ele existia e sumiu quando eu reescrevi o quintal. Voltou,
   e agora com dano, rachadura e níveis de verdade. */
function muro(){
  if(!S.muroEst)S.muroEst={nivel:S.muro||0,dano:0,cerca:0};
  return S.muroEst;
}
function estadoMuro(){
  const M=muro();
  if(!M.nivel&&!M.cerca)return 'não tem muro nenhum';
  const d=M.dano>=6?' · RACHADO':M.dano>=3?' · com dano':'';
  return `muro ${M.nivel}/3 · cerca ${M.cerca}/2${d}`;
}
function forcaMuro(){
  const M=muro();
  return Math.max(0,M.nivel*1.6+M.cerca*.8-M.dano*.35);
}
function danificarMuro(n){
  const M=muro();
  M.dano=Math.min(10,M.dano+n);
  if(M.dano>=10&&M.nivel>0){M.nivel--;M.dano=4;return 'caiu';}
  return M.dano>=6?'rachou':'bateu';
}
function menuMuro(){
  AC.innerHTML='';limpar();cap('O muro');
  const M=muro();
  const desc=[
    'Não tem muro. Qualquer coisa entra andando.',
    'Muro na altura da cintura. Atrapalha, não impede.',
    'Muro na altura do peito, com caco de vidro em cima.',
    'Muro alto, com arame farpado e sem apoio pra pé.'][M.nivel]||'';
  diz(desc,M.nivel>=2?'bom':'perigo');
  if(M.cerca)diz(`E uma cerca de ${M.cerca===1?'um trecho':'dois trechos'} fechando o fundo.`,'sist');
  if(M.dano>=6)diz('Tem uma rachadura de cima a baixo num trecho. Empurrando com força, aquilo cede.','alerta');
  else if(M.dano>=3)diz('Uns blocos estão soltos de um lado.','fraco');
  diz(`Isso hoje vale ${forcaMuro().toFixed(1)} de defesa contra o que vier do quintal.`,'sist');

  if(M.dano>0)botao('Rebocar e assentar o que soltou',acaoDia(2,async()=>{
    if(!temMat('cimento',1))return diz('Sem cimento não dá pra assentar nada.','perigo');
    gastarMat('cimento',1);
    M.dano=Math.max(0,M.dano-5);
    diz(M.dano?'Melhorou. Ainda tem trecho pra refazer.':'O muro está inteiro de novo.','bom');
  }),{custo:'2h · 1 cimento'});

  if(M.nivel<3)botao(['Levantar o muro','Subir o muro','Botar caco e arame em cima'][M.nivel],
    acaoDia(4,async()=>{
      const pre=[{cimento:2,tabua:2},{cimento:3,tabua:2},{cimento:2,arame:4}][M.nivel];
      const falta=Object.keys(pre).filter(k=>!temMat(k,pre[k]));
      if(falta.length)return diz('Falta '+falta.map(k=>pre[k]+' '+MATE[k].un).join(' e ')+'.','perigo');
      if(!temFerra('pa'))return diz('Sem pá você não mistura massa.','perigo');
      Object.keys(pre).forEach(k=>gastarMat(k,pre[k]));
      M.nivel++;S.muro=M.nivel;
      diz(['','O muro vai até a cintura agora.','O muro passou da altura do peito.',
        'Arame farpado em cima e nenhum apoio pra pé. Isso segura gente.'][M.nivel],'bom');
      anotar('Subiu o muro pro nível '+M.nivel+'.');
    }),{custo:'4h · '+[ '2 cimento + 2 tábuas','3 cimento + 2 tábuas','2 cimento + 4 arames'][M.nivel]});

  if(M.cerca<2)botao('Fechar o fundo com cerca',acaoDia(2,async()=>{
    if(!temMat('tabua',3)||!temMat('prego',6))
      return diz('Precisa de 3 tábuas e 6 pregos.','perigo');

    M.cerca++;fecharAvaria('cerca');
    diz('O fundo está fechado. Não é muro, mas ninguém passa sem fazer barulho.','bom');

  botao('Olhar o muro por fora',acaoDia(1,async()=>{
    S.ruido=trava(S.ruido+3,0,100);

    if(chance(.4))achou.push('Tem marca de mão na parte de cima, do lado de fora.');

    if(chance(.2)){darMat('tabua',2);achou.push('Sobrou material do lado de fora: +2 tábuas.');}
    if(!achou.length)diz('Nada. Só o muro e a rua.','narr');
    else achou.forEach(a=>diz(a,'alerta'));
  }),{custo:'1 hora · +3 ruído'});
  botao('Voltar',()=>menuComodo(8),{cls:'chave'});
}

function locaisDeHoje(){
  if(S.locaisDia===S.dia&&S.locaisHoje)return S.locaisHoje;
  const fixos=poolDeLocais().filter(l=>(S.esgotados[l.id]||0)<2&&(!l.trava||tem(l.trava)));
  const emb=fixos.slice().sort(()=>Math.random()-.5);
  const sel=emb.slice(0,4);
  if(S.gerQuebrado&&!S.peca){
    const h=poolDeLocais().find(l=>l.id==='hospital');
    if(h&&!sel.includes(h))sel[3]=h;
  }
  S.locaisHoje=sel;S.locaisDia=S.dia;
  return sel;
}
function itensDoLocal(l){
  const n=1+Math.floor(Math.random()*2)+(l.risco>=4?1:0);
  const bag=(l.itens||[]).slice().sort(()=>Math.random()-.5).slice(0,n);
  return bag.map(id=>ITENS.find(i=>i.id===id)).filter(Boolean);
}

function darItem(id){
  S.armas=S.armas||[];
  const it=ITENS.find(i=>i.id===id);
  if(!it)return;
  if(it.dano){
    if(S.armas.includes(id)){diz('Você já tem um desses.','fraco');return;}
    S.armas.push(id);
    diz(`${it.n} agora é seu. ${it.d}`,'bom');
    anotar(`Achou: ${it.n}.`);
  }
}

function telaItens(){

    (it.municao?'dano '+it.dano+' · '+(S.cartucho||0)+' cartucho'+((S.cartucho||0)===1?'':'s')
      :it.silenciosa?'dano '+it.dano+' · não faz barulho':'dano '+it.dano),it.d));
  const fs=(S.ferra||[]);
  if(fs.length)ficha('Ferramentas',fs.length+' de '+Object.keys(FERRA).length,
    fs.map(f=>FERRA[f].n).join(', '));
  else ficha('Ferramentas','nenhuma','Sem ferramenta, quase todo conserto vira gambiarra.');
  ficha('Material','',listaMat());
  const av=avarias();
  if(av.length){
    diz('Quebrado na casa:','alerta');
    av.forEach(x=>{
      const e=AVARIAS[x.id],f=faltaPra(x);
      diz(`· ${e.n} (${PLANTA[e.onde].nome.toLowerCase()})${x.grave?' — PIORANDO':''}${f.length?' — falta '+f.join(', '):' — dá pra resolver'}`,
        x.grave?'perigo':'sist');
    });
  }
  const mv=melhorVeic();
  if(mv)ficha(VEIC[mv].n,'carrega +'+VEIC[mv].carga+'kg',VEIC[mv].d);
  if(S.coquetel)ficha('Garrafas incendiárias',S.coquetel+' restantes','Uma por uso.');
  if(S.lanterna)ficha('Lanterna forte','1 uso','Cega qualquer coisa por uns segundos.');
  if(!armasNaMao().length&&!S.coquetel&&!S.lanterna)diz('Nada. Só as mãos.','perigo');
  const m=melhorArma();
  if(m)diz(`Se alguma coisa vier pra cima, você usa ${m.n.toLowerCase()}.`,'sist');
  AC.innerHTML='';
  botao('Voltar',()=>irPara(cena.casa.voce),{cls:'chave'});
}

function menuFabrico(){
  limpar();cap('OFICINA · '+horaTexto());
  diz('A bancada tem prego, arame, madeira e uma serra manual.','narr');
  AC.innerHTML='';
  FABRICO.forEach(f=>{
    if(f.uma&&(S[f.uma]||S.porta[f.uma])){ficha(f.n,'pronto','Já está feito.');return;}
    const horas=Math.max(1,f.h-S.oficinaNivel);
    ficha(f.n,horas+'h',f.d);
    botao(f.n,acaoDia(horas,async()=>{
      if(f.som==='martelo')martelada(8,-.15);
      else if(f.som==='serra')serrada(5,.1);
      else if(f.som==='metal'){serrada(3,0);setTimeout(()=>trancaSom(0),1900);}
      diz(`Você trabalha ${horas} ${horas===1?'hora':'horas'} na bancada.`,'sist');
      await pausa(2000);
      diz(f.f(),'bom');
      atualizarPainel();
    }),{custo:horas+(horas===1?' hora':' horas')});
  });
  botao('Sair da bancada',()=>menuComodo(3));
}

/* ================= MAIS CONVERSA ================= */
function opiniaoDaCasa(){
  limpar();cap('SALA · '+horaTexto());
  const p=sortear(S.abrigo);
  const m=moralMedia(),risco=riscoInvasao();
  const falas=[];
  if(risco>.3)falas.push(`“Essa porta não segura, ${S.nomeJogador}. Todo mundo aqui sabe e ninguém fala.”`);
  else if(risco<.12)falas.push('“Pela primeira vez eu dormi de verdade. A porta tá boa.”');
  if(S.comida<gastoComida()*2)falas.push('“Tem comida pra hoje. Pra depois de hoje eu não sei.”');
  if(S.agua<=1)falas.push('“A água acabou. Isso mata antes de qualquer coisa lá fora.”');
  if(S.gerSaude<40)falas.push('“Esse motor tá com um barulho que eu não gosto.”');
  if(S.confianca<40)falas.push(`“Eu vou ser sincero: tem gente aqui que não confia mais em você.”`);
  if(S.infiltrado&&S.pistasDadas.length>=2&&p!==S.infiltrado&&chance(.4))
    falas.push(`“Repara em quem come e em quem só finge que come.”`);
  if(!falas.length)falas.push('“Tá tudo do jeito que dá pra estar. É pouco, mas é.”');
  diz(`${p.n}: ${sortear(falas)}`,'fala');
  mexerMoral(4,p);
  AC.innerHTML='';
  botao('Voltar',()=>menuComodo(4),{cls:'chave'});
}

function menuConversa(id){
  const aqui=S.abrigo.filter(p=>p.local===id);
  if(!aqui.length)return menuComodo(id);
  limpar();cap(PLANTA[id].nome+' · '+horaTexto()+' · '+faixaDoDia());AC.innerHTML='';
  diz('Com quem?','sist');
  aqui.forEach(p=>{
    const b=botao(p.n,()=>menuAssunto(p,id),
      {custo:p.moral>=65?'firme':p.moral>=35?'abalado':'no limite'});
    b.prepend(elRosto(p,30,'vivo'));b.classList.add('bt-rosto');
  });
  botao('Deixar pra depois',()=>menuComodo(id));
}

function menuAssunto(p,id){
  limpar();cap(p.n+' · '+horaTexto());
  fichaRosto(p,p.hab,p.ef,'vivo');
  AC.innerHTML='';
  botao('Falar cara a cara',()=>conversar(p,()=>menuAssunto(p,id)),
    {cls:'prim',custo:'sem gastar hora'});
  botao('Só conversar',acaoDia(1,async()=>{
    limpar();cap(p.n);
    diz(`${p.n}: “${falaDe(p)}”`,'fala');
    await pausa(700);mexerMoral(13,p);mexerMoral(3);
    if(!talvezRevelar(p)){
      if(!liberarPerguntaLocal(p))
        diz(`${p.n} fica menos travado depois de falar.`,'bom');
    }
  }),{custo:'1 hora · moral'});
  botao('Ouvir a voz dela com atenção',()=>ouvirVoz(p,()=>menuAssunto(p,id)),
    {custo:p.vozOuvida?'já guardou':'10 minutos'});
  botao('Perguntar da cidade',acaoDia(1,async()=>{
    limpar();cap(p.n);
    if(!liberarPerguntaLocal(p)){
      diz(`${p.n} conta uma coisa qualquer da cidade. Nada que dê pra usar na porta.`,'narr');
      mexerMoral(5,p);
    }
  }),{custo:'1 hora · pergunta nova'});
  if(S.comida>0)botao('Dividir uma lata',acaoDia(1,async()=>{
    S.comida--;ganhou({comida:-1});
    limpar();cap(p.n);
    mexerMoral(18,p);
    S.abrigo.filter(o=>o!==p).forEach(o=>aproximar(p,o,-4));
    diz(`Vocês dois comem em silêncio no chão da ${PLANTA[id].nome.toLowerCase()}. ${p.n} não esquece disso.`,'bom');
    diz('Os outros viram.','fraco');
  }),{custo:'1 hora · 1 lata'});
  if(S.abrigo.length>=2)botao('Perguntar o que ele acha dos outros',acaoDia(1,async()=>{
    limpar();cap(p.n);
    const outros=S.abrigo.filter(o=>o!==p);
    const alvo=sortear(outros);
    const v=(p.lacos&&p.lacos[alvo.n])||0;
    if(p===S.infiltrado){
      const inocente=sortear(outros);
      diz(`${p.n}: “Eu ficaria de olho em ${inocente.n}. Tem uma coisa errada nele.”`,'fala');
      diz('Ele falou isso rápido demais. Como quem já tinha a resposta pronta.','fraco');
    }else if(S.infiltrado&&outros.includes(S.infiltrado)&&chance(.35)){
      diz(`${p.n}: “${S.infiltrado.n}. Eu não sei explicar. Mas eu não durmo de costas pra ele.”`,'fala');
      if(!S.pistasDadas.includes(-1))S.pistasDadas.push(-1);
    }else if(v>40)diz(`${p.n}: “${alvo.n} é gente boa. Se eu tiver que confiar em alguém aqui, é nele.”`,'fala');
    else if(v<-30)diz(`${p.n}: “${alvo.n} come mais do que trabalha. Eu já falei isso na cara dele.”`,'fala');
    else diz(`${p.n}: “${alvo.n}? Eu mal conheço. Ninguém aqui conhece ninguém direito.”`,'fala');
    mexerMoral(4,p);
  }),{custo:'1 hora'});
  if(melhorArma()&&!p.armado)botao(`Dar ${melhorArma().n.toLowerCase()} pra ele`,acaoDia(1,async()=>{
    const a=melhorArma();
    S.armas=S.armas.filter(x=>x!==a.id);
    p.armado=a.id;
    limpar();cap(p.n);
    mexerMoral(16,p);S.confianca=trava(S.confianca+8,0,100);
    diz(`${p.n} pega ${a.n.toLowerCase()} e não solta mais. Vai lutar por você na invasão.`,'bom');
  }),{custo:'1 hora · perde a arma'});
  botao('Voltar',()=>menuConversa(id),{cls:'chave'});
}
</script>
<script>
/* ================= OS BICHOS ================= */
const BICHOS=[
 {id:'magro',n:'o Magro',peso:30,vel:1,mem:2,folego:0,
  ap:'Alto, fino, com os braços compridos demais pro corpo. Anda rápido e para de repente.',
  fraco:'Foge de luz forte.'},
 {id:'rastejante',n:'o que Rasteja',peso:22,vel:.6,mem:4,folego:0,
  ap:'Não fica em pé. Se arrasta com o peito no chão e cheira o assoalho.',
  fraco:'Lento. Dá pra ganhar distância, mas ele não perde o rastro.'},
 {id:'coro',n:'a Coisa de Muitas Bocas',peso:14,vel:1,mem:2,folego:0,dois:true,
  ap:'Parecem dois, mas se movem no mesmo compasso, como se fossem a mesma coisa em dois lugares.',
  fraco:'Barulho alto confunde as duas metades.'},
 {id:'imitador',n:'o que Chama',peso:20,vel:1,mem:3,folego:0,chama:true,
  ap:'Você não vê. Você ouve gente conhecida chamando você de outro cômodo.',
  fraco:'Se você não responder, ele erra o caminho.'},
 {id:'inchado',n:'o Inchado',peso:11,vel:.7,mem:2,folego:1,
  ap:'Grande demais pra passar em porta. Passa mesmo assim, levando o batente junto.',
  fraco:'Não cabe em vão apertado. Móvel na frente segura ele de verdade.'},
 {id:'primordial',n:'aquilo',peso:3,raro:true,vel:1.2,mem:6,folego:2,
  ap:'Não tem forma que dure. Você olha e a sua cabeça se recusa a guardar o que viu.',
  fraco:'Nada que você tem funciona. Só a saída dos fundos.'}
];

function sortearBicho(){
  const p=[];
  BICHOS.forEach(b=>{
    let w=b.peso;
    if(b.id==='primordial'){
      if(S.dia<7)w=0;
      else w=Math.round(1+(S.dia-7)*.6+(S.vozesRoubadas.length>7?2:0));
    }
    if(b.id==='coro'&&S.dia<4)w=0;
    for(let i=0;i<w;i++)p.push(b);
  });
  return sortear(p.length?p:[BICHOS[0]]);
}

/* ================= ENCONTRO NA RUA ================= */
const COMO=[
 {id:'ouviu',t:'Ela para no meio da rua e vira a cabeça na direção do barulho que você fez.',parado:true},
 {id:'viu',t:'Ela está olhando pra você. Não tem dúvida nenhuma nisso.',parado:false},
 {id:'cheirou',t:'Ela levanta o rosto e cheira o ar duas vezes. Depois vem, sem pressa e sem errar a direção.',parado:false},
 {id:'atras',t:'Você percebe pelo reflexo do vidro que tem alguma coisa atrás de você. Perto.',parado:false}
];
const DIST=[
 {id:'longe',t:'Uns cinquenta metros, do outro lado da rua.',n:3},
 {id:'media',t:'Uns quinze metros. Do lado de cá do muro.',n:2},
 {id:'perto',t:'A dois passos. Você sente o cheiro.',n:1}
];

async function encontroRua(ctx,levar){
  const b=sortearBicho();
  S.vistosMonstro=S.vistosMonstro||[];
  if(ctx.l&&!S.vistosMonstro.includes(ctx.l.id))S.vistosMonstro.push(ctx.l.id);
  const como=sortear(COMO);
  const dist=como.id==='atras'?DIST[2]:sortear(DIST);
  ctx.bicho=b;
  const panB=chance(.5)?-.7:.7;
  assinatura(b.id,panB,trava(1.1-dist.n*.22,.3,1));
  await pausa(800);
  rugido(b.id==='primordial'?.25:dist.n*.45,panB);
  if(b.id==='primordial'){silencioSubito(2);await pausa(2200);}
  await pausa(900);
  diz(como.t,'perigo');
  await pausa(1300);
  diz(dist.t,'sist');
  await pausa(900);
  diz(b.ap,b.id==='primordial'?'perigo':'narr');
  if(b.id==='primordial'){
    await pausa(1600);
    diz('Isso não é do mesmo tipo das outras. Isso é mais velho que as outras.','perigo');
  }
  await pausa(1200);
  AC.innerHTML='';
  const arma=melhorArma();
  /* a isca atrasa quem caça por faro */
  /* inibidor: quem caça por cheiro não te acha */
  if(S.inibidor&&b.id!=='primordial'){S.inibidor=0;
    diz('Ela passa a dois metros de você farejando o ar e não acha nada. O spray funcionou.','bom');
    return false;}
  /* caixa de música: o que caça por som para */
  if(S.caixinha&&(b.id==='coro'||b.id==='imitador'||b.id==='rastejante')){S.caixinha=0;
    diz('Você abre a caixinha. A música é curta e errada, e ela para de se mexer enquanto toca.','bom');
    return false;}
  if(S.iscaAtiva>0){S.iscaAtiva--;
    diz('A carne que você jogou ainda está distraindo alguma coisa lá atrás.','bom');}
  const pm=penalidadeMaos();
  if(pm){
    diz(maosOcupadas()===1
      ?'Você está com uma coisa grande no braço. Isso atrapalha.'
      :'Você está com as duas mãos ocupadas. Vai ter que largar alguma coisa.','alerta');
  }
  if(arma&&arma.municao&&!usarMunicao(arma)){
    diz('Você aponta e o tambor está vazio.','perigo');
  }else if(arma&&arma.municao){
    S.ruido=trava(S.ruido+14,0,100);
    diz('O tiro ecoa a cidade inteira. Isso vai trazer gente e coisa.','alerta');
  }else if(arma&&arma.silenciosa){
    diz('A besta não faz barulho nenhum. Ninguém mais fica sabendo.','sist');
  }

  return new Promise(res=>{
    /* ficar imóvel: só funciona se ela não te viu nem te cheirou */
    if(como.parado&&dist.n>=2)botao('Ficar completamente parado',async()=>{
      AC.innerHTML='';
      const p=trava((b.id==='rastejante'?.25:b.id==='primordial'?.05:.72)-penalidadeMaos()-pesoFerido(),.03,.95);
      await pausa(2200);
      if(chance(p)){
        diz('Você não respira por quase um minuto. Ela desiste e vai embora pro outro lado.','bom');
        res(false);
      }else{
        diz('Ela vem mesmo assim. Alguma coisa em você denuncia o que você é.','perigo');
        await pausa(1400);res(await fuga(ctx,levar,b,1));
      }
    },{custo:como.id==='ouviu'?'boa chance':'arriscado'});

    /* recuar devagar */
    if(dist.n>=2)botao('Recuar devagar, de costas',async()=>{
      AC.innerHTML='';
      const p=trava(.68-(3-dist.n)*.2-(b.vel-1)*.3,.15,.8);
      await pausa(1800);
      if(chance(p)){
        diz('Você anda pra trás sem tirar o olho dela até virar a esquina.','bom');
        S.ruido=trava(S.ruido+4,0,100);res(false);
      }else{
        diz('Ela cobre a distância antes de você chegar na esquina.','perigo');
        res(await fuga(ctx,levar,b,1));
      }
    });

    /* jogar coisa pra desviar */
    botao('Jogar alguma coisa pro outro lado',async()=>{
      AC.innerHTML='';
      const p=trava((b.id==='rastejante'||b.id==='primordial'?.15:b.id==='imitador'?.75:.55)-penalidadeMaos()*.5,.03,.95);
      passo(.6,-.8);
      await pausa(1700);
      if(chance(p)){
        diz('O barulho pega do outro lado da rua. Ela vai atrás e você some.','bom');
        res(false);
      }else{
        diz('Ela nem olha pro barulho. Olha pra você.','perigo');
        res(await fuga(ctx,levar,b,1));
      }
    },{custo:'faz barulho'});

    /* correr */
    botao('Correr agora',async()=>{
      AC.innerHTML='';
      res(await fuga(ctx,levar,b,dist.n>=2?0:1));
    },{custo:dist.n===1?'ela está colada':'dá pra tentar'});

    /* enfrentar com arma */
    if(arma&&dist.n<=2&&b.id!=='primordial')botao(`Enfrentar com ${arma.n.toLowerCase()}`,async()=>{
      AC.innerHTML='';
      const p=trava(.18+arma.dano*.17-(b.folego*.2)-penalidadeMaos()*.7-pesoFerido(),.05,.7);
      await pausa(1600);
      if(chance(p)){
        diz(`Você acerta ${b.n} na altura da cabeça três vezes seguidas. Ela recua e não volta.`,'bom');
        anotar(`Enfrentou ${b.n} com ${arma.n.toLowerCase()} e venceu.`);
        S.ruido=trava(S.ruido+9,0,100);res(false);
      }else{
        diz(`Você acerta. Não adianta. ${arma.n} fica no chão junto com o resto.`,'perigo');
        S.armas=S.armas.filter(x=>x!==arma.id);
        res(await fuga(ctx,levar,b,1));
      }
    },{cls:'prim',custo:'dano '+arma.dano});

    if(S.coquetel>0)botao('Acender uma garrafa e jogar',async()=>{
      AC.innerHTML='';S.coquetel--;
      await pausa(1400);
      if(b.id==='primordial'){
        diz('O fogo pega. Ela atravessa o fogo.','perigo');
        res(await fuga(ctx,levar,b,1));
      }else{
        diz('O vidro estoura e o fogo sobe entre vocês. Ela recua do calor.','bom');
        S.ruido=trava(S.ruido+8,0,100);res(false);
      }
    },{custo:'gasta 1 garrafa'});

    if(S.lanterna&&b.id!=='primordial')botao('Lanterna na cara dela',async()=>{
      AC.innerHTML='';S.lanterna=false;
      await pausa(1200);
      diz(b.id==='magro'?'O facho pega em cheio. Ela se dobra pra trás fugindo da luz e some.'
        :'Ela se protege da luz o suficiente pra vocês passarem.','bom');
      res(false);
    },{custo:'gasta a lanterna'});

    if(ctx.par)botao(`Deixar ${ctx.par.n} distrair ela`,async()=>{
      AC.innerHTML='';
      diz(`${ctx.par.n} olha pra você uma vez antes de correr pro outro lado gritando.`,'perigo');
      await pausa(1500);
      morreuAlguem(ctx.par,`você deixou pra trás pra escapar de ${b.n}, na noite ${S.dia}`);
      S.confianca=trava(S.confianca-32,0,100);
      diz(`Você volta com tudo. ${ctx.par.n} não volta.`,'perigo');
      ctx.par=null;res(false);
    },{custo:'ele fica'});
  });
}

async function fuga(ctx,levar,b,penal){
  if(maosOcupadas()){
    const perdeu=maos().map(id=>CATALOGO[id].n);
    S.maos=[];
    diz(`Você larga ${perdeu.join(' e ')} no meio da rua pra poder correr.`,'perigo');
  }
  const p=trava(.72-penal*.22-(b.vel-1)*.35+(ctx.par&&ctx.par.hab==='corrida'?.15:0)
    -penalidadeMaos()-pesoFerido(),.06,.9);
  passo(1,-.5);passo(1,.5);
  await pausa(1500);
  if(chance(p)){
    if(levar)Object.keys(levar).forEach(k=>levar[k]=Math.floor(levar[k]*.6));
    diz('Você corre até o peito arder e só para quando o portão de casa está fechado atrás de você.','perigo');
    diz('Parte do que você carregava ficou na calçada.','sist');
    S.ruido=trava(S.ruido+16,0,100);
    await recolher(ctx,levar||{},false);
    return true;
  }
  if(b.id==='primordial'){
    if(ctx.par){
      morreuAlguem(ctx.par,`ficou pra trás quando aquilo apareceu, na noite ${S.dia}`);
      diz(`Aquilo alcança ${ctx.par.n} primeiro. Você não olha pra trás.`,'perigo');
      S.ruido=trava(S.ruido+20,0,100);
      await recolher(ctx,{},true);
      return true;
    }
    return fim('primordial');
  }
  diz('Ela te alcança na esquina.','perigo');
  await pausa(1200);
  await recolher(ctx,{},true);
  return true;
}
</script>
<script>
/* ================= FERRAMENTAS ================= */
const FERRA={
 martelo:{n:'martelo',d:'Cabo de madeira, meio solto.'},
 fenda:{n:'chave de fenda',d:'Ponta gasta mas serve.'},
 alicate:{n:'alicate',d:'Enferrujado na dobradiça.'},
 inglesa:{n:'chave inglesa',d:'Boa pra cano e porca.'},
 serra:{n:'serrote',d:'Dente cego de um lado.'},
 pa:{n:'pá',d:'Cabo curto, lâmina boa.'},
 enxada:{n:'enxada',d:'Amolada semana passada.'},
 lanterna:{n:'lanterna',d:'Só funciona com pilha.'},
 escada:{n:'escada',d:'Alcança o telhado e a calha.'}
};
const MATE={
 tabua:{n:'tábua',un:'tábuas'},prego:{n:'prego',un:'pregos'},
 arame:{n:'arame',un:'metros de arame'},lona2:{n:'lona',un:'pedaços de lona'},
 cano:{n:'cano',un:'pedaços de cano'},fio:{n:'fio',un:'metros de fio'},
 telha:{n:'telha',un:'telhas'},cimento:{n:'cimento',un:'sacos de cimento'},
 vedante:{n:'vedante',un:'rolos de vedante'}
};
function temFerra(id){return (S.ferra||[]).includes(id);}
function pegarFerra(id){
  S.ferra=S.ferra||[];
  if(S.ferra.includes(id))return false;
  S.ferra.push(id);return true;
}
function temMat(id,q){return (S.mat&&S.mat[id]||0)>=(q||1);}
function gastarMat(id,q){S.mat=S.mat||{};S.mat[id]=Math.max(0,(S.mat[id]||0)-(q||1));}
function darMat(id,q){S.mat=S.mat||{};S.mat[id]=(S.mat[id]||0)+(q||1);}
function listaMat(){
  return Object.keys(S.mat||{}).filter(k=>S.mat[k]>0)
    .map(k=>S.mat[k]+' '+(S.mat[k]===1?MATE[k].n:MATE[k].un)).join(', ')||'nada';
}
function faltaPra(av){
  const f=[],e=AVARIAS[av.id];
  (e.ferra||[]).forEach(x=>{if(!temFerra(x))f.push(FERRA[x].n)});
  Object.keys(e.mat||{}).forEach(k=>{
    const q=e.mat[k],t=(S.mat&&S.mat[k])||0;
    if(t<q)f.push((q-t)+' '+((q-t)===1?MATE[k].n:MATE[k].un));
  });
  return f;
}

/* ================= AVARIAS =================
   Aparecem sozinhas, pioram se você ignorar, e algumas
   viram outra coisa pior. */
const AVARIAS={

function avarias(){return S.avarias||(S.avarias=[]);}
function avariaEm(id){return avarias().find(a=>a.id===id);}
function avariasNo(comodo){return avarias().filter(a=>AVARIAS[a.id].onde===comodo);}

function abrirAvaria(id,motivo){
  if(avariaEm(id))return null;
  const e=AVARIAS[id];if(!e)return null;
  const a={id,dias:0,etapa:0,vista:false,motivo:motivo||null,grave:false};
  avarias().push(a);
  return a;
}
function fecharAvaria(id){S.avarias=avarias().filter(a=>a.id!==id);}

/* nascem sozinhas, com peso por clima e por dia */
function talvezNovaAvaria(){
  const jaTem=avarias().map(a=>a.id);
  let pool=Object.keys(AVARIAS).filter(k=>!jaTem.includes(k)&&!AVARIAS[k].sofoco);
  // as que são consequência só entram pela cadeia, não do nada
  const consequencia=Object.values(AVARIAS).map(e=>e.pior).filter(Boolean);
  pool=pool.filter(k=>!consequencia.includes(k));
  if(!pool.length)return null;
  /* quanto mais coisa quebrada já tem, menos coisa nova nasce */
  let p=.11+S.dia*.011-avarias().length*.035;
  if(S.clima==='tempestade')p+=.13;
  else if(S.clima==='chuva')p+=.07;
  if(S.viradaChuva>0)p+=.05;
  if(!chance(trava(p,.02,.34)))return null;
  // a chuva escolhe o que estraga
  let esc=sortear(pool);
  if((S.clima==='chuva'||S.clima==='tempestade')&&chance(.6)){
    const molhado=pool.filter(k=>['calha','telhado','infiltra','cano','torneira'].includes(k));
    if(molhado.length)esc=sortear(molhado);
  }
  return abrirAvaria(esc);
}

/* pioram sozinhas se você não olhar */
function envelhecerAvarias(){
  const fala=[];
  avarias().forEach(a=>{
    const e=AVARIAS[a.id];
    a.dias++;
    if(e.efeito){const r=e.efeito();if(r)fala.push(r);}
    if(!a.grave&&a.dias>=3&&chance(.5)){
      a.grave=true;
      if(a.vista)fala.push('⚠ '+e.grave);
    }
    if(a.grave&&e.pior&&a.dias>=5&&chance(.4)&&!avariaEm(e.pior)){
      const nova=abrirAvaria(e.pior,e.n);
      fecharAvaria(a.id);
      if(nova&&a.vista)fala.push('⚠ A '+e.n+' virou outra coisa: '+AVARIAS[e.pior].n+'.');
    }
  });
  return fala;
}

/* o que a avaria custa enquanto está aberta */
function pesoAvarias(){
  let ruido=0,risco=0;
  avarias().forEach(a=>{
    const g=a.grave?2:1;
    if(['aberta','cerca','rachadura'].includes(a.id))risco+=g;
    if(['porta_emperra','curto','aberta'].includes(a.id))ruido+=g;
  });
  return {ruido,risco};
}

/* ---------- consertar ---------- */
function menuConserto(a){
  const e=AVARIAS[a.id];
  AC.innerHTML='';
  limpar();cap(e.n);
  diz(sortear(e.ver),'perigo');
  if(a.grave)diz(e.grave,'alerta');
  if(a.motivo)diz(`Isso começou como ${a.motivo}.`,'fraco');
  a.vista=true;

  const falta=faltaPra(a);
  const prec=[];
  (e.ferra||[]).forEach(x=>prec.push(FERRA[x].n));
  Object.keys(e.mat||{}).forEach(k=>prec.push(e.mat[k]+' '+(e.mat[k]===1?MATE[k].n:MATE[k].un)));
  diz('Pra resolver: '+(prec.length?prec.join(', '):'só tempo e mão')+'.','sist');
  if(e.etapas>1)diz(`São ${e.etapas} etapas. Você está na ${a.etapa+1}.`,'sist');

  if(falta.length){
    diz('Falta: '+falta.join(', ')+'.','alerta');
    botao('Improvisar com o que tem',acaoDia(2,async()=>{
      const p=trava(.5-falta.length*.13,.1,.5);
      if(chance(p)){
        a.etapa++;
        diz('Gambiarra feia, mas segurou.','bom');
        if(a.etapa>=e.etapas)return terminarConserto(a,true);
        diz(`Falta ${e.etapas-a.etapa} etapa${e.etapas-a.etapa>1?'s':''}.`,'sist');
      }else{
        diz('Não segurou. Você perdeu duas horas e a coisa continua igual.','perigo');
        if(chance(.3)&&a.dias<9)a.dias+=2;
      }
    }),{custo:'2 horas · '+Math.round(trava(.5-falta.length*.13,.1,.5)*100)+'% de dar certo'});
  }else{
    botao(a.etapa?'Continuar o conserto':'Consertar direito',acaoDia(e.etapas>1?2:1,async()=>{
      a.etapa++;
      if(a.etapa>=e.etapas){
        Object.keys(e.mat||{}).forEach(k=>gastarMat(k,e.mat[k]));
        return terminarConserto(a,false);
      }
      diz(`Etapa ${a.etapa} de ${e.etapas} feita. Dá pra terminar depois.`,'bom');
      diz('Enquanto não fecha, continua ruim.','fraco');
    }),{custo:(e.etapas>1?'2 horas · etapa '+(a.etapa+1):'1 hora')});
  }
  botao('Só olhar e deixar pra depois',()=>{
    diz('Você olha, entende o tamanho do problema, e vai fazer outra coisa.','narr');
    menuComodo(e.onde);
  });
  botao('Voltar',()=>menuComodo(e.onde),{cls:'chave'});
}
function terminarConserto(a,gambiarra){
  const e=AVARIAS[a.id];
  fecharAvaria(a.id);
  diz(gambiarra?`A ${e.n} está resolvida no improviso. Vai aguentar — por enquanto.`
    :`A ${e.n} está resolvida direito.`,'bom');
  if(gambiarra&&chance(.35)){
    S.gambiarras=(S.gambiarras||0)+1;
    diz('Você sabe que isso volta.','fraco');
  }
  mexerMoral(gambiarra?3:6);
  anotar('Consertou: '+e.n+(gambiarra?' (na gambiarra)':''));
  atualizarPainel();
}

/* achar ferramenta e material vasculhando */
function vasculharPor(comodo){
  const acha=[];
  if(chance(.45)){
    const faltam=Object.keys(FERRA).filter(f=>!temFerra(f));
    if(faltam.length&&chance(.4)){
      const f=sortear(faltam);pegarFerra(f);
      acha.push('Achou uma '+FERRA[f].n+'. '+FERRA[f].d);
    }
  }
  const mats=Object.keys(MATE);
  const q=1+Math.floor(Math.random()*3);
  for(let i=0;i<(chance(.6)?1:2);i++){
    const m=sortear(mats);darMat(m,q);
    acha.push(`+${q} ${q===1?MATE[m].n:MATE[m].un}`);
  }
  return acha;
}

/* ---------- o que ela aprende de você ---------- */
function memAnom(){
  return S.memAnom||(S.memAnom={metodo:{},local:{},pego:0,escapou:0,nivel:0});
}
function usouMetodo(m){
  const M=memAnom();
  M.metodo[m]=(M.metodo[m]||0)+1;
}
function metodoViciado(){
  const M=memAnom(),e=Object.entries(M.metodo);
  if(!e.length)return null;
  const total=e.reduce((a,[,v])=>a+v,0);
  if(total<6)return null;
  const [top,n]=e.sort((a,b)=>b[1]-a[1])[0];
  return n/total>=.55?top:null;   // mais da metade das vezes no mesmo método
}
function localViciado(){
  const M=memAnom(),e=Object.entries(M.local);
  if(!e.length)return null;
  const total=e.reduce((a,[,v])=>a+v,0);
  if(total<6)return null;
  const [top,n]=e.sort((a,b)=>b[1]-a[1])[0];
  return n/total>=.5?Number(top):null;
}

/* ---------- ela aparece ---------- */
function sortearAnomalia(){
  const M=memAnom();
  const nivel=M.nivel;
  let pool=ANOM.filter(a=>a.forca<=1+Math.floor(S.dia/3.5)+(nivel>2?1:0));
  if(!pool.length)pool=ANOM.filter(a=>a.forca===1);
  // quanto mais ela te conhece, mais escolhe as sutis e as disfarçadas
  if(nivel>=2)pool=pool.map(a=>({...a,peso:a.peso*(a.disfarce?1.7:.75)}));
  /* e conforme os dias passam ela para de ser sutil: as pesadas
     ganham peso em vez de continuarem raras a partida inteira */
  const escala=1+Math.max(0,S.dia-5)*.30+nivel*.35;
  pool=pool.map(a=>({...a,peso:a.peso*(a.forca>=3?escala:1)}));
  const total=pool.reduce((s,a)=>s+a.peso,0);
  let r=Math.random()*total;
  for(const a of pool){r-=a.peso;if(r<=0)return a;}
  return pool[0];
}
function ondeAparece(){
  const evitar=localViciado();
  let opc=Object.keys(BASE).map(Number);
  if(evitar!==null){
    // você sempre olha o mesmo canto: ela passa a agir longe dali
    const longe=opc.filter(c=>c!==evitar&&distancia(c,evitar)>=2);
    if(longe.length&&chance(.8))opc=longe;
  }
  return sortear(opc);
}
function chanceAnomalia(){
  let p=.20+S.dia*.035;
  if(S.clima==='neblina')p+=.10;
  if(S.clima==='tempestade')p+=.06;
  if(S.hora>=22||S.hora<5)p+=.14;
  if(memAnom().nivel>=2)p+=.08;
  return trava(p,0,.75);
}

function menuInvestigar(an,comodo,volta){
  AC.innerHTML='';
  limpar();cap('Alguma coisa está errada');
  diz(an.txt(comodo),'perigo');
  const vic=metodoViciado();
  if(vic&&chance(.5))
    diz(`Você já reparou que sempre faz a mesma coisa quando desconfia. Talvez ela também tenha reparado.`,'fraco');

  const M=memAnom();
  M.local[comodo]=(M.local[comodo]||0)+1;

  // as opções mudam: nem todas aparecem sempre
  let disp=Object.keys(METODOS).filter(k=>{
    const m=METODOS[k];
    if(m.precisa==='lanterna'&&(!temFerra('lanterna')||!(S.pilhas>0)))return false;
    if(m.precisa==='memoria'&&!S.anotouCasa)return false;
    return true;
  });
  disp=disp.sort(()=>Math.random()-.5).slice(0,4+(S.dia>6?1:0));

  disp.forEach(k=>{
    const m=METODOS[k];
    let p=m.base;
    if(vic===k)p-=.30;                        // ela aprendeu esse
    if(an.disfarce)p-=.12;
    p+=bonusEstudo();                         // livro e caderno lidos
    p-=(typeof pesoMarca==='function'?pesoMarca():0);
    p=trava(p,.12,.94);
    botao(m.n,()=>investigar(k,an,comodo,volta,p),
      {custo:(m.t?m.t+'h':'rápido')+(m.risco?' · arriscado':'')});
  });
  botao('Deixar quieto e sair de perto',()=>{
    diz('Você decide que não quer saber. Sai e fecha a porta.','narr');
    M.escapou++;M.nivel=Math.min(4,M.nivel+ (chance(.4)?1:0));
    if(chance(.35))setTimeout(()=>diz('Uma hora depois você olha de novo. Está normal. Está normal demais.','fraco'),50);
    volta();
  });
}

async function investigar(k,an,comodo,volta,p){
  AC.innerHTML='';
  const m=METODOS[k];
  usouMetodo(k);
  if(m.t)gastarHoras(m.t);
  if(k==='ferramenta'&&chance(.3)){
    S.pilhas=Math.max(0,(S.pilhas||0)-1);
    if(!S.pilhas)diz('A lanterna apaga. Acabou a pilha.','fraco');
  }
  const M=memAnom();
  limpar();cap(m.n);
  await pausa(700);

  if(m.demora){
    diz('Você marca e vai fazer outra coisa.','narr');
    await pausa(1200);
  }
  const acertou=chance(p);
  if(acertou){
    diz(m.ok,'sist');
    await pausa(1000);
    diz('◈ '+an.real,'alerta');
    M.pego++;
    S.anomPegas=(S.anomPegas||0)+1;
    if(typeof mexerSan==='function')mexerSan(-5);
    if(typeof casaReage==='function')casaReage(an.forca||1).forEach(x=>diz(x,'narr'));
    if(typeof mexerCredito==='function')mexerCredito(+5);
    anotar('Anomalia identificada: '+an.txt(comodo).slice(0,44));
    if(an.efeito)an.efeito();
    if(chance(.4))mexerMoral(-5);
    diz('Você sabe o que viu. Isso não deixa você dormir melhor.','fraco');
  }else{
    diz(m.nao,'narr');
    await pausa(900);
    diz(an.falso,'fraco');
    M.escapou++;
    if(chance(.55)){
      M.nivel=Math.min(4,M.nivel+1);
      if(an.efeito&&chance(.5))an.efeito();
    }
  }
  // ela aprende o método mesmo quando você acerta
  if(metodoViciado()===k&&chance(.5)){
    await pausa(900);
    diz('Da próxima vez isso pode não funcionar.','fraco');
  }
  await pausa(800);
  AC.innerHTML='';
  botao('Continuar',volta,{cls:'chave'});
}

/* dispara sozinha durante o dia */
async function talvezAnomalia(comodo,volta){
  if(S.anomHoje)return false;
  if(!chance(chanceAnomalia()))return false;
  S.anomHoje=true;
  const an=sortearAnomalia();
  const onde=comodo!=null?comodo:ondeAparece();
  await pausa(600);
  if(A.ctx&&chance(.6))estalo(chance(.5)?-.5:.5);
  menuInvestigar(an,onde,volta);
  return true;
}
