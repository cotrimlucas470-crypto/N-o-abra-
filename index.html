  }}
];

function rotinaDe(p){
  /* casa que não confia em você faz menos pelo grupo */
  const aj=typeof ajudaDaCasa==='function'?ajudaDaCasa():0;
  const val=ROTINAS.filter(r=>{
    if(['esconde','sugere','abriu','briga'].includes(r.id)&&aj>.15&&chance(.5))return false;
    if(['conserta','horta','cozinha','vigia','reforca','ajuda'].includes(r.id)&&aj<-.15&&chance(.5))return false;
    if(r.precisa&&!r.precisa(p))return false;
    const m=p.moral==null?60:p.moral;
    return m>=r.moral[0]&&m<=r.moral[1];
  });
  if(!val.length)return null;
  const tot=val.reduce((s,r)=>s+r.peso,0);
  let x=Math.random()*tot;
  for(const r of val){x-=r.peso;if(x<=0)return r;}
  return val[0];
}

/* uma ou duas pessoas fazem alguma coisa por dia */
async function vidaDaCasa(){
  if(!S.abrigo.length)return;
  const quantos=Math.min(S.abrigo.length,1+(chance(.55)?1:0));
  const feitas=[];
  const usados=[];
  for(let i=0;i<quantos;i++){
    const cand=S.abrigo.filter(p=>!usados.includes(p));
    if(!cand.length)break;
    const p=sortear(cand);usados.push(p);
    const r=rotinaDe(p);
    if(!r)continue;
    const txt=r.faz(p);
    if(txt)feitas.push({txt,r});
  }
  if(!feitas.length)return;
  await pausa(700);
  for(const f of feitas){
    diz(f.txt,['briga','esconde','sugere','abriu','chora'].includes(f.r.id)?'perigo':'narr');
    await pausa(900);
  }
  atualizarPainel();
}

/* eles lembram do que aconteceu e comentam */
const MEMORIAS=[
 {q:()=>S.mortos.length>=2,t:()=>`${sortear(S.abrigo).n}: "A gente já perdeu ${S.mortos.length}. Eu contei."`},
 {q:()=>S.anomPegas>=2,t:()=>`${sortear(S.abrigo).n}: "Você tem visto coisa que ninguém vê. Eu acredito em você, é isso que me assusta."`},
 {q:()=>S.gambiarras>=2,t:()=>`${sortear(S.abrigo).n}: "Metade dessa casa tá segurando com arame. Você sabe disso, né?"`},
 {q:()=>S.saq&&S.saq.mortos.length>0,t:()=>`${sortear(S.abrigo).n}: "A gente matou gente. Gente de verdade. Ninguém fala disso."`},
 {q:()=>S.escutasErradas>=2,t:()=>`${sortear(S.abrigo).n}: "Você já errou escutando na porta. E se errar de novo?"`},
 {q:()=>(S.cidadesVistas||[]).length>=2,t:()=>`${sortear(S.abrigo).n}: "Você sai e volta. Um dia você não volta, e a gente fica sem saber."`},
 {q:()=>S.ferido>=3,t:()=>`${sortear(S.abrigo).n}: "Você tá mancando faz dias. Deixa outro ir."`},
 {q:()=>S.confianca<35,t:()=>`${sortear(S.abrigo).n}: "Ninguém aqui confia em ninguém. Inclusive em você."`},
 {q:()=>S.confianca>80,t:()=>`${sortear(S.abrigo).n}: "Seja lá o que for lá fora, aqui dentro tá funcionando. Isso é raro."`}
];
async function memoriaDaCasa(){
  if(!S.abrigo.length||!chance(.35))return;
  const val=MEMORIAS.filter(m=>{try{return m.q()}catch(e){return false}});
  if(!val.length)return;
  await pausa(800);
  diz(sortear(val).t(),'fala');
  await pausa(900);
}

<script>
/* ================= OS OUTROS QUE TAMBÉM ESTÃO VIVOS =================
   Não são monstros. As perguntas funcionam com eles — eles respondem
   tudo certo, porque são gente. É por isso que são perigosos. */

const SAQ={
 nomes:['Beto','Nilson','Cleiton','o careca','a mulher do rifle','Juninho'],
 fase:0
};
S.saq={fase:0,tregua:0,mortos:[],dentro:0,visto:false};

function saqAtivos(){return S.dia>=6&&S.saq.fase<9;}

/* fase 1 — rastro na expedição */
function rastroSaqueador(l){
  if(!saqAtivos()||S.saq.fase>0||!chance(.5))return false;
  S.saq.fase=1;
  diz('Alguém passou por aqui antes de você. Hoje.','perigo');
  diz('As gavetas estão abertas com ordem, não com pressa. Tem pegada de bota na poeira e três pontas de cigarro apagadas no mesmo canto.','narr');
  anotar('Tem outra gente viva revirando a cidade.');
  return true;
}

/* fase 2 — o rádio pega eles */
async function radioSaqueador(){
  if(!saqAtivos()||S.saq.fase!==1||!chance(.55))return false;
  S.saq.fase=2;
  const m=quem('rádio');
  await pausa(900);
  if(m&&m!==S.infiltrado){
    diz(`${m.n} acha uma frequência que não é de nenhuma das casas conhecidas.`,'sist');
    await pausa(1500);
    diz('“...a da luz acesa, na rua de baixo. Tem gerador rodando toda noite.”','fala');
    await pausa(1600);
    diz('“Deixa mais uns dias. Deixa eles juntarem mais.”','fala');
    await pausa(1400);
    diz('A transmissão corta. Ninguém fala nada por um tempo.','perigo');
    mexerMoral(-8);
  }else{
    diz('Alguém deixou um pedaço de papelão no portão com um desenho: sua casa, e um número. O número é quantos vocês são.','perigo');
    mexerMoral(-10);
  }
  anotar('Eles sabem da casa da luz acesa.');
  return true;
}

/* fase 3 — o batedor, de dia */
async function batedorSaqueador(){
  if(!saqAtivos()||S.saq.fase!==2||S.hora>16||!chance(.5))return false;
  S.saq.fase=3;S.saq.visto=true;
  limpar();AC.innerHTML='';cena.modo='porta';cena.sombra={dentro:true,x:.5,larg:.16,alt:.9,qtd:1,dedos:0,tremor:0};
  dimensionar();cap('Batem na porta · '+horaTexto());
  batida(3);
  await pausa(1400);
  diz('É de dia. Ninguém bate de dia.','perigo');
  await pausa(1400);
  const n=sortear(SAQ.nomes);
  S.saq.batedor=n;
  await falarV5(`Boa tarde. Meu nome é ${n}. Eu não quero entrar, moço, pelo amor de Deus, eu só queria uma água.`,
    {pitch:.94,rate:1,dist:'porta'});
  await pausa(700);
  diz('A voz é de gente. É gente mesmo — não tem nada de errado nela.','sist');
  await pausa(1200);
  return new Promise(res=>{
    AC.innerHTML='';
    botao('Dar água pela fresta',async()=>{
      AC.innerHTML='';
      if(S.agua>0)S.agua--;
      diz(`${n} agradece três vezes e bebe tudo de uma vez.`,'narr');
      await pausa(1400);
      await falarV5('Vocês são quantos aí dentro? É que eu tenho gente também, e a gente podia se ajudar.',
        {pitch:.94,rate:1,dist:'fresta'});
      await pausa(900);
      AC.innerHTML='';
      botao('Dizer o número certo',async()=>{
        S.saq.sabeQuantos=S.abrigo.length+1;
        diz(`Você fala. ${n} repete o número em voz baixa, como quem guarda.`,'perigo');
        await fecharBatedor(n,res);
      });
      botao('Mentir e dizer que são muitos',async()=>{
        S.saq.sabeQuantos=99;
        diz(`Você fala um número grande. ${n} olha pra fresta um segundo a mais do que devia.`,'sist');
        await fecharBatedor(n,res);
      });
      botao('Não responder',async()=>{
        diz(`${n} espera. Depois sorri e diz que entendeu.`,'sist');
        await fecharBatedor(n,res);
      });
    },{custo:'1 água'});
    botao('Mandar embora sem abrir nada',async()=>{
      AC.innerHTML='';
      diz(`${n} fica um tempo parado do lado de fora antes de ir. Não insiste.`,'sist');
      S.saq.hostil=true;
      await fecharBatedor(n,res);
    });
  });
}
async function fecharBatedor(n,res){
  AC.innerHTML='';
  await pausa(1600);
  diz(`${n} desce a rua devagar, olhando o muro, o portão e o telhado.`,'perigo');
  anotar(`${n} veio de dia. Estava medindo a casa.`);
  await pausa(1400);
  cena.modo='casa';dimensionar();
  AC.innerHTML='';
  botao('Voltar pra dentro',()=>{res(true);irPara(7);},{cls:'chave'});
}

/* fase 4 — o cerco */
async function cercoSaqueador(){
  S.saq.fase=4;
  limpar();AC.innerHTML='';cena.modo='porta';
  const qtd=3+(chance(.4)?1:0);
  cena.sombra={dentro:true,x:.5,larg:.15,alt:.95,qtd,dedos:0,tremor:0};
  dimensionar();cap('Noite '+S.dia);
  ligarDrone();subirDrone(.7);
  batida(9);
  await pausa(1500);
  diz(`São ${qtd}. Você vê pela fresta que são ${qtd} pares de pé, e nenhum deles está tentando disfarçar isso.`,'perigo');
  await pausa(1600);
  const n=S.saq.batedor||sortear(SAQ.nomes);
  await falarV5('Abre a porta. A gente não vai machucar ninguém se você abrir agora.',
    {pitch:.9,rate:.97,dist:'porta'});
  await pausa(900);
  diz('É gente. Toda pergunta que você fizer, eles respondem certo. Não tem mímico nenhum aí fora.','alerta');
  await pausa(1300);
  AC.innerHTML='';
  const arma=melhorArma();
  const armados=S.abrigo.filter(p=>p.armado).length;

  return new Promise(res=>{
    botao('Negociar: oferecer comida e diesel',async()=>{
      AC.innerHTML='';
      const c=Math.min(S.comida,6),d=Math.min(Math.round(S.diesel),20);
      if(c<4&&d<10){
        diz('Você oferece o que tem. Eles riem. O que você tem não paga o trabalho de vir até aqui.','perigo');
        await pausa(1400);return res(await assalto(qtd,n));
      }
      S.comida-=c;S.diesel=trava(S.diesel-d,0,100);ganhou({comida:-c,diesel:-d});
      diz(`Você passa ${c} latas e ${d} litros pela fresta, uma coisa de cada vez.`,'sist');
      await pausa(1600);
      diz(`${n}: “Tá bom. A gente volta quando acabar.”`,'fala');
      S.saq.tregua=3+Math.floor(Math.random()*3);
      mexerMoral(-6);S.confianca=trava(S.confianca-5,0,100);
      anotar(`Pagou os saqueadores. Trégua de ${S.saq.tregua} noites.`);
      await pausa(1400);
      diz(`Eles vão embora. Você comprou ${S.saq.tregua} noites, e todo mundo aqui sabe que comprou.`,'perigo');
      desligarDrone();res(true);
    },{custo:'6 latas · 20 L'});

    botao('Recusar e trancar tudo',async()=>{
      AC.innerHTML='';
      diz('Você não responde. Do lado de fora alguém chuta a porta uma vez, só pra ver o que ela aguenta.','perigo');
      danificarPorta(12);
      await pausa(1600);
      res(await assalto(qtd,n));
    },{cls:'prim'});

    if(arma||armados)botao('Mostrar a arma pela fresta',async()=>{
      AC.innerHTML='';
      const forca=(arma?arma.dano:0)+armados*2;
      const p=trava(.22+forca*.11,.2,.75);
      await pausa(1500);
      if(chance(p)){
        diz(`Eles veem. Contam quantos vocês são e quanto ferro tem na mão de vocês.`,'sist');
        await pausa(1500);
        diz(`${n}: “Depois a gente conversa.” Eles descem a rua sem correr.`,'bom');
        S.saq.tregua=2+Math.floor(Math.random()*2);
        mexerMoral(9);S.confianca=trava(S.confianca+10,0,100);
        desligarDrone();res(true);
      }else{
        diz('Eles veem, e veem que é só isso que vocês têm.','perigo');
        await pausa(1300);
        res(await assalto(qtd,n));
      }
    },{custo:Math.round((.22+((arma?arma.dano:0)+armados*2)*.11)*100)+'% deles recuarem'});

    botao('Abrir e deixar entrar',()=>confirmar(
      'Você vai abrir a porta pra eles.',
      'Eles tomam a casa em três dias. Isso não se desfaz.',
      async()=>{
      AC.innerHTML='';
      S.saq.dentro=qtd;S.saq.fase=5;
      diz('Você abre. Eles entram sem apontar nada pra ninguém, e é isso que assusta.','perigo');
      await pausa(1800);
      diz('Em uma hora eles já sabem onde fica a comida, o diesel e a chave da tranca.','perigo');
      mexerMoral(-16);S.confianca=trava(S.confianca-22,0,100);
      anotar('Deixou os saqueadores entrarem.');
      desligarDrone();res(true);
    },()=>cercoSaqueador().then(res)),{custo:'eles tomam a casa aos poucos'});
  });
}

async function assalto(qtd,n){
  desligarDrone();
  limpar();cap('Eles vieram');
  const arma=melhorArma();
  const armados=S.abrigo.filter(p=>p.armado);
  /* contra gente a parede importa menos: eles têm tempo e ferramenta */
  let forca=(arma?arma.dano*2.6:0)+armados.length*3.2+S.abrigo.length*.5;
  forca+=S.porta.reforco*.3+(S.porta.tranca?1.2:0)+(S.armadilha?1:0)+forcaMuro()*.35;
  if(S.cachorro&&S.cachorro.vivo)forca+=1.2;
  const deles=qtd*3.4;
  const p=trava(forca/(forca+deles),.12,.88);
  diz('A porta aguenta os primeiros três chutes. No quarto a tranca começa a ceder.','perigo');
  danificarPorta(22);
  await pausa(1900);
  if(S.cachorro&&S.cachorro.vivo){
    latido(0,true);
    diz(`${S.cachorro.n} avança no primeiro que entra e não solta.`,'bom');
    await pausa(1400);
  }
  if(chance(p)){
    diz('Vocês seguram. Não porque são mais fortes — porque estão dentro e eles estão fora, e isso conta.','bom');
    await pausa(1600);
    const morto=sortear(SAQ.nomes.filter(x=>!S.saq.mortos.includes(x)))||'um deles';
    S.saq.mortos.push(morto);
    diz(`${morto} fica caído na entrada. Os outros levam ele e somem na rua.`,'perigo');
    await pausa(1800);
    // a voz dele vira arma dos mímicos
    const pes={n:morto,id:28+Math.floor(Math.random()*22),alt:.5,hab:'—',ef:'—',
      frase:'Abre a porta. A gente não vai machucar ninguém.',mem:'a rua',
      fala:['A gente só queria o que vocês tinham.']};
    registrarVoz(pes,`morreu na sua entrada na noite ${S.dia}, tentando entrar`);
    diz(`Elas estavam ouvindo tudo. Agora elas sabem imitar ${morto} também.`,'alerta');
    diz('Você fabricou uma voz nova pra elas.','perigo');
    mexerMoral(-12);S.saq.tregua=4;
    anotar(`Matou ${morto} na porta. A voz dele entrou no repertório.`);
    return true;
  }
  diz('Eles entram.','perigo');
  await pausa(1600);
  const perda=Math.min(S.abrigo.length,1+(chance(.4)?1:0));
  for(let i=0;i<perda;i++){
    if(!S.abrigo.length)break;
    const v=sortear(S.abrigo);
    morreuAlguem(v,`morreu quando os saqueadores entraram, na noite ${S.dia}`);
    diz(`${v.n} tentou impedir e não teve chance.`,'perigo');
    await pausa(1200);
  }
  const c=Math.round(S.comida*.6),d=Math.round(S.diesel*.5);
  S.comida-=c;S.diesel=trava(S.diesel-d,0,100);ganhou({comida:-c,diesel:-d});
  if(S.armas&&S.armas.length){S.armas=[];diz('Levaram tudo que era de ferro também.','perigo');}
  diz(`Levaram ${c} latas e ${d} litros. Deixaram vocês vivos de propósito, pra vocês juntarem mais.`,'perigo');
  S.saq.tregua=4;danificarPorta(30);
  mexerMoral(-24);S.confianca=trava(S.confianca-15,0,100);
  anotar('Os saqueadores entraram e levaram metade.');
  return true;
}

/* eles dentro de casa, tomando aos poucos */
async function saqueadoresDentro(){
  if(!S.saq.dentro)return false;
  S.saq.dias=(S.saq.dias||0)+1;
  const d=S.saq.dias;
  await pausa(800);
  if(d===1){
    diz('Eles dormiram na sala. De manhã já tinham separado a comida em dois montes: o deles e o de vocês. O deles é maior.','perigo');
    S.comida=Math.round(S.comida*.7);mexerMoral(-8);
  }else if(d===2){
    diz('Hoje eles decidiram quem vai na expedição, e não perguntaram a você.','perigo');
    mexerMoral(-10);S.confianca=trava(S.confianca-12,0,100);
    if(S.abrigo.length&&chance(.5)){
      const p=sortear(S.abrigo);
      morreuAlguem(p,`discutiu com os saqueadores dentro de casa, na noite ${S.dia}`);
      diz(`${p.n} discutiu com eles na cozinha. Levaram ${p.n} pro quintal e voltaram sozinhos.`,'perigo');
    }
  }else if(d>=3){
    diz('Você acorda e a chave da tranca não está mais no seu bolso.','perigo');
    await pausa(1800);
    diz('A casa é deles. Você mora aqui.','perigo');
    return fim('tomada');
  }
  return true;
}

<script>
/* ================= A RUA ================= */
function desenharRua(w,h,t){
  const noite=S.hora>=18;
  const cu=CX.createLinearGradient(0,0,0,h);
  if(noite){cu.addColorStop(0,'#0A0912');cu.addColorStop(.6,'#141020');cu.addColorStop(1,'#0A0810');}
  else{cu.addColorStop(0,'#2A2430');cu.addColorStop(.45,'#4A3B34');cu.addColorStop(1,'#241C1E');}
  CX.fillStyle=cu;CX.fillRect(0,0,w,h);

  // fumaça longe
  for(let i=0;i<3;i++){
    const fx=w*(.15+i*.34)+Math.sin(t*.12+i)*w*.03;
    const g=CX.createRadialGradient(fx,h*.42,2,fx,h*.35,h*.4);
    g.addColorStop(0,'rgba(90,80,75,.18)');g.addColorStop(1,'rgba(0,0,0,0)');
    CX.fillStyle=g;CX.fillRect(fx-w*.3,0,w*.6,h*.8);
  }
  // linha de prédios ao fundo
  const seed=hashNome(cena.local||'rua');
  const sd=i=>semente(seed,i);
  CX.fillStyle=noite?'#0B0912':'#1A1519';
  for(let i=0;i<9;i++){
    const bx=w*(i/9)-w*.02,bw=w*(.11+sd(i)*.05);
    const bh=h*(.18+sd(i*3)*.30);
    CX.fillRect(bx,h*.62-bh,bw,bh+2);
    for(let j=0;j<4;j++)for(let k=0;k<2;k++){
      if(sd(i*10+j*3+k)<.78)continue;
      CX.fillStyle=`rgba(201,162,39,${.14+Math.sin(t*.6+i+j)*.05})`;
      CX.fillRect(bx+bw*(.2+k*.42),h*.62-bh+bh*(.14+j*.22),bw*.16,bh*.1);
      CX.fillStyle=noite?'#0B0912':'#1A1519';
    }
  }
  // rua
  CX.fillStyle=noite?'#080710':'#171215';
  CX.fillRect(0,h*.62,w,h*.38);
  CX.strokeStyle='rgba(120,110,95,.10)';CX.lineWidth=2;
  for(let i=0;i<5;i++){
    const y=h*(.66+i*.075);
    CX.beginPath();CX.moveTo(0,y);CX.lineTo(w,y);CX.stroke();
  }
  // poste torto
  const px=w*.76;
  CX.strokeStyle='#0A0810';CX.lineWidth=Math.max(4,w*.012);
  CX.beginPath();CX.moveTo(px,h*.66);CX.lineTo(px+w*.03,h*.16);CX.stroke();
  CX.beginPath();CX.moveTo(px+w*.03,h*.17);CX.lineTo(px-w*.05,h*.155);CX.stroke();
  const aceso=(seed%3)!==0;
  if(aceso){
    const b=.55+Math.sin(t*3.1)*.25+Math.sin(t*17)*.1;
    const lg=CX.createRadialGradient(px-w*.05,h*.16,2,px-w*.05,h*.16,h*.42);
    lg.addColorStop(0,`rgba(220,190,110,${.30*b})`);
    lg.addColorStop(.4,`rgba(180,140,60,${.09*b})`);
    lg.addColorStop(1,'rgba(0,0,0,0)');
    CX.fillStyle=lg;CX.fillRect(0,0,w,h);
    CX.fillStyle=`rgba(255,230,160,${.7*b})`;
    CX.beginPath();CX.arc(px-w*.05,h*.16,Math.max(3,w*.008),0,7);CX.fill();
  }
  // carro virado
  CX.fillStyle='#0C0A10';
  CX.beginPath();
  CX.moveTo(w*.06,h*.78);CX.lineTo(w*.10,h*.68);CX.lineTo(w*.26,h*.66);
  CX.lineTo(w*.32,h*.78);CX.closePath();CX.fill();
  CX.beginPath();CX.arc(w*.13,h*.79,h*.022,0,7);CX.fill();
  CX.beginPath();CX.arc(w*.27,h*.79,h*.022,0,7);CX.fill();

  // alguma coisa se movendo ao longe
  cena.vulto=cena.vulto||{x:-.2,v:0,ativo:false,prox:6+Math.random()*14};
  const V=cena.vulto;
  V.prox-=1/60;
  if(!V.ativo&&V.prox<=0){V.ativo=true;V.x=chance(.5)?-.12:1.12;V.v=(V.x<0?1:-1)*(.03+Math.random()*.05);}
  if(V.ativo){
    V.x+=V.v/60;
    const vx=w*V.x,vy=h*.63;
    CX.fillStyle='rgba(0,0,0,.85)';
    CX.beginPath();CX.ellipse(vx,vy-h*.045,w*.014,h*.045,0,0,7);CX.fill();
    CX.beginPath();CX.arc(vx,vy-h*.10,w*.011,0,7);CX.fill();
    if(V.x<-.2||V.x>1.2){V.ativo=false;V.prox=8+Math.random()*20;}
  }
  const vg=CX.createRadialGradient(w/2,h*.55,h*.2,w/2,h*.5,h*1.1);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.85)');
  CX.fillStyle=vg;CX.fillRect(0,0,w,h);
}

/* a capacidade agora SAI DA MOCHILA. Antes era um 22 fixo que
   ignorava o equipamento — dois sistemas de carga discordando. */
function capacidade(par){
  let c=mochilaInfo().kg;
  if(par)c+=Math.round(mochilaInfo().kg*.55);
  if(par&&par.hab==='escalada')c+=6;
  if(S.abrigo.length>=4)c+=3;
  return Math.round(c);  /* mochilaInfo já soma o veículo */
}

async function expedicao(l,par){
  gastarHoras(horasDe(l,par));limpar();AC.innerHTML='';
  cena.modo='rua';cena.local=l.id;dimensionar();ambienteRua();
  cap(l.n+' · '+horaTexto());
  diz('Você atravessa o quintal e sai pelo portão. O sol lá fora não aquece nada.','narr');
  if(par)diz(`${par.n} vai um passo atrás de você, sem falar.`,'narr');
  await pausa(1300);
  passo(.9,-.3);await pausa(600);passo(.9,.25);
  S.trilha=S.trilha||[];
  if(!S.trilha.includes(l.id))S.trilha.push(l.id);
  if(S.viradaEsvaziou)diz('A cidade está mais vazia do que estava. E mais perigosa.','perigo');
  /* o giz faz recuar não custar risco */
  /* chave mestra: metade do tempo de saque, e quebra */
  /* bússola: aponta pro que vale mais */
  if(S.bussola){S.bussola=0;
    const pool=poolDeLocais().filter(x=>(S.esgotados[x.id]||0)<2);
    let melhor=null,nb=-1;
    pool.forEach(x=>{const n=(typeof notaLoot==='function')?notaLoot(x):5;
      if(n>nb){nb=n;melhor=x;}});
    if(melhor)diz(`A agulha aponta pra ${melhor.n}. Loot ${nb}/10. Ela ignora todo o resto.`,'bom');}
  if(S.chaveMestra){S.chaveMestra=0;
    if(typeof gastarHoras==='function')S.hora=Math.max(7,S.hora-1);
    diz('A chave mestra abre a porta de primeira. Você economiza a metade do tempo — e ela entorta na fechadura.','bom');}
  /* rádio de pulso: leitura do que tem antes de entrar */
  if(S.pulsoAtivo){S.pulsoAtivo=0;
    const L=(typeof notaLoot==='function')?notaLoot(l):5;
    diz(`O pulso lê o lugar antes de você entrar: loot ${L}/10.`+
      (L>=7?' Vale a pena.':L<=3?' Não tem quase nada aí.':''),'sist');}
  if(S.gizAtivo>0){S.gizAtivo--;
    diz('As marcas de giz do caminho ainda estão aí. Dá pra voltar sem se perder.','sist');}
  if(await visaoDeRua()==='volta')return menuComodo(4);
  if(await eventoRota()==='volta')return menuComodo(4);
  if(await eventoCaminho(l))return menuComodo(8);
  await checarComboio(l,ctx);
  {const isc=checarIsca(l);
   if(isc){diz(isc,'perigo');ctx&&(ctx.risco=(ctx.risco||2)+3);}}
  rastroSaqueador(l);
  /* alguma coisa já mora nesse lugar */
  let amc=ameacaNoLocal(l.id);
  if(!amc&&chance(chanceAmeaca(l))){
    const pool=ameacasDoLocal(l);
    if(pool.length)amc=plantarAmeaca(sortear(pool),l.id);
  }
  if(!amc&&chance(.22)){
    /* encontro com criatura, com leitura tática */
    const ok=await encontroCriatura({l,par},()=>{});
    if(!ok&&chance(.4)){gastarHoras(2);return menuComodo(8);}
  }
  if(amc){
    const rr=await encararAmeaca(amc,{l},()=>{});
    if(rr==='desistiu'||rr==='perdeu'){
      gastarHoras(2);
      return menuComodo(8);
    }
  }
  const E=ETAPAS[l.id]||ETAPAS.rua7;
  /* cidade decaída rende menos e mata mais */
  const pe=pesoEstagio(cidadeAtual());
  const esc=escassez();
  const ctx={l,par,risco:l.risco+(S.viradaEsvaziou?1:0)+Math.round(pe.risco)+riscoDist(l),
    mult:pe.loot,achados:[]};
  if(pe.ord>=2&&chance(.5))
    diz(`${cidadeInfo().n} não rende mais o que rendia. Já levaram quase tudo.`,'fraco');
  const obj=objetivosNoLocal(l.id);
  if(obj.length){
    AC.innerHTML='';
    await pausa(900);
    diz(`${obj[0].dono} pediu uma coisa aqui: ${obj[0].n}.`,'sist');
    return new Promise(res=>{
      botao('Passar lá antes',async()=>{
        AC.innerHTML='';ctx.risco+=1;ctx.objetivo=obj[0];
        diz('Vocês fazem uma volta a mais. Custa risco.','narr');
        await pausa(1200);etapaEntrar(E,ctx);res();
      },{cls:'prim',custo:'+1 risco'});
      botao('Hoje não dá',async()=>{
        AC.innerHTML='';etapaEntrar(E,ctx);res();
      });
    });
  }
  etapaEntrar(E,ctx);
}

function etapaEntrar(E,ctx){
  AC.innerHTML='';
  diz('Por onde você entra?','sist');
  E.entrar.forEach(([nome,txt,dr])=>botao(nome,async()=>{
    AC.innerHTML='';
    if(txt)diz(txt,'narr');
    ctx.risco+=dr;
    await pausa(1500);
    if(await sustoTalvez(ctx))return;
    etapaDentro(E,ctx);
  },{custo:dr>0?'mais arriscado':dr<0?'mais seguro':''}));
}

function etapaDentro(E,ctx){
  AC.innerHTML='';
  diz('Você está dentro. O que procura?','sist');
  E.dentro.forEach(([nome,txt,peso])=>botao(nome,async()=>{
    AC.innerHTML='';
    if(txt)diz(txt,'narr');
    await pausa(1600);
    const l=ctx.l;
    const gasto=S.esgotados[l.id]||0;
    const f=peso*(gasto?.55:1)*(tem('química')?1.12:1)*(ctx.mult||1)*rendeDist(l);
    /* o tipo do lugar decide o que ele tem de verdade */
    const AJ=ajusteRecurso(l);
    const qtdC=Math.round((l.comida[0]+Math.random()*(l.comida[1]-l.comida[0]))*f*AJ.comida);
    const cm=acharComida(qtdC,AJ.estraga);
    ctx.achados=[
      {n:'diesel',q:Math.round((l.diesel[0]+Math.random()*(l.diesel[1]-l.diesel[0]))*f*AJ.diesel),kg:1}
    ];
    if(cm.boa)ctx.achados.push({n:'comida',q:cm.boa,kg:1.5});
    if(cm.ruim)ctx.achados.push({n:'lata suspeita',q:cm.ruim,kg:1.5,estragada:true,
      d:'A tampa está estufada. Pode ser só pressão. Pode não ser.'});
    itensDoLocal(l).forEach(it=>ctx.achados.push({
      n:it.n,q:1,kg:it.kg,item:it,d:it.d}));
    /* ferramenta, material e mochila entram direto, sem ocupar carga */
    const extra=lootDoLocal(l,f);
    extra.texto.forEach(t2=>diz(t2,'bom'));
    if(AJ.med&&chance(.30*AJ.med*f)){
      const q=1+(chance(.3)?1:0);S.remedio+=q;ganhou({remedio:q});
      diz(`Armário de remédio com coisa dentro: +${q}.`,'bom');
    }
    if(await sustoTalvez(ctx))return;
    etapaCarga(E,ctx);
  },{custo:'peso '+peso}));
}

function etapaCarga(E,ctx){
  const cap=capacidade(ctx.par);
  limpar();cap2('O que você carrega');
  diz(`Você acha mais do que consegue levar. Cabem ${cap} quilos${ctx.par?' entre os dois':' nas suas costas'}.`,'sist');
  const levar={};
  const render=()=>{
    let peso=0;
    ctx.achados.forEach((a,i)=>{peso+=(levar[i]||0)*a.kg;});
    limpar();cap2('O que você carrega');
    diz(`${Math.round(peso)} de ${cap} quilos.`,peso>cap?'perigo':'sist');
    ctx.achados.forEach((a,i)=>{
      const q=levar[i]||0;
      ficha(a.n,q+' de '+a.q,a.kg+' kg cada');
    });
    AC.innerHTML='';
    ctx.achados.forEach((a,i)=>{
      const q=levar[i]||0;
      if(q<a.q&&peso+a.kg<=cap)
        botao('Pegar mais '+a.n,()=>{levar[i]=q+1;render();},{custo:'+'+a.kg+' kg'});
      if(q>0)botao('Largar '+a.n,()=>{levar[i]=q-1;render();},{custo:'−'+a.kg+' kg'});
    });
    botao('Encher a mochila com o que cabe',()=>{
      let p=0;
      ctx.achados.forEach((a,i)=>{
        levar[i]=0;
        while(levar[i]<a.q&&p+a.kg<=cap){levar[i]++;p+=a.kg;}
      });
      render();
    },{custo:'automático'});
    botao('Ir embora com isso',()=>etapaSair(E,ctx,levar),{cls:'prim'});
  };
  render();
}
function cap2(t){cap(t);}

function etapaSair(E,ctx,levar){
  AC.innerHTML='';
  diz('E agora, como sai?','sist');
  E.sair.forEach(([nome,txt,dr])=>botao(nome,async()=>{
    AC.innerHTML='';
    if(txt)diz(txt,'narr');
    ctx.risco+=dr;
    await pausa(1300);
    if(await sustoTalvez(ctx,levar))return;
    diz('Ninguém te viu sair.','bom');
    await recolher(ctx,levar,false);
  },{custo:dr>0?'mais arriscado':dr<0?'mais seguro':''}));
}

async function sustoTalvez(ctx,levar){
  let r=trava(ctx.risco*.09,.03,.5);
  if(ctx.par&&ctx.par.hab==='corrida')r*=.7;
  if(ctx.par&&ctx.par.hab==='caça')r*=.7;
  if(!chance(r))return false;
  return encontroRua(ctx,levar);
}
async function sustoAntigo(ctx,levar){
  if(true)return false;
  rugido(1,chance(.5)?-.7:.7);
  await pausa(1000);
  diz('Uma coisa te vê antes de você ver ela.','perigo');
  await pausa(800);AC.innerHTML='';
  return new Promise(res=>{
    botao('Correr e largar metade',async()=>{
      if(levar)Object.keys(levar).forEach(k=>levar[k]=Math.floor(levar[k]/2));
      passo(1,-.5);passo(1,.5);
      diz('Você corre. Metade do que carregava fica na calçada.','perigo');
      S.ruido=trava(S.ruido+14,0,100);
      await recolher(ctx,levar||{},false);res(true);
    });
    botao('Se esconder e esperar',async()=>{
      if(chance(ctx.par?.62:.5)){
        diz('Vocês ficam parados atrás de um muro por quarenta minutos. Ela passa.','bom');
        res(false);
      }else{
        diz('Ela para. Cheira o ar. Vem.','perigo');
        await recolher(ctx,levar||{},true);res(true);
      }
    });
    if(S.coquetel>0)botao('Acender uma garrafa e jogar',async()=>{
      S.coquetel--;
      diz('O vidro estoura na calçada e o fogo sobe. Ela recua do calor e vocês passam.','bom');
      S.ruido=trava(S.ruido+8,0,100);
      res(false);
    },{custo:'gasta 1 garrafa'});
    if(S.lanterna)botao('Lanterna na cara dela',async()=>{
      S.lanterna=false;
      diz('O facho pega em cheio. Ela se protege e vocês recolhem tudo com calma.','bom');
      res(false);
    },{custo:'gasta a lanterna'});
    if(ctx.par)botao(`Deixar ${ctx.par.n} distrair ela`,async()=>{
      diz(`${ctx.par.n} olha pra você uma vez antes de correr pro outro lado gritando.`,'perigo');
      await pausa(1400);
      morreuAlguem(ctx.par,`você deixou pra trás pra escapar, na noite ${S.dia}`);
      S.confianca=trava(S.confianca-32,0,100);
      diz(`Você volta com tudo. ${ctx.par.n} não volta. A casa vai saber o que você escolheu.`,'perigo');
      ctx.par=null;
      await recolher(ctx,levar||{},false);res(true);
    },{cls:'prim',custo:'ele fica'});
  });
}

async function recolher(ctx,levar,ferido){
  const l=ctx.l;
  if(!ferido){
    const extra=vasculharPor(0);
    if(extra.length){
      await pausa(700);
      diz('Antes de sair, ainda deu pra pegar:','sist');
      extra.forEach(t=>diz(t,'bom'));
    }
    if(chance(.14)){
      const v=acharVeiculo();
      if(v){await pausa(800);diz(v,'bom');}
    }
    const bc=bonusCarga();
    if(bc)diz(`${VEIC[melhorVeic()].n[0].toUpperCase()+VEIC[melhorVeic()].n.slice(1)} levou o resto.`,'sist');
  }
  if(ctx.objetivo&&!ferido)await cumprirObjetivo(ctx.objetivo);
  if(!ferido){
    const L=(typeof notaLoot==='function')?notaLoot(l):5;
    const k=acharEstrat(L);
    if(k){const e=ESTRAT[k];
      diz(`◈ ${e.n} — ${RAR[e.r].n}. ${e.d}`,e.r==='comum'?'sist':'bom');}
    if((S.esgotados[l.id]||0)>=1&&!vigiado(l.id)&&chance(.5)){
      marcarVigiado(l.id);
      diz('Você levou demais daqui. Alguém reparou.','alerta');
    }
  }
  S.esgotados[l.id]=(S.esgotados[l.id]||0)+1;
  let d=0,c=0,r=0;
  ctx.achados.forEach((a,i)=>{
    const q=levar[i]||0;if(!q)return;
    if(a.n==='diesel')d+=q;
    else if(a.n==='comida')c+=q;
    else if(a.n==='remedio')r+=q;
    else if(a.estragada){S.estragadas=(S.estragadas||0)+q;S.comida+=q;}
    else if(a.item){
      const it=a.item;
      if(it.dano){S.armas=S.armas||[];if(!S.armas.includes(it.id))S.armas.push(it.id);
        anotar('Trouxe: '+it.n+'.');}
      if(it.diesel)d+=it.diesel;
      if(it.remedio)r+=it.remedio;
      if(it.oficina&&S.oficinaNivel<2)S.oficinaNivel++;
      if(it.lanterna)S.lanterna=true;
      if(it.semente)S.temSemente=true;
      if(it.reforco)pregar(it.reforco);
      if(it.especial==='peca'){S.peca=true;anotar('Trouxe a peça do gerador.');}
    }
  });
  if(ctx.par&&ctx.par.hab==='caça')c+=2;
  S.diesel=trava(S.diesel+d,0,100);S.comida+=c;S.remedio+=r;
  await pausa(800);
  if(ferido){
    if(tem('enfermagem'))diz(`Você chega com o ombro aberto. ${quem('enfermagem').n} costura você na mesa da cozinha.`,'bom');
    else if(S.remedio>0){S.remedio--;diz('Você chega rasgado. Gasta um remédio em você mesmo e aguenta.','sist');}
    else if(ctx.par){morreuAlguem(ctx.par,`foi pego no seu lugar numa expedição, na noite ${S.dia}`);
      diz(`Ela pega ${ctx.par.n} primeiro. É por isso que você ainda está inteiro.`,'perigo');}
    else{mexerMoral(-10);S.ruido=trava(S.ruido+10,0,100);
      diz('Você chega arrastando a perna. Vai doer por muitos dias.','perigo');}
  }
  // gente na rua
  if(!ferido&&chance(.15)&&S.pool.length){
    const p=sortear(S.pool);
    await pausa(1200);
    diz(`Tem alguém agachado atrás de um carro te olhando. ${p.n}, ${p.id} anos. Não corre nem ataca.`,'sist');
    await pausa(900);AC.innerHTML='';
    await new Promise(res=>{
      botao(`Trazer ${p.n}`,async()=>{
        acolher(p);mexerMoral(4);
        diz(`${p.n} vem atrás de você em silêncio. Não passou por porta nenhuma, não respondeu pergunta nenhuma.`,'alerta');
        res();
      },{cls:'prim',custo:'não passa pelas perguntas'});
      botao('Seguir em frente',async()=>{
        S.pool=S.pool.filter(x=>x!==p);
        diz('Você desvia e não olha pra trás. Isso vai voltar em algum sonho.','narr');
        res();
      });
    });
  }
  ganhou({diesel:d,comida:c,remedio:r});
  diz(`Você volta com ${d} litros, ${c} latas${r?' e '+r+' remédio':''}.`,'sist');
  ambienteCasa();cena.modo='casa';dimensionar();atualizarPainel();
  await pausa(900);
  if(S.hora>=19){
    AC.innerHTML='';
    diz('Você volta com o sol já embaixo do muro.','sist');
    botao('Trancar tudo',()=>anoitecer(),{cls:'chave'});
  }else irPara(8);
}

<script>

}

  passarODia();
  /* a casa se deteriora sozinha */

  }
  const pa=pesoAvarias();
  if(pa.ruido)S.ruido=trava(S.ruido+pa.ruido,0,100);
  /* horta e água */

    canteiros().forEach(ct=>{ct.agua=Math.max(0,ct.agua-.8);});
    if(chance(.25))diz('Não cai uma gota. A terra racha sozinha.','fraco');
  }
  crescerCanteiros().forEach(t=>diz(t,'alerta'));
  const chuvaAgua=coletarChuva();

  Object.keys(CIDADES).forEach(k=>marcarCidade(k,k===cidadeAtual()?.4:.9));
  moverAmeacas().forEach(t=>diz('⚠ '+t,'perigo'));
  sararUmPouco().forEach(t=>diz(t,'sist'));
  resumoDaNoite();
  /* saúde de todo mundo, antes de qualquer outra coisa */
  passarSaude(null,'Você').forEach(t=>{
    if(t.startsWith('MORTE:')){
      const e=MALES[t.slice(6)];
      diz(`A ${e.n} venceu. Você não levanta hoje.`,'perigo');
      return leitoLongo();
    }
    diz(t,t.startsWith('⚠')?'perigo':'bom');
  });
  S.abrigo.slice().forEach(p=>{
    passarSaude(p,p.n).forEach(t=>{
      if(t.startsWith('MORTE:')){

        return;
      }
      diz(t,t.startsWith('⚠')?'perigo':'sist');

  /* condições que nascem do estado da casa */

  talvezLista();

  (await passarMoradoras()).forEach(x=>{

  });
  await testemunho();
  (await passarFora()).forEach(t=>diz(t,t.includes('não voltou')?'perigo':'sist'));
  trabalhoDaCasa().forEach(t=>diz(t,'bom'));
  await vidaDaCasa();
  await memoriaDaCasa();
  await talvezEstacao();
  {const hs=hotspots();
   if(hs.length&&S.hotVisto!==S.dia){S.hotVisto=S.dia;
     hs.forEach(h=>diz('◈ '+textoHotspot(h),'alerta'));}}
  passarVigiados().forEach(k=>diz('Pararam de vigiar um dos lugares que você saqueou.','sist'));
  {const t=triagem();if(t)await cenaTriagem(t);}
  {const rs=passarSanidade();
   for(const t of rs){if(t==='RUPTURA')return ruptura();diz(t,'alerta');}}
  if(await talvezLeito())return;
  {const pr=passarPorta();if(pr)diz(pr,'alerta');}

  if(await colapso())return;

  await comboioFantasma();
  await radioHotspot();

  guia();
  await eventoDoDia();
  await visitaComerciante();
  cobrarObjetivos();
  await talvezVirada();
  if(S.saq.dentro){const seguir=await saqueadoresDentro();if(seguir===false)return;}
  if(S.saq.tregua>0)S.saq.tregua--;

  retribuicao();
  if(S.chuva&&!S.chuvaAvisada){S.chuvaAvisada=true;reagir('chuva');}
  if(!S.chuva)S.chuvaAvisada=false;
  if(S.chuva&&S.cisterna){
    const q=Math.min(6-S.agua,S.cisterna);
    if(q>0){S.agua+=q;ganhou({agua:q});diz(`A chuva de ontem encheu ${q} ${q===1?'galão':'galões'} pela cisterna.`,'bom');}

function irPara(id,semTexto){
  if(!PLANTA[id])id=SALA;
  cena.casa=cena.casa||{voce:SALA,monstro:null,visivel:false};
  cena.casa.voce=id;
  somDoComodo(id);
  const q=PLANTA[id];
  if(!semTexto){limpar();}
  else limpar();
  cap(`${q.nome} · ${horaTexto()}`);
  diz(AMBIENTE[id],'narr');
  if(id===8){
    if(S.cisterna)diz(`Cisterna com ${S.cisterna} de 5 calhas ligadas.`,'sist');
    if(S.muro)diz(`Muro reforçado em ${S.muro} de 3.`,'sist');
    if(S.cachorro&&S.cachorro.vivo)
      diz(`${S.cachorro.n} levanta a cabeça quando você chega e volta a deitar.`,S.cachorro.fome>2?'perigo':'bom');
  }
  if(id===3&&S.esconderijo)diz('O buraco no contrapiso está coberto com a chapa de compensado.','sist');
  const gente=S.abrigo.filter(p=>p.local===id);
  gente.forEach(p=>fichaRosto(p,p.hab,p.moral>=65?'firme':p.moral>=35?'abalado':'no limite','vivo'));
  menuComodo(id);
}

function acaoDia(horas,fn){
  return async()=>{
    /* antes: se faltasse hora, a ação rodava mesmo assim e o
       jogador não entendia por que nada acontecia */
    if(S.hora+horas>19){
      diz(`Não dá tempo. São ${horaTexto()} e isso leva ${horas}h.`,'perigo');
      return menuComodo(cena.casa.voce);
    }
    const antes={c:S.comida,d:S.diesel,a:S.agua,r:S.remedio};
    const nLinhas=T?T.children.length:0;
    const acabou=gastarHoras(horas);
    atualizarPainel();
    await fn();
    /* se a ação não escreveu nada, ela falhou calada */
    if(T&&T.children.length<=nLinhas+1)
      diz('Você tenta e não sai nada disso. Faltou alguma coisa.','fraco');
    await pausa(400);
    if(S.hora>=19){
      AC.innerHTML='';
      diz('O sol foi embora. Não dá mais tempo de fazer nada.','sist');
      botao('Trancar tudo e esperar',()=>anoitecer(),{cls:'chave'});
    }else menuComodo(cena.casa.voce);
  };
}

async function vigiar(){
  S.ruido=Math.max(0,S.ruido-4);
  diz('Você fica meia hora encostado na janelinha do sótão, olhando a rua.','narr');
  await pausa(1200);
  const r=Math.random();
  if(r<.28){
    diz('Nada se mexe. Nem cachorro, nem vento. A rua parece uma foto.','narr');
    S.vigiou={tipo:'nada'};
  }else if(r<.62){
    diz('Uma figura passa na esquina e some atrás do muro. Andava normal. Cansada, mas normal.','bom');
    S.vigiou={tipo:'gente'};
  }else if(r<.86){
    diz('Tem uma coisa parada embaixo do poste há vinte minutos. Não senta, não se apoia. Fica em pé exatamente igual.','perigo');
    S.vigiou={tipo:'monstro'};
  }else{
    diz('Você vê três se movendo juntas na calçada de baixo. Elas param no mesmo instante e recomeçam no mesmo instante.','perigo');
    S.vigiou={tipo:'monstro',muitos:true};
  }
  await pausa(1000);
  if(S.vigiou.tipo==='monstro')diz('Se baterem hoje, você já sabe de onde veio.','sist');
}


function verAbrigo(){
  limpar();cap('Quem está aqui');

  });
  if(S.vozesRoubadas.length){diz(' ','narr');
    diz(`Elas sabem imitar ${S.vozesRoubadas.length} ${S.vozesRoubadas.length===1?'voz':'vozes'}. Veja a lista em "O que elas sabem imitar".`,'perigo');}
  if(S.mortos.length)diz(`Perdidos: ${S.mortos.map(p=>p.n).join(', ')}.`,'sist');
  if(typeof totalUso==='function'&&totalUso()>=5){

  diz(`Confiança da casa em você: ${S.confianca>=70?'inteira':S.confianca>=45?'arranhada':S.confianca>=25?'pouca':'nenhuma'}.`,S.confianca>=45?'bom':'perigo');
  const kit=[S.tranca&&'tranca de ferro',S.armadilha&&'armadilha no quintal',
    S.lanterna&&'lanterna',S.olho&&'olho mágico'].filter(Boolean);
  if(kit.length)diz('Feito na oficina: '+kit.join(', ')+'.','sist');
  AC.innerHTML='';
  botao('Voltar',()=>irPara(cena.casa.voce),{cls:'chave'});
}

<script>
/* ================= O PESO DE CADA PISTA =================
   Você juntava avisos e decidia no escuro. Cada pista tem
   valor diferente e você não tinha como saber qual. */

const PESO_PISTA=[
 {re:/^◈ Você escutou/,p:26,n:'o que você ouviu'},
 {re:/^◈ Você já escutou essa voz/,p:30,n:'você conhece essa voz'},
 {re:/^◈ Essa voz é de uma casa/,p:40,n:'voz de outra partida'},
 {re:/^◈ Você escutou e não achou nada/,p:-22,n:'corpo de gente na escuta'},
 {re:/pupila|não fecha/i,p:34,n:'a pupila'},
 {re:/articula|joelho|dedo|dobra/i,p:24,n:'o corpo'},
 {re:/respir|peito|fôlego/i,p:22,n:'a respiração'},
 {re:/sombra|vulto|altura/i,p:18,n:'a sombra'},
 {re:/contou|contar|número|repetiu/i,p:20,n:'a contagem'},
 {re:/nome|chamou/i,p:14,n:'o nome'},
 {re:/daqui sabe|local/i,p:28,n:'a pergunta local'},
 {re:/⚠/,p:16,n:'um aviso'}
];
function pesoDe(s){
  for(const x of PESO_PISTA)if(x.re.test(s))return x;
  return {p:12,n:'alguma coisa'};
}
/* o quanto você tem de razão pra fechar a porta */
function certeza(v){
  let soma=0,itens=[];
  (v.sinais||[]).forEach(s=>{
    const x=pesoDe(s);
    /* aviso falso pesa igual: é isso que o torna cruel */
    soma+=x.p;
    itens.push(x);
  });
  /* o que você fez sem achar nada também conta */
  if(v.olhou&&!(v.sinais||[]).some(s=>/lente|pupila|corpo|sombra/i.test(s)))soma-=14;
  if(v.escutou&&!(v.sinais||[]).some(s=>/escutou/i.test(s)))soma-=12;
  const feitas=(v.usadas||[]).length;
  if(feitas>=2&&!itens.length)soma-=10*feitas;
  return {n:trava(soma,-60,100),itens};
}
function textoCerteza(c){
  const n=c.n;
  if(n>=70)return {t:'Você tem quase certeza de que isso não é gente.',cls:'perigo'};
  if(n>=40)return {t:'Tem coisa demais errada. Provavelmente não é gente.',cls:'alerta'};
  if(n>=18)return {t:'Alguma coisa não fecha, mas é pouco pra ter certeza.',cls:'alerta'};
  if(n>=-10)return {t:'Você não sabe. Nem pra um lado nem pro outro.',cls:'sist'};
  if(n>=-35)return {t:'Tudo que você checou bate. Parece gente mesmo.',cls:'bom'};
  return {t:'Você checou de tudo e não achou nada. Se isso não for gente, você não tem como saber.',cls:'bom'};
}
function painelCerteza(v){
  const c=certeza(v);
  const t=textoCerteza(c);
  const barra=(()=>{
    const q=Math.round(trava((c.n+60)/160,0,1)*10);
    return '░'.repeat(q)+'█'.repeat(10-q);
  })();
  diz(`gente ${barra} coisa`,'fraco');
  diz(t.t,t.cls);
  if(c.itens.length){
    const nomes=[...new Set(c.itens.map(x=>x.n))];
    diz('Pesa contra: '+nomes.join(', ')+'.','fraco');
  }
  /* honestidade sobre o que você NÃO checou */
  const falta=[];
  if(!v.olhou)falta.push('não olhou pelo olho mágico');
  if(!v.escutou)falta.push('não encostou o ouvido');
  if(!(v.usadas||[]).length)falta.push('não perguntou nada');
  if(falta.length)diz('Você ainda '+falta.join(', ')+'.','fraco');
  return c;
}

/* ================= QUEM ESTÁ FORA NÃO ESPERA =================
   Você podia ficar a noite inteira medindo. Agora tem relógio. */
function paciencia(v){
  if(v._pac==null){
    const base=v.mimico?6:5;
    v._pac=base+(v.tipo==='ferido'?-2:0)+(v.tipo==='silente'?4:0)
      +Math.floor(Math.random()*3);
  }
  return v._pac;
}
function turnosRestantes(v){
  return Math.max(0,paciencia(v)-(v.turnos||0));
}
function avisoPaciencia(v){
  const r=turnosRestantes(v);
  if(r>=4)return null;
  if(r===3)return {t:'Do lado de fora, ela muda o peso de pé.',cls:'fraco'};
  if(r===2)return {t:'"Você vai me deixar aqui a noite inteira?"',cls:'alerta'};
  if(r===1)return {t:'Ela dá um passo pra trás. Está indo embora.',cls:'perigo'};
  return {t:'Ela foi.',cls:'perigo'};
}
async function foiEmbora(v){
  limpar();AC.innerHTML='';cap('Ela foi');
  await pausa(1100);
  if(v.mimico){
    diz('A sombra sai da frente da porta e some na rua sem pressa nenhuma.','narr');
    await pausa(1300);
    diz('Você nunca vai saber o que era. Mas você não abriu.','sist');
    S.deixouIr=(S.deixouIr||0)+1;
    mexerCredito(+2);
  }else{
    diz('Ela desiste e vai embora andando devagar, olhando pra trás duas vezes.','perigo');
    await pausa(1400);
    diz(`Era ${v.pessoa.n}. Era gente.`,'perigo');
    mexerMoral(-9);S.confianca=trava(S.confianca-6,0,100);
    S.perdeuGente=(S.perdeuGente||0)+1;
    registrarVoz(v.pessoa,`ficou na sua porta e você demorou demais, na noite ${S.dia}`);
    if(!S.mortos.some(p=>p.n===v.pessoa.n))S.mortos.push(v.pessoa);
    mexerCredito(-5);
  }
  await pausa(1200);
  AC.innerHTML='';
  botao('Continuar a noite',()=>resolverNoite(),{cls:'chave'});
}

/* ================= ELA APRENDE O SEU MÉTODO =================
   Se você sempre olha, ela melhora a aparência. Se sempre
   escuta, ela melhora o som. */
function metodoPorta(){
  return S.metPorta||(S.metPorta={olho:0,ouvido:0,pergunta:0});
}
function vicioPorta(){
  const M=metodoPorta();
  const tot=M.olho+M.ouvido+M.pergunta;
  if(tot<6)return null;
  const e=Object.entries(M).sort((a,b)=>b[1]-a[1])[0];
  return e[1]/tot>=.55?e[0]:null;
}
function avisoVicio(){
  const v=vicioPorta();
  if(!v)return null;
  return {olho:'Você sempre olha primeiro. Elas repararam: as de agora estão mais caprichadas de perto.',
   ouvido:'Você sempre escuta. As de agora respiram melhor do que respiravam.',
   pergunta:'Você sempre pergunta. Elas decoraram as suas perguntas.'}[v];
}

<script>
/* ================= A PORTA ================= */
const PERG={
 CONTAR:{p:'Conta até dez.',

 NOME:{p:'Diz o meu nome.',

   nerv:[()=>'Eu ouvi alguém gritar um nome aí dentro ontem. Não lembro qual.',

 ATRAS:{p:'O que tem atrás de você?',

   ruim:[['Nada. Não tem nada atrás de mim. Nunca teve nada atrás de mim.','Ela não sabe descrever a rua. Ela não olha pra trás porque não enxerga como a gente.'],
         ['Tem eu. Tem eu atrás de mim também.','Isso não é resposta de gente. É a frase quebrando no meio.']],
   nerv:['Eu não quero olhar pra trás. Por favor não me faz olhar pra trás.',

 MAO:{p:'Põe a mão na fresta.',
   ok:['[v]Cinco dedos sujos aparecem embaixo da porta. Tremem, mas são cinco.',
       '[v]Uma mão magra encosta no chão. Dá pra ver a aliança larga e a unha roída.'],
   ruim:[['[v]Uma coisa entra na fresta. Você conta os dedos duas vezes e dá sete nas duas.','Sete dedos. Não tem discussão nessa.'],
         ['[v]O que entra é comprido demais pra ser dedo e dobra no lugar onde não tem junta.','A mão dobra onde osso nenhum dobra.'],
         ['[v]Nada entra. Do outro lado a voz diz que pôs a mão, mas a fresta continua vazia.','Ela disse que fez e não fez. Ela não entende o que é uma mão.']],
   nerv:['[v]A mão treme tanto que mal encosta no chão.','Cinco dedos. Só está apavorado.']},
 PERDA:{p:'Fala o nome de alguém que você perdeu.',
   ok:['Minha irmã. Ficou na rodoviária. Eu não voltei pra buscar.',
       'Meu filho. Seis anos. E eu não vou falar o nome dele em voz alta pra você.'],
   ruim:[[()=>{const c=S.vozesRoubadas.length?sortear(S.vozesRoubadas).n:'você';
        return `${c}. Eu perdi ${c}.`},'Ela falou o nome de alguém desta casa. Ela só conhece esse nome porque ouviu daqui de dentro.'],
         [()=>'Eu não perco. Eu guardo.','Isso não é resposta. É uma coisa se vangloriando.']],
   nerv:['Todo mundo. Essa é a resposta que você quer? Todo mundo.',
         'Ele não consegue escolher um. Faz sentido.']}
};
const CHAVES=Object.keys(PERG);
S.usoPergunta={};
function totalUso(){return CHAVES.reduce((a,k)=>a+(S.usoPergunta[k]||0),0);}
function taxaUso(k){const t=totalUso();return t?(S.usoPergunta[k]||0)/t:0;}
function maisUsada(){return CHAVES.slice().sort((a,b)=>(S.usoPergunta[b]||0)-(S.usoPergunta[a]||0))[0];}

function tipoDaNoite(){
  const p=[];
  Object.entries(TIPOS).forEach(([k,v])=>{
    let peso=v.peso;
    const rep=vozesDisponiveis().length;
    if(k==='conhecido'&&!rep)peso=0;
    if(k==='ecoador'&&!rep)peso=4;
    if(['conhecido','ecoador','coro'].includes(k))peso*=trava(1+rep*.16,1,2.6);
    if(k==='coro'&&S.dia<4)peso=0;
    if(k==='bando'&&S.pool.length<2)peso=0;
    /* quanto menos gente sobrou no mundo, menos chance de ser
       gente na sua porta — e mais chance de ser o resto */
    if(v.mimico)peso*=trava((.45+S.dia*.075)*pressao(),.45,3.2);
    if(k==='humano')peso*=trava((1.6-S.dia*.04)*(1-escassez()*.8),.10,1.6);
    for(let i=0;i<Math.round(peso);i++)p.push(k);
  });
  return sortear(p.length?p:['humano']);
}
const pessoaLivre=()=>S.pool.length?sortear(S.pool):sortear(PESSOAS);
const resolver=x=>typeof x==='function'?x():x;

function gerarVisitante(){
  const tipo=S.dia===1?'humano':tipoDaNoite();
  const t=TIPOS[tipo];
  let mimico=!!t.mimico,pessoa;

  const rep=vozesDisponiveis();
  if(chance(.06)&&['conhecido','ecoador'].includes(tipo)){
    const ant=mortoDeAntes();
    if(ant){
      const vz2=vozDe(ant);
      const v2={tipo,mimico:true,pessoa:ant,sinais:[],usadas:[],turnos:0,corrente:false,
        consultou:false,decorada:null,olhou:false,escutou:false,_modelo:null,_escuta:null,
        vozIdx:vz2.vozIdx,pitch:vz2.pitch,rate:vz2.rate,qtd:1,
        alt:ant.alt,larg:.16,dedos:0,tremor:0,x:.5,deAntes:true};
      v2.respostas={};
      const ruins2=CHAVES.slice().sort(()=>Math.random()-.5).slice(0,2);
      CHAVES.forEach(k=>{
        const errado=ruins2.includes(k);
        v2.respostas[k]={txt:errado?sortear(PERG[k].ruim(ant)):sortear(PERG[k].bom(ant)),
          errado,aviso:errado?PERG[k].aviso:null};
      });
      return v2;
    }
  }
  if(tipo==='conhecido'){pessoa=rep.length?sortear(rep).p:sortear(S.mortos);mimico=!chance(.14);}
  else if(tipo==='ecoador')pessoa=rep.length?sortear(rep).p:pessoaLivre();
  else if(tipo==='crianca'){
    pessoa=S.pool.find(p=>p.id<16)||{n:'menino',id:11,alt:.27,hab:'ouvido fino',
      ef:'Denuncia um sinal de graça em toda porta.',frase:'Eu não fiz nada de errado.',
      mem:'a escola',fala:['Eu fico quietinho, eu juro.']};
    mimico=chance(trava(.15+S.dia*.03,.15,.45));
  }
  else if(tipo==='coro')pessoa=rep.length?sortear(rep).p:pessoaLivre();
  else{pessoa=pessoaLivre();if(!t.mimico)mimico=chance(trava(.10+S.dia*.032,.10,.42));}

  const vz=vozDe(pessoa);
  if(pessoa.vozOuvida||S.vozesOuvidas.includes(pessoa.n))pessoa.vozOuvida=true;
  const v={tipo,mimico,pessoa,sinais:[],usadas:[],turnos:0,corrente:false,
    consultou:false,decorada:null,olhou:false,_modelo:null,
    vozIdx:vz.vozIdx,pitch:vz.pitch,rate:vz.rate,
    alt:pessoa.alt||.45,larg:.24+Math.random()*.07,qtd:1,dedos:0,
    prazo:t.urgente?5:99,grupo:null,respostas:{}};

  if(tipo==='coro'){v.qtd=3;v.rate=.86;}
  if(tipo==='bando'){
    const outros=S.pool.filter(p=>p!==pessoa).sort(()=>Math.random()-.5).slice(0,chance(.5)?2:1);
    v.grupo=[pessoa,...outros].map(p=>({p,mimico:chance(trava(.14+S.dia*.028,.14,.38))}));
    v.qtd=v.grupo.length;
    mimico=v.mimico=v.grupo.some(x=>x.mimico);
  }
  if(mimico&&chance(.22))v.rate=vz.rate*1.35;

  // quantas respostas vão sair erradas
  const qtdRuins=mimico?(S.dia<=2?4:S.dia<=4?3:S.dia<=7?2:(chance(.45)?1:2)):0;
  /* elas aprendem: os erros migram pras perguntas que você quase não faz */
  const aprendizado=(mimico&&totalUso()>=8)?trava((S.dia-2)*.11,0,.62):0;
  const ordem=CHAVES.slice().sort((a,b)=>
    (Math.random()-aprendizado*taxaUso(b)*2.6)-(Math.random()-aprendizado*taxaUso(a)*2.6));
  let ruins=ordem.slice(0,qtdRuins);
  if(aprendizado>.25){
    const decoradas=CHAVES.filter(k=>!ruins.includes(k)&&taxaUso(k)>.22);
    if(decoradas.length)v.decorada=decoradas.sort((a,b)=>taxaUso(b)-taxaUso(a))[0];
  }
  const nervoso=!mimico&&chance(.3)?sortear(CHAVES):null;
  CHAVES.forEach(k=>{
    const P=PERG[k];
    if(ruins.includes(k)){
      const [txt,porque]=sortear(P.ruim);
      v.respostas[k]={txt:resolver(txt),errado:true,porque:resolver(porque)};
    }else if(k===nervoso){
      v.respostas[k]={txt:resolver(P.nerv[0]),errado:false,nota:P.nerv[1]};
    }else{
      v.respostas[k]={txt:resolver(sortear(P.ok)),errado:false};
    }
  });

  v.sinalVisual=mimico
    ? sortear(['A silhueta não faz sombra na parede atrás dela. Nada ali bloqueia a luz direito.',
               'Os olhos brilham quando pega a luz do lampião. Como os de um bicho.',
               'A boca continua se mexendo depois que a voz já parou.',
               'A roupa está limpa e passada. Ninguém lá fora tem roupa limpa há semanas.'])
    : sortear(['Um rosto sujo e encolhido, piscando com a luz do lampião.',
               'Ela recua um passo quando te vê. Medo de você. Isso é humano.',
               'A mão está agarrada na alça de uma mochila vazia.',
               'A respiração faz vapor no frio. Ela está viva.']);
  if(mimico&&chance(.4)){v.altErrada=true;v.alt=v.alt<.4?.66:.24;}
  return v;
}

/* ---------- cena ---------- */
function painelSinais(v){
  const velho=$('#sinais');if(velho)velho.remove();
  const d=document.createElement('div');d.id='sinais';d.className='sinais';
  const n=v.sinais.length;
  d.innerHTML=`<b>${n===0?'Nada estranho até agora':n===1?'1 coisa estranha':n+' coisas estranhas'}</b>`
    +v.sinais.map(s=>`<span>⚠ ${esc(s)}</span>`).join('')
    +(n===0?'<span class="dica">Nenhum aviso ainda. Isso não prova que é gente.</span>':'<span class="dica">Aviso na lista não tem volta: isso não é gente.</span>');

}

async function cenaPorta(){

  ligarDrone();subirDrone(.15);

  diz(v.tipo==='ferido'?'Batidas fracas, muitas, abaixo da maçaneta.'
     :v.tipo==='silente'?'Três batidas fortes. Depois nada.'
     :'Três batidas. Pausa. Mais três.','sist');

     :v.alt<.5?'A sombra é de estatura média e balança de leve.'
     :'A sombra é alta. Quem está ali precisa se curvar pra falar na altura da fresta.','narr');

  }

      diz(`${S.cachorro.n} se planta na frente da porta com o pelo do pescoço em pé e late sem parar.`,'perigo');
      v.sinais.push(`${S.cachorro.n} latiu pra isso do jeito que ele não late pra gente.`);
    }else{
      diz(`${S.cachorro.n} vai até a porta, cheira a fresta e volta a deitar.`,'bom');
    }
  }
  if(tem('ouvido fino')&&v.mimico&&chance(.7)){
    v.sinais.push(`${quem('ouvido fino').n} escutou: a respiração do outro lado é rápida demais.`);
  }
  await pausa(500);

  // primeira fala
  if(v.tipo==='silente'){
    diz('Do lado de fora não vem voz nenhuma. Só o peso de alguém encostado na madeira.','perigo');
  }else if(v.tipo==='coro'){
    sussurro(9,-.5,.09);sussurro(8,.5,.09);
    const ab=sortear(ABERTURAS);fala(ab);
    await falarV5(ab,{vozIdx:v.vozIdx,pitch:v.pitch,rate:v.rate,dist:'porta',mimico:v.mimico,pessoa:v.pessoa});
    diz('Três bocas disseram isso ao mesmo tempo, na mesma palavra.','perigo');
    v.sinais.push('Três vozes falando exatamente juntas.');
  }else if(v.tipo==='conhecido'){
    fala(v.pessoa.frase);
    await falarV5(v.pessoa.frase,{vozIdx:v.vozIdx,pitch:v.pitch,rate:v.rate,dist:'porta',mimico:v.mimico,pessoa:v.pessoa});
  const rec=reconheceVoz(v);
  if(rec){await pausa(1000);diz('◈ '+rec,'alerta');
    if(!S.abrigo.some(x=>x.n===v.pessoa.n))v.sinais.push('◈ '+rec);}
  if(v.deAntes){
    await pausa(1000);
    diz('◈ Essa voz não é dessa casa. É de antes.','alerta');
    v.sinais.push('◈ Essa voz é de uma casa que já acabou.');
  }
    diz(`Essa é a voz de ${v.pessoa.n}. ${v.pessoa.n} morreu.`,'perigo');
    v.sinais.push(`Está usando a voz de ${v.pessoa.n}, que já morreu.`);
  }else{
    const ab=v.tipo==='ferido'?sortear(ABERTURAS_FERIDO)
            :v.tipo==='crianca'?sortear(ABERTURAS_CRIANCA)
            :(v.tipo==='ecoador'&&S.vozesRoubadas.length&&chance(.55))?sortear(S.vozesRoubadas).frase
            :sortear(ABERTURAS);
    fala(ab);
    await falarV5(ab,{vozIdx:v.vozIdx,pitch:v.pitch,rate:v.rate,dist:'porta',mimico:v.mimico,pessoa:v.pessoa});
    if(v.pessoa.id<16)diz('A voz é de criança.','sist');
    else if(v.pessoa.id>55)diz('A voz é de alguém velho, arrastada.','sist');
    if(v.altErrada){
      const err=v.pessoa.id<16?'A voz é de criança, mas a sombra é de gente grande.'
                              :'A voz é de adulto, mas a sombra mal chega na maçaneta.';
      diz(err,'perigo');v.sinais.push(err);
    }
  }
  if(v.tipo==='ferido')diz('Ele não fica em pé muito tempo. Você tem umas quatro trocas de palavra, no máximo.','sist');
  if(v.tipo==='bando')diz(`São ${v.grupo.length} sombras. Elas se revezam pra falar.`,'sist');

  if(S.dia===1){
    diz(' ','narr');
    diz('Faça perguntas. Resposta impossível vira aviso na lista, e aviso na lista é mentira na certa. O problema é que nem toda mentira deixa aviso — por isso existem a corrente, o olho mágico e a janela do sótão.','sist');
  }
  painelSinais(v);
  menuPorta(v);
}

function menuPorta(v){
  AC.innerHTML='';
  guia();
  if(!v._batTocada){v._batTocada=true;tocarBatida(v);}
  const cz=painelCerteza(v);
  const ap=avisoPaciencia(v);
  if(ap)diz(ap.t,ap.cls);
  if(turnosRestantes(v)<=0)return foiEmbora(v);
  const av=avisoVicio();
  if(av&&chance(.3))diz(av,'fraco');
  const restam=S.maxPerguntas-S.perguntasFeitas;
  if(v.tipo!=='silente'&&restam>0){
    perguntasDoDia(v).slice(0,4).forEach(k=>{
      const u=(S.usoPergunta||{})[k]||0;
      botao(PERG[k].p,()=>perguntar(k,v),
        {custo:u>=3?'+4 ruído · elas já decoraram essa':u?'+4 ruído · usada '+u+'x':'+4 ruído · nova'});
    });
    perguntasLocaisAtivas().filter(k=>!v.usadas.includes('L_'+k)).slice(0,2).forEach(k=>
      botao(PERG_LOCAL[k].p,()=>perguntarLocal(k,v),{custo:'só quem é daqui sabe'}));
  }
  if(!v.olhou)botao('Olhar pelo olho mágico',()=>olharPeloOlho(v),
    {cls:'prim',custo:S.porta.olho?'lente boa':'vê a cara dele'});
  if(!v.escutou)botao('Encostar o ouvido na porta',()=>escutarPorta(v),
    {cls:'prim',custo:'+5 ruído · você é quem julga'});
  if(!v.sombraVista)botao('Observar a sombra por baixo da porta',()=>{
    const r=observarSombra(v);
    diz(r.t,r.sinal?'perigo':r.ok?'bom':'alerta');
    if(r.sinal&&typeof adicionarSinal==='function')
      adicionarSinal(v,'◈ Não tem sombra debaixo da porta.');
    menuPorta(v);
  },{custo:'grátis · não faz barulho'});
  if(!v.corrente)botao('Entreabrir com a corrente',()=>corrente(v),{custo:'vê o rosto · arriscado'});
  const perito=quem('ouvido fino')||quem('polícia');
  if(perito&&!v.consultou)botao(`Chamar ${perito.n} pra escutar`,()=>consultar(v,perito),
    {custo:'1 turno · +3 ruído'});
  botao('Abrir a porta',()=>confirmarAbrir(v),{cls:'prim',custo:restam>0?restam+' perguntas sobrando':'sem perguntas'});
  botao('Mandar embora',()=>decidir(false,v));
}

async function consultar(v,p){
  AC.innerHTML='';v.consultou=true;v.turnos++;
  S.ruido=trava(S.ruido+3,0,100);atualizarPainel();
  diz(`${p.n} encosta o ouvido na madeira e fica ali um tempo.`,'sist');
  await pausa(2000);
  const falso=(p===S.infiltrado);
  const confiavel=p.moral>=45&&!falso;
  const leitura=falso?!v.mimico:(confiavel?v.mimico:chance(.5));
  if(leitura){
    diz(`${p.n}: “Não é gente. Não sei explicar, mas não é.”`,'perigo');
    if(confiavel)v.sinais.push(`${p.n} escutou e disse que não é gente.`);
  }else{
    diz(`${p.n}: “Eu acho que é gente de verdade. A respiração tá certa.”`,'bom');
  }
  if(!confiavel&&!falso)diz(`${p.n} não parece seguro do que falou.`,'fraco');
  await pausa(700);
  await depoisDaResposta(v);
}

async function perguntarLocal(ch,v){
  metodoPorta().pergunta++;
  v.usadas.push('L_'+ch);S.perguntasFeitas++;v.turnos++;
  AC.innerHTML='';
  const L=PERG_LOCAL[ch];
  diz('— '+L.p,'sist');
  await pausa(900);
  const sabe=v.mimico?mimicoSabeLocal(v,ch):true;
  const txt=sabe?L.certo:sortear(L.errado);
  cena.falando=true;
  fala(txt);
  await falarV5(txt,{vozIdx:v.vozIdx,pitch:v.pitch,rate:v.rate,
    dist:v.corrente?'fresta':'porta',mimico:v.mimico});
  cena.falando=false;
  await pausa(400);
  if(!sabe){
    const aviso=`Errou uma coisa que qualquer um daqui sabe: ${L.p.toLowerCase()}`;
    v.sinais.push(aviso);
    diz('⚠ '+aviso,'alerta');
  }else if(v.mimico){
    diz(`Respondeu certo. ${PERG_LOCAL[ch].dono==='—'?'':'Alguém já contou isso pra ela.'}`,'fraco');
  }else{
    diz('Respondeu como quem morou aqui a vida inteira.','bom');
  }
  await depoisDaResposta(v);
}

async function perguntar(k,v){
  metodoPorta().pergunta++;
  v.usadas.push(k);S.perguntasFeitas++;v.turnos++;
  S.usoPergunta[k]=(S.usoPergunta[k]||0)+1;
  S.ruido=trava(S.ruido+4,0,100);atualizarPainel();
  AC.innerHTML='';
  fala(PERG[k].p);
  await pausa(500);
  if(v.tipo==='silente'){
    diz('Nada. Só a madeira estalando com o peso.','narr');
    return depoisDaResposta(v);
  }
  const r=v.respostas[k];
  if(v.tipo==='coro')sussurro(7,chance(.5)?-.6:.6,.07);
  if(r.txt.startsWith('[v]')){
    const t=r.txt.slice(3);
    cena.sombra.larg=.36;cena.sombra.dedos=r.errado?7:5;
    await pausa(1100);
    if(r.errado){cena.sombra.tremor=.6;arranhao(.2,.6);}
    diz(t,r.errado?'perigo':'narr');
    await pausa(1100);
    cena.sombra.tremor=0;cena.sombra.dedos=0;cena.sombra.larg=v.larg;
  }else{
    fala(r.txt);cena.falando=true;
    await falarV5(r.txt,{vozIdx:v.vozIdx,pitch:v.pitch,rate:v.rate,dist:v.corrente?'fresta':'porta',mimico:v.mimico});
  }
  cena.falando=false;
  await pausa(400);
  if(r.errado){
    diz('⚠ '+r.porque,'alerta');
    v.sinais.push(r.porque);
  }else if(r.nota){
    diz('Estranho, mas explicável. '+r.nota,'bom');
  }else if(v.decorada===k){
    diz('Respondeu essa rápido demais. Como quem já ensaiou.','fraco');
  }else{
    diz('Nada de errado nessa resposta.','bom');
  }
  await depoisDaResposta(v);
}

async function depoisDaResposta(v){
  painelSinais(v);
  subirDrone(trava(.15+S.perguntasFeitas*.25+v.sinais.length*.2,0,1));
  if(v.tipo==='ferido'&&v.turnos>=v.prazo)return prazoEstourou(v);
  if(S.perguntasFeitas>=S.maxPerguntas){
    AC.innerHTML='';
    diz('Você já falou demais. Alguma coisa longe vai ter ouvido.','sist');
    if(!v.sombraVista)botao('Observar a sombra por baixo da porta',()=>{
    const r=observarSombra(v);
    diz(r.t,r.sinal?'perigo':r.ok?'bom':'alerta');
    if(r.sinal&&typeof adicionarSinal==='function')
      adicionarSinal(v,'◈ Não tem sombra debaixo da porta.');
    menuPorta(v);
  },{custo:'grátis · não faz barulho'});
  if(!v.corrente)botao('Entreabrir com a corrente',()=>corrente(v),{custo:'vê o rosto · arriscado'});
    botao('Abrir a porta',()=>confirmarAbrir(v),{cls:'prim'});
    botao('Mandar embora',()=>decidir(false,v));
    return;
  }
  menuPorta(v);
}

async function corrente(v){
  AC.innerHTML='';v.corrente=true;v.turnos++;
  S.ruido=trava(S.ruido+3,0,100);atualizarPainel();
  diz('Você prende a corrente e abre quatro dedos de porta.','sist');
  correnteSom(0);dobradica(true,0);
  cena.abertura=.18;
  await pausa(1500);
  diz(v.sinalVisual,v.mimico?'perigo':'bom');
  if(v.mimico)v.sinais.push('Pela fresta: '+v.sinalVisual.toLowerCase());
  await pausa(1100);
  if(v.mimico&&chance(.28)){
    batida(2,1.6);cena.bater=1;rugido(.9);
    diz('A coisa joga o corpo contra a porta.','perigo');
    S.ruido=trava(S.ruido+14,0,100);danificarPorta(12);
    cena.abertura=0;await pausa(1400);
    if(S.porta.tranca){
      metalPesado(0);
      diz('A barra de ferro nem verga. Você fecha e ela continua batendo do lado de fora.','bom');
    }else if(S.porta.reforco>2){
      diz(`As tábuas seguram o baque. Você empurra de volta e tranca.`,'bom');
    }else{
      S.porta.reforco=Math.max(0,S.porta.reforco-1);ganhou({reforco:-1});
      diz('Uma tábua se solta com prego e tudo. Você fecha antes que ela ache o vão.','perigo');
    }
  }else{cena.abertura=0;correnteSom(0);diz('Você fecha antes que a coragem acabe.','narr');}
  atualizarPainel();await pausa(600);
  await depoisDaResposta(v);
}

async function prazoEstourou(v){
  AC.innerHTML='';await pausa(800);
  diz('Do lado de fora, o barulho de um corpo escorregando pela porta até o chão.','perigo');
  await pausa(1500);
  if(v.mimico){
    arranhao(0,1.4);
    diz('E então ele levanta. Não do jeito que gente levanta.','perigo');
    S.ruido=trava(S.ruido+10,0,100);
  }else{
    S.mortos.push(v.pessoa);registrarVoz(v.pessoa,`morreu encostado na sua porta enquanto você decidia, na noite ${S.dia}`);
    mexerMoral(-14);
    diz(`Ele morreu encostado na sua porta enquanto você decidia. Era ${v.pessoa.n}. Era gente.`,'perigo');
  }
  cena.sombra.dentro=false;atualizarPainel();await pausa(1200);
  AC.innerHTML='';botao('Continuar a noite',()=>resolverNoite(),{cls:'chave'});
}

function acolher(p,quieto){
  p.moral=p.moral??70;p.local=4;p.lacos=p.lacos||{};
  S.abrigo.forEach(o=>aproximar(p,o,4));
  S.abrigo.push(p);S.pool=S.pool.filter(x=>x!==p);
  anotar(`${p.n} entrou.`);
  const inf=talvezInfiltrar(p);
  return inf;
}

async function decidir(abrir,v){
  calar();desligarDrone();AC.innerHTML='';
  const s=$('#sinais');if(s)s.remove();
  if(abrir)await abriu(v);else await fechou(v);
  cena.sombra.dentro=false;cena.abertura=0;atualizarPainel();
  if(S.fimDado)return;
  await pausa(1100);
  AC.innerHTML='';botao('Continuar a noite',()=>resolverNoite(),{cls:'chave'});
}

async function abriu(v){
  diz(S.porta.tranca?'Você tira a barra de ferro do encaixe. Ela pesa mais do que parece.'
    :'Você levanta a tranca. A madeira range de cima a baixo.','sist');
  if(S.porta.tranca)metalPesado(0);
  dobradica(true,0);
  cena.abertura=.5;await pausa(1400);
  if(v.tipo==='bando'){
    cena.abertura=1;
    const maus=v.grupo.filter(x=>x.mimico);
    v.grupo.forEach(x=>{if(!x.mimico)acolher(x.p);});
    if(maus.length){
      rugido(.5);diz('Duas entram andando. A terceira entra do jeito errado.','perigo');
      await pausa(1200);
      const alvo=S.abrigo.length?sortear(S.abrigo):null;
      if(alvo){
        morreuAlguem(alvo,`morreu na cozinha na noite ${S.dia}, quando você abriu pro bando`);
        S.ruido=trava(S.ruido+24,0,100);
        diz(`${alvo.n} fica na cozinha. O resto de vocês empurra a coisa de volta pro escuro.`,'perigo');
      }else return fim('Você abriu para o bando. Só um deles precisava ser mentira.');
    }else{diz(`Entram ${v.grupo.length}. Sentam no chão sem falar. Era gente de verdade.`,'bom');mexerMoral(6);}
    return;
  }
  if(v.mimico){
    cena.abertura=1;rugido(.55);cena.bater=1;danificarPorta(18);
    diz(v.tipo==='crianca'?'A criança entra. Na altura certa. Com o sorriso na altura errada.'
      :v.tipo==='conhecido'?`Tem o rosto de ${v.pessoa.n}. Tem quase tudo de ${v.pessoa.n}.`
      :'Não tem cara. Tem só a boca, e a boca está na altura da sua.','perigo');
    await pausa(1400);
    if(v.sinais.length)diz(`Você tinha ${v.sinais.length} ${v.sinais.length===1?'aviso':'avisos'} na mão.`,'sist');
    const arma=melhorArma();
    if(arma&&arma.municao&&usarMunicao(arma))S.ruido=trava(S.ruido+14,0,100);
    if(arma&&chance(trava(.15+arma.dano*.14,.1,.6))){
      S.ruido=trava(S.ruido+18,0,100);danificarPorta(10);
      diz(`Você acerta ${arma.n.toLowerCase()} na coisa antes dela passar do batente. Ela recua pro escuro e vocês trancam.`,'bom');
      anotar(`Segurou uma delas na porta com ${arma.n.toLowerCase()}.`);
      mexerMoral(8);S.confianca=trava(S.confianca+10,0,100);
      return;
    }
    const arm=S.abrigo.find(x=>x.armado);
    if(arm&&chance(.45)){
      const a=ITENS.find(x=>x.id===arm.armado);
      diz(`${arm.n} entra na frente com ${a?a.n.toLowerCase():'o que tinha na mão'} e empurra a coisa pra fora.`,'bom');
      S.ruido=trava(S.ruido+16,0,100);danificarPorta(10);mexerMoral(6);
      return;
    }
    const alvo=S.abrigo.length?sortear(S.abrigo):null;
    if(alvo){
      morreuAlguem(alvo,`morreu no corredor na noite ${S.dia}, quando você abriu a porta`);
      S.ruido=trava(S.ruido+25,0,100);
      diz(`${alvo.n} não sai do corredor. Vocês fecham a porta com a coisa lá fora, mas ${alvo.n} já tinha ficado do lado de dentro dela.`,'perigo');
    }else return fim('Você abriu. Ela usou a sua voz até o amanhecer, chamando alguém que não veio.');
    return;
  }
  cena.abertura=1;
  const p=v.pessoa;
  if(v.tipo==='conhecido'){
    acolher(p);mexerMoral(12);
    diz(`É ${p.n}. Está vivo. Imundo, magro e vivo.`,'bom');
    diz('Ninguém dorme direito depois disso. Todo mundo já tinha enterrado ele por dentro.','narr');
  }else if(v.tipo==='ferido'){
    if(tem('enfermagem')){acolher(p);mexerMoral(10);
      diz(`${quem('enfermagem').n} costura ${p.n} na mesa da cozinha. Ele fica.`,'bom');}
    else if(S.remedio>0){S.remedio--;acolher(p);diz(`Você gasta um remédio em ${p.n}. Funciona.`,'bom');}
    else{S.mortos.push(p);registrarVoz(p,`entrou ferido demais e morreu no chão da sala, na noite ${S.dia}`);
      mexerMoral(-10);
      diz(`${p.n} entra e morre no chão da sala segurando sua mão. Não tinha o que fazer.`,'perigo');}
  }else{
    acolher(p);mexerMoral(5);
    diz(`Era gente. ${p.n}, ${p.id} anos, entra e senta no chão sem falar por um minuto inteiro.`,'bom');
    diz(`${p.hab.toUpperCase()} — ${p.ef}`,'sist');
    fichaRosto(p,p.hab,'entrou na noite '+S.dia,'vivo');
    if(S.abrigo.length===1)reagir('primeiroEntrou',p.n);
  }
  S.comida=Math.max(0,S.comida-1);S.ruido=trava(S.ruido+8,0,100);
  if(S.abrigo.includes(p))diz(`E agora a voz de ${p.n} existe dentro desta casa. Elas escutam isso.`,'narr');
}

async function fechou(v){
  diz('Você não responde. Você segura a tranca com as duas mãos.','sist');
  await pausa(1400);
  if(v.mimico){
    arranhao(0,1.3);danificarPorta(5);
    diz(v.tipo==='coro'?'As três sombras se separam devagar e vão embora em direções diferentes.'
      :'A sombra fica ali mais um tempo. Depois se desfaz pros lados, como água.','bom');
    diz('Era uma delas. Você acertou.','bom');
    S.ruido=trava(S.ruido+3,0,100);
    if(v.tipo==='conhecido')diz(`Você fez a coisa certa. Vai passar semanas achando que não.`,'narr');
  }else{
    const p=v.pessoa;
    S.pool=S.pool.filter(x=>x!==p);S.mortos.push(p);
    registrarVoz(p,`gritou na sua porta a noite ${S.dia} inteira porque você não abriu`);
    mexerMoral(-16);S.confianca=trava(S.confianca-5,0,100);
    const ult=sortear(['Por favor. Eu tenho filho.','Eu vi vocês. Eu sei que tem gente aí dentro.',
      'Não faz isso comigo.','Tudo bem. Tudo bem, eu entendo.']);
    await falarV5(ult,{vozIdx:v.vozIdx,pitch:v.pitch,rate:v.rate,dist:'porta',mimico:v.mimico,pessoa:v.pessoa});
    await pausa(600);rugido(1.3);
    diz('Ele grita por uns quatro minutos. Depois para no meio de uma palavra.','perigo');
    diz(`Era gente de verdade. Era ${p.n}. E agora elas também sabem gritar com a voz de ${p.n}.`,'perigo');
    S.ruido=trava(S.ruido+12,0,100);
    if(v.tipo==='crianca')mexerMoral(-12);
  }
}

<script>
/* ================= CADA LUGAR FICA A UMA DISTÂNCIA =================
   Toda expedição custava 4 horas fixas, fosse a casa da esquina
   ou o aeroporto de outra cidade. Agora o mapa tem escala. */

const DISTANCIA={
 /* Cacoal — o que é perto de casa */
 rua7:1, casas:1, mercado:2, posto:2, colegio:2, igreja:2,
 lanchonete:2, delegacia:3, ferrovelho:3, hospital:3,
 serraria:3, obra:4, sitio:4, torre:4,
 /* Vila Andirobal — distrito de roça */
 an_igreja:2, an_armazem:2, an_escola:3, an_roca:4,
 /* Peridão d'Oeste — cidade */
 pe_farmacia:2, pe_borracharia:2, pe_atacado:3,
 pe_quartel:4, pe_frigorifico:4,
 /* Barra do Piraíba — beira de BR */
 pi_posto:2, pi_hotel:2, pi_fila:3, pi_deposito:3,
 /* Sumaúma — cidade grande */
 su_rodoviaria:3, su_hospital:4, su_shopping:4,
 su_industrial:5, su_aeroporto:5
};
const NOME_DIST=['','na esquina','perto','do outro lado da cidade',
  'longe','no fim de tudo'];

function distDe(l){
  const d=DISTANCIA[(l&&l.id)||'']||3;
  return trava(d,1,5);
}
/* quanto custa ir e voltar */
function horasDe(l,par){
  let h=1+distDe(l)*1.1;
  const v=melhorVeic();
  if(v)h+=VEIC[v].horas;                      /* moto tira 2, carroça soma 1 */
  if(par&&par.hab==='corrida')h-=1;
  if(temMal('torcao')||temMal('fratura'))h+=2;
  if(temMal('bolha'))h+=1;
  if(maosOcupadas())h+=1;
  if(S.chuva)h+=1;
  if(S.clima==='neblina')h+=1;
  return trava(Math.round(h),1,9);
}
/* longe é mais perigoso e rende mais */
function riscoDist(l){return Math.round((distDe(l)-2)*.5);}
function rendeDist(l){return 1+(distDe(l)-2)*.14;}

function textoDist(l,par){
  const d=distDe(l), h=horasDe(l,par);
  const v=melhorVeic();
  return `${NOME_DIST[d]} · ${h}h${v?' de '+VEIC[v].n:' a pé'}`;
}
/* dá tempo de voltar antes de escurecer? */
function daTempo(l,par){
  return S.hora+horasDe(l,par)<19;
}
function avisoTempo(l,par){
  const h=horasDe(l,par);
  const volta=S.hora+h;
  if(volta<17)return null;
  if(volta<19)return 'Você volta em cima da hora.';
  return `Não dá tempo: são ${horaTexto()} e a viagem leva ${h}h.`;
}

<script>
/* ================= LER O QUE JÁ PASSOU =================
   O texto antigo não é mais apagado: fica esmaecido acima,
   e você rola pra ver. Sutil, sem tela separada. */

const MAX_LINHAS=110;

/* limpar() agora empurra pra trás em vez de destruir */
limpar=function(){
  if(T.children.length){
    [...T.children].forEach(el=>el.classList.add('passado'));
    const ult=T.lastElementChild;
    if(!ult||!ult.classList.contains('separa')){
      const sep=document.createElement('div');
      sep.className='separa passado';
      T.appendChild(sep);
    }
  }
  while(T.children.length>MAX_LINHAS)T.removeChild(T.firstChild);
  AC.innerHTML='';
  T.scrollTop=T.scrollHeight;_naoVisto=false;
  setTimeout(atualizarSetas,30);
};

/* ---------- as setinhas ---------- */
let _setas=null;
function montarSetas(){
  if(_setas)return;
  const pai=$('#cena');
  if(!pai)return;
  const cima=document.createElement('button');
  cima.id='seta-cima';cima.type='button';cima.innerHTML='▴';
  cima.setAttribute('aria-label','ver o que passou');
  const baixo=document.createElement('button');
  baixo.id='seta-baixo';baixo.type='button';baixo.innerHTML='▾';
  baixo.setAttribute('aria-label','descer');
  pai.appendChild(cima);pai.appendChild(baixo);
  _setas={cima,baixo};

  const rolar=(dir)=>{
    const passo=Math.max(90,T.clientHeight*.72);
    T.scrollTop+=dir*passo;
    if(dir>0&&T.scrollTop+T.clientHeight>=T.scrollHeight-60)_naoVisto=false;
    setTimeout(atualizarSetas,60);
  };
  [[cima,-1],[baixo,1]].forEach(([b,d])=>{
    b.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();rolar(d);});
    b.addEventListener('click',e=>{e.stopPropagation();});
  });
  T.addEventListener('scroll',atualizarSetas,{passive:true});
  atualizarSetas();
}

function atualizarSetas(){
  if(!_setas)return;
  const temCima=T.scrollTop>12;
  const temBaixo=T.scrollTop+T.clientHeight<T.scrollHeight-12;
  _setas.cima.classList.toggle('vis',temCima);
  _setas.baixo.classList.toggle('vis',temBaixo);
  /* se entrou texto que você ainda não viu, a seta chama atenção */
  _setas.baixo.classList.toggle('novo',temBaixo&&_naoVisto);
}
let _naoVisto=false;
/* toda linha nova rola sozinha pro fim, a não ser que você
   esteja lendo o que passou — aí só avisa */
function seguirTexto(){
  if(!T)return;
  const noFim=T.scrollTop+T.clientHeight>=T.scrollHeight-60;
  if(noFim){T.scrollTop=T.scrollHeight;_naoVisto=false;}
  else _naoVisto=true;
  atualizarSetas();
}

/* toda vez que entra texto novo, reavalia */
const _dizBase=diz;
diz=function(t,cls){
  const p=_dizBase(t,cls);
  setTimeout(seguirTexto,20);
  return p;
};
const _capBase=cap;
cap=function(t){const r=_capBase(t);setTimeout(seguirTexto,20);return r;};
const _fichaBase=typeof ficha==='function'?ficha:null;
if(_fichaBase)ficha=function(a,b2,c){const r=_fichaBase(a,b2,c);setTimeout(seguirTexto,20);return r;};

function dicaRolagem(){
  if(S.viuHist)return;
  S.viuHist=true;
  diz('Perdeu alguma coisa? Arraste o texto pra cima, ou use a setinha ▴ do canto. Nada do que foi dito some.','fraco');
}
</script>
<script>
/* ================= A BARRA RECOLHÍVEL =================
   Você pediu um X pra fechar e ganhar tela. Fechada, ela vira
   uma aba fina que mostra QUANTAS ações estão esperando —
   assim você nunca fecha e esquece que tinha o que fazer. */

let _barraFechada=false,_barraPronta=false;

function montarBarra(){
  if(_barraPronta)return;
  _barraPronta=true;
  const AC2=$('#acoes');
  if(!AC2)return;

  /* cabeçalho da barra: quantas ações + o X */
  const topo=document.createElement('div');
  topo.id='barra-topo';
  topo.innerHTML='<span id="barra-cont"></span><button id="barra-x" type="button">✕</button>';
  AC2.parentNode.insertBefore(topo,AC2);

  /* aba pra reabrir quando estiver fechada */
  const aba=document.createElement('button');
  aba.id='barra-aba';aba.type='button';
  aba.innerHTML='<span id="aba-txt">ações</span>';
  AC2.parentNode.appendChild(aba);

  $('#barra-x').onclick=e=>{e.stopPropagation();fecharBarra();};
  aba.onclick=e=>{e.stopPropagation();abrirBarra();};
  [topo,aba].forEach(el=>el.addEventListener('pointerdown',e=>e.stopPropagation()));

  try{if(localStorage.getItem('naoabra_barra')==='0')fecharBarra();}catch(e){}
  atualizarBarra();
}

function contarAcoes(){
  const AC2=$('#acoes');
  if(!AC2)return 0;
  return [...AC2.children].filter(b=>b.tagName==='BUTTON').length;
}
function atualizarBarra(){
  const c=$('#barra-cont');
  if(!c||!c.textContent&&c.textContent!=='')return;
  const n=contarAcoes();
  c.textContent=n?(n===1?'1 coisa pra fazer':n+' coisas pra fazer'):'nada agora';
  const aba=$('#aba-txt');
  if(aba)aba.textContent=n?(n===1?'1 ação':n+' ações'):'ações';
  const a=$('#barra-aba');
  if(a&&a.classList&&a.classList.toggle)a.classList.toggle('tem',n>0&&_barraFechada);
}
function fecharBarra(){
  _barraFechada=true;
  if(document.body&&document.body.classList&&document.body.classList.add)
    document.body.classList.add('barra-off');
  try{localStorage.setItem('naoabra_barra','0')}catch(e){}
  atualizarBarra();
  setTimeout(()=>{dimensionar();atualizarSetas&&atualizarSetas();},60);
}
function abrirBarra(){
  _barraFechada=false;
  if(document.body&&document.body.classList&&document.body.classList.remove)
    document.body.classList.remove('barra-off');
  try{localStorage.setItem('naoabra_barra','1')}catch(e){}
  atualizarBarra();
  setTimeout(()=>{dimensionar();atualizarSetas&&atualizarSetas();},60);
}

/* toda vez que as ações mudam, o contador acompanha */
const _botaoBarra=botao;
botao=function(txt,fn,op){
  const b=_botaoBarra(txt,fn,op);
  setTimeout(atualizarBarra,10);
  /* se chegou ação nova com a barra fechada, a aba avisa */
  if(_barraFechada){
    const a=$('#barra-aba');
    if(a&&a.classList&&a.classList.add){
      a.classList.add('novo');
      setTimeout(()=>a.classList.remove('novo'),900);
    }
  }
  return b;
};

/* com a barra fechada sobra tela pro canvas */
const _dimBase=dimensionar;
dimensionar=function(){
  _dimBase();
  if(!_barraFechada)return;
  const l=CV.clientWidth||window.innerWidth;
  const ehCasa=cena&&['casa','fim','olho','rua','escuta','mapa','mochila','casafora'].includes(cena.modo);
  const alt=Math.round(trava(window.innerHeight*(ehCasa?.56:.44),140,l*1.25));
  CV.width=Math.round(l*DPR);CV.height=Math.round(alt*DPR);
  CV.style.height=alt+'px';
  CX.setTransform(DPR,0,0,DPR,0,0);
};
