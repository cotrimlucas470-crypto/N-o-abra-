<script>
/* ================= OS ROSTOS GANHAM VIDA =================
   Antes: canvas pintado uma vez e congelado. Agora respira,
   pisca e às vezes olha pro lado. Um relógio só pra todos,
   e quem sai da tela para de desenhar. */

const ROSTOS_VIVOS=[];
let _relogioRostos=null;

function animarRosto(c,x,tam,p,estado){
  const h=hashNome(p.n+p.id);
  const r={c,x,tam,p,estado,h,
    fase:semente(h,71)*7,          // cada um respira no seu tempo
    piscaEm:1+semente(h,72)*4,
    piscando:0,
    olha:0,olhaEm:2+semente(h,73)*6,
    ultimo:0};
  ROSTOS_VIVOS.push(r);
  if(ROSTOS_VIVOS.length>26)ROSTOS_VIVOS.shift();   // não acumula
  ligarRelogioRostos();
  return r;
}
function ligarRelogioRostos(){
  if(_relogioRostos)return;
  const passo=()=>{
    _relogioRostos=requestAnimationFrame(passo);
    if(document.visibilityState==='hidden')return;
    const t=performance.now()/1000;
    for(let i=ROSTOS_VIVOS.length-1;i>=0;i--){
      const r=ROSTOS_VIVOS[i];
      /* fora da tela ou removido do documento: para de gastar */
      if(!r.c.isConnected){ROSTOS_VIVOS.splice(i,1);continue;}
      if(t-r.ultimo<1/14)continue;      // 14 quadros por segundo basta
      r.ultimo=t;
      const rect=r.c.getBoundingClientRect?r.c.getBoundingClientRect():null;
      if(rect&&(rect.bottom<-40||rect.top>window.innerHeight+40))continue;
      tickRosto(r,t);
    }
    if(!ROSTOS_VIVOS.length){cancelAnimationFrame(_relogioRostos);_relogioRostos=null;}
  };
  _relogioRostos=requestAnimationFrame(passo);
}
function tickRosto(r,t){
  const dt=1/14;
  /* piscar */
  r.piscaEm-=dt;
  if(r.piscaEm<=0&&r.estado!=='morto'){
    r.piscando=.14;
    r.piscaEm=2+Math.random()*5;
    if(r.p.doente>0||r.estado==='quebrado')r.piscaEm*=.45;  // doente pisca mais
  }
  if(r.piscando>0)r.piscando-=dt;
  /* olhar pro lado */
  r.olhaEm-=dt;
  if(r.olhaEm<=0){
    r.olha=(Math.random()-.5)*2;
    r.olhaEm=3+Math.random()*7;
    setTimeout(()=>{r.olha=0;},600+Math.random()*900);
  }
  /* respiração */
  const resp=Math.sin(t*(r.p.doente>0?2.4:1.15)+r.fase);
  pintarRosto(r.x,r.tam,r.p,r.estado,{
    resp:resp*(r.p.doente>0?1.5:1),
    pisca:Math.max(0,r.piscando/.14),
    olha:r.olha
  });
}

/* pintarRosto passa a aceitar o quadro da animação */
const _pintarBase=pintarRosto;
pintarRosto=function(x,tam,p,estado,anim){
  const a=anim||{resp:0,pisca:0,olha:0};
  const q=tam/100;
  x.save();
  /* o peito sobe e desce: a cabeça acompanha de leve */
  x.translate(0,a.resp*q*.9);
  _pintarBase(x,tam,p,estado);
  x.restore();
  /* pálpebra fechando por cima, no lugar dos olhos */
  if(a.pisca>0&&estado!=='morto'){
    const h=hashNome(p.n+p.id),s=i=>semente(h,i);
    const cx=tam*.5,larg=tam*(.30+s(4)*.06),alt=tam*(.36+s(5)*.06);
    const cy=tam*.46+a.resp*q*.9;
    const oy=cy-alt*.06,sep=larg*(.19+s(7)*.05),oa=alt*.045+q*.5;
    const pele=PELE[Math.floor(s(1)*PELE.length)];
    [-1,1].forEach(d=>{
      x.fillStyle=pele;
      x.beginPath();
      x.ellipse(cx+d*sep,oy-oa*(1-a.pisca),larg*.115,oa*1.15*a.pisca,0,0,7);
      x.fill();
    });
  }
  /* pupila desviando */
  if(a.olha&&estado!=='morto'&&estado!=='quebrado'){
    const h=hashNome(p.n+p.id),s=i=>semente(h,i);
    const cx=tam*.5,larg=tam*(.30+s(4)*.06),alt=tam*(.36+s(5)*.06);
    const cy=tam*.46+a.resp*q*.9;
    const oy=cy-alt*.06,sep=larg*(.19+s(7)*.05),oa=alt*.045+q*.5;
    const pele=PELE[Math.floor(s(1)*PELE.length)];
    [-1,1].forEach(d=>{
      x.fillStyle='#E6DFD2';
      x.beginPath();x.ellipse(cx+d*sep,oy,larg*.10,oa,0,0,7);x.fill();
      x.fillStyle='#15100F';
      x.beginPath();x.arc(cx+d*sep+a.olha*larg*.045,oy,oa*.62,0,7);x.fill();
    });
  }
};

/* elRosto passa a devolver rosto vivo */
const _elRostoBase=elRosto;
elRosto=function(p,tam,estado){
  const c=_elRostoBase(p,tam,estado);
  if(tam>=24&&estado!=='morto'){
    const x=c.getContext('2d');
    animarRosto(c,x,tam,p,estado);
  }
  return c;
};

/* ================= TEXTURA POR MATERIAL =================
   Antes era um grão só pra tudo. Agora cada superfície tem a
   sua, e o padrão é gerado uma vez e reaproveitado. */

/* a camada de acabamento passa a usar textura de material */
const _acabBase=acabamento;
acabamento=function(w,h,t){
  const m=cena.modo;
  if(m==='casa'&&cena.casa){
    const id=cena.casa.voce;
    const tipo=id===8?'terra':id===6?'reboco':id===3?'metal':'madeira';
    aplicarTextura(tipo,w,h,.55);
  }else if(m==='porta'){
    aplicarTextura('madeira',w,h,.7);
  }else if(m==='casafora'||m==='rua'){
    aplicarTextura('reboco',w,h,.35);
  }
  _acabBase(w,h,t);
  /* grão de filme por cima de tudo, deslocando a cada quadro */
  if(!['mochila','mapa'].includes(m))
    aplicarTextura('filme',w,h,.5,{x:Math.random()*64-32,y:Math.random()*64-32});
};

<script>
/* ================= DAR MEDO DE VERDADE =================
   O problema não era a anomalia. Era a apresentação: texto
   entrando igualzinho ao resto do jogo. Agora ela chega
   diferente — escurece, cala, e revela devagar. */

async function apresentarAnomalia(txt,forca){
  const f=forca||1;
  /* trava de segurança: se qualquer coisa falhar no meio, o
     escuro sai sozinho em vez de deixar a tela preta */
  clearTimeout(cena._escTimer);
  cena._escTimer=setTimeout(()=>{cena.escurecer=0;},9000);
  try{
  return await _apresentar(txt,f);
  }finally{
    cena.escurecer=0;
    clearTimeout(cena._escTimer);
    if(A.ctx)devolverAmbiente();
  }
}
async function _apresentar(txt,f){
  /* 1. o mundo cala */
  if(A.ctx){
    silencioSubito(1.2+f*.5);
    abaixarAmbiente(.08,2.6+f);
  }
  /* 2. a tela escurece por baixo do texto */
  cena.escurecer=1;
  await pausa(600+f*300);
  /* 3. um som que não é do jogo */
  if(A.ctx&&f>=2){
    const t=A.ctx.currentTime;
    const o=A.ctx.createOscillator(),g=A.ctx.createGain(),fl=A.ctx.createBiquadFilter();
    o.type='sine';
    o.frequency.setValueAtTime(38,t);
    o.frequency.exponentialRampToValueAtTime(19,t+2.4);
    fl.type='lowpass';fl.frequency.value=120;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(.13*f,t+.9);
    g.gain.linearRampToValueAtTime(0,t+2.8);
    o.connect(fl);fl.connect(g);saida(g,{pan:0,rev:.9});
    o.start(t);o.stop(t+2.9);
  }
  /* 4. o texto entra pedaço por pedaço */
  const partes=String(txt).split(/(?<=[.!?])\s+/).filter(Boolean);
  for(const p of partes){
    diz(p,'perigo');
    await pausa(700+f*200);
  }
  await pausa(400);
}

/* escurecimento desenhado por cima de qualquer cena */
const _acabAnom=acabamento;
acabamento=function(w,h,t){
  _acabAnom(w,h,t);
  if(cena.escurecer>0){
    cena.escurecer=Math.max(0,cena.escurecer-.0016);  /* some sozinho */
    const pul=.72+Math.sin(t*2.2)*.06;
    CX.fillStyle=`rgba(2,1,4,${.78*cena.escurecer*pul})`;
    CX.fillRect(0,0,w,h);
    /* respiração vermelha muito fraca nas bordas */
    const g=CX.createRadialGradient(w*.5,h*.5,h*.25,w*.5,h*.5,h);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(1,`rgba(80,14,10,${.22*cena.escurecer})`);
    CX.fillStyle=g;CX.fillRect(0,0,w,h);
  }
};

<script>
/* ================= NÃO PERDER PROGRESSO =================
   O jogo salvava em UM lugar só: o começo da noite. Fechar o
   app às 3 da tarde perdia o dia inteiro. */

let _saveTimer=null,_saveSujo=false;
function marcarSujo(){
  _saveSujo=true;
  if(_saveTimer)return;
  _saveTimer=setTimeout(()=>{
    _saveTimer=null;
    if(!_saveSujo)return;
    _saveSujo=false;
    try{salvar();}catch(e){}
  },1200);   // junta várias mudanças num save só
}
function salvarAgora(){
  if(_saveTimer){clearTimeout(_saveTimer);_saveTimer=null;}
  _saveSujo=false;
  try{salvar();return true;}catch(e){return false;}
}

/* toda ação que gasta tempo ou muda recurso marca pra salvar */
const _gastarBase=gastarHoras;
gastarHoras=function(h){const r=_gastarBase(h);marcarSujo();return r;};
const _ganhouBase=ganhou;
ganhou=function(o){const r=_ganhouBase(o);marcarSujo();return r;};
const _irParaBase=irPara;
irPara=function(id,semTexto){const r=_irParaBase(id,semTexto);marcarSujo();return r;};

/* e salva de verdade quando você sai do app */
addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden')salvarAgora();
});
addEventListener('pagehide',()=>salvarAgora());
addEventListener('blur',()=>{if(_saveSujo)salvarAgora();});

/* ================= IR DIRETO PRA ONDE VOCÊ QUER =================
   Andar de cômodo em cômodo custava clique à toa. */
function menuIr(de){
  AC.innerHTML='';limpar();cap('Pra onde');
  diz('Andar pela casa não custa hora. Só o tempo de chegar.','fraco');
  PLANTA.forEach(c=>{
    if(c.id===de)return;
    const d=distancia(de,c.id);
    const av=avariasNo(c.id).length;
    const gente=S.abrigo.filter(p=>p.local===c.id).length;
    const marca=[];
    if(av)marca.push(av+(av>1?' quebrados':' quebrado'));
    if(gente)marca.push(gente+(gente>1?' pessoas':' pessoa'));
    if(c.id===8&&canteiros().some(prontoPra))marca.push('colheita pronta');
    botao(c.nome,()=>{irPara(c.id);},
      {custo:marca.length?marca.join(' · '):(d>2?'do outro lado':'')});
  });
  botao('Ficar aqui',()=>menuComodo(de),{cls:'chave'});
}

/* ================= O ESTADO DA CASA NUM LUGAR SÓ =================
   Antes você tinha que abrir cinco telas pra saber como estava. */
function telaEstado(volta){
  AC.innerHTML='';limpar();cap('Como está tudo');

  /* recursos com leitura em dias, não em número solto */
  const bocas=S.abrigo.length+1;
  const diasC=S.comida>0?Math.floor(S.comida/Math.max(1,Math.ceil(bocas*.7))):0;
  const diasD=S.gerQuebrado?0:Math.floor(S.diesel/8);
  diz(`Comida: ${S.comida} — dá pra ${diasC} ${diasC===1?'dia':'dias'} com ${bocas} ${bocas===1?'boca':'bocas'}.`,
    diasC<=1?'perigo':diasC<=3?'alerta':'sist');
  diz(`Diesel: ${Math.round(S.diesel)} — ${S.gerQuebrado?'o gerador está QUEBRADO':diasD+' noite'+(diasD===1?'':'s')+' de gerador'}.`,
    S.gerQuebrado?'perigo':diasD<=1?'alerta':'sist');
  diz(`Água: ${S.agua} · Remédio: ${S.remedio}`,S.remedio?'sist':'fraco');
  diz(`Ruído: ${Math.round(S.ruido)} de 100 — ${S.ruido>70?'está te entregando':S.ruido>40?'dá pra ouvir daqui':'baixo'}.`,
    S.ruido>70?'perigo':S.ruido>40?'alerta':'bom');

  /* as pessoas */
  if(S.abrigo.length){
    diz('─── quem está aqui ───','fraco');
    S.abrigo.forEach(p=>{
      const est=[];
      if(p.doente>0)est.push('DOENTE ('+p.doente+'d)');
      est.push(p.moral>=65?'firme':p.moral>=35?'abalado':'no limite');
      if(p.armado)est.push('armado');
      const o=(S.objetivos||[]).find(x=>x.dono===p.n&&!x.feito);
      if(o)est.push('quer '+o.n);
      fichaRosto(p,p.hab,est.join(' · '),'vivo');
    });
  }else diz('Você está sozinho nessa casa.','perigo');

  /* o que está quebrado */
  const av=avarias();
  if(av.length){
    diz('─── quebrado ───','fraco');
    av.forEach(a=>{
      const e=AVARIAS[a.id],f=faltaPra(a);
      diz(`${e.n} (${PLANTA[e.onde].nome.toLowerCase()})${a.grave?' — PIORANDO':''}${f.length?' — falta '+f.join(', '):' — dá pra resolver'}`,
        a.grave?'perigo':'alerta');
    });
  }else diz('Nada quebrado na casa.','bom');

  /* defesa */
  const arma=melhorArma();
  diz('─── defesa ───','fraco');
  diz(`Porta: reforço ${S.porta.reforco}${S.porta.tranca?' · com tranca':' · SEM TRANCA'}${S.porta.dano>30?' · muito danificada':''}`,
    S.porta.tranca?'sist':'alerta');
  diz(`Muro: ${estadoMuro()} — vale ${forcaMuro().toFixed(1)}`,forcaMuro()>=3?'sist':'fraco');
  diz(arma?`Arma: ${arma.n}${arma.municao?' ('+(S.cartucho||0)+' cartuchos)':''}`:'Sem arma.',arma?'sist':'perigo');
  if(pesoFerido())diz(`Você está machucado — ${Math.round(pesoFerido()*100)}% pior em tudo.`,'perigo');

  const ec=estadoCredito();
  diz(`A casa: ${ec.n} (${Math.round(credito())}/100).`,ec.cls);
  if(moradoras().length)
    diz(`${moradoras().length} ${moradoras().length===1?'coisa':'coisas'} crescendo dentro de casa.`,'perigo');
  /* o mundo */
  diz('─── lá fora ───','fraco');
  diz(`${cidadeInfo().n} · ${CLIMAS[S.clima||'limpo'].n} · ${estagioDe(cidadeAtual()).n}`,'sist');
  const am=ameacasVivas().filter(a=>a.cid===cidadeAtual());
  if(am.length)diz(`${am.length} ${am.length===1?'ameaça solta':'ameaças soltas'} por aí: ${am.map(a=>AMEACAS[a.id].n).join(', ')}.`,'perigo');
  const vivas=(S.casas||[]).filter(c=>c.viva).length;
  diz(`${vivas} ${vivas===1?'casa ainda transmite':'casas ainda transmitem'} no rádio.`,vivas?'sist':'perigo');

  botao('Voltar',volta,{cls:'chave'});
}

/* ================= NÃO FAZER BESTEIRA SEM QUERER =================
   Ação sem volta pede confirmação. */
function confirmar(txt,aviso,fn,volta){
  AC.innerHTML='';limpar();cap('Tem certeza?');
  diz(txt,'perigo');
  if(aviso)diz(aviso,'alerta');
  botao('Sim, eu quero',()=>fn(),{cls:'prim'});
  botao('Não',volta,{cls:'chave'});
}

/* ================= CONFORTO ================= */
function telaAjustes(volta){
  AC.innerHTML='';limpar();cap('Ajustes');
  const cfg=S.cfg||(S.cfg={fonte:1,velo:1,tela:false});

  diz(`Tamanho da letra: ${['pequena','normal','grande','bem grande'][cfg.fonte]}`,'sist');
  botao('Letra menor',()=>{cfg.fonte=Math.max(0,cfg.fonte-1);aplicarCfg();telaAjustes(volta);},
    {falta:cfg.fonte<=0?'já está no menor':''});
  botao('Letra maior',()=>{cfg.fonte=Math.min(3,cfg.fonte+1);aplicarCfg();telaAjustes(volta);},
    {falta:cfg.fonte>=3?'já está no maior':''});

  diz(`Velocidade do texto: ${['devagar','normal','rápido','sem pausa'][cfg.velo]}`,'sist');
  botao('Mais devagar',()=>{cfg.velo=Math.max(0,cfg.velo-1);aplicarCfg();telaAjustes(volta);},
    {falta:cfg.velo<=0?'já está no mais devagar':''});
  botao('Mais rápido',()=>{cfg.velo=Math.min(3,cfg.velo+1);aplicarCfg();telaAjustes(volta);},
    {falta:cfg.velo>=3?'já está no mais rápido':''});

  botao(cfg.tela?'Sair da tela cheia':'Tela cheia',()=>{
    cfg.tela=!cfg.tela;telaCheia(cfg.tela);telaAjustes(volta);
  },{custo:'aproveita a tela toda'});

  botao('Salvar agora',()=>{
    diz(salvarAgora()?'Salvo.':'Não deu pra salvar nesse aparelho.',
      'bom');
  },{custo:'o jogo já salva sozinho'});

  botao('Voltar',volta,{cls:'chave'});
}
function aplicarCfg(){
  const cfg=S.cfg||{fonte:1,velo:1};
  const tam=[15,16.5,18.5,21][cfg.fonte]||16.5;
  document.documentElement.style.setProperty('--txt',tam+'px');
  const T2=$('#texto');
  if(T2)T2.style.fontSize=tam+'px';
  marcarSujo();
}
function telaCheia(quer){
  try{
    if(quer&&document.documentElement.requestFullscreen)
      document.documentElement.requestFullscreen();
    else if(!quer&&document.exitFullscreen&&document.fullscreenElement)
      document.exitFullscreen();
  }catch(e){}
}
/* a velocidade do texto mexe nas pausas do jogo inteiro */
const _pausaBase=pausa;
pausa=function(ms){
  const v=(S.cfg&&S.cfg.velo)!=null?S.cfg.velo:1;
  const f=[1.4,1,.6,.15][v];
  return _pausaBase(Math.round(ms*f));
};

<script>
/* ================= O MUNDO ESVAZIA =================
   Você pediu bem menos sobrevivente com o tempo. Não é só
   "aparecer menos gente": é o mundo tendo menos gente. */

function escassez(){
  /* 0 no começo, 1 quando quase não sobrou ninguém */
  const d=S.dia;
  return trava((d-3)/26+(S.mortos.length*.035)+((S.casas||[]).filter(c=>!c.viva).length*.05),0,.92);
}

/* quem ainda bate na porta */
function chanceVisitaGente(){
  return trava(.55*(1-escassez()*.85),.06,.55);
}
/* quem aceita entrar / quantos ainda existem pra achar */
function poolVivo(){
  const e=escassez();
  const max=Math.max(1,Math.round(S.pool.length*(1-e*.7)));
  return S.pool.slice(0,max);
}

/* as casas do rádio caem mais rápido no fim */
function ritmoQueda(){
  return Math.max(2,Math.round(3-escassez()*1.6));
}

/* a cada dia o mundo perde gente sozinho */
function mundoPerdeGente(){
  const r=[];
  const e=escassez();
  /* alguém do pool morre lá fora sem você ver */
  if(S.pool.length>3&&chance(.12+e*.28)){
    const p=S.pool.splice(Math.floor(Math.random()*S.pool.length),1)[0];
    if(p){
      S.mortosFora=(S.mortosFora||0)+1;
      registrarVoz(p,`morreu em algum lugar da cidade no dia ${S.dia}, sem você saber`);
      if(chance(.35))r.push(`O rádio confirma: ${p.n} não está mais viva. Você nunca chegou a conhecer.`);
    }
  }
  /* e às vezes um grupo inteiro some */
  if(S.dia>=8&&S.pool.length>4&&chance(.06+e*.14)){
    const n=Math.min(S.pool.length-2,2+Math.floor(Math.random()*2));
    for(let i=0;i<n;i++){
      const p=S.pool.splice(Math.floor(Math.random()*S.pool.length),1)[0];
      if(p)registrarVoz(p,`sumiu junto com um grupo inteiro no dia ${S.dia}`);
    }
    S.mortosFora=(S.mortosFora||0)+n;
    r.push(`Um grupo de ${n} sumiu de uma vez. Ninguém viu como.`);
  }
  return r;
}

function textoEscassez(){
  const e=escassez();
  if(e<.2)return null;
  if(e<.4)return 'Faz uns dias que você não vê gente nova na rua.';
  if(e<.6)return 'A cidade está mais vazia do que estava. Muito mais.';
  if(e<.8)return 'Você não vê uma pessoa viva há dias. Nem de longe, nem correndo.';
  return 'Se ainda tem gente nessa cidade, ela não sai de casa e não fala no rádio.';
}

/* ================= E FICA MAIS DIFÍCIL =================
   Menos gente lá fora quer dizer mais coisa que não é gente. */
function pressao(){
  return 1+escassez()*1.1+Math.max(0,S.dia-6)*.05;
}
</script>

const CRIATURAS_NOVAS={
 casca:{n:'a Casca',fam:'falsa',forca:3,vel:1,noite:3,

/* ---------- as silhuetas novas ---------- */
const _desBase=desSilhueta;
desSilhueta=function(cx,cy,h,tipo,t,cor){
  const c=cor||'#0A0810';
  if(tipo==='casca'){
    CX.fillStyle=c;
    /* corpo humano, mas com a "pele" folgada */
    CX.beginPath();CX.arc(cx,cy-h*.40,h*.085,0,7);CX.fill();
    CX.beginPath();
    CX.moveTo(cx-h*.10,cy-h*.32);
    CX.bezierCurveTo(cx-h*.19,cy-h*.16+Math.sin(t*1.1)*h*.012,cx-h*.13,cy+h*.02,cx-h*.08,cy+h*.06);
    CX.lineTo(cx+h*.08,cy+h*.06);
    CX.bezierCurveTo(cx+h*.13,cy+h*.02,cx+h*.19,cy-h*.16-Math.sin(t*1.1)*h*.012,cx+h*.10,cy-h*.32);
    CX.closePath();CX.fill();
    CX.fillRect(cx-h*.06,cy+h*.06,h*.05,h*.30);
    CX.fillRect(cx+h*.01,cy+h*.06,h*.05,h*.30);
    /* a costura */
    CX.strokeStyle='rgba(120,60,40,.5)';CX.lineWidth=Math.max(1,h*.008);
    CX.setLineDash([h*.02,h*.02]);
    CX.beginPath();CX.moveTo(cx,cy-h*.31);CX.lineTo(cx,cy+h*.05);CX.stroke();
    CX.setLineDash([]);
  }else if(tipo==='pequena'){
    const s=.62;
    CX.fillStyle=c;
    CX.beginPath();CX.arc(cx,cy-h*.40*s+h*.16,h*.09,0,7);CX.fill();
    CX.fillRect(cx-h*.07,cy-h*.30*s+h*.16,h*.14,h*.24);
    /* braços até o chão */
    CX.lineWidth=h*.026;CX.strokeStyle=c;
    [-1,1].forEach(d=>{
      CX.beginPath();
      CX.moveTo(cx+d*h*.06,cy-h*.26*s+h*.16);
      CX.lineTo(cx+d*h*.11,cy+h*.30);CX.stroke();
    });
    CX.fillRect(cx-h*.05,cy+h*.10,h*.04,h*.22);
    CX.fillRect(cx+h*.01,cy+h*.10,h*.04,h*.22);
  }else if(tipo==='dobra'){
    CX.strokeStyle=c;CX.lineWidth=h*.030;CX.lineCap='round';
    CX.beginPath();CX.arc(cx,cy-h*.30,h*.055,0,7);CX.fill();
    /* membros com três dobras */
    [[-1,.9],[1,1],[-1,1.1],[1,.85]].forEach(([d,esc],i)=>{
      const f=Math.sin(t*1.3+i*1.7)*h*.03;
      CX.beginPath();
      CX.moveTo(cx,cy-h*.24);
      CX.lineTo(cx+d*h*.13*esc,cy-h*.10+f);
      CX.lineTo(cx+d*h*.05*esc,cy+h*.08-f);
      CX.lineTo(cx+d*h*.17*esc,cy+h*.24+f);
      CX.lineTo(cx+d*h*.09*esc,cy+h*.40);
      CX.stroke();
    });
    CX.lineCap='butt';
  }else if(tipo==='raiz'){
    CX.strokeStyle=c;CX.lineWidth=h*.022;
    const bal=Math.sin(t*.7)*h*.02;
    CX.beginPath();
    CX.moveTo(cx,cy+h*.44);
    CX.bezierCurveTo(cx+bal,cy+h*.16,cx-bal,cy-h*.10,cx+bal*1.5,cy-h*.34);
    CX.stroke();
    /* "folhas" que são outra coisa */
    for(let i=0;i<6;i++){
      const y=cy+h*.36-i*h*.13;
      const d=i%2?1:-1;
      CX.beginPath();
      CX.moveTo(cx+bal*(i/5),y);
      CX.quadraticCurveTo(cx+d*h*.11,y-h*.05,cx+d*h*.16,y+h*.03);
      CX.stroke();
    }
    CX.fillStyle=c;
    CX.beginPath();CX.ellipse(cx+bal*1.5,cy-h*.36,h*.045,h*.065,0,0,7);CX.fill();
  }else if(tipo==='fome'){
    const g=1+(S.dia>=8?.3:0)+((S.vistos&&S.vistos.fome||0)*.10);
    CX.fillStyle=c;
    CX.beginPath();
    CX.ellipse(cx,cy+h*.04,h*.24*g,h*.34*g+Math.sin(t*1.4)*h*.02,0,0,7);CX.fill();
    CX.beginPath();CX.arc(cx,cy-h*.30*g,h*.10,0,7);CX.fill();
    /* boca aberta, sempre */
    CX.fillStyle='#000';
    CX.beginPath();
    CX.ellipse(cx,cy-h*.27*g,h*.045,h*.055+Math.abs(Math.sin(t*3))*h*.02,0,0,7);CX.fill();
    CX.fillStyle=c;
    CX.fillRect(cx-h*.28*g,cy+h*.06,h*.08,h*.26);
    CX.fillRect(cx+h*.20*g,cy+h*.06,h*.08,h*.26);
  }else if(tipo==='coro'){
    const n=5+((S.vozesRoubadas||[]).length>4?1:0);
    for(let i=0;i<n;i++){
      const dx=(i-(n-1)/2)*h*.20;
      const esc=.72+((i*37)%23)/60;
      const hh=h*esc;
      CX.fillStyle=c;
      CX.globalAlpha=.55+i*.08;
      CX.beginPath();CX.arc(cx+dx,cy-hh*.36,hh*.062,0,7);CX.fill();
      CX.fillRect(cx+dx-hh*.075,cy-hh*.30,hh*.15,hh*.32);
      CX.fillRect(cx+dx-hh*.06,cy+h*.02,hh*.045,hh*.26);
      CX.fillRect(cx+dx+hh*.015,cy+h*.02,hh*.045,hh*.26);
    }
    CX.globalAlpha=1;
  }else return _desBase(cx,cy,h,tipo,t,cor);
};

 janela:{n:'a janela do quarto',onde:1,

   base:()=>9+(S.grade?10:0)+(avariaEm('aberta')?-5:avariaEm('janela')?-3:3),
   cede:'O vidro vai ao chão inteiro, de uma vez só.',
   som:()=>estalo(-.4)},
 telhado:{n:'o telhado',onde:0,
   d:'Telha solta é convite pra quem sobe.',
   base:()=>11+(avariaEm('goteira')?-6:avariaEm('telhado')?-3:4)+(temMat('telha',2)?3:0),
   cede:'Entra claridade no sótão onde não tinha claridade.',
   som:()=>{passo(.3,0);setTimeout(()=>estalo(.2),450);}},
 porao:{n:'o chão do porão',onde:6,
   d:'Terra batida e uma parede que já foi melhor.',
   base:()=>11+(avariaEm('rachadura')?-6:avariaEm('infiltra')?-3:4)+(temMat('cimento',2)?3:0),
   cede:'O chão do porão levanta num canto e não abaixa mais.',
   som:()=>rugido(.25,0)}
};

/* qual via cada criatura procura */
function viaDe(id){
  const c=CRIATURAS[id];if(!c)return 'porta';
  if(c.quebra==='chao')return 'porao';
  if(c.silhueta==='rastejante')return chance(.6)?'porao':'muro';
  if(c.silhueta==='dobra')return chance(.6)?'janela':'telhado';
  if(c.fam==='falsa')return 'porta';
  if(c.silhueta==='pequena')return chance(.5)?'janela':'porta';
  if(c.silhueta==='raiz')return 'muro';
  if(c.forca>=5)return chance(.5)?'porta':'porao';
  return sortear(['muro','janela','porta','telhado']);
}

function cerco(){
  return S.cerco||(S.cerco={ativo:false,onda:0,vias:{},dentro:[],barricou:{},avisos:[]});
}
function iniciarCerco(){
  const C=cerco();
  C.ativo=true;C.onda=0;C.dentro=[];C.barricou={};
  C.vias={};
  Object.keys(VIAS).forEach(k=>{
    C.vias[k]={hp:Math.max(2,Math.round(VIAS[k].base())),max:Math.max(2,Math.round(VIAS[k].base())),
      atacando:null,dano:0};
  });
  return C;
}
function hpVia(k){const C=cerco();return C.vias[k]?C.vias[k].hp:0;}
function barraVia(k){
  const C=cerco(),v=C.vias[k];
  if(!v)return '';
  const n=Math.round(trava(v.hp/Math.max(1,v.max),0,1)*5);
  return '█'.repeat(n)+'░'.repeat(5-n);
}

/* ---------- as ações que você tem ---------- */
function acoesCerco(C,res){
  AC.innerHTML='';
  const atacadas=Object.keys(C.vias).filter(k=>C.vias[k].atacando);

  atacadas.forEach(k=>{
    const v=C.vias[k];
    const mat=k==='muro'?'cimento':'tabua';
    const temMaterial=temMat(mat,1);
    botao(`Escorar ${VIAS[k].n}`,()=>{
      AC.innerHTML='';
      if(!temMaterial){
        diz(`Você empurra o que tem contra ${VIAS[k].n} com o corpo. Segura um pouco.`,'narr');
        v.hp+=2;
      }else{
        gastarMat(mat,1);
        v.hp+=5+(temFerra('martelo')?3:0);
        diz(`Você prega o que dá em cima de ${VIAS[k].n}. Aguenta mais.`,'bom');
      }
      res();
    },{custo:temMaterial?('+'+(5+(temFerra('martelo')?3:0))+' · gasta 1 '+MATE[mat].n):'+2 · sem material'});
  });

  /* isca: joga comida longe pra tirar elas de cima */
  if(S.comida>0)botao('Jogar comida longe do muro',()=>{
    AC.innerHTML='';
    S.comida--;ganhou({comida:-1});
    const alvo=sortear(atacadas.length?atacadas:Object.keys(C.vias));
    if(chance(.62)){
      C.vias[alvo].atacando=null;
      diz(`Você joga por cima do muro. O que estava em ${VIAS[alvo].n} vai atrás.`,'bom');
    }else diz('Elas nem olham. Não é isso que elas querem.','perigo');
    res();
  },{custo:'1 comida · 62%'});

  /* barulho em outro canto */
  botao('Fazer barulho do outro lado da casa',()=>{
    AC.innerHTML='';
    S.ruido=trava(S.ruido+12,0,100);
    const alvo=sortear(atacadas.length?atacadas:Object.keys(C.vias));
    if(chance(.5)){
      C.vias[alvo].atacando=null;
      diz(`Elas mudam de lado. ${VIAS[alvo].n} fica em paz por enquanto.`,'bom');
    }else diz('Elas não se importam com barulho. Elas vieram por causa do silêncio.','perigo');
    res();
  },{custo:'+12 ruído · 50%'});

  /* mandar alguém segurar */
  const uteis=S.abrigo.filter(p=>p.doente<=0);
  if(uteis.length&&atacadas.length)botao('Mandar alguém segurar uma entrada',()=>{
    AC.innerHTML='';
    const p=sortear(uteis),k=sortear(atacadas);
    C.vias[k].hp+=4;
    p.segurando=k;
    diz(`${p.n} vai pra ${VIAS[k].n} e fica lá.`,'sist');
    if(chance(.30)){
      diz(`${p.n} não vai aguentar sozinho se aquilo entrar.`,'alerta');
    }
    res();
  },{custo:'+4 na entrada · arrisca a pessoa'});

  /* tentar o gerador de novo */
  if(S.gerQuebrado||S.diesel<=0)botao('Tentar fazer o gerador voltar',()=>{
    AC.innerHTML='';
    const p=trava(.18+(temFerra('inglesa')?.2:0)+(tem('mecânica')?.25:0)
      +(S.temPeca?.25:0)+(S.diesel>3?.15:-.3),.05,.9);
    if(chance(p)){
      S.gerQuebrado=false;
      if(S.diesel<=0){S.diesel=6;ganhou({diesel:6});}
      S.gerSaude=Math.max(20,S.gerSaude);
      diz('O motor pega. O ronco volta e a rua inteira volta a ser confusa pra elas.','bom');
      C.acabou=true;
    }else diz('Não pega. Você tenta três vezes e as mãos tremem.','perigo');
    res();
  },{custo:Math.round(trava(.18+(temFerra('inglesa')?.2:0)+(tem('mecânica')?.25:0)
      +(S.temPeca?.25:0)+(S.diesel>3?.15:-.3),.05,.9)*100)+'% · acaba o cerco'});

  /* enfrentar o que já entrou */
  if(C.dentro.length){
    const arma=melhorArma();
    botao(`Enfrentar ${CRIATURAS[C.dentro[0].id].n}`,()=>{
      AC.innerHTML='';
      const cr=C.dentro[0];
      const CC=CRIATURAS[cr.id];
      const p=trava(.10+(arma?arma.dano*.08:0)+(S.abrigo.length*.04)
        -CC.forca*.05-pesoFerido(),.03,.75);
      if(arma&&arma.municao&&!usarMunicao(arma)){
        diz('Vazio.','perigo');
      }else if(chance(p)){
        C.dentro.shift();
        diz(`${CC.n} cai no corredor e não levanta.`,'bom');
        S.vistos=S.vistos||{};S.vistos[cr.id]=(S.vistos[cr.id]||0)+2;
      }else{
        diz(`Você acerta e ${CC.n} nem registra.`,'perigo');
        const fc=ferirPor('bicho');
        if(fc)diz(`Você ficou com ${fc.n}.`,'perigo');
        S.ferido=(S.ferido||0)+2;
        if(S.abrigo.length&&chance(.4)){
          const v=sortear(S.abrigo);
          morreuAlguem(v,`ficou entre você e ${CC.n} na noite ${S.dia}`);
          diz(`${v.n} entrou no meio.`,'perigo');
        }
      }
      res();
    },{cls:'prim',custo:Math.round(trava(.10+(arma?arma.dano*.08:0)+(S.abrigo.length*.04)
      -CRIATURAS[C.dentro[0].id].forca*.05-pesoFerido(),.03,.75)*100)+'%'});

    botao('Levar todo mundo pro sótão e trancar',()=>{
      AC.innerHTML='';
      C.escondido=true;
      diz('Vocês sobem e travam o alçapão com o que tem. A casa passa a ser delas.','perigo');
      res();
    },{custo:'perde a casa · salva gente'});
  }

  botao('Não fazer nada e esperar',()=>{AC.innerHTML='';diz('Você fica parado ouvindo.','fraco');res();});
}

/* ---------- uma onda ---------- */
async function ondaCerco(C){
  C.onda++;
  const hora=(21+C.onda)%24;
  S.hora=hora;
  limpar();cap(`${String(hora).padStart(2,'0')}:00 — no escuro`);

  /* quantas vêm */
  /* no máximo 2 frentes por vez: 5 ao mesmo tempo era impossível
     de defender com uma ação por onda */
  const n=trava(1+Math.floor(C.onda/3)+(escassez()>.5?1:0),1,3);
  const vindo=[];
  const livres=Object.keys(C.vias).filter(k=>C.vias[k].hp>0);
  for(let i=0;i<n&&livres.length;i++){
    const id=sortearCriatura();
    let via=viaDe(id);
    if(!livres.includes(via))via=sortear(livres);
    livres.splice(livres.indexOf(via),1);
    vindo.push({id,via});
    C.vias[via].atacando=id;
  }
  await pausa(700);

  /* elas chegam */
  for(const x of vindo){
    const c=CRIATURAS[x.id];
    if(VIAS[x.via].som)VIAS[x.via].som();
    somCerco(x.via);
    diz(`${c.como} — em ${VIAS[x.via].n}.`,'perigo');
    await pausa(900);
  }

  /* o estado das entradas */
  diz('─── o que está aguentando ───','fraco');
  Object.keys(C.vias).forEach(k=>{
    const v=C.vias[k];
    if(v.hp<=0)return;
    const at=v.atacando?' ← '+CRIATURAS[v.atacando].n:'';
    diz(`${VIAS[k].n.padEnd(22)} ${barraVia(k)}${at}`,v.atacando?'alerta':'sist');
  });
  if(C.dentro.length)
    diz(`DENTRO DE CASA: ${C.dentro.map(d=>CRIATURAS[d.id].n).join(', ')}`,'perigo');

  await new Promise(r=>acoesCerco(C,r));
  if(C.acabou)return 'gerador';

  /* elas batem */
  await pausa(800);
  for(const k of Object.keys(C.vias)){
    const v=C.vias[k];
    if(!v.atacando)continue;
    const c=CRIATURAS[v.atacando];
    const forca=c.forca*.92*(1+C.onda*.21)*difCerco();
    v.hp-=forca;
    if(v.hp<=0){
      diz('⚠ '+VIAS[k].cede,'perigo');
      await pausa(1200);
      C.dentro.push({id:v.atacando,onde:VIAS[k].onde});
      diz(`${c.n} está dentro da casa.`,'perigo');
      /* quem estava segurando aquela entrada paga */
      const seg=S.abrigo.find(p=>p.segurando===k);
      if(seg&&chance(.55)){
        morreuAlguem(seg,`estava segurando ${VIAS[k].n} quando cedeu, na noite ${S.dia}`);
        diz(`${seg.n} estava ali.`,'perigo');
      }
      v.hp=0;v.atacando=null;
      await pausa(1000);
    }
  }

  /* às vezes o que entrou pega o que veio buscar e vai embora */
  if(C.dentro.length&&chance(.22)){
    const saiu=C.dentro.shift();
    diz(`${CRIATURAS[saiu.id].n} sai por onde entrou, levando alguma coisa.`,'alerta');
    if(S.comida>1)S.comida-=2;
  }
  /* o que já está dentro caça */
  for(const d of C.dentro){
    if(C.escondido)continue;
    const c=CRIATURAS[d.id];
    await pausa(700);
    if(chance(.42)&&S.abrigo.length){
      const v=sortear(S.abrigo);
      if(chance(.55)){
        morreuAlguem(v,`foi pego por ${c.n} dentro de casa na noite ${S.dia}`);
        diz(`${c.n} pegou ${v.n} no corredor.`,'perigo');
      }else{
        v.doente=(v.doente||0)+2;
        diz(`${v.n} escapou por pouco de ${c.n} e não fala mais nada.`,'perigo');
        mexerMoral(-10);
      }
    }else if(chance(.3)){
      diz(`${c.n} anda pela casa. Você ouve de qual cômodo, e muda.`,'alerta');
      if(chance(.4)){S.comida=Math.max(0,S.comida-1);
        diz('Alguma coisa foi levada da despensa.','perigo');}
    }
  }
  return null;
}

/* ---------- a noite inteira ---------- */
async function noiteDeCerco(){
  marcarNoite({cerco:true});
  const C=iniciarCerco();
  limpar();AC.innerHTML='';cena.modo='casa';
  cena.casa={voce:4,monstro:null,visivel:false};
  dimensionar();

  silencioSubito(2.4);
  cap('O gerador parou');
  await pausa(1800);
  diz('O ronco some e sobra um silêncio que essa casa não tinha desde o primeiro dia.','perigo');
  await pausa(1600);
  diz('O gerador nunca foi luz. Era barulho. Era o barulho que fazia elas não saberem qual casa era qual.','sist');
  await pausa(2000);
  diz('Agora sabem.','perigo');
  await pausa(1500);
  ligarDrone();subirDrone(.85);

  diz('─── as entradas ───','fraco');
  Object.keys(VIAS).forEach(k=>{
    diz(`${VIAS[k].n} — ${barraVia(k)} — ${VIAS[k].d}`,hpVia(k)<=5?'perigo':'sist');
  });
  const fraca=Object.keys(C.vias).sort((a,b)=>C.vias[a].hp-C.vias[b].hp)[0];
  diz(`O ponto mais fraco é ${VIAS[fraca].n}.`,'alerta');
  await pausa(1400);

  let fim=null;
  while(C.onda<8&&!fim){
    const r=await ondaCerco(C);
    if(r==='gerador'){fim='gerador';break;}
    if(!S.abrigo.length&&C.dentro.length&&chance(.5)){fim='sozinho';break;}
    if(C.dentro.length>=4){fim='tomada';break;}
    await pausa(600);
  }
  desligarDrone();

  C.ativo=false;
  limpar();AC.innerHTML='';
  if(fim==='gerador'){
    cap('O motor voltou');
    diz('O ronco enche a casa de novo. Lá fora elas param onde estão, e depois vão embora sem pressa.','bom');
    if(C.dentro.length){
      diz(`${C.dentro.map(d=>CRIATURAS[d.id].n).join(' e ')} ainda está aqui dentro. O barulho não resolve isso.`,'perigo');
      S.dentroCasa=C.dentro.map(d=>({...d,onde:PLANTA[d.onde]?d.onde:6,visto:false}));
    }
    mexerMoral(12);
  }else if(fim==='tomada'){
    cap('Três dentro');
    diz('Três já estão andando pela casa e vocês não têm mais pra onde ir.','perigo');
    await pausa(1600);
    return fimJogo('cerco');
  }else if(fim==='sozinho'){
    cap('Só você');
    diz('Não sobrou ninguém pra segurar nada.','perigo');
    await pausa(1600);
    return fimJogo('cerco');
  }else{
    cap('Amanheceu');
    diz('O céu clareia e elas somem uma por uma, sem pressa, do jeito que vieram.','bom');
    if(C.dentro.length){
      diz(`${C.dentro.map(d=>CRIATURAS[d.id].n).join(' e ')} continua dentro da casa. Isso não acaba com o sol.`,'perigo');
      S.dentroCasa=C.dentro.map(d=>({...d,onde:PLANTA[d.onde]?d.onde:6,visto:false}));
    }else{
      diz('A casa aguentou.','bom');
      mexerMoral(16);S.confianca=trava(S.confianca+14,0,100);
      anotar(`A casa aguentou a noite ${S.dia} sem gerador.`);
    }
  }
  /* o estrago fica */
  Object.keys(C.vias).forEach(k=>{
    const v=C.vias[k];
    if(v.hp<v.max*.5){
      if(k==='porta')danificarPorta(25);
      if(k==='muro')danificarMuro(5);
      if(k==='janela')abrirAvaria('aberta','a noite do cerco');
      if(k==='telhado')abrirAvaria('telhado','a noite do cerco');
      if(k==='porao')abrirAvaria('rachadura','a noite do cerco');
    }
  });
  await pausa(1200);
  AC.innerHTML='';
  botao('Amanhecer',()=>cenaDia(),{cls:'chave'});
}

const fimJogo=(t)=>typeof fim==='function'?fim(t):null;
</script>
<script>
/* ================= O LAYOUT PARAVA DE CABER =================
   canvas 40vh + ações até 47vh + painel ~10vh = 97% da tela.
   Sobrava 3% pro texto, e com muitos botões sobrava zero — foi
   por isso que a barra de conversa "sumiu" ao voltar pra casa.
   Agora quem cede espaço é o CANVAS, nunca o texto. */

const MIN_TEXTO=0.19;   // o texto nunca fica com menos que isso da tela

function alturaCanvas(){
  const H=(typeof innerHeight==='number'&&innerHeight)||window.innerHeight||640;
  const l=CV.clientWidth||window.innerWidth||360;
  const painel=($('#painel')&&!$('#painel').hidden)?($('#painel').offsetHeight||70):0;
  const topoBarra=(_barraFechada?34:30);
  /* quanto as ações realmente querem, com teto */
  let acoes=0;
  if(!_barraFechada&&AC){
    const querem=AC.scrollHeight||0;
    acoes=Math.min(querem,H*0.34);
  }else if(_barraFechada){
    acoes=42;   // só a aba
  }
  const sobra=H-painel-topoBarra-acoes-(H*MIN_TEXTO);
  const ehCasa=cena&&['casa','fim','olho','rua','escuta','mapa','mochila','casafora','conversa'].includes(cena.modo);
  const teto=_barraFechada?H*.54:H*(ehCasa?.40:.33);
  /* em tela pequena o piso do canvas nao pode comer o texto */
  const piso=Math.min(110,H*.16);
  const topo=Math.max(piso,Math.min(teto,l*1.2));   /* teto nunca abaixo do piso */
  return Math.round(trava(sobra,piso,topo));
}

dimensionar=function(){
  const l=CV.clientWidth||window.innerWidth||360;
  const alt=alturaCanvas();
  /* DPR é global: o laço de desenho divide por ele também.
     Ter dois valores diferentes foi o que criou as listras. */
  CV.width=Math.round(l*DPR);
  CV.height=Math.round(alt*DPR);
  CV.style.height=alt+'px';
  CX.setTransform(DPR,0,0,DPR,0,0);
};

/* toda vez que a lista de ações muda, o canvas se reajusta */
let _redimTimer=null;
function pedirRedim(){
  if(_redimTimer)return;
  _redimTimer=setTimeout(()=>{
    _redimTimer=null;
    dimensionar();
    if(typeof atualizarSetas==='function')atualizarSetas();
  },30);
}
const _botaoLayout=botao;
botao=function(txt,fn,op){
  const b=_botaoLayout(txt,fn,op);
  pedirRedim();
  return b;
};
addEventListener('resize',()=>{pedirRedim();});
addEventListener('orientationchange',()=>setTimeout(pedirRedim,220));
</script>
<script>
/* ================= LUZ DO DIA DE VERDADE =================
   Estava tudo escuro o tempo todo: o facho do lampião e a
   vinheta rodavam de dia igual à noite. Sete da manhã ficava
   preto. Agora o sol existe. */

const CURVA_LUZ=[
 /* hora, brilho, cor (r,g,b) */
 [0,.16,[.52,.58,1.00]],   // madrugada, azul
 [5,.24,[.58,.62,.98]],
 [6,.55,[.92,.86,.90]],    // primeira luz
 [7,.82,[1.02,.96,.88]],   // manhã, quente e CLARA
 [9,.98,[1.02,1.00,.94]],
 [11,1.00,[1.00,1.00,.98]],// meio-dia, neutro e cheio
 [14,.98,[1.02,.99,.93]],
 [16,.88,[1.06,.92,.78]],  // tarde puxando dourado
 [17,.72,[1.10,.84,.64]],
 [18,.50,[1.05,.72,.58]],  // fim de tarde, laranja
 [19,.32,[.86,.64,.62]],   // anoitecer
 [20,.20,[.62,.62,.92]],
 [22,.16,[.54,.58,1.00]],  // noite
 [24,.16,[.52,.58,1.00]]
];
function luzAgora(){
  const h=trava(S.hora+(S.minutos||0)/60,0,24);
  let a=CURVA_LUZ[0],b=CURVA_LUZ[CURVA_LUZ.length-1];
  for(let i=0;i<CURVA_LUZ.length-1;i++){
    if(h>=CURVA_LUZ[i][0]&&h<=CURVA_LUZ[i+1][0]){a=CURVA_LUZ[i];b=CURVA_LUZ[i+1];break;}
  }
  const t=(b[0]-a[0])?(h-a[0])/(b[0]-a[0]):0;
  const mist=(x,y)=>x+(y-x)*t;
  let f=mist(a[1],b[1]);
  const c=[mist(a[2][0],b[2][0]),mist(a[2][1],b[2][1]),mist(a[2][2],b[2][2])];
  /* o tempo tira luz, mas nunca faz meio-dia virar noite */
  const cl=CLIMAS[S.clima||'limpo'];
  if(cl)f*=trava(.55+cl.vis*.45,.5,1);
  if(S.chuva)f*=.88;
  return {f:trava(f,.14,1),c};
}
const ehDia=()=>luzAgora().f>=.45;

/* substitui o tom antigo */
aplicarTom=function(w,h){
  const L=luzAgora();
  CX.globalCompositeOperation='multiply';
  CX.fillStyle=`rgb(${Math.round(trava(L.c[0],0,1.2)*255)},${Math.round(trava(L.c[1],0,1.2)*255)},${Math.round(trava(L.c[2],0,1.2)*255)})`;
  CX.fillRect(0,0,w,h);
  CX.globalCompositeOperation='source-over';
  /* escurece só o que falta de luz — de dia quase nada */
  if(L.f<.95){
    CX.fillStyle=`rgba(6,7,16,${(1-L.f)*.72})`;
    CX.fillRect(0,0,w,h);
  }
  /* e de dia entra claridade pela janela */
  if(L.f>.5){
    const g=CX.createRadialGradient(w*.72,h*.18,h*.02,w*.72,h*.18,h*.95);
    g.addColorStop(0,`rgba(255,250,232,${(L.f-.5)*.30})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    CX.globalCompositeOperation='lighter';
    CX.fillStyle=g;CX.fillRect(0,0,w,h);
    CX.globalCompositeOperation='source-over';
  }
};

/* ================= TEXTURA SEM LISTRA ================= */
const _texNovo={};
function padrao(tipo,w,h){
  const chave='n_'+tipo;
  if(_texNovo[chave])return _texNovo[chave];
  const lado=96;
  const c=document.createElement('canvas');
  c.width=lado;c.height=lado;
  const x=c.getContext('2d');
  /* nada de listra de ponta a ponta: era isso que criava as
     faixas coloridas atravessando a tela */
  if(tipo==='madeira'){
    for(let i=0;i<70;i++){
      const y=Math.random()*lado;
      x.strokeStyle=`rgba(48,32,20,${.05+Math.random()*.07})`;
      x.lineWidth=.5+Math.random()*1.2;
      x.beginPath();
      x.moveTo(-4,y);
      x.bezierCurveTo(lado*.3,y+(Math.random()-.5)*5,lado*.7,y+(Math.random()-.5)*5,lado+4,y+(Math.random()-.5)*3);
      x.stroke();
    }
    for(let i=0;i<3;i++){
      x.strokeStyle='rgba(36,24,15,.09)';x.lineWidth=1.4;
      x.beginPath();x.ellipse(Math.random()*lado,Math.random()*lado,3+Math.random()*4,2+Math.random()*3,Math.random()*3,0,7);x.stroke();
    }
  }else if(tipo==='reboco'){
    for(let i=0;i<260;i++){
      const v=Math.random();
      x.fillStyle=v>.5?`rgba(255,252,244,${(v-.5)*.06})`:`rgba(10,8,12,${(.5-v)*.08})`;
      x.beginPath();x.arc(Math.random()*lado,Math.random()*lado,.4+Math.random()*1.1,0,7);x.fill();
    }
  }else if(tipo==='terra'){
    for(let i=0;i<190;i++){
      x.fillStyle=`rgba(46,34,22,${.04+Math.random()*.07})`;
      x.beginPath();x.arc(Math.random()*lado,Math.random()*lado,.6+Math.random()*1.8,0,7);x.fill();
    }
  }else if(tipo==='metal'){
    for(let i=0;i<50;i++){
      x.strokeStyle=`rgba(190,198,208,${.012+Math.random()*.02})`;
      x.lineWidth=.5;
      const px=Math.random()*lado;
      x.beginPath();x.moveTo(px,-2);x.lineTo(px+(Math.random()-.5)*3,lado+2);x.stroke();
    }
    for(let i=0;i<14;i++){
      x.fillStyle=`rgba(110,58,30,${.03+Math.random()*.05})`;
      x.beginPath();x.arc(Math.random()*lado,Math.random()*lado,1+Math.random()*2.4,0,7);x.fill();
    }
  }else{
    for(let i=0;i<300;i++){
      const v=Math.random();
      x.fillStyle=v>.5?`rgba(255,250,238,${(v-.5)*.045})`:`rgba(0,0,0,${(.5-v)*.055})`;
      x.fillRect(Math.random()*lado,Math.random()*lado,1,1);
    }
  }
  _texNovo[chave]=c;
  return c;
}
let _patNovo={};
aplicarTextura=function(tipo,w,h,forca,desloca){
  /* DESLIGADA POR PADRÃO. Estava atrapalhando enxergar a cena,
     e efeito que esconde o jogo não vale nada. Quem quiser
     liga em Ajustes > Granulado. */
  const nv=(S.cfg&&S.cfg.grao)||0;
  if(!nv)return;
  const L=luzAgora();
  const f=(forca==null?1:forca)*trava(1.10-L.f*.60,.30,1)*(nv===1?.16:.34);
  if(f<=.02)return;
  if(!_patNovo[tipo]){
    const p=padrao(tipo,w,h);
    try{_patNovo[tipo]=CX.createPattern(p,'repeat');}catch(e){return;}
  }
  const pat=_patNovo[tipo];
  if(!pat)return;
  CX.save();
  CX.globalAlpha=f;
  if(desloca)CX.translate(desloca.x||0,desloca.y||0);
  CX.fillStyle=pat;
  CX.fillRect(-96,-96,w+192,h+192);
  CX.restore();
};

/* ================= O ACABAMENTO RESPEITA O SOL ================= */
acabamento=function(w,h,t){
  const m=cena.modo;
  if(m==='mochila'||m==='mapa'||m==='fim'||m==='vazio')return;
  const L=luzAgora();
  const noite=L.f<.42;
  const claro=L.f;

  /* material do cômodo, discreto */
  if(m==='casa'&&cena.casa){
    const id=cena.casa.voce;
    /* deslocamento próprio de cada cômodo: sem isso o padrão
       pode alinhar com as linhas da cena e virar listra */
    aplicarTextura(id===8?'terra':id===6?'reboco':id===3?'metal':'madeira',w,h,.45,
      {x:-((id*37)%96),y:-((id*53)%96)});
  }else if(m==='porta')aplicarTextura('madeira',w,h,.5,{x:-19,y:-41});
  else if(m==='casafora'||m==='rua')aplicarTextura('reboco',w,h,.32,{x:-61,y:-13});

  /* o lampião só existe quando falta luz */
  if(noite&&['casa','porta'].includes(m)){
    const forcaL=trava((.42-claro)/.42,0,1);
    if(m==='casa'){
      const lx=w*.5,ly=h*.55;
      sombraDe(w*.28,h*.78,lx,ly,w*.10,h*.03,forcaL*.9);
      sombraDe(w*.72,h*.80,lx,ly,w*.08,h*.025,forcaL*.8);
      fachoLampiao(w,h,t,lx,ly,forcaL);
    }else fachoLampiao(w,h,t,w*.5,h*.28,forcaL*.6);
  }

  /* poeira: bonita na luz, some no escuro total */
  if(['casa','porta','rua','casafora'].includes(m))
    poeira(w,h,t,trava(.35+claro*.75,.2,1));

  if(S.clima==='neblina'&&['rua','casafora'].includes(m)){
    const g=CX.createLinearGradient(0,h*.3,0,h);
    g.addColorStop(0,'rgba(196,202,212,.03)');
    g.addColorStop(1,`rgba(196,202,212,${.10+(1-claro)*.10})`);
    CX.fillStyle=g;CX.fillRect(0,0,w,h);
  }

  /* borda escura proporcional à falta de luz */
  if(!['olho','escuta'].includes(m))
    vinhetaViva(w,h,t,trava((1-claro)*.82,.06,.92));

  if(m==='olho'){poeira(w,h,t,.3);franja(w,h,.4);}

  /* grão de filme leve, e só no escuro */
  if((S.cfg&&S.cfg.grao)&&claro<.62&&!['mochila','mapa'].includes(m))
    aplicarTextura('filme',w,h,.28,{x:Math.random()*96-48,y:Math.random()*96-48});

  /* o escuro da anomalia continua por cima de tudo */
  if(cena.escurecer>0){
    cena.escurecer=Math.max(0,cena.escurecer-.0016);
    const pul=.72+Math.sin(t*2.2)*.06;
    CX.fillStyle=`rgba(2,1,4,${.78*cena.escurecer*pul})`;
    CX.fillRect(0,0,w,h);
    const g=CX.createRadialGradient(w*.5,h*.5,h*.25,w*.5,h*.5,h);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(1,'rgba(80,14,10,'+(.22*cena.escurecer)+')');
    CX.fillStyle=g;CX.fillRect(0,0,w,h);
  }
};

/* a hora aparece no texto do cômodo */
function faixaDoDia(){
  const h=S.hora;
  if(h<6)return 'madrugada';
  if(h<9)return 'manhã';
  if(h<12)return 'meio da manhã';
  if(h<15)return 'meio-dia';
  if(h<17)return 'tarde';
  if(h<19)return 'fim de tarde';
  if(h<21)return 'anoitecendo';
  return 'noite';
}
</script>
<script>
/* ================= VOLUME E PELE =================
   Os rostos eram cor chapada com traços por cima. Faltava
   luz, sombra e superfície. Isso é uma camada por cima do
   que já existe — não reescrevi nada, só dei corpo. */

const _peleCache={};
function texturaPele(tam,h){
  const k=Math.round(tam)+'_'+(h%97);
  if(_peleCache[k])return _peleCache[k];
  const c=document.createElement('canvas');
  c.width=c.height=Math.max(24,Math.round(tam));
  const x=c.getContext('2d');
  const n=Math.round(tam*1.5);
  for(let i=0;i<n;i++){
    const v=semente(h,200+i);
    const px=semente(h,300+i)*c.width, py=semente(h,400+i)*c.height;
    x.fillStyle=v>.5
      ?'rgba(255,240,225,'+((v-.5)*.10)+')'
      :'rgba(60,30,20,'+((.5-v)*.13)+')';
    x.beginPath();x.arc(px,py,.4+v*1.1,0,7);x.fill();
  }
  /* manchas de pele: sarda, cicatriz, pinta */
  for(let i=0;i<4;i++){
    if(semente(h,500+i)>.55)continue;
    x.fillStyle='rgba(70,40,26,'+(.06+semente(h,510+i)*.10)+')';
    x.beginPath();
    x.ellipse(semente(h,520+i)*c.width,semente(h,530+i)*c.height,
      c.width*.05,c.width*.03,semente(h,540+i)*3,0,7);
    x.fill();
  }
  _peleCache[k]=c;
  return c;
}

const _pintarVol=pintarRosto;
pintarRosto=function(x,tam,p,estado,anim){
  _pintarVol(x,tam,p,estado,anim);
  if(tam<20)return;
  const h=hashNome(p.n+p.id), s=i=>semente(h,i);
  const q=tam/100;
  const cx=tam*.5, larg=tam*(.30+s(4)*.06), alt=tam*(.36+s(5)*.06);
  const cy=tam*.46+((anim&&anim.resp)||0)*q*.9;

  x.save();
  /* recorta tudo no formato da cabeça */
  x.beginPath();
  x.ellipse(cx,cy,larg,alt,0,0,7);
  x.clip();

  /* pele com poro e mancha */
  try{
    const t=texturaPele(tam,h);
    x.globalAlpha=.55;
    x.drawImage(t,cx-larg,cy-alt,larg*2,alt*2);
    x.globalAlpha=1;
  }catch(e){}

  /* luz vindo de cima e da esquerda, como o lampião */
  const lg=x.createRadialGradient(cx-larg*.35,cy-alt*.45,alt*.05,
                                  cx-larg*.1,cy-alt*.1,alt*1.5);
  lg.addColorStop(0,'rgba(255,236,200,.20)');
  lg.addColorStop(.5,'rgba(255,220,180,.05)');
  lg.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=lg;x.fillRect(cx-larg,cy-alt,larg*2,alt*2);

  /* sombra do lado oposto e embaixo do queixo */
  const sg=x.createLinearGradient(cx+larg*.1,cy,cx+larg,cy+alt*.7);
  sg.addColorStop(0,'rgba(0,0,0,0)');
  sg.addColorStop(1,'rgba(8,4,10,.42)');
  x.fillStyle=sg;x.fillRect(cx-larg,cy-alt,larg*2,alt*2);

  /* maçã do rosto e olheira: o que dá idade e cansaço */
  const cansaco=trava((100-(p.moral==null?60:p.moral))/100+(p.doente>0?.4:0),0,1);
  if(cansaco>.25){
    [-1,1].forEach(d=>{
      const og=x.createRadialGradient(cx+d*larg*(.19+s(7)*.05),cy-alt*.06+alt*.10,
        alt*.01,cx+d*larg*(.19+s(7)*.05),cy-alt*.06+alt*.10,alt*.16);
      og.addColorStop(0,'rgba(40,18,30,'+(.28*cansaco)+')');
      og.addColorStop(1,'rgba(0,0,0,0)');
      x.fillStyle=og;x.fillRect(cx-larg,cy-alt,larg*2,alt*2);
    });
  }
  /* febre: rubor nas maçãs */
  if(p.doente>0){
    [-1,1].forEach(d=>{
      const fg=x.createRadialGradient(cx+d*larg*.42,cy+alt*.10,alt*.01,
        cx+d*larg*.42,cy+alt*.10,alt*.22);
      fg.addColorStop(0,'rgba(150,50,40,.24)');
      fg.addColorStop(1,'rgba(0,0,0,0)');
      x.fillStyle=fg;x.fillRect(cx-larg,cy-alt,larg*2,alt*2);
    });
  }
  x.restore();

  /* contorno: dá recorte contra o fundo */
  x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=Math.max(1,q*1.2);
  x.beginPath();x.ellipse(cx,cy,larg,alt,0,0,7);x.stroke();
  /* fio de luz na borda de cima */
  x.strokeStyle='rgba(255,232,190,.22)';x.lineWidth=Math.max(1,q);
  x.beginPath();x.ellipse(cx,cy,larg*.98,alt*.98,0,Math.PI*1.15,Math.PI*1.85);x.stroke();
};

/* ================= AS CRIATURAS GANHAM SUPERFÍCIE =================
   Eram preenchimento chapado. Cada família tem uma pele. */
const _desPele=desSilhueta;
desSilhueta=function(cx,cy,h,tipo,t,cor){
  /* 1. sombra no chão, dá peso */
  CX.save();
  CX.fillStyle='rgba(0,0,0,.30)';
  CX.beginPath();
  CX.ellipse(cx,cy+h*.46,h*.20,h*.035,0,0,7);
  CX.fill();
  CX.restore();

  /* 2. a silhueta, como sempre foi */
  _desPele(cx,cy,h,tipo,t,cor);

  /* 3. superfície por cima, recortada na própria silhueta */
  CX.save();
  CX.globalCompositeOperation='source-atop';
  const fam=tipo==='humana'||tipo==='alta'||tipo==='meia'||tipo==='casca'||tipo==='pequena'
    ?'falsa':(tipo==='macica'||tipo==='aquilo'||tipo==='fome'||tipo==='coro'?'surda':'aberta');

  if(fam==='falsa'){
    /* pele esticada: brilho oleoso e emenda */
    const g=CX.createLinearGradient(cx-h*.2,cy-h*.4,cx+h*.2,cy+h*.4);
    g.addColorStop(0,'rgba(120,96,80,.30)');
    g.addColorStop(.45,'rgba(60,46,38,.10)');
    g.addColorStop(1,'rgba(0,0,0,.35)');
    CX.fillStyle=g;CX.fillRect(cx-h*.6,cy-h*.7,h*1.2,h*1.5);
    CX.strokeStyle='rgba(150,70,50,.18)';CX.lineWidth=Math.max(1,h*.006);
    for(let i=0;i<3;i++){
      const y=cy-h*.30+i*h*.22;
      CX.beginPath();CX.moveTo(cx-h*.2,y);
      CX.quadraticCurveTo(cx,y+h*.02,cx+h*.2,y-h*.01);CX.stroke();
    }
  }else if(fam==='aberta'){
    /* casca seca: gretas e nervura */
    const g=CX.createLinearGradient(cx,cy-h*.5,cx,cy+h*.5);
    g.addColorStop(0,'rgba(70,58,40,.28)');
    g.addColorStop(1,'rgba(0,0,0,.40)');
    CX.fillStyle=g;CX.fillRect(cx-h*.6,cy-h*.7,h*1.2,h*1.5);
    CX.strokeStyle='rgba(20,14,10,.35)';CX.lineWidth=Math.max(1,h*.005);
    for(let i=0;i<9;i++){
      const a=(i/9)*7+t*.1;
      const x1=cx+Math.cos(a)*h*.05,y1=cy+Math.sin(a)*h*.16;
      CX.beginPath();CX.moveTo(x1,y1);
      CX.lineTo(x1+Math.cos(a)*h*.20,y1+Math.sin(a)*h*.26);CX.stroke();
    }
  }else{
    /* surda: não reflete luz. Só profundidade que engole */
    const g=CX.createRadialGradient(cx,cy-h*.1,h*.02,cx,cy,h*.55);
    g.addColorStop(0,'rgba(30,6,8,.30)');
    g.addColorStop(.6,'rgba(0,0,0,.30)');
    g.addColorStop(1,'rgba(0,0,0,.62)');
    CX.fillStyle=g;CX.fillRect(cx-h*.6,cy-h*.7,h*1.2,h*1.5);
    /* fiapos que se mexem na borda */
    CX.strokeStyle='rgba(0,0,0,.5)';CX.lineWidth=Math.max(1,h*.004);
    for(let i=0;i<7;i++){
      const a=t*.5+i*.9;
      CX.beginPath();
      CX.moveTo(cx+Math.cos(a)*h*.18,cy+Math.sin(a)*h*.28);
      CX.lineTo(cx+Math.cos(a)*h*.26,cy+Math.sin(a)*h*.36+Math.sin(t*2+i)*h*.02);
      CX.stroke();
    }
  }
  CX.restore();

  /* 4. contorno duro: sem isso ela some no fundo escuro */
  CX.save();
  CX.globalCompositeOperation='destination-over';
  CX.strokeStyle='rgba(180,168,150,.14)';
  CX.lineWidth=Math.max(1.5,h*.016);
  _desPele(cx,cy,h,tipo,t,'rgba(180,168,150,.14)');
  CX.restore();
};
</script>
<script>
/* ================= DIFICULDADE QUE TE LÊ =================
   Antes tudo escalava só com o dia. Agora o jogo mede como
   você está indo e ajusta — quem domina enfrenta mais, quem
   está apanhando ganha ar. */

function placar(){
  const P=S.placar||(S.placar={acertos:0,erros:0,abriuCerto:0,abriuErrado:0,
    noitesLimpa:0,invasoes:0});
  return P;
}
function dominio(){
  /* 0 = está apanhando · 1 = está dominando */
  const P=placar();
  const tent=P.acertos+P.erros;
  const taxa=tent>=4?P.acertos/tent:.5;
  const folga=trava(S.comida/Math.max(1,(S.abrigo.length+1)*4),0,1);
  const casa=trava((S.porta.reforco*.08)+(forcaMuro()*.06)+(S.confianca/220),0,1);
  const vida=trava(1-(S.mortos.length*.10)-(S.ferido||0)*.05,0,1);
  return trava(taxa*.38+folga*.20+casa*.22+vida*.20,0,1);
}
function nivelDif(){
  const d=dominio();
  return d>.72?'apertando':d>.45?'firme':d>.25?'aliviando':'na mão';
}

/* onde isso pesa */
function difMimico(){   /* chance de ser mímico na porta */
  return 1+(dominio()-.5)*.55;
}
function difEscuta(){   /* defeitos audíveis: quem domina ouve menos */
  return dominio()>.65?-1:dominio()<.3?1:0;
}
function difLente(){    /* defeitos visíveis na lente */
  return dominio()>.7?-1:dominio()<.28?1:0;
}
function difCerco(){    /* força das criaturas no cerco */
  return 1+(dominio()-.5)*.40;
}
function difLoot(){     /* o mundo dá mais quando você está mal */
  return trava(1.35-dominio()*.55,.8,1.35);
}

/* o placar aprende com o que você faz */
const _julgarBase=typeof julgarEscuta==='function'?julgarEscuta:null;
if(_julgarBase){
  julgarEscuta=async function(v,e,escolha,antes){
    const real=e.defeitos.map(d=>d.id);
    if(escolha&&real.includes(escolha))placar().acertos++;
    else if(escolha)placar().erros++;
    return _julgarBase(v,e,escolha,antes);
  };
}

/* liga nas chances que já existem */
const _tipoBase=tipoDaNoite;
tipoDaNoite=function(){
  const antes=S.dia;
  const r=_tipoBase();
  return r;
};
const _perfilBase=perfilEscuta;
perfilEscuta=function(v){
  const e=_perfilBase(v);
  if(v.mimico&&!v._difAplicada){
    v._difAplicada=true;
    const aj=difEscuta();
    if(aj<0&&e.defeitos.length>1)e.defeitos=e.defeitos.slice(0,1);
    if(aj>0&&e.defeitos.length<3){
      const falta=DEFEITOS_SOM.filter(d=>!e.defeitos.some(x=>x.id===d.id));
      if(falta.length)e.defeitos.push(sortear(falta));
    }
  }
  return e;
};
const _lootBase=lootDoLocal;
lootDoLocal=function(l,f){
  return _lootBase(l,(f==null?1:f)*difLoot());
};

/* o resumo do dia diz onde você está */
function textoDificuldade(){
  const n=nivelDif();
  if(n==='apertando')return 'Você está dando conta. Elas percebem isso.';
  if(n==='na mão')return 'A casa está no limite. O que vier agora vem mais devagar.';
  return null;
}

/* ================= O RESUMO DA NOITE =================
   Você acordava sem saber o que tinha acontecido. */
function marcarNoite(o){
  S.ultimaNoite=Object.assign({visitas:0,abriu:0,mimicos:0,invasao:false,
    cerco:false,mortos:[],perdeu:{},achou:[]},S.ultimaNoite||{},o||{});
}
function resumoDaNoite(){
  const N=S.ultimaNoite;
  if(!N)return false;
  S.ultimaNoite=null;
  const l=[];
  if(N.visitas)l.push(`${N.visitas} ${N.visitas===1?'bateu':'bateram'} na porta`);
  if(N.mimicos)l.push(`${N.mimicos} ${N.mimicos===1?'não era gente':'não eram gente'}`);
  if(N.abriu)l.push(`você abriu ${N.abriu} ${N.abriu===1?'vez':'vezes'}`);
  if(N.cerco)l.push('a casa passou a noite cercada');
  else if(N.invasao)l.push('teve invasão');
  if(!l.length)return false;
  diz('Ontem à noite: '+l.join(' · ')+'.','sist');
  if((N.mortos||[]).length)
    diz(`Você perdeu ${N.mortos.join(' e ')}.`,'perigo');
  return true;
}
</script>
<script>
/* ================= FERIDAS E DOENÇAS =================
   Regra que eu segui: cada uma cabe em duas linhas — o que
   ela faz com você, e o que resolve. Nada de nome difícil,
   nada de sistema que precise de tabela pra entender. */

const MALES={
 /* ---------- FERIDAS: vêm de acidente e de bicho ---------- */
 corte:{n:'corte',tipo:'ferida',grav:1,dias:4,
  faz:'Sangra e dói quando você força o braço.',
  custa:{forca:.10},
  trata:['gaze','alcool','linha'],
  pior:'infeccao',
  vem:'faca, vidro, arame'},
 cortefundo:{n:'corte fundo',tipo:'ferida',grav:3,dias:8,
  faz:'Não para de sangrar sozinho. Precisa fechar.',
  custa:{forca:.28,horas:1},
  trata:['linha','gaze'],
  pior:'infeccao',urgente:true,
  vem:'coisa cortando com força'},

/* ================= O ESTADO DE SAÚDE ================= */
function saude(alvo){
  const o=alvo||S;
  if(!o.males)o.males=[];
  o.males=o.males.filter(m=>m&&MALES[m.id]);
  return o.males;
}
function temMal(id,alvo){return saude(alvo).some(m=>m.id===id);}
function pegarMal(id,alvo,porque){
  if(!MALES[id])return null;
  const L=saude(alvo);
  const ja=L.find(m=>m.id===id);
  if(ja){ja.dias=Math.max(ja.dias,MALES[id].dias);return null;}
  const m={id,dias:MALES[id].dias,tratado:0,porque:porque||null};
  L.push(m);
  return m;
}
function curarMal(id,alvo){
  const o=alvo||S;
  o.males=saude(o).filter(m=>m.id!==id);
}

/* quanto isso custa, somado */
function custoSaude(alvo){
  const c={forca:0,fuga:0,atencao:0,horas:0,ruido:0,moral:0,agua:0};
  saude(alvo).forEach(m=>{
    const e=MALES[m.id].custa||{};
    Object.keys(e).forEach(k=>{c[k]=(c[k]||0)+e[k];});
  });
  c.forca=trava(c.forca,0,.65);
  c.fuga=trava(c.fuga,0,.60);
  c.atencao=trava(c.atencao,0,.55);
  c.horas=Math.min(3,Math.round(c.horas));
  return c;
}
/* substitui o peso antigo, mantendo o nome que o resto usa */
pesoFerido=function(){
  const c=custoSaude();
  return trava(c.forca*.6+c.fuga*.4,0,.55);
};

/* ---------- o dia passa ---------- */
function passarSaude(alvo,nome){
  const L=saude(alvo),r=[];
  /* o jogo tinha p.doente (número de dias) desde a v5. Em vez de
     dois sistemas discordando, o antigo alimenta o novo. */
  const o=alvo||S;
  if(o.doente>0&&!L.length){pegarMal('febre',o,'estava doente');}
  o.doente=L.length?Math.max(o.doente||0,1):0;
  for(let i=L.length-1;i>=0;i--){
    const m=L[i],e=MALES[m.id];
    m.dias-=1+(m.tratado?1:0);
    if(m.tratado)m.tratado=0;
    if(m.dias<=0){
      L.splice(i,1);
      r.push(`${nome||'Você'} está sem ${e.n}.`);
      continue;
    }
    /* piora se não cuidar */
    if(e.pior&&m.dias<=Math.ceil(e.dias*.4)&&chance(.28)&&!temMal(e.pior,alvo)){
      pegarMal(e.pior,alvo,'a '+e.n+' que ninguém cuidou');
      r.push(`⚠ A ${e.n} de ${nome||'você'} virou ${MALES[e.pior].n}.`);
    }
    /* o que mata, mata */
    if(e.mata&&m.dias<=1&&chance(.35)){
      r.push('MORTE:'+m.id);
    }
    /* o que pega, pega */
    if(e.pega&&S.abrigo.length&&chance(e.pega*.5)){
      const o=sortear(S.abrigo.filter(p=>p!==alvo&&!temMal(m.id,p)));
      if(o){pegarMal(m.id,o,'pegou de '+(nome||'você'));
        r.push(`${o.n} pegou ${e.n}.`);}
    }
  }
  return r;
}

/* ---------- tratar ---------- */
function temRemedio(k){
  const R=REMEDIOS[k];if(!R)return false;
  if(R.acao)return true;
  if(R.ferra)return temFerra(R.ferra);
  if(R.recurso)return (S[R.recurso]||0)>0;
  if(k==='cha')return S.temSemente||canteiros().length>0||(S.med&&S.med.cha>0);
  return (S.med&&S.med[R.qtd]>0)||S.remedio>0;
}
function gastarRemedio(k){
  const R=REMEDIOS[k];if(!R)return;
  if(R.acao)return;
  if(R.ferra)return;
  if(R.recurso){S[R.recurso]=Math.max(0,(S[R.recurso]||0)-1);ganhou({[R.recurso]:-1});return;}
  S.med=S.med||{};
  if(S.med[R.qtd]>0){S.med[R.qtd]--;return;}
  if(S.remedio>0){S.remedio--;ganhou({remedio:-1});}
}
function tratar(m,k,alvo,nome){
  const e=MALES[m.id];
  const certo=(e.trata||[]).includes(k);
  gastarRemedio(k);
  if(!certo){
    return {ok:false,t:`${REMEDIOS[k].n} não faz nada pra ${e.n}.`};
  }
  m.tratado=1;
  const forte=['antibiotico','linha','tala','soro','pomada'].includes(k);
  m.dias=Math.max(1,m.dias-(forte?3:1));
  if(forte&&e.pior)m.semPior=true;
  return {ok:true,t:`${nome||'Você'}: ${e.n} tratada com ${REMEDIOS[k].n}. ${forte?'Isso resolve de verdade.':'Alivia.'}`};
}

/* ---------- a tela ---------- */
function telaSaude(volta){
  AC.innerHTML='';limpar();cap('Machucados e doenças');
  const meus=saude();
  const c=custoSaude();

  if(!meus.length)diz('Você está inteiro.','bom');
  else{
    diz('EM VOCÊ:','sist');
    meus.forEach(m=>{
      const e=MALES[m.id];
      const falta=(e.trata||[]).filter(k=>temRemedio(k));
      ficha(e.n.toUpperCase(),e.dias?m.dias+(m.dias===1?' dia':' dias'):'',
        e.faz+(m.porque?' (veio de '+m.porque+')':''));
      if(e.urgente)diz('  ⚠ Isso não espera.','perigo');
      if(!falta.length)diz('  Você não tem com o que tratar: precisa de '+
        (e.trata||[]).map(k=>REMEDIOS[k].n).join(' ou ')+'.','alerta');
    });
    if(c.forca||c.fuga||c.atencao||c.horas||c.ruido){
      const l=[];
      if(c.forca)l.push('força −'+Math.round(c.forca*100)+'%');
      if(c.fuga)l.push('fugir −'+Math.round(c.fuga*100)+'%');
      if(c.atencao)l.push('atenção −'+Math.round(c.atencao*100)+'%');
      if(c.horas)l.push(c.horas+'h a menos por dia');
      if(c.ruido)l.push('+'+c.ruido+' de ruído por noite');
      diz('No total: '+l.join(' · '),'perigo');
    }
  }

  const doentes=S.abrigo.filter(p=>saude(p).length);
  if(doentes.length){
    diz('NA CASA:','sist');
    doentes.forEach(p=>{
      const q=saude(p).map(m=>MALES[m.id].n).join(', ');
      fichaRosto(p,p.hab,q,'vivo');
    });
  }

  /* botões de tratamento */
  meus.forEach(m=>{
    const e=MALES[m.id];
    (e.trata||[]).forEach(k=>{
      if(!temRemedio(k))return;
      const R=REMEDIOS[k];
      botao(`${e.n}: usar ${R.n}`,acaoDia(R.acao?4:0,async()=>{
        const r=tratar(m,k,null,null);
        diz(r.t,r.ok?'bom':'fraco');
        if(R.acao){mexerMoral(4);diz('Você fica deitado o resto do dia.','narr');}
      }),{custo:R.acao?'4 horas':R.d});
    });
  });
  doentes.forEach(p=>{
    const m=saude(p)[0];if(!m)return;
    const e=MALES[m.id];
    const k=(e.trata||[]).find(x=>temRemedio(x)&&!REMEDIOS[x].acao);
    if(!k)return;
    botao(`Tratar ${p.n} (${e.n})`,acaoDia(1,async()=>{
      const r=tratar(m,k,p,p.n);
      diz(r.t,r.ok?'bom':'fraco');
      if(r.ok){mexerMoral(6,p);aproximar(p,S.abrigo.find(x=>x!==p)||p,4);}
    }),{custo:'1 hora · '+REMEDIOS[k].n});
  });

  /* fazer remédio em casa */
  botao('Fazer soro caseiro',acaoDia(1,async()=>{
    if(S.agua<1)return diz('Precisa de água.','perigo');
    S.agua--;ganhou({agua:-1});
    S.med=S.med||{};S.med.soro=(S.med.soro||0)+2;
    diz('Água, sal e açúcar. Dois copos guardados.','bom');
  }),{custo:'1h · 1 água → 2 soros'});
  if(canteiros().length||S.temSemente)botao('Ferver chá de erva',acaoDia(1,async()=>{
    S.med=S.med||{};S.med.cha=(S.med.cha||0)+2;
    diz('Duas canecas. Não é remédio de verdade, mas ajuda.','bom');
  }),{custo:'1h → 2 chás'});
  botao('Rasgar pano pra gaze',acaoDia(1,async()=>{
    if(!temMat('lona2',1))return diz('Precisa de pano ou lona.','perigo');
    gastarMat('lona2',1);
    S.med=S.med||{};S.med.gaze=(S.med.gaze||0)+3;
    diz('Três tiras limpas.','bom');
  }),{custo:'1h · 1 lona → 3 gazes'});
  if(temMat('tabua',1))botao('Fazer tala',acaoDia(1,async()=>{
    gastarMat('tabua',1);
    S.med=S.med||{};S.med.tala=(S.med.tala||0)+1;
    diz('Tábua lascada e pano. Feia e funciona.','bom');
  }),{custo:'1h · 1 tábua → 1 tala'});

  const M=S.med||{};
  const lista=Object.keys(M).filter(k=>M[k]>0).map(k=>M[k]+' '+k);
  diz('Você tem: '+(lista.length?lista.join(', '):'nada específico')+
    (S.remedio?' · '+S.remedio+' remédio genérico':''),'sist');
  botao('Voltar',volta,{cls:'chave'});
}

/* ---------- de onde vem cada coisa ---------- */
function ferirPor(fonte,alvo,nome){
  const t={
    bicho:['mordida','corte','cortefundo','pancada'],
    queda:['torcao','fratura','pancada','corte'],
    fogo:['queimadura'],
    gente:['corte','pancada','cortefundo'],
    mato:['arranhao','bolha','piolho'],
    obra:['corte','pancada','queimadura','fratura']
  }[fonte]||['corte'];
  const id=sortear(t);
  const m=pegarMal(id,alvo,fonte==='bicho'?'uma mordida':fonte);
  return m?MALES[id]:null;
}
function adoecerPor(fonte,alvo){
  const t={
    comida:['barriga','febre'],
    agua:['barriga','desidratacao'],
    frio:['tosse','gripe','febre'],
    sujeira:['infeccao','piolho'],
    cansaco:['insonia','febre'],
    fome:['fome','desidratacao']
  }[fonte]||['febre'];
  const id=sortear(t);
  const m=pegarMal(id,alvo,fonte);
  return m?MALES[id]:null;
}

  const r=[];
  dentro().forEach(d=>{
    const c=CRIATURAS[d.id];
    if(chance(.45)){
      const v=vizinhos(d.onde);

      const p=trava(.12+arma.dano*.09+(sabe?.15:0)+(S.abrigo.length*.04)
        -c.forca*.06-cs.forca,.04,.80);
      await pausa(1700);
      if(chance(p)){
        dentro().splice(dentro().indexOf(d),1);
        S.vistos=S.vistos||{};S.vistos[d.id]=(S.vistos[d.id]||0)+2;
        diz(`Custou. Mas ${c.n} não levanta mais.`,'bom');
        mexerMoral(10);S.confianca=trava(S.confianca+8,0,100);
        anotar(`Matou ${c.n} dentro de casa.`);
        if(chance(.5)){const m=sortear(['tabua','arame','cano']);darMat(m,2);}
      }else{
        diz(`Você acerta e não muda nada.`,'perigo');
        const fer=ferirPor('bicho');
        if(fer)diz(`Você ficou com ${fer.n}. ${fer.faz}`,'perigo');
        if(S.abrigo.length&&chance(.30)){
          const v=sortear(S.abrigo);
          morreuAlguem(v,`entrou na frente quando você enfrentou ${c.n}`);
          diz(`${v.n} entrou na frente.`,'perigo');
        }
      }
      res();
    }),{custo:Math.round(trava(.12+arma.dano*.09+((S.vistos&&S.vistos[d.id]||0)>=2?.15:0)
      +(S.abrigo.length*.04)-c.forca*.06-cs.forca,.04,.80)*100)+'%'});

    /* isca */
    if(S.comida>0)botao('Deixar comida e abrir caminho pra fora',acaoDia(1,async()=>{
      S.comida--;ganhou({comida:-1});
      const p=trava(c.fam==='surda'?.20:.68,.1,.85);
      await pausa(1400);
      if(chance(p)){
        dentro().splice(dentro().indexOf(d),1);
        diz(`${c.n} pega e vai embora sozinha.`,'bom');
      }else diz('Ela come e fica.','perigo');
      res();
    }),{custo:'1 comida · '+Math.round(trava(c.fam==='surda'?.20:.68,.1,.85)*100)+'%'});

    botao('Deixar pra depois',()=>{
      diz('Você fecha a porta do cômodo e vai fazer outra coisa. A casa fica menor.','narr');
      res();
    },{cls:'chave'});
  }).then(volta);
}

/* ================= O QUE IMPORTA HOJE =================
   Com 20 sistemas, é fácil não saber por onde começar. Isso
   lê o estado real e diz as três coisas que mais pesam. */
function prioridades(){
  const p=[];
  const bocas=S.abrigo.length+1;

  dentro().forEach(d=>p.push({peso:100,t:`${CRIATURAS[d.id].n} está dentro da casa.`,
    como:'Encurralar, enxotar ou enfrentar.'}));

  saude().filter(m=>MALES[m.id].urgente).forEach(m=>
    p.push({peso:95,t:`Você está com ${MALES[m.id].n}.`,
      como:'Trata hoje: '+(MALES[m.id].trata||[]).map(k=>REMEDIOS[k].n).join(' ou ')+'.'}));

  if(S.gerQuebrado)p.push({peso:92,t:'O gerador está quebrado.',
    como:'Sem ele a noite vira cerco. Precisa de peça e mecânica.'});
  else if(S.diesel<10)p.push({peso:88,t:`Só ${Math.round(S.diesel)} de diesel.`,
    como:'Menos de duas noites. Posto e borracharia rendem diesel.'});

  if(S.comida<bocas)p.push({peso:86,t:`${S.comida} de comida pra ${bocas} ${bocas===1?'boca':'bocas'}.`,
    como:'Mercado, armazém e a horta.'});

  avarias().filter(a=>a.grave).forEach(a=>
    p.push({peso:80,t:`${AVARIAS[a.id].n} está piorando.`,
      como:faltaPra(a).length?'Falta '+faltaPra(a).join(', ')+'.':'Dá pra resolver hoje.'}));

  if(S.dia>=5&&forcaMuro()<3)p.push({peso:70,t:'O muro quase não vale nada.',
    como:'No cerco, o muro é a segunda entrada que elas tentam.'});
  if(S.porta.reforco<3)p.push({peso:68,t:'A porta tem pouco reforço.',
    como:'Cada tábua conta na noite em que o gerador falhar.'});

  S.abrigo.filter(x=>saude(x).some(m=>MALES[m.id].urgente)).forEach(x=>
    p.push({peso:75,t:`${x.n} está mal.`,como:'Tratar custa 1 hora.'}));

  (S.objetivos||[]).filter(o=>!o.feito&&o.ignorado>=5&&S.abrigo.some(y=>y.n===o.dono))
    .forEach(o=>p.push({peso:60,t:`${o.dono} ainda quer ${o.n}.`,
      como:'Se você ignorar demais, sai sozinho atrás disso.'}));

  if(S.dia>=6&&!melhorArma())p.push({peso:64,t:'Você não tem arma nenhuma.',
    como:'Dá pra fabricar na oficina com tábua e arame.'});
  if(!S.anotouCasa&&S.dia>=3)p.push({peso:45,t:'A casa não está anotada no caderno.',
    como:'4 horas. Libera comparar, que é o melhor jeito de achar anomalia.'});

  return p.sort((a,b)=>b.peso-a.peso).slice(0,3);
}
function mostrarPrioridades(){
  const p=prioridades();
  if(!p.length){
    diz('Nada urgente hoje. É um bom dia pra construir alguma coisa.','bom');
    return;
  }
  diz('─── o que pesa hoje ───','fraco');
  p.forEach(x=>{
    diz('· '+x.t,x.peso>=85?'perigo':x.peso>=65?'alerta':'sist');
    diz('   '+x.como,'fraco');
  });
}

<script>
/* ================= O QUE ESTÁ ACONTECENDO =================
   O jogo tinha 25 sistemas e nenhuma resposta pra "o que é
   isso". Agora tem — contada pelo rádio, em cinco estágios,
   e o que você mesmo descobriu entra na história. */

const ESTAGIOS_MUNDO=[
 {id:1,n:'os primeiros relatos',dias:0,
  falas:[
   'Uma mulher descreve alguém que bateu na porta dela falando com a voz do filho. O filho estava do lado dela.',
   'Um homem repete três vezes que não é loucura, que ele viu, e depois desliga.',
   'Alguém pergunta se mais alguém está ouvindo coisa que não devia. Doze pessoas respondem sim.',
   '"Não é gente. Eu sei que parece gente. Não é gente."',
   'Uma voz institucional pede calma e diz que os relatos estão sendo apurados. É a última vez que ela fala.']},
 {id:2,n:'começam a comparar',dias:3,
  falas:[
   'Três casas diferentes descrevem a mesma coisa alta e curvada. Nenhuma delas se conhece.',

   'Uma voz nova, calma demais, começa a transmitir todo dia no mesmo horário. Diz que está catalogando.',
   '"Nós contamos onze tipos diferentes. Onze que a gente conseguiu ver."',

   '"A pergunta não é o que elas são. É por que agora."',
   'Ela lê uma lista de fraquezas confirmadas. Você anota tudo.']},
 {id:4,n:'o que ninguém queria ouvir',dias:11,
  falas:[
   'A voz calma diz que as cidades que caíram primeiro foram as que tinham mais gente. Não menos. Mais.',
   '"Quanto mais gente junta num lugar, mais rápido acaba. A gente estava fazendo errado desde o começo."',
   'Ela pergunta, sem tom nenhum, quantos ainda estão ouvindo. Você conta as vozes que respondem. São poucas.',
   '"Se você está sozinho numa casa pequena, você está fazendo a coisa certa. Eu sinto muito por isso."',

 {id:5,n:'o fim da linha',dias:16,

   'O rádio pega uma única frase, repetida, em três frequências ao mesmo tempo: "não abra".',

   '"Quem ainda estiver aí: vocês são a resposta. Não tem nada pra descobrir. Só tem aguentar."',
   'Silêncio nas frequências que estavam ocupadas ontem. Todas.',
   'Uma voz de criança lê uma lista de nomes por vinte minutos. Nenhum é conhecido. Depois para.']}
];

function estagioMundo(){
  const d=S.dia;
  let e=ESTAGIOS_MUNDO[0];
  ESTAGIOS_MUNDO.forEach(x=>{if(d>=x.dias)e=x;});
  return e;
}

/* o que VOCÊ descobriu entra na transmissão */
function contribuicoes(){
  const c=[];
  if((S.escutasCertas||0)>=3)
    c.push('Alguém no rádio descreve exatamente o que você aprendeu escutando na porta: respiração que não varia é o sinal mais confiável.');
  if((S.locaisLib||[]).length>=3)
    c.push('Duas casas trocam perguntas locais no ar. Uma delas é a mesma que a Dona Lurdes te ensinou.');
  if((S.anomPegas||0)>=3)
    c.push('Você ouve alguém descrever uma coisa que você viu essa semana, e ninguém acredita nela. Você acredita.');
  if((S.vistos&&Object.keys(S.vistos).length>=4))
    c.push(`Pedem descrição de qualquer coisa que alguém tenha visto de perto. Você já viu ${Object.keys(S.vistos).length} tipos diferentes.`);
  if((S.saq&&S.saq.mortos.length)||0)
    c.push('Falam de gente que virou pior que as coisas. Você sabe do que estão falando.');
  if((S.cidadesVistas||[]).length>=2)
    c.push('Perguntam se alguém saiu da própria cidade e voltou. Quase ninguém responde.');
  if((S.trancados||0)>0)
    c.push('Alguém pergunta se dá pra prender uma dentro de casa em vez de matar. Você poderia responder.');
  if((S.mortos||[]).length>=3)
    c.push('Leem nomes de mortos por dez minutos. Três dos seus estão na lista, e você não contou pra ninguém.');
  return c;
}

/* o boletim ganha o fio da história */
const _boletimBase=boletimRadio;
boletimRadio=async function(){
  if(S.boletimDia===S.dia)return false;
  const E=estagioMundo();
  const virou=S.estagioVisto!==E.id;
  S.estagioVisto=E.id;

  /* mudança de estágio é acontecimento */
  if(virou&&E.id>1){
    S.boletimDia=S.dia;
    await pausa(700);
    silencioSubito(1.4);
    await pausa(1200);
    diz('O rádio mudou de assunto.','sist');
    await pausa(1100);
    diz('“'+sortear(E.falas)+'”','fala');
    await pausa(1400);
    S.ouviu=S.ouviu||[];
    if(!S.ouviu.includes(E.id))S.ouviu.push(E.id);
    anotar('O rádio entrou em: '+E.n+'.');
    return true;
  }
  /* dia comum: a fala do estágio, uma dica, ou o que você fez */
  const r=Math.random();
  if(r<.42){
    S.boletimDia=S.dia;
    await pausa(600);
    diz('O rádio pega alguma coisa.','sist');
    await pausa(900);
    diz('“'+sortear(E.falas)+'”','fala');
    await pausa(900);
    return true;
  }
  if(r<.60){
    const c=contribuicoes();
    if(c.length){
      S.boletimDia=S.dia;
      await pausa(600);
      diz(sortear(c),'sist');
      await pausa(900);
      return true;
    }
  }
  return _boletimBase();
};

/* o que você juntou, num lugar só */
function telaMundo(volta){
  AC.innerHTML='';limpar();cap('O que se sabe');
  const E=estagioMundo();
  diz(`O rádio está em: ${E.n}.`,'sist');
  const ouvi=(S.ouviu||[]).length;
  diz(`Você acompanhou ${ouvi} de ${ESTAGIOS_MUNDO.length} viradas.`,'fraco');

  diz('─── o que você aprendeu sozinho ───','fraco');
  const meu=[];
  if((S.escutasCertas||0))meu.push(`Escutou pela porta e acertou ${S.escutasCertas} ${S.escutasCertas===1?'vez':'vezes'}.`);
  if((S.anomPegas||0))meu.push(`Identificou ${S.anomPegas} ${S.anomPegas===1?'anomalia':'anomalias'}.`);
  const vis=S.vistos?Object.keys(S.vistos):[];
  if(vis.length)meu.push(`Viu ${vis.length} ${vis.length===1?'tipo':'tipos'} de perto: ${vis.map(k=>CRIATURAS[k]?CRIATURAS[k].n:k).join(', ')}.`);
  const sabidas=vis.filter(k=>(S.vistos[k]||0)>=2&&CRIATURAS[k]);
  if(sabidas.length){
    meu.push('Sabe a fraqueza de '+sabidas.length+':');
    sabidas.forEach(k=>diz(`   ${CRIATURAS[k].n}: ${CRIATURAS[k].fraco}`,'bom'));
  }
  if((S.locaisLib||[]).length)meu.push(`${S.locaisLib.length} perguntas locais que só quem é daqui responde.`);
  if((S.estudo||0))meu.push(`Estudou ${S.estudo}x: investigar ficou ${Math.round(bonusEstudo()*100)}% mais fácil.`);
  if(!meu.length)diz('Nada ainda. Você tem sobrevivido, não descoberto.','fraco');
  else meu.forEach(m=>diz('· '+m,'sist'));

  const c=contribuicoes();
  if(c.length){
    diz('─── o que você poderia contar pra eles ───','fraco');
    c.slice(0,3).forEach(x=>diz('· '+x,'fraco'));
  }
  botao('Voltar',volta,{cls:'chave'});
}

/* ================= O JOGO NÃO ACABA NA NOITE 12 =================
   Tinha conteúdo pra 30 dias e arco pra 12. */
