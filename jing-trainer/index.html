<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#05060a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Sistema de recuperação e evolução mecânica para Jing e Luna — Honor of Kings.">
<title>ESPELHO · Treino Jing</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="fundo"></div>

<div id="girar">
  <div>
    <div class="ic">📱</div>
    <h2 style="margin:12px 0 6px">Vire o aparelho</h2>
    <p class="mini">Este painel foi desenhado para a tela do seu celular deitada, do mesmo jeito que você joga.</p>
  </div>
</div>

<div id="app">
  <nav id="rail">
    <div class="marca"><b>◈</b>ESPELHO</div>
    <button class="railbtn on" data-tela="inicio"><span class="ic">◉</span><span class="tx">Base</span></button>
    <button class="railbtn" data-tela="treinar"><span class="ic">⚔</span><span class="tx">Treino</span></button>
    <button class="railbtn" data-tela="mapa"><span class="ic">✥</span><span class="tx">HUD</span></button>
    <button class="railbtn" data-tela="rel"><span class="ic">▤</span><span class="tx">Dados</span></button>
    <button class="railbtn" data-tela="luna"><span class="ic">☾</span><span class="tx">Luna</span></button>
    <button class="railbtn" data-tela="ajustes"><span class="ic">⚙</span><span class="tx">Config</span></button>
  </nav>

  <div id="main">
    <section class="tela on" id="tela-inicio"></section>
    <section class="tela" id="tela-treinar"></section>
    <section class="tela" id="tela-mapa"></section>
    <section class="tela" id="tela-rel"></section>
    <section class="tela" id="tela-luna"></section>
    <section class="tela" id="tela-ajustes"></section>

    <!-- runner de exercício -->
    <section id="treino">
      <div class="tfaixa">
        <button class="sair" id="tf-sair">✕</button>
        <div class="nome" id="tf-nome">—</div>
        <div class="flex wrap espaco" id="tf-chips"></div>
      </div>
      <div id="palco">
        <canvas id="hudcv"></canvas>
        <div id="dica"></div>
        <div id="fb"></div>

        <div id="brief">
          <div class="corpo" id="brief-corpo"></div>
          <div class="pe">
            <button class="btn sec sm" id="brief-volta">Voltar</button>
            <button class="btn full" id="brief-ir">Começar</button>
          </div>
        </div>

        <div id="res">
          <div class="corpo rolagem" id="res-corpo"></div>
          <div class="pe" style="display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line)">
            <button class="btn sec sm" id="res-repetir">Repetir</button>
            <button class="btn full" id="res-proximo">Próximo</button>
            <button class="btn sec sm" id="res-encerrar">Encerrar</button>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<div id="toast"></div>
<div id="modal"><div class="cx" id="modal-cx"></div></div>

<script src="js/util.js"></script>
<script src="js/hud.js"></script>
<script src="js/metrics.js"></script>
<script src="js/engines.js"></script>
<script src="js/drills.js"></script>
<script src="js/coach.js"></script>
<script src="js/graf.js"></script>
<script src="js/ui.js"></script>
<script src="js/treino.js"></script>
<script src="js/app.js"></script>
</body>
</html>
