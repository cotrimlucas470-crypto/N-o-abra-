<script>
/* ================= A HORTA DE VERDADE =================
   Canteiros separados, cada um com estado próprio. */
const CULT=[
 {id:'mandioca',n:'mandioca',dias:9,rende:9,agua:1,d:'Demora, mas rende que não acaba.'},
 {id:'feijao',n:'feijão',dias:6,rende:5,agua:2,d:'Meio termo em tudo.'},
 {id:'milho',n:'milho',dias:7,rende:6,agua:2,d:'Cresce alto. Dá pra ver da rua.'},
 {id:'abobora',n:'abóbora',dias:8,rende:8,agua:2,d:'Uma só já dá pra semana.'},
 {id:'couve',n:'couve',dias:4,rende:3,agua:2,d:'Rápida e bebe muita água.'},
 {id:'macaxeira',n:'macaxeira',dias:8,rende:7,agua:1,d:'Aguenta seca melhor que tudo.'}
];
const PRAGAS=[
 {id:'lagarta',n:'lagarta',perde:.4,cura:'catar na mão',horas:1,
  ver:'As folhas estão furadas de ponta a ponta.'},
 {id:'fungo',n:'mofo branco',perde:.5,cura:'arrancar as folhas doentes',horas:1,
  ver:'Tem um pó branco no pé das folhas.'},
 {id:'seca',n:'seca',perde:.6,cura:'regar de verdade',horas:1,precisaAgua:2,
  ver:'A terra rachou e as folhas murcharam pra dentro.'},
 {id:'formiga',n:'formiga',perde:.35,cura:'achar o formigueiro',horas:2,
  ver:'Tem uma trilha de formiga cortadeira indo e voltando do canteiro.'}
];

function canteiros(){return S.cant||(S.cant=[]);}
function novoCanteiro(tipo){
  canteiros().push({tipo,dias:0,agua:4,seco:0,praga:null,pragaDias:0,alterado:false,perda:0});
}
function crescerCanteiros(){
  const avisos=[];
  const chuva=S.clima==='chuva'||S.clima==='tempestade';
  canteiros().forEach((c,i)=>{
    const cu=CULT.find(x=>x.id===c.tipo);
    if(chuva)c.agua=Math.min(4,c.agua+2);
    else c.agua-=(S.clima==='calor'?1.2:S.clima==='nublado'?.6:.85);
    if(c.agua<=0){
      c.agua=0;c.seco=(c.seco||0)+1;
      if(!c.praga&&c.seco>=2&&chance(.5)){
        c.praga='seca';c.pragaDias=0;
        avisos.push(`O canteiro de ${cu.n} secou. A terra rachou.`);
      }
    }else c.seco=0;
    if(!c.praga&&c.dias>=2&&chance(.055+(S.clima==='chuva'?.03:0))){
      c.praga=sortear(PRAGAS.filter(p=>p.id!=='seca')).id;c.pragaDias=0;
      avisos.push(`Deu problema no canteiro de ${cu.n}. ${PRAGAS.find(p=>p.id===c.praga).ver}`);
    }
    if(c.praga){
      c.pragaDias++;
      const P=PRAGAS.find(p=>p.id===c.praga);
      c.perda=Math.min(.7,c.perda+P.perde*.12);
      /* com praga cresce devagar, mas cresce */
      if(c.agua>0&&chance(.5))c.dias++;
      if(c.pragaDias>=8&&chance(.3)){
        avisos.push(`O canteiro de ${cu.n} se perdeu inteiro. Você deixou passar tempo demais.`);
        canteiros().splice(i,1);return;
      }
    }else if(c.agua>0){
      c.dias++;
    }
    // anomalia mexendo na horta
    if(!c.alterado&&S.dia>=5&&chance(.04)){
      c.alterado=true;
      avisos.push(`Uma planta do canteiro de ${cu.n} não é mais a mesma planta.`);
    }
  });
  return avisos;
}
function prontoPra(c){
  const cu=CULT.find(x=>x.id===c.tipo);
  return c.dias>=cu.dias;
}
function menuHorta(){
  AC.innerHTML='';limpar();cap('A horta');
  const cs=canteiros();
  if(!cs.length)diz('Terra batida e mato. Dá pra abrir canteiro.','narr');
  cs.forEach((c,i)=>{
    const cu=CULT.find(x=>x.id===c.tipo);
    const P=c.praga?PRAGAS.find(p=>p.id===c.praga):null;
    const est=P?'⚠ '+P.ver:(prontoPra(c)?'No ponto de colher.':`${c.dias} de ${cu.dias} dias.`);
    const ag=c.agua<=1?' · terra seca':c.agua>=4?' · encharcado':'';
    diz(`Canteiro ${i+1} — ${cu.n}. ${est}${ag}${c.alterado?' · tem uma planta diferente':''}`,
      P?'alerta':prontoPra(c)?'bom':'sist');
  });
  cs.forEach((c,i)=>{
    const cu=CULT.find(x=>x.id===c.tipo);
    if(prontoPra(c)&&!c.praga){
      const q=Math.max(1,Math.round(cu.rende*(1-c.perda)+(tem('cozinha')?2:0)));
      botao(`Colher o canteiro ${i+1} (${cu.n})`,acaoDia(2,async()=>{
        S.comida+=q;ganhou({comida:q});
        if(chance(.5)){darMat('cimento',0);S.temSemente=true;
          diz('Você separa semente pro próximo plantio.','bom');}
        canteiros().splice(i,1);
        diz(`${q} refeições. A casa inteira desce pra ver.`,'bom');
        mexerMoral(8);anotar(`Colheu ${cu.n}.`);
      }),{custo:'2 horas · +'+q+' comida'});
    }
    if(c.praga){
      const P=PRAGAS.find(p=>p.id===c.praga);
      const falta=P.precisaAgua&&S.agua<P.precisaAgua;
      botao(`Canteiro ${i+1}: ${P.cura}`,acaoDia(P.horas,async()=>{
        if(falta)return diz('Não tem água suficiente pra isso.','perigo');
        if(P.precisaAgua){S.agua-=P.precisaAgua;ganhou({agua:-P.precisaAgua});}
        if(chance(.75)){
          c.praga=null;c.pragaDias=0;c.agua=3;
          diz('Resolvido. O canteiro ainda tem salvação.','bom');
        }else diz('Você faz o que dá e não resolve. Volta amanhã.','perigo');
      }),{custo:P.horas+'h'+(P.precisaAgua?' · '+P.precisaAgua+' água':'')});
    }
    if(c.agua<3&&!c.praga)botao(`Regar o canteiro ${i+1}`,acaoDia(1,async()=>{
      if(S.agua<1)return diz('Não tem água pra isso.','perigo');
      S.agua--;ganhou({agua:-1});c.agua=Math.min(4,c.agua+2);
      diz('A terra bebe tudo em dois minutos.','bom');
    }),{custo:'1 hora · 1 água'});
    if(c.alterado)botao(`Arrancar a planta estranha do canteiro ${i+1}`,acaoDia(1,async()=>{
      c.alterado=false;
      if(chance(.4)){diz('Você arranca. A raiz é comprida demais pro tamanho da planta.','alerta');mexerMoral(-4);}
      else diz('Você arranca e joga fora. Era só uma erva daninha esquisita.','narr');
    }),{custo:'1 hora'});
  });
  if(cs.length<4)botao('Abrir canteiro novo',()=>menuPlantio(),
    {custo:temFerra('enxada')?'2 horas · tem enxada':'3 horas · sem enxada'});
  botao('Voltar',()=>menuComodo(8),{cls:'chave'});
}
function menuPlantio(){
  AC.innerHTML='';limpar();cap('O que plantar');
  if(!S.temSemente)diz('Sem semente boa, o que nascer vai ser fraco.','fraco');
  CULT.forEach(c=>{
    botao(`${c.n} — ${c.dias} dias, rende ${c.rende}`,acaoDia(temFerra('enxada')?2:3,async()=>{
      novoCanteiro(c.id);
      if(S.temSemente&&chance(.5))S.temSemente=false;
      diz(`Canteiro de ${c.n} aberto. ${c.d}`,'bom');
      diz('Agora depende de você e da chuva.','sist');
    }),{custo:c.d});
  });
  botao('Voltar',()=>menuHorta(),{cls:'chave'});
}

/* ================= ÁGUA =================
   Calha, cisterna, bomba, cano. Tudo conectado. */
function agua(){
  return S.hidro||(S.hidro={calha:0,cisterna:0,bomba:false,entupida:false});
}
function coletarChuva(){
  const H=agua();
  if(!(S.clima==='chuva'||S.clima==='tempestade'))return null;
  if(avariaEm('calha')||H.entupida)return 'A calha está entupida. A chuva toda foi pro chão.';
  const base=H.calha*(S.clima==='tempestade'?3:2);
  if(!base)return null;
  const q=Math.min(base,20-S.agua);
  if(q<=0)return 'Os galões já estão cheios.';
  S.agua+=q;ganhou({agua:q});
  return `A calha encheu ${q} de água durante a chuva.`;
}
function menuAgua(){
  AC.innerHTML='';limpar();cap('A água');
  const H=agua();
  diz(`Calha ligada em ${H.calha} de 4 pontos. ${H.calha?'Cada chuva rende '+H.calha*2+' de água.':'Nenhuma chuva é aproveitada.'}`,'sist');
  diz(`Cisterna: ${H.cisterna} de 3 tambores. ${H.bomba?'Com bomba.':'Sem bomba — tirar água é balde por balde.'}`,'sist');
  if(avariaEm('torneira'))diz('A torneira do quintal continua perdendo água.','alerta');

  if(H.calha<4)botao('Ligar mais um pedaço de calha',acaoDia(2,async()=>{
    if(!temMat('cano',1))return diz('Falta cano pra isso.','perigo');
    gastarMat('cano',1);H.calha++;
    diz(`Agora são ${H.calha} pontos de calha. Chuva vira água guardada.`,'bom');
  }),{custo:'2 horas · 1 cano'});
  if(H.cisterna<3)botao('Montar mais um tambor',acaoDia(2,async()=>{
    H.cisterna++;
    diz(`Tambor ${H.cisterna} no lugar. Cabe mais água guardada.`,'bom');
  }),{custo:'2 horas'});
  if(!H.bomba)botao('Montar a bomba na cisterna',acaoDia(3,async()=>{
    if(!temFerra('inglesa'))return diz('Sem chave inglesa não dá pra montar.','perigo');
    if(!temMat('cano',1)||!temMat('fio',1))return diz('Falta cano e fio.','perigo');
    gastarMat('cano',1);gastarMat('fio',1);H.bomba=true;
    diz('A bomba pega. Tirar água virou apertar um botão.','bom');
    anotar('Montou a bomba da cisterna.');
  }),{custo:'3h · chave inglesa · cano · fio'});
  botao('Limpar a calha por dentro',acaoDia(1,async()=>{
    if(!temFerra('escada'))return diz('Sem escada você não alcança.','perigo');
    H.entupida=false;fecharAvaria('calha');
    diz('Você tira dois quilos de folha podre lá de dentro. A água desce direito de novo.','bom');
    if(chance(.2))diz('Junto com a folha desce uma coisa que não é folha. Você não olha muito.','alerta');
  }),{custo:'1 hora · escada'});
  botao('Voltar',()=>menuComodo(8),{cls:'chave'});
}

/* ================= VEÍCULOS ================= */
const VEIC={
 bici:{n:'bicicleta',carga:6,horas:-1,ruido:0,comb:0,fuga:1,
  conserto:{ferra:['alicate'],mat:{arame:2}},
  d:'Silenciosa. Leva pouco, mas leva você e volta rápido.'},
 carroca:{n:'carroça de mão',carga:16,horas:1,ruido:1,comb:0,fuga:0,

 moto:{n:'moto',carga:8,horas:-2,ruido:5,comb:2,fuga:2,

function veic(){return S.veic||(S.veic={});}
function veicPronto(id){return veic()[id]==='ok';}
function melhorVeic(){
  const v=Object.keys(VEIC).filter(veicPronto);
  if(!v.length)return null;
  return v.sort((a,b)=>VEIC[b].carga-VEIC[a].carga)[0];
}
function bonusCarga(){

}
function menuVeiculos(){
  AC.innerHTML='';limpar();cap('O que tem rodando');
  const V=veic();
  const achados=Object.keys(V);
  if(!achados.length)diz('Nada. Você anda a pé e carrega no braço.','narr');
  achados.forEach(id=>{
    const e=VEIC[id];
    diz(`${e.n} — ${V[id]==='ok'?'funcionando':'quebrada'}. ${e.d}`,V[id]==='ok'?'bom':'fraco');
  });
  achados.filter(id=>V[id]!=='ok').forEach(id=>{
    const e=VEIC[id],c=e.conserto;
    const falta=[];
    c.ferra.forEach(f=>{if(!temFerra(f))falta.push(FERRA[f].n)});
    Object.keys(c.mat).forEach(k=>{if(!temMat(k,c.mat[k]))falta.push(c.mat[k]+' '+MATE[k].un)});
    botao(`Consertar ${e.n}`,acaoDia(3,async()=>{
      if(falta.length)return diz('Falta '+falta.join(', ')+'.','perigo');
      Object.keys(c.mat).forEach(k=>gastarMat(k,c.mat[k]));
      const ajuda=tem('mecânica')?.95:.7;
      if(chance(ajuda)){
        V[id]='ok';
        diz(`${e.n[0].toUpperCase()+e.n.slice(1)} funcionando.`,'bom');
        diz(e.d,'sist');
        if(id==='carro')S.carro=true;
        anotar('Consertou: '+e.n);mexerMoral(10);
      }else diz('Você mexe a tarde toda e não pega. Falta alguma coisa que você não sabe o que é.','perigo');
    }),{custo:falta.length?'falta: '+falta.join(', '):'3 horas',
        falta:falta.length?'falta '+falta.join(', '):''});
  });
  botao('Voltar',()=>menuComodo(8),{cls:'chave'});
}
function acharVeiculo(){
  const V=veic();
  const faltam=Object.keys(VEIC).filter(id=>!V[id]);
  if(!faltam.length)return null;
  const id=sortear(faltam);
  V[id]='quebrado';
  return `Tem uma ${VEIC[id].n} aqui. Não anda, mas dá pra rebocar até em casa.`;
}

<script>
/* ================= CLIMA ================= */
const CLIMAS={
 limpo:{n:'céu limpo',p:24,vis:1,ruido:0},
 nublado:{n:'nublado',p:20,vis:.9,ruido:0},
 chuva:{n:'chuva',p:16,vis:.7,ruido:-12},
 tempestade:{n:'tempestade',p:7,vis:.5,ruido:-20},
 neblina:{n:'neblina',p:9,vis:.4,ruido:-4},
 vento:{n:'vento forte',p:11,vis:.85,ruido:-6},
 calor:{n:'calor de rachar',p:9,vis:1,ruido:2},
 frio:{n:'friagem',p:4,vis:.95,ruido:0}
};
const CLIMA_TXT={
 limpo:['O céu está limpo e isso é ruim: dá pra ver a casa de longe.','Sol forte. Sombra curta e nenhuma desculpa pra ninguém.'],
 nublado:['O céu está fechado sem chover. A luz fica igual o dia inteiro.','Nublado. Não dá pra saber que horas são olhando pra cima.'],
 chuva:['Chove desde cedo. O barulho da água cobre quase tudo.','Chuva fina que não para. A rua virou barro.'],
 tempestade:['Tempestade. Trovão que faz a janela tremer.','A chuva bate na telha com força de pedra. Ninguém sai hoje sem motivo.'],
 neblina:['A neblina desceu e você não vê o fim do quintal.','Névoa densa. O muro some a cinco metros.'],
 vento:['Vento forte desde a madrugada. A casa inteira range.','O vento derruba coisa no quintal a manhã toda.'],
 calor:['Calor de rachar. A água acaba mais rápido e a horta pede o dobro.','Trinta e nove graus. Todo mundo está de pavio curto.'],
 frio:['Friagem. Veio do sul e pegou todo mundo de calça curta.','Frio de verdade, que aqui é notícia.']
};
function sortearClima(){
  const ant=S.clima;
  let e=Object.entries(CLIMAS);
  if(S.viradaChuva>0)return 'chuva';
  const local=climaDaCidade();
  if(local&&local!==ant)return local;
  // o tempo tem inércia
  if(ant&&chance(.35))return ant;
  e=e.map(([k,v])=>[k,v.p*(k===ant?.4:1)]);
  const t=e.reduce((s,[,p])=>s+p,0);
  let r=Math.random()*t;
  for(const [k,p] of e){r-=p;if(r<=0)return k;}
  return 'limpo';
}

const PESO_R={comum:44,incomum:30,raro:17,muitoraro:7,unico:2};
function sortearEvento(){
  S.usados=S.usados||[];
  const val=EVT.filter(e=>{
    if(e.id&&S.usados.includes(e.id))return false;
    if(e.cond&&!e.cond())return false;
    if(e.r==='unico'&&S.dia<7)return false;
    if(e.r==='muitoraro'&&S.dia<4)return false;
    return true;
  });
  if(!val.length)return null;
  const t=val.reduce((s,e)=>s+PESO_R[e.r],0);
  let r=Math.random()*t;
  for(const e of val){r-=PESO_R[e.r];if(r<=0)return e;}
  return val[0];
}
async function eventoDoDia(){
  if(!chance(.62))return false;
  const e=sortearEvento();
  if(!e)return false;
  if(e.id){S.usados=S.usados||[];S.usados.push(e.id);}
  await pausa(700);
  if(e.r==='unico'||e.r==='muitoraro'){silencioSubito(1.6);await pausa(1400);}
  diz(e.t,e.r==='unico'?'alerta':e.r==='raro'||e.r==='muitoraro'?'sist':'narr');
  await pausa(1100);
  const res=e.f();
  if(res)diz(res,e.r==='comum'?'narr':'bom');
  if(e.r==='unico')anotar('ACONTECEU: '+e.t.slice(0,50));
  atualizarPainel();
  await pausa(900);
  return true;
}

          else {S[k]=(S[k]||0)+o.pega[k];g[k]=o.pega[k];}
        });
        ganhou(g);
        diz('Trocado. Ele confere duas vezes e guarda no carrinho.','bom');
        await pausa(1200);

  });
}

/* ================= A VOZ =================
   Menos robô: frase por frase, com pausa entre elas e
   entonação que muda conforme a situação. */
const TOM={
 calmo:{pitch:1,rate:.94,pausa:340},
 normal:{pitch:1,rate:1,pausa:260},
 nervoso:{pitch:1.09,rate:1.13,pausa:150},
 medo:{pitch:1.16,rate:1.2,pausa:110},
 baixo:{pitch:.9,rate:.86,pausa:420},
 cansado:{pitch:.93,rate:.83,pausa:460}
};
function tomDaHora(op){
  if(op.tom)return TOM[op.tom]||TOM.normal;
  if(op.mimico)return chance(.5)?TOM.calmo:TOM.normal;
  if(S.ruido>70||cena.modo==='casa'&&cena.casa&&cena.casa.monstro!=null)return TOM.medo;
  if(S.dia>=9&&chance(.4))return TOM.cansado;
  if(moralMedia()<35)return TOM.baixo;
  if(S.hora>=22||S.hora<5)return TOM.calmo;
  return TOM.normal;
}
/* quebra em frases pra dar respiração entre elas */
function fatiar(txt){
  return String(txt)
    .split(/(?<=[.!?…])\s+|(?<=,)\s+(?=(?:mas|só que|e|porque|aí|então)\b)/i)
    .map(s=>s.trim()).filter(Boolean);
}
async function falarNatural(txt,op={}){
  const T0=tomDaHora(op);
  const partes=fatiar(txt);
  for(let i=0;i<partes.length;i++){
    const p=partes[i];
    // cada frase varia um tico, senão vira metrônomo
    const jit=1+(Math.random()-.5)*.07;
    const sobe=/\?$/.test(p)?1.06:/[!…]$/.test(p)?1.03:1;
    await falarOriginal(p,{...op,
      pitch:(op.pitch||1)*T0.pitch*jit*sobe,
      rate:(op.rate||1)*T0.rate*jit});
    if(i<partes.length-1){
      const extra=/[.!?…]$/.test(p)?T0.pausa:T0.pausa*.55;
      await pausa(extra+Math.random()*90);
    }
  }
}

function mochila(){
  /* aceita estado incompleto sem derrubar o jogo: save de versão
     anterior, tipo trocado por evento, itens perdidos no meio. */
  if(!S.mochila||typeof S.mochila!=='object')S.mochila={tipo:'nenhuma',itens:[]};
  if(!MOCHILAS[S.mochila.tipo])S.mochila.tipo='nenhuma';
  if(!Array.isArray(S.mochila.itens))S.mochila.itens=[];
  else S.mochila.itens=S.mochila.itens.filter(x=>x&&CATALOGO[x.id]&&x.q>0);
  return S.mochila;
}
function mochilaInfo(){
  const m=mochila();
  const base=MOCHILAS[m.tipo]||MOCHILAS.nenhuma;
  const v=melhorVeic();
  return {...base,
    kg:base.kg+(v?VEIC[v].carga*.6:0),
    vol:base.vol+(v?VEIC[v].carga:0),
    comVeiculo:!!v};
}
function maos(){
  if(!Array.isArray(S.maos))S.maos=[];
  S.maos=S.maos.filter(id=>CATALOGO[id]);
  return S.maos;
}
/* o que está NA mochila e o que está NOS BRAÇOS são limites
   separados. Antes item de mão furava a capacidade inteira. */
const PESO_MAOS=24;
function pesoMochila(){
  return mochila().itens.reduce((s,it)=>s+(CATALOGO[it.id].kg*it.q),0);
}
function pesoMaos(){
  return maos().reduce((s,id)=>s+CATALOGO[id].kg,0);
}
function pesoAtual(){return pesoMochila()+pesoMaos();}
/* carregar coisa grande nos braços atrapalha tudo que exige mão livre */
function maosOcupadas(){return maos().length;}
function penalidadeMaos(){
  const n=maosOcupadas();
  if(!n)return 0;
  return n===1?.18:.42;   // fuga, luta e esconder ficam mais difíceis
}
function volumeAtual(){
  return mochila().itens.reduce((s,it)=>s+(CATALOGO[it.id].vol*it.q),0);
}
function cabe(id,q){
  q=q||1;
  const e=CATALOGO[id];if(!e)return false;
  const inf=mochilaInfo();
  if(e.mao)return maos().length<2 && pesoMaos()+e.kg<=PESO_MAOS;
  return pesoMochila()+e.kg*q<=inf.kg && volumeAtual()+e.vol*q<=inf.vol;
}
function guardar(id,q){
  q=q||1;
  const e=CATALOGO[id];
  if(!e)return 0;
  if(e.mao){
    if(!cabe(id,1))return 0;   /* checa peso E quantidade, não só quantidade */
    maos().push(id);return 1;
  }
  let posto=0;
  const m=mochila();
  for(let i=0;i<q;i++){
    if(!cabe(id,1))break;
    const pilha=e.pilha||1;
    const slot=m.itens.find(x=>x.id===id&&x.q<pilha);
    if(slot)slot.q++;
    else m.itens.push({id,q:1,dia:S.dia});
    posto++;
  }
  return posto;
}
function largar(id,q){
  q=q||1;
  const m=mochila();
  if((S.maos||[]).includes(id)){
    S.maos=S.maos.filter(x=>x!==id);return 1;
  }
  let tirou=0;
  for(let i=0;i<q;i++){
    const idx=m.itens.findIndex(x=>x.id===id);
    if(idx<0)break;
    m.itens[idx].q--;tirou++;
    if(m.itens[idx].q<=0)m.itens.splice(idx,1);
  }
  return tirou;
}
function temItem(id){
  return mochila().itens.some(x=>x.id===id)||(S.maos||[]).includes(id);
}
function contarItem(id){
  const s=mochila().itens.filter(x=>x.id===id).reduce((a,b)=>a+b.q,0);
  return s+((S.maos||[]).includes(id)?1:0);
}

/* descarregar em casa: converte o que é recurso e guarda o resto */
function descarregar(){
  const m=mochila(),ganho={};
  const sobrou=[];
  const passar=(id,q)=>{
    const e=CATALOGO[id];
    let usou=false;
    if(e.usa){
      Object.keys(e.usa).forEach(k=>{
        const v=e.usa[k]*q;
        S[k]=(k==='diesel')?trava(S[k]+v,0,100):(S[k]||0)+v;
        ganho[k]=(ganho[k]||0)+v;
      });usou=true;
    }
    if(e.ferra){for(let i=0;i<q;i++)pegarFerra(e.ferra);usou=true;}
    if(e.mat){darMat(e.mat,q);usou=true;}
    if(e.cartucho){S.cartucho=(S.cartucho||0)+e.cartucho*q;usou=true;}
    if(e.carga){S.pilhas=(S.pilhas||0)+e.carga*q;usou=true;}
    if(e.moeda){S.moeda=(S.moeda||0)+e.moeda*q;usou=true;}
    if(e.oficina){S.oficinaNivel=Math.min(2,(S.oficinaNivel||0)+q);usou=true;}
    if(e.reforco){S.porta.reforco+=q;usou=true;}
    if(e.semente){S.temSemente=true;usou=true;}
    if(e.especial==='peca'){S.peca=true;usou=true;}
    if(e.dano){
      S.armas=S.armas||[];
      for(let i=0;i<q;i++)if(!S.armas.includes(id))S.armas.push(id);
      usou=true;
    }
    if(!usou)sobrou.push({id,q});
  };
  m.itens.slice().forEach(it=>passar(it.id,it.q));
  (S.maos||[]).slice().forEach(id=>passar(id,1));
  m.itens=[];S.maos=[];
  S.guardados=S.guardados||[];
  sobrou.forEach(s=>{
    const g=S.guardados.find(x=>x.id===s.id);
    if(g)g.q+=s.q;else S.guardados.push({...s});
  });
  if(Object.keys(ganho).length)ganhou(ganho);
  return {ganho,sobrou};
}

/* comida perecível estraga na mochila */
function estragarNaMochila(){
  const m=mochila(),perdeu=[];
  m.itens.slice().forEach(it=>{
    const e=CATALOGO[it.id];
    if(!e.perece)return;
    if(S.dia-it.dia>=e.perece){
      perdeu.push(e.n.toLowerCase());
      m.itens=m.itens.filter(x=>x!==it);
    }
  });
  return perdeu;
}

let GRADE=[];
function desenharMochila(w,h,t){
  const g=CX.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#141019');g.addColorStop(1,'#08060C');
  CX.fillStyle=g;CX.fillRect(0,0,w,h);

  const inf=mochilaInfo(),m=mochila();
  const pk=pesoAtual(),vl=volumeAtual();

  /* a boca da mochila desenhada em volta */
  CX.strokeStyle='#3A3040';CX.lineWidth=Math.max(3,w*.012);
  CX.beginPath();
  CX.moveTo(w*.06,h*.20);
  CX.quadraticCurveTo(w*.5,h*.10,w*.94,h*.20);
  CX.lineTo(w*.94,h*.94);
  CX.quadraticCurveTo(w*.5,h*.99,w*.06,h*.94);
  CX.closePath();CX.stroke();
  CX.fillStyle='rgba(20,16,26,.6)';CX.fill();
  /* costura */
  CX.setLineDash([4,5]);CX.strokeStyle='rgba(140,120,90,.22)';CX.lineWidth=1;
  CX.beginPath();
  CX.moveTo(w*.09,h*.23);CX.quadraticCurveTo(w*.5,h*.14,w*.91,h*.23);
  CX.lineTo(w*.91,h*.91);CX.quadraticCurveTo(w*.5,h*.96,w*.09,h*.91);
  CX.closePath();CX.stroke();CX.setLineDash([]);

  /* nome e barras */
  CX.fillStyle='#E8E2D4';CX.textAlign='center';
  CX.font=Math.max(13,h*.045)+'px "Bodoni Moda",serif';
  CX.fillText(inf.n,w*.5,h*.09);
  const bar=(y,val,max,cor,txt)=>{
    const bw=w*.36,bx=w*.5-bw/2;
    CX.fillStyle='rgba(255,255,255,.07)';CX.fillRect(bx,y,bw,h*.014);
    const f=trava(val/max,0,1);
    CX.fillStyle=f>.92?'#8C2F1E':cor;CX.fillRect(bx,y,bw*f,h*.014);
    CX.fillStyle='rgba(232,226,212,.55)';
    CX.font=Math.max(8,h*.026)+'px "Share Tech Mono",monospace';
    CX.fillText(txt,w*.5,y-h*.008);
  };
  bar(h*.145,pk,inf.kg,'#C9A227',`peso ${pk.toFixed(1)} / ${inf.kg.toFixed(0)} kg`);
  bar(h*.185,vl,inf.vol,'#7A8B7F',`espaço ${vl} / ${inf.vol}`);

  /* a grade de itens */
  GRADE=[];
  const cols=4,cel=Math.min(w*.19,h*.15);
  const x0=w*.5-(cols*cel)/2+cel/2,y0=h*.30;
  m.itens.forEach((it,i)=>{
    const cx=x0+(i%cols)*cel,cy=y0+Math.floor(i/cols)*cel*1.04;
    if(cy>h*.90)return;
    const e=CATALOGO[it.id];
    CX.fillStyle='rgba(255,255,255,.035)';
    CX.fillRect(cx-cel*.44,cy-cel*.44,cel*.88,cel*.88);
    CX.strokeStyle=e.anomalo?'rgba(150,80,160,.5)'
      :(e.raro>=4?'rgba(201,162,39,.42)':'rgba(120,110,130,.22)');
    CX.lineWidth=1;CX.strokeRect(cx-cel*.44,cy-cel*.44,cel*.88,cel*.88);
    desItem(it.id,cx,cy-cel*.05,cel*.78);
    if(it.q>1){
      CX.fillStyle='#E8E2D4';CX.textAlign='right';
      CX.font=Math.max(9,cel*.19)+'px "Share Tech Mono",monospace';
      CX.fillText('×'+it.q,cx+cel*.40,cy+cel*.38);
    }
    GRADE.push({id:it.id,x:cx,y:cy,r:cel*.44});
  });
  /* as mãos */
  const maos=S.maos||[];
  CX.textAlign='center';
  CX.fillStyle='rgba(232,226,212,.4)';
  CX.font=Math.max(8,h*.026)+'px "Share Tech Mono",monospace';
  CX.fillText(maos.length?'NAS MÃOS':'mãos livres',w*.5,h*.955);
  maos.forEach((id,i)=>{
    const cx=w*(.5+(i-(maos.length-1)/2)*.17),cy=h*.895;
    CX.strokeStyle='rgba(201,162,39,.35)';CX.lineWidth=1;
    CX.beginPath();CX.arc(cx,cy,cel*.36,0,7);CX.stroke();
    desItem(id,cx,cy,cel*.60);
    GRADE.push({id,x:cx,y:cy,r:cel*.36,mao:true});
  });
  if(!m.itens.length&&!maos.length){
    CX.fillStyle='rgba(232,226,212,.28)';
    CX.font='italic '+Math.max(12,h*.038)+'px "Crimson Pro",serif';
    CX.fillText('Vazia.',w*.5,h*.55);
  }
  vinheta(w,h,.9);
}

function toqueMochila(e){
  if(cena.modo!=='mochila'||!GRADE.length)return;
  if(!CV||typeof CV.getBoundingClientRect!=='function')return;
  const r=CV.getBoundingClientRect();
  if(!r.width||!r.height)return;
  const x=(e.clientX-r.left)*(CV.width/DPR)/r.width;
  const y=(e.clientY-r.top)*(CV.height/DPR)/r.height;
  const hit=GRADE.find(g=>Math.hypot(g.x-x,g.y-y)<=g.r);
  if(hit)fichaItem(hit.id,hit.mao);
}

function gerarCasa(chaveLocal,i){
  const ch=chaveLocal+'#'+i;

  if(V[ch])return {...V[ch],chave:ch,jaVista:true};
  const h=hashNome(ch+S.semente);
  /* casa de Sumaúma é prédio, casa do Andirobal é de madeira:
     cada cidade sorteia dentro do que existe lá */
  const C=CIDADES[cidadeAtual()]||CIDADES.cacoal;
  const permitidos=(C.casas&&C.casas.length)?C.casas:Object.keys(TIPO_CASA);

  const usar=tipos.length?tipos:Object.entries(TIPO_CASA);
  const tot=usar.reduce((s,[,t])=>s+t.p,0);
  let r=semente(h,1)*tot,tipo=usar[0][0];
  for(const [k,t] of usar){r-=t.p;if(r<=0){tipo=k;break;}}

  const dec=pesoEstagio(cidadeAtual()).ord;

  const nc=2+Math.floor(semente(h,2)*3);
  const comodos=COMODOS_CASA.filter(c=>semente(h,c.id.length+3)<c.p)
    .slice(0,nc+1);
  if(!comodos.length)comodos.push(COMODOS_CASA[0]);
  const casa={chave:ch,tipo,
    estado:(()=>{
      const s4=semente(h,4),d=pesoEstagio(cidadeAtual()).ord;
      if(d>=3&&s4<.30)return 'queimada';
      if(d>=2&&s4<.50)return 'saqueada';
      if(S.dia>4&&s4<.3+d*.12)return 'revirada';
      return 'intacta';
    })(),
    comodos:comodos.map(c=>({...c,vasculhado:0,achado:false})),
    porta:semente(h,5)<.45?'trancada':'aberta',
    janela:semente(h,6)<.6,

function salvarCasa(c){
  const V=casasVistas();
  V[c.chave]={...c};
  // não deixa crescer sem limite
  const ks=Object.keys(V);
  if(ks.length>60)delete V[ks[0]];
}

/* ---------- desenho da fachada ---------- */
function desenharCasaFora(w,h,t){
  const c=cena.casaAtual;
  if(!c)return;
  const T=TIPO_CASA[c.tipo];
  const g=CX.createLinearGradient(0,0,0,h);
  const noite=S.hora>=18||S.hora<6;
  g.addColorStop(0,noite?'#0A0A14':'#1A1620');
  g.addColorStop(1,'#08060A');
  CX.fillStyle=g;CX.fillRect(0,0,w,h);
  // rua
  CX.fillStyle='#141018';CX.fillRect(0,h*.78,w,h*.22);
  CX.strokeStyle='rgba(90,80,70,.2)';CX.lineWidth=1;
  for(let i=0;i<6;i++)dLinha(w*(i/6),h*.80,w*(i/6)+w*.04,h,'rgba(90,80,70,.14)',1);
  // muro e portão
  CX.fillStyle='#241E28';CX.fillRect(0,h*.62,w,h*.17);
  // corpo
  const bx=w*.16,bw=w*.68,by=h*.30,bh=h*.34;
  CX.fillStyle=T.fach;CX.fillRect(bx,by,bw,bh);
  CX.fillStyle='rgba(0,0,0,.28)';CX.fillRect(bx,by,bw*.16,bh);
  // telhado
  CX.fillStyle=c.estado==='queimada'?'#2A2226':'#6A4438';
  CX.beginPath();CX.moveTo(bx-w*.05,by);CX.lineTo(w*.5,by-h*.15);
  CX.lineTo(bx+bw+w*.05,by);CX.closePath();CX.fill();
  if(c.telhado){
    CX.fillStyle='#0A0810';
    CX.fillRect(w*.5-w*.04,by-h*.09,w*.08,h*.05);
  }
  // porta
  const px=w*.44,pw=w*.12,ph=bh*.52;
  CX.fillStyle=c.violada?'#1A1218':'#3A2A22';
  CX.fillRect(px,by+bh-ph,pw,ph);
  CX.strokeStyle='#221A18';CX.lineWidth=1;CX.strokeRect(px,by+bh-ph,pw,ph);
  if(c.porta==='trancada'&&!c.violada)dCirc(px+pw*.82,by+bh-ph*.5,w*.008,'#C9A227');
  if(c.violada){
    CX.strokeStyle='#0A0810';CX.lineWidth=2;
    dLinha(px,by+bh-ph,px+pw,by+bh-ph*.4,'#0A0810',2);
  }
  // janelas
  const jw=w*.11,jh=bh*.24;
  [[bx+bw*.10,by+bh*.18],[bx+bw*.72,by+bh*.18]].forEach(([jx,jy],i)=>{
    const quebrada=c.janela&&i===0;
    CX.fillStyle=c.ocupada&&noite?'rgba(244,208,116,.30)':'#100C16';
    CX.fillRect(jx,jy,jw,jh);
    CX.strokeStyle='#2A2228';CX.lineWidth=1.5;CX.strokeRect(jx,jy,jw,jh);
    dLinha(jx+jw/2,jy,jx+jw/2,jy+jh,'#2A2228',1);
    dLinha(jx,jy+jh/2,jx+jw,jy+jh/2,'#2A2228',1);
    if(quebrada){
      CX.strokeStyle='#0A0810';CX.lineWidth=1.5;
      dLinha(jx+jw*.2,jy,jx+jw*.75,jy+jh*.8,'#0A0810',1.5);
      dLinha(jx+jw*.8,jy+jh*.1,jx+jw*.3,jy+jh,'#0A0810',1.5);
    }
  });
  // número da casa
  CX.fillStyle='rgba(232,226,212,.30)';CX.textAlign='center';
  CX.font=Math.max(9,h*.028)+'px "Share Tech Mono",monospace';
  CX.fillText(c.num,w*.5,by+bh+h*.045);
  // mato do abandono
  if(c.tipo==='abandonada'||c.estado==='saqueada'){
    CX.strokeStyle='#3A4A34';CX.lineWidth=1.5;
    for(let i=0;i<22;i++){
      const gx=w*(.05+Math.random()*.9);
      CX.beginPath();CX.moveTo(gx,h*.79);
      CX.lineTo(gx+(Math.random()-.5)*w*.02,h*.79-h*.05*Math.random());CX.stroke();
    }
  }
  // sinal de anomalia
  if(TIPO_CASA[c.tipo].anomala){
    CX.fillStyle=`rgba(150,80,160,${.04+Math.sin(t*1.4)*.03})`;
    CX.fillRect(0,0,w,h);
  }
  if(c.ocupada&&noite){
    CX.fillStyle=`rgba(244,208,116,${.03+Math.sin(t*2)*.02})`;
    CX.fillRect(bx,by,bw,bh);
  }
  if(S.chuva)desenharChuva(w,h,t);
  vinheta(w,h,.95);
}

/* ---------- entrar ---------- */
async function chegarNaCasa(casa,voltar){
  cena.casaAtual=casa;
  const antes=cena.modo;
  cena.modo='casafora';dimensionar();
  limpar();AC.innerHTML='';
  const T=TIPO_CASA[casa.tipo];
  cap('Número '+casa.num);
  await pausa(600);
  diz(`É uma ${T.n}.`,'narr');
  if(casa.jaVista&&casa.violada)diz('Você já entrou aqui. A porta continua do jeito que você deixou.','fraco');
  if(casa.estado==='revirada')diz('Alguém passou por aqui antes. As gavetas estão todas abertas.','fraco');
  if(casa.ocupada)diz('Tem alguma coisa lá dentro. Você não sabe o quê.','perigo');
  await pausa(900);
  menuFora(casa,voltar);
}

function menuFora(casa,voltar){
  AC.innerHTML='';
  const dentro=()=>entrarNaCasa(casa,voltar);
  botao('Olhar pela janela antes',acaoRua(0,async()=>{
    limpar();cap('Pela janela');
    const T=TIPO_CASA[casa.tipo];
    diz(`Dá pra ver ${casa.comodos.length===1?'um cômodo':'parte de dentro'}. ${sortear([
      'Móvel no lugar, poeira em tudo.','Está tudo revirado lá dentro.',
      'Tem prato na mesa. Comida servida.','Escuro demais pra ver o fundo.'])}`,'narr');
    if(casa.ocupada){
      diz(chance(.6)?'E tem alguma coisa que se mexeu quando você chegou perto.'
        :'Não dá pra ver o que está lá.','perigo');
      casa.viuOcupante=true;
    }else diz('Não parece ter ninguém.','sist');
    casa.barulho+=1;
    menuFora(casa,voltar);
  }),{custo:'quase sem risco'});

  if(casa.porta==='aberta')botao('Entrar pela porta',dentro,{cls:'prim',custo:'está destrancada'});
  else{
    botao('Tentar a porta',acaoRua(0,async()=>{
      limpar();
      if(temItem('chave')&&chance(.3)){
        largar('chave',1);casa.porta='aberta';
        diz('Uma das chaves do molho serve. Você não esperava por isso.','bom');
      }else diz('Trancada. Não cede.','fraco');
      menuFora(casa,voltar);
    }),{custo:temItem('chave')?'você tem um molho de chaves':'trancada'});
    const arma=melhorArma();
    botao('Arrombar',acaoRua(0,async()=>{
      limpar();
      const forca=(temFerra('martelo')?.3:0)+(arma&&arma.dano>=3?.3:0)+.35;
      casa.barulho+=4;
      if(chance(forca)){
        casa.porta='aberta';casa.violada=true;
        diz('A madeira do batente racha e a porta abre.','bom');
        diz('O barulho foi alto. Alguém pode ter ouvido.','alerta');
      }else{
        diz('Você bate três vezes e ela não abre. Só fez barulho.','perigo');
      }
      menuFora(casa,voltar);
    }),{custo:'+4 barulho'});
  }
  if(casa.janela)botao('Entrar pela janela quebrada',acaoRua(0,async()=>{
    limpar();
    if(chance(.82)){diz('Você passa pelo vão sem encostar no vidro.','bom');dentro();}
    else{diz('Você se corta no caco ao passar. Não é fundo, mas sangra.','perigo');
      S.ferido=(S.ferido||0)+1;dentro();}
  }),{custo:'silencioso · pode cortar'});
  if(casa.lateral)botao('Procurar entrada lateral',acaoRua(0,async()=>{
    limpar();
    diz('Tem um portãozinho no corredor lateral, e ele só está encostado.','bom');
    casa.porta='aberta';casa.barulho=Math.max(0,casa.barulho-1);
    menuFora(casa,voltar);
  }),{custo:'sem barulho'});
  if(casa.telhado&&temFerra('escada'))botao('Subir pelo telhado',acaoRua(0,async()=>{
    limpar();
    if(chance(.7)){diz('Você entra pelo alçapão do sótão, direto no melhor cômodo.','bom');
      casa.entradaSotao=true;dentro();}
    else{diz('A telha cede e você desce mais rápido do que queria.','perigo');
      S.ferido=(S.ferido||0)+1;dentro();}
  }),{custo:'escada · direto no sótão'});

  botao('Deixar essa casa pra lá',()=>{salvarCasa(casa);voltar();},{cls:'chave'});
}

/* helper: ação de rua sem gastar hora da casa */
const acaoRua=(n,f)=>async()=>{AC.innerHTML='';await f();};

/* ---------- dentro ---------- */
async function entrarNaCasa(casa,voltar){
  casa.violada=true;
  cena.modo='casafora';
  limpar();AC.innerHTML='';cap('Dentro da '+TIPO_CASA[casa.tipo].n);
  await pausa(700);
  diz(sortear([
    'Cheiro de mofo e de coisa fechada.',
    'A casa é fria por dentro. Mais fria do que a rua.',
    'Tem poeira no ar, levantada pela sua entrada.',
    'Alguém morou aqui até semana passada. Dá pra sentir.']),'narr');
  if(casa.entradaSotao)diz('Você caiu direto no sótão. Metade da casa nem precisa ser cruzada.','bom');
  await pausa(800);
  menuDentro(casa,voltar);
}

function menuDentro(casa,voltar){
  AC.innerHTML='';
  const T=TIPO_CASA[casa.tipo];
  const risco=riscoCasa(casa);
  if(risco>=.5)diz('Você está aqui dentro há tempo demais.','perigo');

  casa.comodos.forEach(c=>{
    const esg=c.vasculhado>=3;
    botao((c.vasculhado?'Vasculhar de novo: ':'Vasculhar ')+c.n,
      ()=>vasculharCasa(casa,c,voltar),
      {custo:esg?'já tirou tudo':c.vasculhado?'sobrou pouco':'ainda intacto'});
  });
  if(casa.ocupada&&!casa.enfrentado)
    botao('Procurar o que está aqui dentro',()=>encararOcupante(casa,voltar),
      {cls:'prim',custo:'perigoso'});
  botao('Ver a mochila',()=>telaMochila(()=>menuDentro(casa,voltar)),
    {custo:pesoAtual().toFixed(1)+'/'+mochilaInfo().kg.toFixed(0)+'kg'});
  botao('Sair dessa casa',()=>{
    salvarCasa(casa);
    diz('Você sai e fecha o que dá pra fechar.','narr');
    voltar();
  },{cls:'chave'});
}

function riscoCasa(casa){
  const T=TIPO_CASA[casa.tipo];
  const usos=casa.comodos.reduce((s,c)=>s+c.vasculhado,0);
  return trava(.04+usos*.035+casa.barulho*.04+T.risco*.04+S.dia*.008,0,.85);
}

async function vasculharCasa(casa,com,voltar){
  AC.innerHTML='';limpar();cap(com.n);
  com.vasculhado++;
  casa.barulho+=chance(.3)?1:0;
  await pausa(600);

  /* o que sai depende do tipo da casa e do cômodo */
  const T=TIPO_CASA[casa.tipo];
  let pool=T.loot.filter(id=>CATALOGO[id]);
  if(com.favor)pool=pool.concat(pool.filter(id=>com.favor.includes(CATALOGO[id].cat)));
  const qtd=Math.max(0,Math.round((3-com.vasculhado+1)*T.riqueza*(.4+Math.random()*.8))
    -(casa.estado==='revirada'?1:0));
  if(qtd<=0){
    diz(sortear(['Nada. Já levaram o que prestava.','Só lixo e roupa velha.',
      'Você revira e não sobrou nada aqui.']),'narr');
  }else{
    const achou=[];
    /* mochila melhor é achado especial, não item de mochila */
    if(chance(.10+(T.riqueza-1)*.06)){
      const tipos=['sacola','escolar','comum','viagem','militar','carrinho'];
      const alvo=tipos[Math.min(tipos.length-1,
        Math.floor((T.riqueza+S.dia*.15+Math.random()*1.6)))];
      const r=acharMochila(alvo);
      if(r)diz(r,'bom');
    }
    for(let i=0;i<qtd;i++){
      const id=sortear(pool);
      const e=CATALOGO[id];
      if(!e)continue;
      if(e.raro>=4&&!chance(.35))continue;
      const q=e.pilha?1+Math.floor(Math.random()*Math.min(3,e.pilha)):1;
      achou.push({id,q});
    }
    if(!achou.length)diz('Quase nada. Um ou outro trapo.','narr');
    else{
      diz('Você acha:','sist');
      achou.forEach(a=>{
        const e=CATALOGO[a.id];
        const posto=guardar(a.id,a.q);
        if(posto)diz(`· ${e.n}${a.q>1?' ×'+a.q:''} — ${e.d}`,e.raro>=4?'bom':'narr');
        if(posto<a.q){
          const sobra=a.q-posto;
          diz(`  (não coube ${sobra>1?sobra+' unidades':'uma unidade'} — a mochila está no limite)`,'alerta');
          casa.sobrou=casa.sobrou||[];casa.sobrou.push({id:a.id,q:sobra});
        }
      });
    }
  }
  /* o risco cobra */
  if(chance(riscoCasa(casa))){
    await pausa(900);
    await sustoNaCasa(casa,voltar);
    return;
  }
  await pausa(700);
  menuDentro(casa,voltar);
}

async function sustoNaCasa(casa,voltar){
  const T=TIPO_CASA[casa.tipo];
  limpar();AC.innerHTML='';
  estalo(chance(.5)?-.6:.6);
  const tipos=[
    {t:'Alguma coisa cai no cômodo do lado.',
     f:()=>{casa.barulho+=2;return 'Você fica parado dois minutos. Não vem mais nada.';}},
    {t:'Tem passo em cima de você. No forro.',
     f:()=>{casa.ocupada=true;return 'Anda de um lado pro outro e para bem em cima da sua cabeça.';}},
    {t:'A porta pela qual você entrou fechou.',
     f:()=>{casa.porta='trancada';return 'Não estava ventando.';}},
    {t:'Você ouve alguém falando baixo em outro cômodo.',
     f:()=>{casa.ocupada=true;return 'São duas vozes. Ou uma fazendo duas.';}}
  ];
  const s=sortear(tipos);
  diz(s.t,'perigo');
  await pausa(1300);
  diz(s.f(),'narr');
  await pausa(1000);
  AC.innerHTML='';
  botao('Sair daqui agora',()=>{
    salvarCasa(casa);
    diz('Você sai rápido, sem olhar pra trás.','sist');
    voltar();
  },{cls:'prim'});
  botao('Continuar vasculhando mesmo assim',()=>{
    casa.barulho+=2;menuDentro(casa,voltar);
  },{custo:'o risco sobe'});
}

async function encararOcupante(casa,voltar){
  AC.innerHTML='';limpar();cap('O que está aqui dentro');
  casa.enfrentado=true;
  await pausa(800);
  const T=TIPO_CASA[casa.tipo];
  const bicho=T.anomala||chance(.55);
  if(!bicho){
    diz('É gente. Um homem sozinho, magro, encostado na parede da cozinha com uma faca na mão.','perigo');
    await pausa(1300);
    diz('Ele não avança. Ele também está com medo.','narr');
    await pausa(900);
    AC.innerHTML='';
    botao('Dizer que você só quer comida',async()=>{
      AC.innerHTML='';
      if(chance(.6)){
        diz('Ele aponta pra um armário e não fala nada. Vocês dividem a casa por dez minutos.','bom');
        guardar('lata',2);
      }else{diz('Ele grita pra você sair. Você sai.','perigo');salvarCasa(casa);return voltar();}
      menuDentro(casa,voltar);
    });
    botao('Oferecer alguma coisa em troca',async()=>{
      AC.innerHTML='';
      if(temItem('lata')&&largar('lata',1)){
        diz('Você deixa uma lata no chão e empurra com o pé. Ele deixa você vasculhar o resto.','bom');
        casa.ocupada=false;
      }else diz('Você não tem nada pra oferecer. Ele percebe isso.','fraco');
      menuDentro(casa,voltar);
    },{custo:'1 lata'});
    botao('Sair sem virar as costas',()=>{salvarCasa(casa);voltar();},{cls:'chave'});
    return;
  }
  const b=sortearBicho();
  assinatura(b.id,0,.9);
  await pausa(1600);
  diz('Não é gente.',TIPO_CASA[casa.tipo].anomala?'alerta':'perigo');
  await pausa(1200);
  diz('É '+b.n+'. E está entre você e a porta.','perigo');
  await pausa(1000);
  AC.innerHTML='';
  const arma=melhorArma();
  if(arma)botao(`Enfrentar com ${arma.n.toLowerCase()}`,async()=>{
    AC.innerHTML='';
    if(arma.municao&&!usarMunicao(arma))return diz('Está descarregada.','perigo');
    if(arma.municao){S.ruido=trava(S.ruido+14,0,100);
      diz('O tiro dentro de casa ensurdece você por uns segundos.','alerta');}
    const p=trava(arma.dano/(arma.dano+b.forca*2.2),.15,.85);
    await pausa(1100);
    if(chance(p)){
      diz('Você acerta, e acerta de novo, e ela para de se mexer.','bom');
      casa.ocupada=false;S.matou=(S.matou||0)+1;
      menuDentro(casa,voltar);
    }else{
      diz('Você erra. Ela não.','perigo');
      S.ferido=(S.ferido||0)+2;salvarCasa(casa);
      diz('Você sai correndo pela janela e deixa metade do que pegou pra trás.','perigo');
      mochila().itens=mochila().itens.slice(0,Math.ceil(mochila().itens.length/2));
      voltar();
    }
  },{custo:Math.round(trava(arma.dano/(arma.dano+b.forca*2.2),.15,.85)*100)+'%'});
  botao('Sair de fininho',async()=>{
    AC.innerHTML='';
    const p=trava(.72-casa.barulho*.06,.2,.8);
    if(chance(p)){diz('Você sai sem que ela perceba. Deixa a casa pra ela.','sist');}
    else{diz('Ela percebe. Você corre e perde parte do que carregava.','perigo');
      S.ferido=(S.ferido||0)+2;mochila().itens=mochila().itens.slice(0,Math.ceil(mochila().itens.length*.6));}
    salvarCasa(casa);voltar();
  },{cls:'chave',custo:Math.round(trava(.72-casa.barulho*.06,.2,.8)*100)+'%'});
}

/* ---------- a rua com casas ---------- */
function menuRuaCasas(local,voltar){
  AC.innerHTML='';limpar();cap('A rua do '+local.n.toLowerCase());
  diz('A quadra tem casa dos dois lados. Dá pra escolher em qual entrar.','narr');
  const n=3+Math.floor(Math.random()*2);
  for(let i=0;i<n;i++){
    const casa=gerarCasa(local.id,i);
    const T=TIPO_CASA[casa.tipo];
    const pistas=[];
    if(casa.jaVista&&casa.violada)pistas.push('você já entrou');
    if(casa.estado==='revirada')pistas.push('parece revirada');
    if(casa.porta==='trancada')pistas.push('portão fechado');
    if(casa.janela)pistas.push('janela quebrada');
    botao(`Número ${casa.num} — ${T.n}`,()=>chegarNaCasa(casa,voltar),
      {custo:pistas.join(' · ')||'nada de fora'});
  }
  botao('Voltar pra rua principal',voltar,{cls:'chave'});
}

<script>
/* ================= LUZ, POEIRA E SOMBRA =================
   Camadas que passam por cima de qualquer cena e dão volume
   sem precisar redesenhar nada do que já existe. */

/* ---------- poeira suspensa no facho ---------- */
let _po=null;
function poeira(w,h,t,dens){
  if(!_po||_po.length<40){
    _po=[];
    for(let i=0;i<70;i++)_po.push({
      x:Math.random(),y:Math.random(),
      vx:(Math.random()-.5)*.00045,vy:-.00018-Math.random()*.00035,
      r:.4+Math.random()*1.3,o:.05+Math.random()*.22,f:Math.random()*7
    });
  }
  const q=Math.round((dens==null?1:dens)*_po.length);
  for(let i=0;i<q;i++){
    const p=_po[i];
    p.x+=p.vx;p.y+=p.vy;p.f+=.02;
    if(p.y<-.05){p.y=1.05;p.x=Math.random();}
    if(p.x<-.05)p.x=1.05;if(p.x>1.05)p.x=-.05;
    const cin=.55+Math.sin(p.f)*.45;
    CX.fillStyle=`rgba(232,222,196,${p.o*cin})`;
    CX.beginPath();CX.arc(p.x*w,p.y*h,p.r,0,7);CX.fill();
  }
}

/* ---------- o facho do lampião com volume ---------- */
function fachoLampiao(w,h,t,cx,cy,forca){
  const f=forca==null?1:forca;
  const tremor=1+Math.sin(t*7.3)*.035+Math.sin(t*13.1)*.018;
  const r=h*.72*f*tremor;
  // halo quente
  const g=CX.createRadialGradient(cx,cy,h*.02,cx,cy,r);
  g.addColorStop(0,`rgba(255,214,140,${.22*f})`);
  g.addColorStop(.35,`rgba(220,170,90,${.10*f})`);
  g.addColorStop(.7,`rgba(160,110,50,${.035*f})`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  CX.globalCompositeOperation='lighter';
  CX.fillStyle=g;
  CX.beginPath();CX.arc(cx,cy,r,0,7);CX.fill();
  CX.globalCompositeOperation='source-over';
  // escurece o que está longe da luz
  const s=CX.createRadialGradient(cx,cy,r*.30,cx,cy,r*1.25);
  s.addColorStop(0,'rgba(0,0,0,0)');
  s.addColorStop(1,`rgba(4,3,7,${.62*f})`);
  CX.fillStyle=s;CX.fillRect(0,0,w,h);
}

/* ---------- sombra projetada por um objeto ---------- */
function sombraDe(cx,cy,lx,ly,larg,alt,forca){
  const dx=cx-lx,dy=cy-ly;
  const d=Math.hypot(dx,dy)||1;
  const esc=1+d*.0016;
  CX.save();
  CX.translate(cx,cy);
  CX.transform(1,0,dx/d*.55,.34,0,0);
  CX.scale(esc,esc);
  const g=CX.createRadialGradient(0,0,0,0,0,larg*1.1);
  g.addColorStop(0,`rgba(0,0,0,${.44*(forca==null?1:forca)})`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  CX.fillStyle=g;
  CX.beginPath();CX.ellipse(0,0,larg,alt,0,0,7);CX.fill();
  CX.restore();
}

/* ---------- textura de superfície ---------- */
let _tex=null;
function textura(w,h,forca){
  if(!_tex||_tex.w!==w){
    _tex={w,pontos:[]};
    for(let i=0;i<340;i++)_tex.pontos.push({
      x:Math.random(),y:Math.random(),
      r:.5+Math.random()*1.6,o:Math.random()
    });
  }
  const f=forca==null?1:forca;
  _tex.pontos.forEach(p=>{
    CX.fillStyle=p.o>.5
      ?`rgba(255,245,225,${(p.o-.5)*.055*f})`
      :`rgba(0,0,0,${(.5-p.o)*.10*f})`;
    CX.fillRect(p.x*w,p.y*h,p.r,p.r);
  });
}

/* ---------- respiração da imagem ---------- */
function respiraImagem(w,h,t){
  const s=1+Math.sin(t*.55)*.0022+Math.sin(t*.31)*.0013;
  CX.translate(w/2,h/2);CX.scale(s,s);CX.translate(-w/2,-h/2);
}

/* ---------- borda escura viva ---------- */
function vinhetaViva(w,h,t,forca){
  const f=forca==null?1:forca;
  const pul=1+Math.sin(t*.9)*.03;
  const g=CX.createRadialGradient(w*.5,h*.48,h*.22*pul,w*.5,h*.5,h*1.02);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(.55,`rgba(6,4,9,${.20*f})`);
  g.addColorStop(1,`rgba(3,2,5,${.90*f})`);
  CX.fillStyle=g;CX.fillRect(0,0,w,h);
}

/* ---------- aberração cromática nas bordas ---------- */
function franja(w,h,forca){
  const f=(forca==null?1:forca);
  if(f<=0)return;
  CX.globalCompositeOperation='screen';
  const e=CX.createLinearGradient(0,0,w*.10,0);
  e.addColorStop(0,`rgba(90,40,140,${.10*f})`);
  e.addColorStop(1,'rgba(0,0,0,0)');
  CX.fillStyle=e;CX.fillRect(0,0,w*.10,h);
  const d=CX.createLinearGradient(w,0,w*.90,0);
  d.addColorStop(0,`rgba(140,40,40,${.10*f})`);
  d.addColorStop(1,'rgba(0,0,0,0)');
  CX.fillStyle=d;CX.fillRect(w*.90,0,w*.10,h);
  CX.globalCompositeOperation='source-over';
}

/* ================= A CAMADA QUE JUNTA TUDO =================
   Uma chamada só no fim do laço. Cada cena decide a força. */
function acabamento(w,h,t){
  const m=cena.modo;
  if(m==='mochila'||m==='mapa'||m==='fim'||m==='vazio')return;

  const noite=S.hora>=19||S.hora<6;
  const claro=visibilidade?visibilidade():1;

  if(m==='casa'){
    const c=cena.casa;
    const perigo=c&&c.monstro!=null;
    // o que está no cômodo joga sombra a partir do lampião
    const lx=w*.5,ly=h*.55;
    sombraDe(w*.28,h*.78,lx,ly,w*.10,h*.03,noite?.9:.4);
    sombraDe(w*.72,h*.80,lx,ly,w*.08,h*.025,noite?.8:.35);
    if(perigo)sombraDe(w*.5,h*.84,lx,ly,w*.16,h*.05,1);
    fachoLampiao(w,h,t,lx,ly,noite?1:.42);
    poeira(w,h,t,noite?1:.55);
    textura(w,h,.8);
    if(perigo)franja(w,h,.7);
    vinhetaViva(w,h,t,noite?1:.72);
  }else if(m==='porta'){
    fachoLampiao(w,h,t,w*.5,h*.28,.55);
    poeira(w,h,t,.7);
    textura(w,h,1);
    vinhetaViva(w,h,t,.95);
  }else if(m==='rua'||m==='casafora'){
    poeira(w,h,t,noite?.5:.85);
    textura(w,h,.55);
    if(S.clima==='neblina'){
      CX.fillStyle='rgba(180,186,196,.16)';CX.fillRect(0,0,w,h);
      const g=CX.createLinearGradient(0,h*.3,0,h);
      g.addColorStop(0,'rgba(190,196,206,.02)');
      g.addColorStop(1,'rgba(190,196,206,.20)');
      CX.fillStyle=g;CX.fillRect(0,0,w,h);
    }
    vinhetaViva(w,h,t,noite?1:.62/Math.max(.4,claro));
  }else if(m==='olho'){
    poeira(w,h,t,.35);
    franja(w,h,.45);
  }else if(m==='escuta'){
    poeira(w,h,t,.25);
  }
}
</script>
<script>
/* ================= AS PISTAS SERVEM PRA ALGUMA COISA =================
   Ler não é sabor: cada tipo entrega uma vantagem concreta. */

const SOBRENOMES=['Bezerra','Nogueira','da Paz','Siqueira','Falcão','Andrade',
 'Quirino','Moura','Ribamar','Teixeira','Vasconcelos','Amorim'];
const PRIMEIROS=['Aparecida','Jonas','Iraci','Sebastião','Neide','Válter',
 'Cleusa','Adenilson','Rosimar','Genival','Lindalva','Edmilson'];

function nomeInventado(){
  return sortear(PRIMEIROS)+' '+sortear(SOBRENOMES);
}

/* uma pista lida vira vantagem de verdade */
function lerPista(id){
  const e=CATALOGO[id];
  if(!e)return null;
  const dia=S.dia;

  if(id==='foto'){
    /* põe uma voz nova no seu repertório: você passa a reconhecer
       de ouvido alguém que você nunca conheceu vivo */
    const n=nomeInventado();
    const pes={n:n.split(' ')[0],id:30+Math.floor(Math.random()*25),alt:.45+Math.random()*.15,
      hab:'—',ef:'—',frase:'Sou eu. Você não lembra de mim?',mem:'uma foto que você achou',
      fala:['Eu morava aqui perto.']};
    registrarVoz(pes,`você achou uma foto dela numa casa vazia, no dia ${dia}`);
    S.vozesOuvidas=S.vozesOuvidas||[];
    if(!S.vozesOuvidas.includes(pes.n))S.vozesOuvidas.push(pes.n);
    return {t:`Uma família na frente de uma casa azul. Atrás, a caneta desbotada: "${n}, ${2000+Math.floor(Math.random()*20)}".`,
      efeito:`Agora você conhece a cara de ${pes.n}. Se essa voz bater na sua porta, você vai saber que não é dessa casa.`,
      cls:'sist'};
  }

  if(id==='documento'){
    /* revela um local que ainda rende */
    const pool=poolDeLocais();
    const bons=pool.filter(l=>(S.esgotados[l.id]||0)<1);
    const l=bons.length?sortear(bons):sortear(pool);
    S.dicaLocal=S.dicaLocal||[];
    if(!S.dicaLocal.includes(l.id))S.dicaLocal.push(l.id);
    S.trilha=S.trilha||[];
    if(!S.trilha.includes(l.id))S.trilha.push(l.id);
    return {t:`Uma conta de luz com endereço. O carimbo é de dois meses antes de tudo isso começar.`,
      efeito:`O endereço é ${l.n}. Marcado no mapa — e ninguém mexeu lá ainda.`,cls:'bom'};
  }

  if(id==='celular'){
    const msgs=[
      'a última mensagem na tela travada é "não abre pra ninguém, nem pra mim"',
      'a tela mostra 41 chamadas não atendidas do mesmo número',
      'o último áudio tem 3 segundos e é só alguém respirando',
      'a foto da tela de bloqueio é a rua de vocês, tirada de dentro de um carro',
      'o alarme está marcado pra 4h47 e continua tocando na sua cabeça'];
    memAnom().nivel=Math.max(0,memAnom().nivel-1);
    return {t:`Sem bateria, mas ${sortear(msgs)}.`,
      efeito:'Você entende um pouco melhor o que aconteceu aqui. Fica mais difícil ela te enganar.',
      cls:'alerta'};
  }

  if(id==='livro'||id==='caderno'){
    /* estudar melhora a sua leitura de anomalia */
    S.estudo=(S.estudo||0)+1;
    const txt=id==='caderno'
      ?['as últimas páginas são a mesma frase repetida por trinta linhas',
        'tem um desenho da planta de uma casa com um cômodo a mais do que a casa tem',
        'alguém anotou a hora de cada barulho durante nove noites seguidas',
        'a letra vai piorando página por página até virar risco']
      :['tem uma anotação a lápis na margem de quase toda página',
        'as páginas 88 a 104 foram arrancadas com cuidado',
        'é um manual de instalação elétrica, e é mais útil do que parece',
        'alguém sublinhou só os verbos, o livro inteiro'];
    return {t:`Você senta e lê. ${sortear(txt)}.`,
      efeito:`Você aprende a reparar em coisa que não reparava. (estudo ${S.estudo}: +${Math.min(18,S.estudo*6)}% em toda investigação)`,
      cls:'bom'};
  }

  if(id==='estranho'){
    /* mexer com objeto anômalo tem preço */
    S.anomalos=(S.anomalos||0)+1;
    memAnom().nivel=Math.min(4,memAnom().nivel+1);
    const t=['Ele não tem lado de dentro. Você vira e continua sendo o lado de fora.',
      'Pesa diferente dependendo de quem segura.',
      'Está morno. Ficou morno a semana inteira.',
      'Tem uma dobra que some quando você olha direto pra ela.'];
    if(S.anomalos>=3){
      return {t:sortear(t),
        efeito:'Três desses na mesma casa. Alguma coisa passou a saber onde você mora.',
        cls:'perigo'};
    }
    return {t:sortear(t),efeito:'Guardar isso foi uma escolha. Você fez a escolha.',cls:'perigo'};
  }
  return null;
}

/* o estudo entra na conta de investigar */
function bonusEstudo(){return Math.min(.18,(S.estudo||0)*.06);}

/* ler a pista custa tempo e é uma ação de verdade */
function menuPistas(volta){
  AC.innerHTML='';
  limpar();cap('O que dá pra ler');
  const guardadas=mochila().itens.filter(x=>CATALOGO[x.id]&&CATALOGO[x.id].cat==='pista');
  if(!guardadas.length){
    diz('Você não está carregando nada que dê pra ler.','narr');
    diz('Foto, documento, celular, livro, caderno — essas coisas aparecem nas casas e valem o peso.','fraco');
  }else{
    diz('Papel e coisa achada rendem mais do que parece.','narr');
    if(S.estudo)diz(`Você já estudou ${S.estudo} ${S.estudo===1?'vez':'vezes'}. Investigar está ${Math.round(bonusEstudo()*100)}% mais fácil.`,'sist');
  }
  guardadas.forEach(x=>{
    const e=CATALOGO[x.id];
    botao(`Examinar: ${e.n}${x.q>1?' ('+x.q+')':''}`,acaoDia(1,async()=>{
      const r=lerPista(x.id);
      largar(x.id,1);
      if(!r)return diz('Não tem nada de útil aí.','narr');
      limpar();cap(e.n);
      await pausa(600);
      diz(r.t,'narr');
      await pausa(1300);
      diz('◈ '+r.efeito,r.cls);
      anotar('Examinou: '+e.n);
    }),{custo:'1 hora · gasta o item'});
  });
  botao('Voltar',volta,{cls:'chave'});
}

/* ---------- O QUE ACONTECE COM A SUA CASA ENQUANTO VOCÊ NÃO ESTÁ ----------
   É isso que faz viagem ser decisão e não passeio. */
async function ausencia(dias){
  const r=[];
  const gente=S.abrigo.length;
  const defesa=S.porta.reforco*.5+(S.porta.tranca?2:0)+(S.armadilha?1.5:0)
    +forcaMuro()*.45+gente*.8+((S.cachorro&&S.cachorro.vivo)?1.2:0);
  for(let d=0;d<dias;d++){
    /* o gerador roda o dia inteiro e ninguém economiza como você */
    S.diesel=trava(S.diesel-11,0,100);
    if(gente)S.comida=Math.max(0,S.comida-Math.ceil(gente*.9));
    S.ruido=trava(S.ruido+7,0,100);
    // bateram na porta e você não estava
    if(chance(.75)){
      if(gente){
        const q=sortear(S.abrigo);
        if(chance(trava(.55-defesa*.035,.14,.55))){
          morreuAlguem(q,`abriu a porta enquanto você estava fora, no dia ${S.dia}`);
          r.push(`${q.n} atendeu a porta na sua ausência. ${q.n} não está mais aqui.`);
        }else r.push('Bateram na porta duas noites seguidas. Ninguém abriu.');
      }else{
        danificarPorta(14);
        r.push('Bateram e insistiram. A porta tem marca nova.');
      }
    }
    if(S.saq&&S.saq.fase>=2&&chance(.5)){
      const c=Math.min(S.comida,5);S.comida-=c;
      r.push(`Levaram ${c} de comida enquanto a casa estava sem você.`);
    }
    /* sem você na porta, alguém decide errado */
    if(gente&&chance(.28)){
      const q=sortear(S.abrigo);
      if(q&&chance(.5)){
        S.confianca=trava(S.confianca-14,0,100);
        r.push(`${q.n} abriu pra alguém que pedia ajuda. Deu certo. Dessa vez.`);
      }else{
        danificarPorta(10);
        r.push('Alguém deixou a tranca fora do lugar a noite inteira.');
      }
    }
    if(chance(.5)){
      const a=talvezNovaAvaria();
      if(a)r.push('Uma coisa quebrou e ninguém consertou: '+AVARIAS[a.id].n+'.');
    }
    crescerCanteiros();
  }
  if(gente){
    mexerMoral(-9*dias);
    S.confianca=trava(S.confianca-8*dias,0,100);
    r.push(`A casa ficou ${dias} ${dias===1?'dia':'dias'} decidindo sozinha. Isso muda alguma coisa.`);
  }
  return r;
}

async function viajarPara(cid,volta){
  const p=podeViajar(cid);
  const C=CIDADES[cid];
  AC.innerHTML='';limpar();cap('A estrada');
  if(!p.ok){diz(p.por,'perigo');
    return botao('Voltar',volta,{cls:'chave'});}
  const dias=Math.max(1,Math.ceil(C.horas/9));
  diz(`De ${VEIC[p.veic].n} até ${C.n}. ${p.gasto} de diesel e ${dias} ${dias===1?'dia':'dias'} fora de casa.`,'sist');
  await pausa(1000);
  diz('Enquanto você não estiver aqui, a casa continua sem você.','alerta');
  AC.innerHTML='';
  botao('Ir',async()=>{
    AC.innerHTML='';
    S.diesel=trava(S.diesel-p.gasto,0,100);ganhou({diesel:-p.gasto});
    limpar();cap('A estrada');
    if(A.ctx)motorViagem(p.veic);
    await pausa(1400);
    diz(sortear([
      'A estrada está limpa por uns dez quilômetros. Depois não está mais.',
      'Você passa por três carros parados na mesma curva, todos com a porta do motorista aberta.',
      'Um cachorro corre atrás do carro por quase um minuto e desiste.',
      'Tem gente pintada em cima de uma placa: uma seta e a palavra NÃO.',
      'Você não vê uma pessoa viva o caminho inteiro. Nenhuma.'
    ]),'narr');
    await pausa(1800);
    // o risco da estrada
    const risco=trava(.10+C.risco*.07-(p.veic==='carro'?.05:0),.05,.4);
    if(chance(risco)){
      diz('No meio do caminho tem um bloqueio: dois carros atravessados de propósito.','perigo');
      await pausa(1500);
      const r2=await bloqueioEstrada(C);
      if(!r2)return;
    }
    S.dia+=dias;
    const noticias=await ausencia(dias);
    S.cidade=cid;
    marcarCidade(cid,3);            // sua passagem também gasta o lugar
    if(!S.cidadesVistas)S.cidadesVistas=['cacoal'];
    if(!S.cidadesVistas.includes(cid))S.cidadesVistas.push(cid);
    S.locaisHoje=null;S.locaisDia=0;
    limpar();cap(C.n);
    diz(C.d,'sist');
    const est=estagioDe(cid);
    diz(est.t,est.id==='ativa'?'sist':'perigo');
    diz(`${C.arq[0].toUpperCase()+C.arq.slice(1)}.`,'narr');
    if(!(S.cidadesVistas||[]).includes(cid)){
      diz(C.hist,'fraco');
      diz(`Aqui era ${C.econ}.`,'fraco');
    }
    await pausa(1400);
    if(noticias.length){
      diz('De casa, pelo rádio:','fraco');
      for(const n of noticias){diz('· '+n,'perigo');await pausa(700);}
    }
    atualizarPainel();
    AC.innerHTML='';
    botao('Começar a vasculhar',()=>menuLocais(),{cls:'chave'});
  },{cls:'prim',custo:p.gasto+' diesel · '+dias+(dias===1?' dia':' dias')});
  botao('Hoje não',volta,{cls:'chave'});
}

function motorViagem(v){
  if(!A.ctx)return;
  const t=A.ctx.currentTime;
  marcarCamada('evento',4);
  const o=A.ctx.createOscillator(),g=A.ctx.createGain(),f=A.ctx.createBiquadFilter();
  o.type='sawtooth';
  o.frequency.setValueAtTime(v==='moto'?95:58,t);
  o.frequency.linearRampToValueAtTime(v==='moto'?130:74,t+2.2);
  o.frequency.linearRampToValueAtTime(v==='moto'?110:64,t+4);
  f.type='lowpass';f.frequency.value=v==='moto'?420:260;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(.07,t+.8);
  g.gain.linearRampToValueAtTime(.05,t+3.4);
  g.gain.linearRampToValueAtTime(0,t+4.6);
  o.connect(f);f.connect(g);saida(g,{pan:0,rev:.3});
  o.start(t);o.stop(t+4.7);
  const s=src(),f2=A.ctx.createBiquadFilter(),g2=A.ctx.createGain();
  f2.type='bandpass';f2.frequency.value=1600;f2.Q.value=.6;
  g2.gain.setValueAtTime(0,t);
  g2.gain.linearRampToValueAtTime(.03,t+1);
  g2.gain.linearRampToValueAtTime(0,t+4.4);
  s.connect(f2);f2.connect(g2);saida(g2,{pan:0,rev:.5});
  s.start(t);s.stop(t+4.5);
}

/* ---------- a tela ---------- */
function telaCidades(volta){
  AC.innerHTML='';limpar();cap('Sair da cidade');
  const at=cidadeInfo();
  diz(`Você está em ${at.n}. ${at.d}`,'sist');
  const v=melhorVeic();
  diz(v?`Você tem ${VEIC[v].n} funcionando.`:'Sem veículo você não sai de Cacoal.',v?'bom':'perigo');
  if(S.abrigo.length)
    diz(`${S.abrigo.length} ${S.abrigo.length===1?'pessoa fica':'pessoas ficam'} na casa sem você.`,'alerta');
  Object.keys(CIDADES).forEach(k=>{
    if(k===cidadeAtual())return;
    const C=CIDADES[k],p=podeViajar(k);
    const vista=(S.cidadesVistas||['cacoal']).includes(k);
    ficha(C.n,vista?'você já esteve lá':'nunca foi',
      C.d+' Risco da estrada: '+'▲'.repeat(C.risco||1)+'.');
    botao('Ir para '+C.n,()=>viajarPara(k,()=>telaCidades(volta)),
      {custo:p.ok?p.gasto+' diesel · '+Math.max(1,Math.ceil(C.horas/9))+'d fora':p.por});
  });
  botao('Ficar',volta,{cls:'chave'});
}

<script>

const AMEACAS={
 /* --- caçadores: se movem pelo mapa e podem te achar --- */
 matilha:{n:'a matilha',tipo:'caçador',forca:2,vel:2,

 rastreador:{n:'o que segue',tipo:'caçador',forca:3,vel:1,silencioso:true,

 enxame:{n:'o enxame',tipo:'ambiental',forca:2,vel:3,

    const t=A.ctx.currentTime;g.gain.setValueAtTime(0,t);

 /* --- do lugar: presas ao local, mas mudam o que dá pra fazer --- */
 desabamento:{n:'a estrutura',tipo:'lugar',forca:3,

 gas:{n:'o cheiro',tipo:'lugar',forca:2,

 /* --- gente --- */
 emboscada:{n:'a emboscada',tipo:'gente',forca:3,

 /* --- raro e pesado --- */
 territorio:{n:'território',tipo:'raro',forca:5,raro:true,

/* ---------- onde cada ameaça mora ---------- */
function ameacasDoLocal(l){
  const pool=[];
  const cid=CIDADES[l.cid||cidadeAtual()]||CIDADES.cacoal;
  const r=(l.risco||1)+(cid.risco||0);
  pool.push('matilha','emboscada');
  if(r>=2)pool.push('rastreador','enxame');
  if(r>=3)pool.push('desabamento','gas');
  if(S.clima==='chuva'||S.clima==='tempestade')pool.push('agua');
  if(r>=4&&S.dia>=6)pool.push('territorio');
  return pool;
}
function chanceAmeaca(l){
  const cid=CIDADES[l.cid||cidadeAtual()]||CIDADES.cacoal;
  /* isso divide espaço com anomalia e saqueador na mesma saída:
     se cada um disparar demais, toda expedição vira encontro */
  let p=.09+(l.risco||1)*.035+(cid.risco||0)*.045+S.dia*.008;
  if(S.viradaEsvaziou)p+=.05;
  if(S.hora>=17)p+=.07;
  if(ameacasVivas().length>=3)p*=.5;
  return trava(p,.05,.40);
}

/* ---------- a ameaça persiste no mundo ---------- */
function ameacasVivas(){return S.ameacas||(S.ameacas=[]);}
function plantarAmeaca(id,localId){
  if(ameacasVivas().some(a=>a.id===id&&a.local===localId))return null;
  const a={id,local:localId,cid:cidadeAtual(),dias:0,teVi:0};
  ameacasVivas().push(a);
  return a;
}
/* elas se movem sozinhas entre os dias */
function moverAmeacas(){
  const avisos=[];
  const locais=poolDeLocais().map(l=>l.id);
  ameacasVivas().forEach((a,i)=>{
    const A2=AMEACAS[a.id];
    a.dias++;
    if(A2.vel&&chance(.3*A2.vel)){
      const novo=sortear(locais);
      if(novo!==a.local)a.local=novo;
    }
    // a que segue vai atrás de você
    if(A2.segue&&a.teVi>0&&chance(.35)){
      a.perto=(a.perto||0)+1;
      if(a.perto>=3){
        avisos.push(`${A2.n[0].toUpperCase()+A2.n.slice(1)} chegou na sua rua.`);
        a.naRua=true;
      }
    }
    if(a.dias>9&&chance(.3))ameacasVivas().splice(i,1);
  });
  return avisos;
}
function ameacaNoLocal(localId){
  return ameacasVivas().find(a=>a.local===localId&&a.cid===cidadeAtual());
}

/* ---------- o encontro ---------- */
async function encararAmeaca(a,ctx,volta){
  const A2=AMEACAS[a.id];
  a.teVi++;
  AC.innerHTML='';limpar();cap(A2.n);
  if(A2.som)A2.som();
  await pausa(1000);
  diz(A2.aviso,'perigo');
  await pausa(1400);
  diz(A2.d,'narr');
  await pausa(1200);

  const arma=melhorArma();
  const pm=penalidadeMaos();
  const escondeBom=(S.abrigo.length&&ctx&&ctx.par&&ctx.par.hab==='esconder')?.12:0;

  return new Promise(res=>{
    AC.innerHTML='';
    /* giz: recuar sem se perder. isca: ela está ocupada. */
    const bonusGiz=(S.gizAtivo>0)?.14:0;
    const bonusIsca=(S.iscaAtiva>0)?.18:0;
    const pf=trava(A2.fugir-pm-pesoFerido()-(A2.cerco?.12:0)+bonusGiz+bonusIsca,.05,.95);
    botao('Sair de perto agora',async()=>{
      AC.innerHTML='';
      await pausa(1200);
      if(chance(pf)){
        diz(A2.perde(),'sist');
        if(ctx&&ctx.achados)ctx.achados.forEach(x=>x.q=Math.ceil(x.q*.6));

      }else{
        diz('Não dá pra simplesmente sair. Não dessa.','perigo');
        await pausa(1000);
        res(await sofrer(A2,ctx));
      }
    },{cls:'prim',custo:Math.round(pf*100)+'%'});

    if(A2.esconder>0){
      const pe=trava(A2.esconder+escondeBom-pm*.6-pesoFerido()*.5,.05,.95);
      botao('Se enfiar num canto e esperar passar',async()=>{
        AC.innerHTML='';
        gastarHoras(1);
        await pausa(2000);
        if(chance(pe)){
          diz('Você fica parado tempo demais num lugar apertado demais. E funciona.','bom');
          res('escondeu');
        }else{
          diz('Ela sabe onde você está. Sabia o tempo todo.','perigo');
          res(await sofrer(A2,ctx));
        }
      },{custo:'1 hora · '+Math.round(pe*100)+'%'});
    }

    if(arma&&A2.lutar>0){
      const pl=trava(A2.lutar+arma.dano*.07-pm*.7-pesoFerido(),.05,.9);
      botao(`Enfrentar com ${arma.n.toLowerCase()}`,async()=>{
        AC.innerHTML='';
        if(arma.municao&&!usarMunicao(arma))
          {diz('Vazio. Você aperta o gatilho e não acontece nada.','perigo');
           return res(await sofrer(A2,ctx));}
        if(arma.municao)S.ruido=trava(S.ruido+14,0,100);
        await pausa(1700);
        if(chance(pl)){
          diz(`Resolvido. Custou mais do que devia, mas resolvido.`,'bom');
          ameacasVivas().splice(ameacasVivas().indexOf(a),1);
          S.ameacasMortas=(S.ameacasMortas||0)+1;
          anotar(`Enfrentou ${A2.n} e venceu.`);
          if(chance(.5)){const m=sortear(['tabua','arame','cano','fio','prego']);darMat(m,2);
            diz('Sobrou material no lugar.','sist');}
          res('venceu');
        }else{
          diz('Você acerta e não adianta.','perigo');
          res(await sofrer(A2,ctx));
        }
      },{custo:Math.round(pl*100)+'%'+(arma.municao?' · gasta munição':'')});
    }

    botao('Voltar outro dia',async()=>{
      AC.innerHTML='';
      diz('Você desiste do lugar antes de entrar. Não perdeu nada além do dia.','sist');
      S.esgotados[a.local]=(S.esgotados[a.local]||0);
      res('desistiu');
    },{custo:'perde a viagem'});
  });
}

async function sofrer(A2,ctx){
  const f=A2.forca;
  if(ctx&&ctx.par&&chance(.35)){
    morreuAlguem(ctx.par,`ficou pra trás quando ${A2.n} apareceu, no dia ${S.dia}`);
    diz(`${ctx.par.n} ficou pra trás.`,'perigo');
    ctx.par=null;
    return 'perdeu';
  }
  const dano=['Você sai machucado e vai demorar pra sarar.',
    'Alguma coisa te pega antes de você sair. Não fundo, mas pega.',
    'Você bate a cabeça fugindo e acorda deitado no meio da rua.'];
  diz(sortear(dano),'perigo');
  const fer=ferirPor(A2.tipo==='gente'?'gente':A2.tipo==='lugar'?'queda':'bicho');
  if(fer)diz(`Você ficou com ${fer.n}. ${fer.faz}`,'perigo');
  S.ferido=(S.ferido||0)+f;
  if(chance(.4)){
    diz('Você volta pra casa com febre no dia seguinte.','perigo');
    S.doenteJog=(S.doenteJog||0)+2;
  }
  if(ctx&&ctx.achados)ctx.achados.forEach(x=>x.q=Math.floor(x.q*.35));
  mexerMoral(-6);
  return 'apanhou';
}

/* o ferimento pesa nos dias seguintes */

function sararUmPouco(){
  const r=[];
  if(S.ferido>0){
    /* remédio cura o dobro, sempre. Antes era 50% e não dava
       pra perceber a diferença — decisão invisível é decisão morta. */
    const temRem=S.remedio>0&&S.ferido>=2;
    const cura=temRem?3:1;
    if(temRem){S.remedio--;ganhou({remedio:-1});
      r.push('Você gasta um remédio em você mesmo. Sara em um terço do tempo.');}
    S.ferido=Math.max(0,S.ferido-cura);
    if(!S.ferido)r.push('Você acorda sem dor pela primeira vez em dias.');
    else if(chance(.4))r.push('Ainda dói. Menos, mas dói.');
  }

    S.doenteJog--;
    if(!S.doenteJog)r.push('A febre passou.');
    else r.push('Você passa o dia com febre. Tudo custa mais.');
  }
  return r;
}

function criaturasDaNoite(){
  const lista=Object.entries(CRIATURAS)
    .filter(([,c])=>S.dia>=c.noite&&(!c.raro||S.dia>=7));
  return lista;
}
function sortearCriatura(fam){
  let l=criaturasDaNoite();
  if(fam)l=l.filter(([,c])=>c.fam===fam);
  if(!l.length)l=[['vizinho',CRIATURAS.vizinho]];
  /* raras pesam menos, fortes aparecem mais tarde */
  const peso=([k,c])=>{
    let p=10-c.forca;
    if(c.raro)p*=.12;
    if(S.dia>=8&&c.fam==='surda')p*=2.2;
    const C=CIDADES[cidadeAtual()];
    if(C&&C.bicho===k)p*=1.8;
    return Math.max(.4,p);
  };
  const tot=l.reduce((s,x)=>s+peso(x),0);
  let r=Math.random()*tot;
  for(const x of l){r-=peso(x);if(r<=0)return x[0];}
  return l[0][0];
}

/* ================= O DESENHO =================
   Silhueta reconhecível sem ler o nome. */
function desSilhueta(cx,cy,h,tipo,t,cor){
  const c=cor||'#0A0810';
  CX.fillStyle=c;CX.strokeStyle=c;
  const bal=Math.sin(t*1.6)*h*.012;
  if(tipo==='humana'){
    CX.beginPath();CX.arc(cx,cy-h*.42+bal,h*.085,0,7);CX.fill();
    CX.fillRect(cx-h*.10,cy-h*.34+bal,h*.20,h*.36);
    CX.fillRect(cx-h*.15,cy-h*.32+bal,h*.05,h*.30);
    CX.fillRect(cx+h*.10,cy-h*.32+bal,h*.05,h*.30);
    CX.fillRect(cx-h*.08,cy+h*.02,h*.06,h*.30);
    CX.fillRect(cx+h*.02,cy+h*.02,h*.06,h*.30);
  }else if(tipo==='alta'){
    const dob=h*.10;
    CX.beginPath();CX.arc(cx+dob*.5,cy-h*.40+bal,h*.075,0,7);CX.fill();
    CX.save();CX.translate(cx,cy-h*.34);CX.rotate(.22);
    CX.fillRect(-h*.08,0,h*.16,h*.34);CX.restore();
    CX.fillRect(cx-h*.13,cy-h*.28+bal,h*.04,h*.42);
    CX.fillRect(cx+h*.09,cy-h*.28+bal,h*.04,h*.42);
    // joelho virado pro lado errado
    CX.beginPath();
    CX.moveTo(cx-h*.05,cy);CX.lineTo(cx-h*.13,cy+h*.18);CX.lineTo(cx-h*.03,cy+h*.36);
    CX.lineWidth=h*.05;CX.stroke();
    CX.beginPath();
    CX.moveTo(cx+h*.05,cy);CX.lineTo(cx+h*.13,cy+h*.18);CX.lineTo(cx+h*.03,cy+h*.36);
    CX.stroke();
  }else if(tipo==='meia'){
    CX.save();
    CX.beginPath();CX.rect(cx-h*.30,cy-h*.55,h*.30,h*1.0);CX.clip();
    CX.beginPath();CX.arc(cx,cy-h*.40,h*.085,0,7);CX.fill();
    CX.fillRect(cx-h*.10,cy-h*.32,h*.20,h*.38);
    CX.fillRect(cx-h*.08,cy+h*.04,h*.07,h*.30);
    CX.restore();
  }else if(tipo==='magra'){
    CX.lineWidth=h*.032;
    CX.beginPath();CX.arc(cx,cy-h*.46+bal,h*.062,0,7);CX.fill();
    CX.beginPath();CX.moveTo(cx,cy-h*.40);CX.lineTo(cx,cy+h*.04);CX.stroke();
    // braços passando do joelho
    [[-1],[1]].forEach(([s])=>{
      CX.beginPath();
      CX.moveTo(cx,cy-h*.34);
      CX.lineTo(cx+s*h*.16,cy-h*.06+bal*2);
      CX.lineTo(cx+s*h*.11,cy+h*.28);
      CX.stroke();
      CX.beginPath();
      CX.moveTo(cx,cy+h*.04);
      CX.lineTo(cx+s*h*.10,cy+h*.20);
      CX.lineTo(cx+s*h*.05,cy+h*.42);
      CX.stroke();
    });
  }else if(tipo==='rastejante'){
    CX.beginPath();
    CX.ellipse(cx,cy+h*.36,h*.30,h*.075,Math.sin(t*.9)*.05,0,7);CX.fill();
    CX.beginPath();CX.arc(cx-h*.26,cy+h*.33,h*.055,0,7);CX.fill();
    CX.lineWidth=h*.018;
    for(let i=0;i<4;i++){
      const x=cx-h*.16+i*h*.11;
      CX.beginPath();
      CX.moveTo(x,cy+h*.36);
      CX.lineTo(x+Math.sin(t*2+i)*h*.05,cy+h*.44);
      CX.stroke();
    }
  }else if(tipo==='inchada'){
    CX.beginPath();
    CX.ellipse(cx,cy+h*.06,h*.26,h*.32+Math.sin(t*.8)*h*.02,0,0,7);CX.fill();
    CX.beginPath();CX.arc(cx,cy-h*.30,h*.10,0,7);CX.fill();
    CX.fillRect(cx-h*.30,cy+h*.02,h*.09,h*.26);
    CX.fillRect(cx+h*.21,cy+h*.02,h*.09,h*.26);
  }else if(tipo==='grupo'){
    [[-.26,.86],[0,1],[.28,.78]].forEach(([dx,esc],i)=>{
      const hh=h*esc,b2=Math.sin(t*1.5+i*2)*hh*.014;
      CX.beginPath();CX.arc(cx+dx*h*1.6,cy-hh*.40+b2,hh*.07,0,7);CX.fill();
      CX.fillRect(cx+dx*h*1.6-hh*.09,cy-hh*.32+b2,hh*.18,hh*.34);
      CX.fillRect(cx+dx*h*1.6-hh*.07,cy+h*.02,hh*.05,hh*.28);
      CX.fillRect(cx+dx*h*1.6+hh*.02,cy+h*.02,hh*.05,hh*.28);
    });
  }else if(tipo==='macica'){
    CX.fillRect(cx-h*.20,cy-h*.34,h*.40,h*.62);
    CX.beginPath();CX.arc(cx,cy-h*.38,h*.11,0,7);CX.fill();
    const soco=Math.max(0,Math.sin(t*1.25));
    CX.fillRect(cx+h*.18,cy-h*.24+soco*h*.04,h*.16+soco*h*.10,h*.13);
    CX.fillRect(cx-h*.12,cy+h*.28,h*.10,h*.24);
    CX.fillRect(cx+h*.03,cy+h*.28,h*.10,h*.24);
  }else if(tipo==='aquilo'){
    for(let i=0;i<7;i++){
      const a=t*.4+i*.9;
      const rx=h*(.10+i*.045),ry=h*(.30-i*.02);
      CX.globalAlpha=.14+Math.sin(t*1.4+i)*.10;
      CX.beginPath();
      CX.ellipse(cx+Math.sin(a)*h*.05,cy+Math.cos(a*.7)*h*.04,rx,ry,a*.2,0,7);
      CX.fill();
    }
    CX.globalAlpha=1;
  }
}

/* a ficha que você lê antes de decidir */

}

function leitura(c,ctx){
  const C=CRIATURAS[c]||CRIATURAS.vizinho;
  const dist=ctx&&ctx.dist!=null?ctx.dist:2;      // 0 colado · 3 longe
  const vis=visibilidade();
  const noite=S.hora>=19||S.hora<6;
  const dentro=ctx&&ctx.dentro;

  let meuOlho=(3-dist)*.28+vis*.5-(noite?.25:0)+(temFerra('lanterna')?.2:0);
  if(dentro)meuOlho+=.15;
  meuOlho=trava(meuOlho,0,1);

  let oOlhoDela=(3-dist)*.26+(C.vel>=3?.2:0)+(noite?.2:0)
    +(S.ruido/100)*.45-(dentro?.15:0)-(maosOcupadas()?0:.05);
  if(C.fam==='surda')oOlhoDela+=.25;
  oOlhoDela=trava(oOlhoDela,0,1);

  const arma=melhorArma();
  const meuPeso=(arma?arma.dano:.5)+(ctx&&ctx.par?1.5:0)
    +(S.abrigo.length?.4:0)-pesoFerido()*4-penalidadeMaos()*3;
  const pesoDela=C.forca*1.5+(C.vel-1)*.6;
  const razao=meuPeso/Math.max(.6,pesoDela);

  return {meuOlho,oOlhoDela,razao,dist,C,
    vejo:meuOlho>.45,ouco:true,
    sabe:(S.vistos&&S.vistos[c]||0)>=2};
}
const barra=(v)=>{
  const n=Math.round(trava(v,0,1)*5);
  return '█'.repeat(n)+'░'.repeat(5-n);
};
function mostrarLeitura(L){
  const c=L.C;
  diz('─── o que dá pra saber ───','fraco');
  diz(`Eu enxergo ela   ${barra(L.meuOlho)}  ${L.meuOlho>.7?'clara':L.meuOlho>.45?'dá pra ver':L.meuOlho>.2?'só o vulto':'quase nada'}`,'sist');
  diz(`Ela me percebe   ${barra(L.oOlhoDela)}  ${L.oOlhoDela>.7?'já sabe onde você está':L.oOlhoDela>.45?'desconfia':L.oOlhoDela>.2?'ainda não':'não faz ideia'}`,
    L.oOlhoDela>.6?'perigo':'sist');
  const r=L.razao;
  diz(`Força              ${r>1.4?'você é mais forte':r>.9?'está parelho':r>.5?'ela é mais forte':'ela é MUITO mais forte'}`,
    r>.9?'bom':r>.5?'alerta':'perigo');
  diz(`Distância          ${['colado em você','a poucos passos','no meio da rua','longe ainda'][L.dist]||'?'}`,'sist');
  if(L.sabe)diz('◈ Você já viu essa antes. Sabe do que ela não gosta.','bom');
}

<script>
/* ================= LOOT COM CABEÇA =================
   Antes: cada local tinha uma listinha fixa e ferramenta boa
   não estava em lista nenhuma. Resultado: você nunca achava
   chave inglesa nem mochila, e posto de gasolina não dava

const AFIN={
 /* ferramenta e peça */

 /* comida */
 mercado:{comida:2.6,mat:['lona2'],itens:['lata','conserva','saco','agua5']},
 armazem:{comida:2.8,mat:['lona2','arame'],itens:['lata','saco','conserva','semente']},

};
function afinidade(l){
  const id=(l&&l.id)||'';
  const chaves=Object.keys(AFIN).filter(k=>id.includes(k));
  if(!chaves.length)return AFIN.casa;
  const j={ferra:[],mat:[],itens:[],comida:0,diesel:0,med:0,mochila:0,arma:0,estraga:0};
  chaves.forEach(k=>{
    const a=AFIN[k];
    ['ferra','mat','itens'].forEach(p=>{if(a[p])j[p]=j[p].concat(a[p])});
    ['comida','diesel','med','mochila','arma','estraga'].forEach(p=>{
      if(a[p])j[p]=Math.max(j[p],a[p]);});
  });
  return j;
}

/* ---------- o que sai de um local ---------- */
function lootDoLocal(l,fator){
  const A=afinidade(l);
  const f=(fator==null?1:fator)*(1+(l.risco||1)*.14);
  const saiu={ferra:[],mat:{},itens:[],mochila:null,texto:[]};

  /* FERRAMENTA — a queixa era não achar chave inglesa nunca */
  if(A.ferra.length){
    const faltam=A.ferra.filter(x=>!temFerra(x));
    const p=trava(.34*f+(faltam.length?.22:0),0,.85);
    if(faltam.length&&chance(p)){
      const x=sortear(faltam);
      pegarFerra(x);saiu.ferra.push(x);
      saiu.texto.push(`Achou uma ${FERRA[x].n}. ${FERRA[x].d}`);
      if(chance(.3*f)){
        const y=sortear(A.ferra.filter(z=>!temFerra(z)));
        if(y){pegarFerra(y);saiu.ferra.push(y);
          saiu.texto.push(`E uma ${FERRA[y].n} junto.`);}
      }
    }
  }
  /* MATERIAL */
  if(A.mat.length){
    const n=1+Math.floor(Math.random()*2*f);
    for(let i=0;i<n;i++){
      const m=sortear(A.mat),q=1+Math.floor(Math.random()*3*f);
      darMat(m,q);saiu.mat[m]=(saiu.mat[m]||0)+q;
    }
    const lista=Object.keys(saiu.mat).map(k=>
      saiu.mat[k]+' '+(saiu.mat[k]===1?MATE[k].n:MATE[k].un));
    if(lista.length)saiu.texto.push('Material: '+lista.join(', ')+'.');
  }
  /* MOCHILA — você disse que nunca achou uma */
  if(A.mochila){
    const p=trava(.13*A.mochila*f,0,.5);
    if(chance(p)){
      /* sorteia uma melhor que a sua, com as boas mais raras */
      const ordem=['nenhuma','sacola','escolar','comum','viagem','militar'];
      const at=ordem.indexOf(mochila().tipo);
      const cand=ordem.slice(at+1);
      /* as boas só existem mais tarde, e mesmo assim são raras */
      const trava2={sacola:1,escolar:1,comum:3,viagem:6,militar:10};
      const cand2=cand.filter(k=>S.dia>=(trava2[k]||1));
      if(cand2.length){
        const cand=cand2;
        const pesos={sacola:40,escolar:30,comum:16,viagem:6,militar:1.6};
        const tot=cand.reduce((s,k)=>s+(pesos[k]||5),0);
        let r=Math.random()*tot,esc=cand[0];
        for(const k of cand){r-=(pesos[k]||5);if(r<=0){esc=k;break;}}
        const msg=acharMochila(esc);
        if(msg){saiu.mochila=esc;saiu.texto.push(msg);}
      }
    }
  }
  return saiu;
}


/* ---------- comida e diesel do lugar certo ---------- */
function ajusteRecurso(l){
  const A=afinidade(l);
  return {comida:A.comida||1,diesel:A.diesel||1,med:A.med||0,estraga:A.estraga||1};
}

        return `${p.n} consertou ${e.n} sozinho. Não avisou ninguém.`;}
      return `${p.n} adiantou ${e.n}. Falta pouco.`;
    }
    return `${p.n} passou a tarde tentando resolver ${e.n} e não conseguiu.`;
  }},
 {id:'horta',peso:12,precisa:()=>canteiros().length>0,moral:[40,100],
  faz:p=>{
    const c=sortear(canteiros());
    if(!c)return null;
    if(c.agua<3&&S.agua>0){S.agua--;c.agua=Math.min(4,c.agua+2);
      return `${p.n} regou a horta sem ninguém pedir.`;}
    if(c.praga&&chance(.4)){c.praga=null;c.pragaDias=0;
      return `${p.n} catou praga do canteiro a manhã inteira. Resolveu.`;}
    return `${p.n} ficou um tempo parado olhando a horta crescer.`;

 {id:'organiza',peso:11,moral:[40,100],
  faz:p=>{
    if(chance(.35)){const m=sortear(['prego','arame','tabua','fio']);darMat(m,2);
      return `${p.n} organizou o depósito e achou material que ninguém tinha visto: +2 ${MATE[m].un}.`;}
    return `${p.n} passou a manhã arrumando a despensa por tamanho de lata.`;
  }},
 {id:'cozinha',peso:12,precisa:()=>S.comida>0,moral:[35,100],
  faz:p=>{
    mexerMoral(6);
    if(chance(.3)){S.comida++;ganhou({comida:1});
      return `${p.n} cozinhou e esticou a comida. Rendeu uma refeição a mais.`;}
    return `${p.n} cozinhou pra todo mundo. A casa cheirou a comida pela primeira vez em dias.`;
  }},
 {id:'vigia',peso:10,moral:[45,100],
  faz:p=>{
    if(chance(.28)){S.ruido=Math.max(0,S.ruido-5);
      return `${p.n} passou a noite acordado na janela do sótão. Mandou todo mundo falar baixo.`;}

 {id:'reforca',peso:9,moral:[50,100],precisa:()=>temMat('tabua',1),
  faz:p=>{

    gastarMat('tabua',1);S.porta.reforco++;

 {id:'ensina',peso:8,moral:[55,100],precisa:()=>S.abrigo.length>=2,
  faz:p=>{

    if(!o)return null;

 /* --- humanas: nem sempre útil --- */
 {id:'chora',peso:10,moral:[0,35],
  faz:p=>{
    S.ruido=trava(S.ruido+3,0,100);
    return `${p.n} chorou baixo a tarde inteira no quarto. Todo mundo ouviu e ninguém foi lá.`;

 {id:'isola',peso:9,moral:[0,40],
  faz:p=>{
    p.moral=trava(p.moral-4,0,100);
    return `${p.n} não falou com ninguém o dia inteiro. Comeu de costas pra sala.`;
  }},
 {id:'briga',peso:11,moral:[0,55],precisa:()=>S.abrigo.length>=2,
  faz:p=>{
    const o=sortear(S.abrigo.filter(x=>x!==p));
    if(!o)return null;
    aproximar(p,o,-16);mexerMoral(-5);
    return sortear([

 {id:'ajuda',peso:10,moral:[50,100],precisa:()=>S.abrigo.some(x=>x.doente>0),

 {id:'reza',peso:7,moral:[0,60],

 {id:'lembra',peso:9,moral:[0,100],precisa:()=>S.mortos.length>0,

      `${p.n} contou uma história de ${m.n} que ninguém sabia. Todo mundo riu e depois piorou.`]);
  }},
 /* --- ruins: autonomia com preço --- */
 {id:'esconde',peso:7,moral:[0,35],precisa:()=>S.comida>=3,

 {id:'sugere',peso:6,moral:[0,30],precisa:()=>S.abrigo.length>=2,

 {id:'abriu',peso:4,moral:[0,25],
