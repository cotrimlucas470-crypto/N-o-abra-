<script>
/* ================= A INVASÃO TINHA UMA SAÍDA SÓ =================
   Bug real: os únicos desfechos eram chegar no QUINTAL (e o jogo
   nunca dizia isso) ou morrer. Sem relógio, sem amanhecer, sem
   limite. Quem não sabia do quintal ficava em loop até morrer.
   Agora: a noite ACABA, e sempre tem mais de um jeito de passar. */

const INV_MAX=14;          /* a noite tem fim */

function invEstado(I){
  I.turno=(I.turno||0)+1;
  return I;
}
function invRestam(I){return Math.max(0,INV_MAX-(I.turno||0));}

/* o painel que faltava: onde ele está, quanto falta, por onde sair */
function painelInvasao(I){
  const c=cena.casa;
  const d=distancia(c.voce,c.monstro);
  const r=invRestam(I);
  const barra='█'.repeat(trava(Math.round(r/INV_MAX*8),0,8))+'░'.repeat(8-trava(Math.round(r/INV_MAX*8),0,8));
  diz(`amanhecer ${barra} ${r} ${r===1?'turno':'turnos'}`,r<=3?'alerta':'fraco');
  diz(`Você: ${PLANTA[c.voce].nome} · Ele: ${d===0?'AQUI':d===1?'no cômodo ao lado':d===2?'a dois cômodos':'longe'}`,
    d<=1?'perigo':'sist');
  if(I.escondido)diz('Você está escondido. Ficar parado é uma opção de verdade.','bom');
  if(I.bloqTurnos>0)diz(`O armário segura a passagem por mais ${I.bloqTurnos}.`,'bom');
  /* a saída, dita em voz alta */
  if(c.voce!==8)diz('O quintal tem saída pra rua. É por lá que dá pra sumir.','fraco');
  else diz('Você está no quintal. Daqui dá pra sumir na rua.','bom');
  diz(`Você aguenta ${I.folego} ${I.folego===1?'encontro':'encontros'} antes de acabar.`,I.folego<=1?'perigo':'fraco');
}

/* ---------- ficar parado é jogada, não desperdício ---------- */
async function ficarParado(I){
  AC.innerHTML='';
  I.escondido=true;
  I.ruidoEm=null;I.memoria=0;
  diz('Você para de respirar direito e não se mexe.','narr');
  await pausa(1500);
  return turnoMonstro(I);
}

/* ---------- o turno do jogador, com saída garantida ---------- */
const _turnoBase=turnoJogador;
turnoJogador=function(I){
  /* a noite acaba sozinha */
  if(invRestam(I)<=0)return amanheceuInvasao(I);
  painelInvasao(I);
  _turnoBase(I);
  /* ficar parado e sair pelo quintal aparecem SEMPRE */
  const c=cena.casa;
  if(!PLANTA[c.voce].esconde)
    botao('Ficar parado e não fazer barulho',()=>ficarParado(I),
      {custo:distancia(c.voce,c.monstro)>=2?'ele está longe · seguro':'arriscado'});
  if(c.voce===8)botao('Sair pela rua e dar a volta',()=>escapou(I),
    {cls:'prim',custo:'termina a noite'});
};


/* ---------- a noite acaba ---------- */
async function amanheceuInvasao(I){
  AC.innerHTML='';limpar();cena.modo='casa';
  cap('Clareou');
  await pausa(1400);
  desligarDrone();
  diz('A janela do corredor fica cinza. Depois quase branca.','narr');
  await pausa(1600);
  diz('Ele para no meio do que estava fazendo, do jeito que param, e vai embora pela onde entrou.','sist');
  await pausa(1500);
  const vivos=I.acompanha?I.acompanha.length:0;
  if(vivos)diz(`${vivos} ${vivos===1?'pessoa passou':'pessoas passaram'} a noite com você e ${vivos===1?'chegou':'chegaram'} inteira${vivos===1?'':'s'}.`,'bom');
  mexerMoral(14);
  S.confianca=trava(S.confianca+10,0,100);
  if(typeof mexerCredito==='function')mexerCredito(+8);
  anotar(`Aguentou a invasão da noite ${S.dia} até amanhecer.`);
  await pausa(1200);
  AC.innerHTML='';
  botao('Sair de onde você estava',()=>cenaDia(),{cls:'chave'});
}

</script>
<script>
/* ================= REMÉDIO ERA RARO DEMAIS =================
   Gaze, álcool e tala praticamente não apareciam. Sem cura,
   qualquer ferida vira infecção e infecção mata. O jogo ficava
   injogável por falta de item básico. */

/* 1. médico básico vira COMUM, e o lugar temático entrega */
const MED_BASICO=['gaze','alcool','analgesico','soro','cha'];
const MED_BOM=['antitermico','linha','tala','pomada'];
const MED_RARO=['antibiotico'];

function acharMedico(l,fator){
  const A=afinidade(l);
  const id=(l&&l.id)||'';
  const tema=/hospital|farmacia|posto|saude|quartel|hotel/.test(id);
  const f=(fator==null?1:fator);
  S.med=S.med||{};
  const saiu=[];

  /* base: 3x a 5x mais que antes */
  let n=(tema?2:0)+(chance(.55*f)?1:0)+(chance(.35*f)?1:0);
  /* pity: cada saque sem cura aumenta a chance do próximo */
  S.pity=(S.pity||0);
  if(S.pity>=2)n+=1;
  if(S.pity>=4)n+=1;
  if(S.pity>=6)n+=2;

  for(let i=0;i<n;i++){
    let pool=MED_BASICO.slice();
    if(tema||chance(.35))pool=pool.concat(MED_BOM);
    if((tema&&chance(.30))||chance(.06))pool=pool.concat(MED_RARO);
    /* 4. o que você PRECISA aparece mais */
    const precisa=[];
    saude().forEach(m=>(MALES[m.id].trata||[]).forEach(k=>{
      if(REMEDIOS[k]&&!REMEDIOS[k].acao&&!REMEDIOS[k].recurso)precisa.push(k);
    }));
    S.abrigo.forEach(p=>saude(p).forEach(m=>(MALES[m.id].trata||[]).forEach(k=>{
      if(REMEDIOS[k]&&!REMEDIOS[k].acao&&!REMEDIOS[k].recurso)precisa.push(k);
    })));
    const k=(precisa.length&&chance(.55))?sortear(precisa):sortear(pool);
    const q=REMEDIOS[k]?REMEDIOS[k].qtd:null;
    if(!q)continue;
    const qt=1+(chance(.35)?1:0)+(tema&&chance(.3)?1:0);
    S.med[q]=(S.med[q]||0)+qt;
    saiu.push(qt+' '+REMEDIOS[k].n);
  }
  if(saiu.length)S.pity=0;else S.pity++;
  return saiu;
}

/* 2. mochila garantida: se não achou em X saques, aparece */
function acharMochilaGarantida(l){
  const ordem=['nenhuma','sacola','escolar','comum','viagem','militar'];
  const at=ordem.indexOf(mochila().tipo);
  if(at>=3)return null;                 /* já tem uma boa */
  S.saquesSemMochila=(S.saquesSemMochila||0)+1;
  const A=afinidade(l);
  let p=.10+(A.mochila||0)*.10;
  if(S.saquesSemMochila>=4)p+=.30;
  if(S.saquesSemMochila>=7)p=1;         /* garantida */
  if(!chance(trava(p,0,1)))return null;
  S.saquesSemMochila=0;
  const cand=ordem.slice(at+1,at+3);
  if(!cand.length)return null;
  return acharMochila(sortear(cand));
}

/* 3. crafting improvisado, pra nunca ficar sem saída */
const IMPROVISO=[
 {id:'bandagem',n:'Rasgar pano pra bandagem',h:1,
  precisa:()=>temMat('lona2',1)||S.comida>0,
  faz:()=>{if(temMat('lona2',1))gastarMat('lona2',1);
    S.med=S.med||{};S.med.gaze=(S.med.gaze||0)+3;
    return 'Três tiras de pano rasgadas e limpas no fogo.';}},
 {id:'tala',n:'Fazer tala com tábua e pano',h:1,
  precisa:()=>temMat('tabua',1),
  faz:()=>{gastarMat('tabua',1);S.med=S.med||{};S.med.tala=(S.med.tala||0)+1;
    return 'Tábua lascada no tamanho e amarrada. Feia e segura o osso.';}},
 {id:'soro',n:'Fazer soro com água, sal e açúcar',h:1,
  precisa:()=>S.agua>0,
  faz:()=>{S.agua--;ganhou({agua:-1});S.med=S.med||{};S.med.soro=(S.med.soro||0)+2;
    return 'Dois copos. Isso segura desidratação e barriga.';}},
 {id:'cha',n:'Ferver erva pra chá',h:1,
  precisa:()=>canteiros().length>0||S.temSemente,
  faz:()=>{S.med=S.med||{};S.med.cha=(S.med.cha||0)+2;
    return 'Duas canecas. Fraco, mas ajuda febre e tosse.';}},
 {id:'alcool',n:'Destilar álcool de limpeza',h:2,
  precisa:()=>temFerra('inglesa')&&(temMat('cano',1)||S.oficinaNivel>0),
  faz:()=>{if(temMat('cano',1))gastarMat('cano',1);
    S.med=S.med||{};S.med.alcool=(S.med.alcool||0)+3;
    return 'Três frascos. Arde igual o diabo e evita infecção.';}},
 {id:'linha',n:'Preparar agulha e linha',h:1,
  precisa:()=>temMat('arame',1)||temFerra('alicate'),
  faz:()=>{if(temMat('arame',1))gastarMat('arame',1);
    S.med=S.med||{};S.med.linha=(S.med.linha||0)+2;
    return 'Agulha curva de arame e linha de costura fervida.';}}
];
function menuImproviso(volta){
  AC.innerHTML='';limpar();cap('Improvisar remédio');
  diz('Não precisa achar farmácia. Dá pra fazer com o que tem em casa.','sist');
  const M=S.med||{};
  const lista=Object.keys(M).filter(k=>M[k]>0).map(k=>M[k]+' '+k);
  diz('Você tem: '+(lista.length?lista.join(', '):'nada')+'.',lista.length?'sist':'alerta');
  IMPROVISO.forEach(r=>{
    const pode=r.precisa();
    botao(r.n,acaoDia(r.h,async()=>{

      diz(r.faz(),'bom');

  });

}

/* liga na expedição */
const _lootMed=lootDoLocal;
lootDoLocal=function(l,f){
  const r=_lootMed(l,f);
  const med=acharMedico(l,f);
  if(med.length)r.texto.push('Remédio: '+med.join(', ')+'.');
  const mo=acharMochilaGarantida(l);
  if(mo)r.texto.push(mo);
  return r;
};

<script>
/* ================= RISCO E LOOT REROLADOS TODO DIA =================
   Eram fixos por local: você decorava o mapa e nunca mais pensava.
   Agora cada lugar tem nota 0-10 que muda por dia, com semente do
   dia (o mesmo dia dá o mesmo mapa se você recarregar). */

function semDia(id,sal){
  return semente(hashNome(id+'#'+S.dia+'#'+(S.semente||0)),sal||1);
}
/* quanto o lugar já foi mexido */
function depleta(id){return trava((S.esgotados[id]||0)*2.2,0,6);}

function notaLoot(l){
  const id=(l&&l.id)||'';
  const base=4+Math.round(semDia(id,3)*5);          /* 4 a 9 */
  const A=(typeof afinidade==='function')?afinidade(id?{id}:{}):{};
  const tema=(A.comida||0)+(A.diesel||0)+(A.med||0)+(A.mochila||0);
  let n=base+(tema>2.4?1:0)-depleta(id);
  if(hotspotDe(id))n+=3;
  if(typeof pesoEstagio==='function')n-=Math.round(pesoEstagio(cidadeAtual()).ord*.8);
  return trava(Math.round(n),0,10);
}
function notaRisco(l){
  const id=(l&&l.id)||'';
  const base=(l&&l.risco!=null?l.risco:2)*1.4;
  let n=base+semDia(id,7)*4;
  if(hotspotDe(id))n+=2.5;                            /* onde tem coisa, tem coisa */
  if(S.hora>=17)n+=1.2;
  if(typeof escassez==='function')n+=escassez()*2;
  if(S.clima==='neblina')n+=1;
  if(typeof pesoEstagio==='function')n+=pesoEstagio(cidadeAtual()).risco;
  /* as ameaças soltas empurram o risco de onde estão */
  if(typeof ameacaNoLocal==='function'&&ameacaNoLocal(id))n+=2.5;
  return trava(Math.round(n),0,10);
}
function barra10(n,cheio,vazio){
  const q=trava(Math.round(n),0,10);
  return (cheio||'█').repeat(q)+(vazio||'░').repeat(10-q);
}
function corRisco(n){return n>=8?'perigo':n>=5?'alerta':'sist';}
function corLoot(n){return n>=8?'bom':n>=4?'sist':'fraco';}

/* ================= HOTSPOTS ================= */
const HOTSPOTS=[
 {id:'caixa',n:'caixa de suprimento',
  t:l=>`Caixa lacrada do governo largada em ${l}. Alguém deixou de paraquedas e não voltou pra buscar.`,
  radio:l=>`"Caixa de suprimento em ${l}. Repito: em ${l}. Quem chegar primeiro leva."`},
 {id:'comboio',n:'comboio parado',
  t:l=>`Um comboio parou em ${l} e não saiu mais. Três caminhões com a carga fechada.`,
  radio:l=>`"Tem comboio parado em ${l} há dois dias. Carga fechada. Cuidado com quem já está lá."`},
 {id:'heli',n:'helicóptero caído',
  t:l=>`Um helicóptero caiu perto de ${l} ontem à noite. Ainda está fumegando.`,
  radio:l=>`"Caiu alguma coisa perto de ${l}. Aeronave. Se tiver alguém aí, é agora."`},
 {id:'deposito',n:'depósito aberto',
  t:l=>`Arrombaram um depósito em ${l} e não levaram tudo. Ninguém leva tudo.`,
  radio:l=>`"Depósito aberto em ${l}. Quem for, leva o que der."`}
];
function hotspots(){
  if(!S.hot||S.hotDia!==S.dia){
    S.hotDia=S.dia;S.hot=[];
    const pool=poolDeLocais().filter(l=>(S.esgotados[l.id]||0)<2);
    const n=S.dia<3?0:(1+(semDia('h',1)>.62?1:0)+(semDia('h',2)>.88?1:0));
    const usados=[];
    for(let i=0;i<n&&pool.length;i++){
      const l=pool[Math.floor(semDia('hot'+i,4)*pool.length)];
      if(!l||usados.includes(l.id))continue;
      usados.push(l.id);
      const H=HOTSPOTS[Math.floor(semDia('tipo'+i,6)*HOTSPOTS.length)];
      S.hot.push({local:l.id,nome:l.n,tipo:H.id});
    }
  }
  return S.hot;
}
function hotspotDe(id){return hotspots().find(h=>h.local===id)||null;}
function textoHotspot(h){
  const H=HOTSPOTS.find(x=>x.id===h.tipo)||HOTSPOTS[0];
  return H.t(h.nome);
}

/* o rádio anuncia — e o anúncio traz gente pra lá */
async function radioHotspot(){
  const hs=hotspots();
  if(!hs.length)return false;
  if(S.hotAnunciado===S.dia)return false;
  S.hotAnunciado=S.dia;
  if(!chance(.72))return false;
  const h=sortear(hs);
  const H=HOTSPOTS.find(x=>x.id===h.tipo)||HOTSPOTS[0];
  await pausa(700);
  diz('O rádio pega uma transmissão aberta, sem código nenhum.','sist');
  await pausa(900);
  diz('“'+H.radio(h.nome)+'”','fala');
  await pausa(1000);
  h.anunciado=true;
  diz('Se você ouviu, mais gente ouviu.','fraco');
  return true;
}

/* ================= AS BARRAS NO MENU DE LOCAIS ================= */
function fichaLocal(l){
  const R=notaRisco(l),L=notaLoot(l);
  const h=hotspotDe(l.id);
  diz(`${l.n}${h?'  ◈ '+(HOTSPOTS.find(x=>x.id===h.tipo)||{}).n.toUpperCase():''}`,h?'alerta':'sist');
  diz(`  risco ${barra10(R)} ${R}/10`,corRisco(R));
  diz(`  loot  ${barra10(L)} ${L}/10`,corLoot(L));
  if(h&&h.anunciado)diz('  o rádio anunciou isso hoje. Não vai estar vazio.','perigo');
  return {R,L};
}

<script>
/* ================= MOCHILA COMO ESCOLHA, NÃO ÓBVIO =================
   As 7 já existiam, mas levar a maior era sempre certo. Agora
   cada uma tem preço: ruído no passo, furtividade e velocidade. */

/* nota mínima de loot pra cada uma aparecer, e o custo de usar */
const TIER={
 nenhuma:{tier:0,min:0, drop:0,  ruido:0, furt:0,  lento:0, rap:0,comp:[]},
 sacola:{tier:1, min:1, drop:.20,ruido:0, furt:0,  lento:0, rap:0,comp:[],
   som:'pano'},
 escolar:{tier:1,min:1, drop:.18,ruido:1, furt:.04,lento:0, rap:1,comp:[],
   som:'ziper'},
 comum:{tier:2,  min:4, drop:.15,ruido:2, furt:.09,lento:0, rap:2,comp:[],
   som:'ziper'},
 viagem:{tier:3, min:7, drop:.06,ruido:3, furt:.16,lento:1, rap:4,comp:['med'],
   som:'fivela'},
 militar:{tier:4,min:9, drop:.02,ruido:5, furt:.24,lento:1, rap:6,comp:['med','mun'],
   som:'velcro'},
 carrinho:{tier:4,min:6,drop:.04,ruido:7,furt:.30,lento:2, rap:3,comp:[],
   som:'roda'}
};
function tierDe(t){return TIER[t]||TIER.nenhuma;}
function tierAtual(){return tierDe(mochila().tipo);}

/* ---------- o preço de carregar grande ---------- */
function ruidoMochila(){return tierAtual().ruido;}
function furtMochila(){return tierAtual().furt;}
function lentoMochila(){return tierAtual().lento;}

/* ---------- compartimento dedicado ----------
   o que está no compartimento não ocupa slot e sai na hora */
function comp(){
  if(!S.comp||typeof S.comp!=='object')S.comp={med:[],mun:[]};
  if(!Array.isArray(S.comp.med))S.comp.med=[];
  if(!Array.isArray(S.comp.mun))S.comp.mun=[];
  const t=tierAtual();
  if(!t.comp.includes('med'))S.comp.med=[];
  if(!t.comp.includes('mun'))S.comp.mun=[];
  S.comp.med=S.comp.med.slice(0,2);
  S.comp.mun=S.comp.mun.slice(0,2);
  return S.comp;
}
function temComp(k){return tierAtual().comp.includes(k);}
/* usar do compartimento não custa turno */
function usarCompMed(){
  const c=comp();
  if(!c.med.length)return null;
  const k=c.med.shift();
  const m=saude()[0];
  if(!m)return {t:'Você não está machucado.'};
  const r=tratar(m,k,null,null);
  return {t:'Do bolso médico, sem parar: '+r.t};
}

/* ---------- drop com gating por nota de loot ---------- */
function mochilaSorteada(l){
  const L=(typeof notaLoot==='function')?notaLoot(l):5;
  const hot=(typeof hotspotDe==='function')&&hotspotDe((l&&l.id)||'');
  const atual=tierAtual().tier;
  const cand=[];
  Object.keys(TIER).forEach(k=>{
    const T=TIER[k];
    if(!T.drop)return;
    if(L<T.min)return;                          /* regra 1: gating */
    let p=T.drop;
    if(hot&&T.tier>=3)p*=2;                     /* regra 2: hotspot dobra */
    if(T.tier<=atual)p*=.25;                    /* regra 4: não repete o que já tem */
    if(T.tier===atual+1)p*=1.6;                 /* upgrade natural */
    if(T.tier<atual)p=0;                        /* nunca oferece pior */
    /* loot alto empurra pro topo e some com a tralha:
       em local 9/10 achar sacola não faz sentido */
    const folga=L-T.min;
    if(folga>=4&&T.tier<=1)p*=.22;
    else if(folga>=2&&T.tier<=1)p*=.55;
    if(T.tier>=3)p*=(1+(L-T.min)*.18);
    if(p>0)cand.push([k,p]);
  });
  /* regra 3: pity — a tier 1 vira garantida */
  S.semMoch=(S.semMoch||0);
  if(atual===0&&S.semMoch>=5)return 'escolar';
  if(!cand.length)return null;
  const tot=cand.reduce((s,c)=>s+c[1],0);
  let r=Math.random()*tot;
  for(const c of cand){r-=c[1];if(r<=0)return c[0];}
  return null;
}
function tentarMochila(l){
  const k=mochilaSorteada(l);
  if(!k){S.semMoch=(S.semMoch||0)+1;return null;}
  const T=TIER[k],M=MOCHILAS[k];
  if(!M)return null;
  S.semMoch=0;
  const at=mochilaInfo();
  if(M.kg<=at.kg)return `Tem uma ${M.n.toLowerCase()} aqui, mas a sua carrega mais.`;
  /* regra 5: a antiga fica pra trás */
  const velha=MOCHILAS[mochila().tipo];
  mochila().tipo=k;
  S.stash=S.stash||[];
  const sobra=[];
  while(pesoMochila()>mochilaInfo().kg&&mochila().itens.length){
    sobra.push(mochila().itens.pop());
  }
  if(sobra.length)S.stash=S.stash.concat(sobra);
  const custo=[];
  if(T.ruido)custo.push('+'+T.ruido+' de ruído no passo');
  if(T.furt)custo.push(Math.round(T.furt*100)+'% pior pra se esconder');
  if(T.lento)custo.push(T.lento===1?'você anda mais devagar':'muito mais devagar');
  return `${M.n}. ${M.d}\n  ${velha?'Você larga a '+velha.n.toLowerCase()+' no chão.':''}`
    +(custo.length?'\n  O preço: '+custo.join(' · ')+'.':'')
    +(T.rap?'\n  '+T.rap+' bolsos de acesso rápido.':'')
    +(T.comp.length?'\n  Compartimento '+T.comp.map(c=>c==='med'?'médico':'de munição').join(' e ')+'.':'');
}

/* ---------- o preço entra no jogo ---------- */
/* ruído: andar com mochila grande soma por dia */
const _gastarM=gastarHoras;
gastarHoras=function(h){
  const r=_gastarM(h);
  if(h>0&&ruidoMochila())S.ruido=trava(S.ruido+ruidoMochila()*.35*h,0,100);
  return r;
};
/* furtividade: esconder e fugir pioram */
const _pesoFerM=pesoFerido;
pesoFerido=function(){
  return trava(_pesoFerM()+furtMochila(),0,.72);
};
/* velocidade: a expedição demora mais */
const _horasM=horasDe;
horasDe=function(l,par){
  return trava(_horasM(l,par)+lentoMochila(),2,11);
};

/* ---------- som de abrir, por material ---------- */
function somMochila(){
  if(!A.ctx)return;
  const t=A.ctx.currentTime,s=tierAtual().som;
  if(s==='ziper'){
    for(let i=0;i<14;i++){
      const tt=t+i*.022;
      const o=A.ctx.createOscillator(),g=A.ctx.createGain(),f=A.ctx.createBiquadFilter();
      o.type='square';o.frequency.value=1400+i*70;
      f.type='bandpass';f.frequency.value=2400;f.Q.value=8;
      g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(.014,tt+.004);
      g.gain.exponentialRampToValueAtTime(.001,tt+.02);
      o.connect(f);f.connect(g);saida(g,{pan:.1,rev:.25});o.start(tt);o.stop(tt+.03);
    }
  }else if(s==='velcro'){
    const sr=src(),f=A.ctx.createBiquadFilter(),g=A.ctx.createGain();
    f.type='highpass';f.frequency.value=2600;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.055,t+.05);
    g.gain.linearRampToValueAtTime(.03,t+.28);
    g.gain.exponentialRampToValueAtTime(.001,t+.45);
    sr.connect(f);f.connect(g);saida(g,{pan:.1,rev:.3});sr.start(t);sr.stop(t+.5);
  }else if(s==='fivela'){
    [0,.13].forEach(off=>{
      const o=A.ctx.createOscillator(),g=A.ctx.createGain();
      o.type='triangle';o.frequency.setValueAtTime(2100,t+off);
      o.frequency.exponentialRampToValueAtTime(900,t+off+.07);
      g.gain.setValueAtTime(0,t+off);g.gain.linearRampToValueAtTime(.05,t+off+.006);
      g.gain.exponentialRampToValueAtTime(.001,t+off+.12);
      o.connect(g);saida(g,{pan:0,rev:.35});o.start(t+off);o.stop(t+off+.14);
    });
  }else if(s==='roda'){
    const sr=src(),f=A.ctx.createBiquadFilter(),g=A.ctx.createGain();
    f.type='bandpass';f.frequency.value=420;f.Q.value=2;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.045,t+.3);
    g.gain.linearRampToValueAtTime(0,t+1.4);
    sr.connect(f);f.connect(g);saida(g,{pan:-.2,rev:.5});sr.start(t);sr.stop(t+1.5);
  }else{
    const sr=src(),f=A.ctx.createBiquadFilter(),g=A.ctx.createGain();
    f.type='bandpass';f.frequency.value=1200;f.Q.value=1.4;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.03,t+.06);
    g.gain.exponentialRampToValueAtTime(.001,t+.3);
    sr.connect(f);f.connect(g);saida(g,{pan:0,rev:.3});sr.start(t);sr.stop(t+.32);
  }
}

/* ---------- a tela mostra o preço ---------- */
function telaMochilaInfo(volta){
  AC.innerHTML='';limpar();cap('A mochila');
  somMochila();
  const T=tierAtual(),M=MOCHILAS[mochila().tipo]||MOCHILAS.nenhuma;
  ficha(M.n,'tier '+T.tier,M.d);
  diz(`${Math.round(pesoMochila())} de ${Math.round(mochilaInfo().kg)} kg · ${volumeAtual()} de ${mochilaInfo().vol} de espaço.`,'sist');
  const c=[];
  if(T.ruido)c.push('+'+T.ruido+' de ruído por hora andando');
  if(T.furt)c.push(Math.round(T.furt*100)+'% pior pra fugir e se esconder');
  if(T.lento)c.push('+'+T.lento+'h em toda expedição');
  diz(c.length?'O preço: '+c.join(' · ')+'.':'Não custa nada carregar isso.',c.length?'alerta':'bom');
  if(T.rap)diz(`${T.rap} bolsos de acesso rápido.`,'sist');
  if(temComp('med')){

function perderConfiancaRadio(){

/* ---------- 3.1.4 O ALTAR DE SUCATA ---------- */
function altar(){
  if(S.altar==null)S.altar=0;
  return S.altar;
}
function crescerAltar(n){
  S.altar=trava(altar()+(n||1),0,40);
}
function pesoAltar(){
  const a=altar();
  return {risco:trava(a*.012,0,.30),n:a};
}
function textoAltar(){
  const a=altar();
  if(a<4)return 'Uma pilha pequena de coisa que não serve, no canto do quintal.';
  if(a<10)return 'O monte de sucata já tem a altura do joelho.';
  if(a<18)return 'O monte passou da cintura. De noite ele faz sombra que parece coisa.';
  if(a<28)return 'É um monte da altura de uma pessoa. Ninguém passa perto dele à noite.';
  return 'Não é mais monte. É uma coisa empilhada, e ela tem forma agora.';
}
function menuAltar(volta){

  if(altar()>=18)diz('Alguma coisa vem mexer nele de madrugada. Você já ouviu.','alerta');
  botao('Queimar tudo',acaoDia(2,async()=>{

    diz('Mas o canto do quintal está limpo de novo.','bom');

  botao('Separar o que ainda serve',acaoDia(2,async()=>{
    if(altar()<3)return diz('Não tem o que separar aí.','fraco');
    const m=sortear(['tabua','arame','prego','cano']);
    darMat(m,2+Math.floor(altar()/6));
    S.altar=Math.max(0,altar()-4);
    diz(`Você garimpa e tira ${2+Math.floor(altar()/6)} ${MATE[m].un} do meio do lixo.`,'bom');
  }),{custo:'2h · vira material'});
  botao('Voltar',volta,{cls:'chave'});
}
/* descartar coisa alimenta o monte */
if(typeof largar==='function'){
  const _lg=largar;
  largar=function(){const r=_lg.apply(null,arguments);crescerAltar(1);return r;};
}
/* e o monte pesa na invasão */
if(typeof riscoInvasao==='function'){

<script>
/* ================= SANIDADE: A LENTE DISTORCIDA =================
   Não é barra de vida. É filtro de percepção: quanto menor,
   menos você pode confiar no que a TELA te diz. */

const SANIDADE_ESTAGIOS=[
 {min:80,n:'lúcido',   drift:0,   ilusao:0,   d:'Você está inteiro. O que você lê é o que é.'},
 {min:60,n:'tenso',    drift:0,   ilusao:.10, d:'Você ouve passo onde não tem passo.'},
 {min:40,n:'fissurado',drift:.10, ilusao:.22, d:'O peso da mochila não bate. Tem vulto no canto do olho.'},
 {min:20,n:'rachado',  drift:.15, ilusao:.34, d:'Aparece coisa no inventário que não existe. O relógio atrasa.'},
 {min:1, n:'desfeito', drift:.20, ilusao:.48, d:'Os nomes mudam. O mapa mostra lugar que não existe.'},
 {min:0, n:'ruptura',  drift:.25, ilusao:.60, d:'Você não está mais dirigindo isso.'}
];
function san(){
  if(S.sanidade==null)S.sanidade=100;
  return trava(S.sanidade,0,100);
}
function estagio(){
  const v=san();
  return SANIDADE_ESTAGIOS.find(e=>v>=e.min)||SANIDADE_ESTAGIOS[SANIDADE_ESTAGIOS.length-1];
}
function mexerSan(n,motivo){
  const antes=estagio().n;
  S.sanidade=trava(san()+n,0,100);
  const dps=estagio().n;
  if(antes!==dps){
    if(n<0)diz(`Alguma coisa muda em você. Agora você está ${dps}.`,'perigo');
    else diz(`Você respira melhor. ${dps[0].toUpperCase()+dps.slice(1)}.`,'bom');
  }
  return S.sanidade;
}
function debito(){
  if(S.realDebt==null)S.realDebt=0;
  return S.realDebt;
}

/* ================= A INTERFACE MENTE ================= */
/* número que oscila conforme o estágio */
function mente(v){
  const d=estagio().drift;
  if(!d||chance(.5))return v;
  const f=1+(Math.random()*2-1)*d;
  S.realDebt=debito()+1;
  return Math.round(v*f*10)/10;
}
/* o peso da mochila passa a mentir */
if(typeof pesoMochila==='function'){
  const _pm=pesoMochila;
  pesoMochila=function(){
    const real=_pm.apply(null,arguments);
    if(S._verdade)return real;
    return mente(real);
  };
}
/* a hora pode atrasar */
if(typeof horaTexto==='function'){
  const _ht=horaTexto;
  horaTexto=function(){
    if(estagio().drift>=.15&&chance(.18)){
      S.realDebt=debito()+1;
      const h=trava(S.hora-1,0,23);
      return String(h).padStart(2,'0')+':00';
    }
    return _ht.apply(null,arguments);
  };
}
/* o nome dos moradores pode trocar */
const NOMES_FALSOS=['Aparecida','Vanderlei','Neide','Zezinho','Cleide','Genivaldo','Marli','Toninho'];
function nomeDe(p){
  if(!p)return '';
  if(estagio().drift>=.20&&chance(.15)){
    S.realDebt=debito()+1;
    return NOMES_FALSOS[hashNome(p.n+S.dia)%NOMES_FALSOS.length];
  }
  return p.n;
}
/* o texto se degrada: erro de digitação no log */
if(typeof diz==='function'){
  const _dz=diz;
  diz=function(txt,cls){
    let t=txt;
    const e=estagio();
    if(typeof t==='string'&&e.drift>0&&t.length>20&&chance(e.ilusao*.35)){
      const i=Math.floor(Math.random()*(t.length-2))+1;
      if(/[a-záéíóúãõâêôç]/i.test(t[i])){
        t=t.slice(0,i)+t[i]+t.slice(i);   /* letra dobrada, como quem digitou tremendo */
        S.realDebt=debito()+1;
      }
    }
    return _dz(t,cls);
  };
}

/* ================= CATÁLOGO DE ILUSÕES ================= */
const ILUSOES=[
 {id:'batido',min:.10,
  t:'Três batidas na porta dos fundos. Pausadas, do jeito que gente bate.',
  checar:()=>{
    if(chance(.72)){mexerSan(-6);
      return {t:'Não tem ninguém. Não tem marca no chão, e o chão está molhado.',real:false};}
    return {t:'Tem uma coisa parada ali. Ela vai embora quando você acende a luz.',real:true};},
  ignorar:()=>{
    if(chance(.20)){return {t:'Era real. Ela entrou pelos fundos enquanto você fingia que não ouviu.',invade:true};}
    return {t:'Não acontece nada. Você não dorme mais essa noite.',san:-4};}},
 {id:'sussurro',min:.10,
  t:()=>{const m=(S.mortos||[]).length?sortear(S.mortos).n:'alguém que você conheceu';
    return `O rádio pega uma voz. É a voz d${/a$/.test(m)?'a':'o'} ${m}, pedindo pra você abrir a porta.`;},
  checar:()=>({t:'Você desliga o rádio e tira a pilha. Continua por mais dez segundos.',real:false,san:-8}),
  ignorar:()=>({t:'Você deixa tocando até parar sozinho.',san:-5})},
 {id:'fantasma',min:.34,
  t:'Tem uma lata de comida na mochila que você não lembra de ter pegado.',
  checar:()=>({t:'Não é lata. É uma pedra do tamanho de uma lata, embrulhada em papel.',real:false,limpa:true}),
  ignorar:()=>({t:'Você conta a lata no total do dia. O total do dia está errado.',san:-3})},
 {id:'mapa',min:.34,
  t:'O rádio marcou um ponto de suprimento lendário num lugar que você nunca ouviu falar.',
  checar:()=>({t:'Você confere no caderno. Esse lugar não existe nessa cidade.',real:false}),
  ignorar:()=>({t:'Você anota o lugar. Vai perder um dia atrás dele.',san:-4,perdeDia:true})},
 {id:'sombra',min:.48,
  t:'Tem alguém parado no quintal, de costas, na altura do muro.',
  checar:()=>({t:'Você chega perto e não tem ninguém. A grama não está pisada.',real:false,san:-7}),
  ignorar:()=>({t:'Você fecha a cortina. Continua lá quando você abre de novo.',san:-9})},
 {id:'contagem',min:.22,
  t:'Você conta as pessoas da casa e dá uma a mais do que devia.',
  checar:()=>({t:'Você conta de novo, em voz alta, um por um. Dá certo.',real:false,san:-4}),
  ignorar:()=>({t:'Você prefere não contar de novo.',san:-6})}
];
async function talvezIlusao(){
  const e=estagio();
  if(!e.ilusao)return false;
  /* o fósforo riscado ainda protege por um tempo */
  if(S.ilusaoLimpa>0){S.ilusaoLimpa--;return false;}
  if(S.iluDia===S.dia)return false;
  if(!chance(e.ilusao))return false;
  S.iluDia=S.dia;
  const pool=ILUSOES.filter(i=>e.ilusao>=i.min);
  if(!pool.length)return false;
  const il=sortear(pool);
  limpar();AC.innerHTML='';cap('Você tem certeza?');
  await pausa(900);
  diz(typeof il.t==='function'?il.t():il.t,'perigo');
  await pausa(1200);
  return new Promise(res=>{
    AC.innerHTML='';
    botao('Ir verificar',acaoDia(0,async()=>{
      const r=il.checar();
      S.ruido=trava(S.ruido+3,0,100);
      await pausa(1200);
      diz(r.t,r.real?'perigo':'sist');
      if(r.san)mexerSan(r.san);
      if(r.limpa)S.realDebt=Math.max(0,debito()-2);
      if(!r.real)S.realDebt=Math.max(0,debito()-1);
      res();
    }),{custo:'+3 de ruído · você fica sabendo'});
    botao('Não verificar',async()=>{
      AC.innerHTML='';
      const r=il.ignorar();
      await pausa(1100);
      diz(r.t,'alerta');
      if(r.san)mexerSan(r.san);
      S.realDebt=debito()+2;
      if(r.invade)S.invadeHoje=true;
      if(r.perdeDia)S.mapaFalso=true;
      res();
    },{custo:'a dúvida fica'});
  });
}

/* ================= CHECAGEM DE REALIDADE ================= */
function menuRealidade(volta){
  AC.innerHTML='';limpar();cap('Conferir o que é real');
  const e=estagio();
  diz(`Você está ${e.n}. ${e.d}`,e.drift?'alerta':'bom');
  diz(`Sanidade ${Math.round(san())}/100 · dúvida acumulada ${debito()}.`,'sist');
  if(e.drift)diz(`A tela está errando até ${Math.round(e.drift*100)}% nos números que te mostra.`,'perigo');

  botao('Riscar um fósforo',()=>{
    AC.innerHTML='';
    if(!temMat('fosforo',1)&&!S.lanterna)return diz('Você não tem com o que iluminar.','perigo');
    if(temMat('fosforo',1))gastarMat('fosforo',1);
    S.ilusaoLimpa=2;
    S.realDebt=Math.max(0,debito()-2);
    diz('A luz enche o cômodo por dez segundos. O que estava no canto não está mais.','bom');
    menuRealidade(volta);
  },{custo:'1 fósforo · limpa ilusão visual'});

  botao('Conferir a mochila peça por peça',acaoDia(0,async()=>{
    S._verdade=true;
    const real=pesoMochila();
    S._verdade=false;
    diz(`Você pesa tudo de novo: ${Math.round(real)} kg. De verdade.`,'sist');
    S.realDebt=Math.max(0,debito()-3);
    mexerSan(2);
  }),{custo:'5 minutos · limpa item fantasma'});

  botao('Se beliscar',()=>{
    AC.innerHTML='';
    mexerSan(-1);
    const e2=estagio();
    diz(`Dói. Você está acordado, e você está ${e2.n}. Isso é verdade.`,'sist');
    S.realDebt=Math.max(0,debito()-1);
    menuRealidade(volta);
  },{custo:'−1 de sanidade · confirma o estágio'});

  botao('Voltar',volta,{cls:'chave'});
}

/* ================= RECUPERAR ================= */
function menuCuidar(volta){
  AC.innerHTML='';limpar();cap('Cuidar de si');
  diz(`Sanidade ${Math.round(san())}/100 · ${estagio().n}.`,san()<40?'perigo':'sist');

  botao('Tomar banho',acaoDia(1,async()=>{
    if(S.agua<4)return diz('Precisa de 4 de água. Você não tem.','perigo');
    S.agua-=4;ganhou({agua:-4});
    mexerSan(6);
    diz('Água fria e um sabão que já foi sabão. Você fica limpo pela primeira vez em dias.','bom');
  }),{custo:'1h · 4 água · +6'});

  botao('Fazer comida quente no fogão',acaoDia(2,async()=>{
    if(S.comida<2)return diz('Precisa de 2 de comida.','perigo');

    mexerSan(4);
    S.abrigo.forEach(p=>p.moral=trava((p.moral||60)+9,0,100));

    if(S.abrigo.length)diz('É a primeira refeição de mesa desde que isso começou.','sist');
  }),{custo:'2h · 2 comida · +4 e +9 de moral pra todos'});

  botao('Escrever no diário',acaoDia(1,async()=>{
    const d=debito();
    S.realDebt=0;
    mexerSan(2+Math.min(6,d));
    diz(d>3?'Você escreve tudo que viu e não teve coragem de conferir. No papel parece menor.'
          :'Você escreve o dia. Fica registrado que aconteceu.','bom');
    if(d>3)diz(`${d} coisas que você deixou passar viraram uma página só.`,'sist');
  }),{custo:'1h · limpa a dúvida acumulada'});

  botao('Consertar móvel e barricada',acaoDia(2,async()=>{
    mexerSan(3);
    if(S.porta)danificarPorta(-8);
    S.somSuspeito=Math.max(0,(S.somSuspeito||0)-2);
    diz('Você prega, aperta parafuso, endireita o que estava torto. A casa range menos.','bom');
  }),{custo:'2h · +3 · a casa range menos'});

  botao('Procurar música no rádio',acaoDia(1,async()=>{
    S.ruido=trava(S.ruido+9,0,100);
    if(chance(.55)){
      mexerSan(8);
      diz('Você acha uma estação tocando música antiga. Fica ouvindo até acabar a pilha.','bom');
      S.abrigo.forEach(p=>p.moral=trava((p.moral||60)+6,0,100));
    }else diz('Só chiado. Você roda o dial até desistir.','fraco');
  }),{custo:'1h · +9 de ruído · 55% de +8'});

  botao('Conferir o que é real',()=>menuRealidade(volta),{custo:'fósforo, mochila, beliscão'});
  botao('Voltar',volta,{cls:'chave'});
}

/* ================= A ROTINA DO DIA ================= */
function passarSanidade(){
  const r=[];
  if(typeof mexerTrilho==='function'){if(S.dormiuMal)mexerTrilho('disso',6);if(!S.abrigo.length)mexerTrilho('paranoia',2);if(sequelas&&sequelas().includes('hiper'))mexerSan(-4);}
  if(S.dormiuMal){mexerSan(-10);r.push('Você não dormiu. Isso cobra.');}
  if(!S.abrigo.length){mexerSan(-3);r.push('Mais um dia sem falar com ninguém.');}
  else if(S.falouHoje===false)mexerSan(-1);
  if(S.gerQuebrado||S.diesel<=0){mexerSan(-2);r.push('Mais uma noite no escuro completo.');}
  if(san()<=0)r.push('RUPTURA');
  return r;
}
async function ruptura(){
  limpar();AC.innerHTML='';cap('Você não está dirigindo isso');
  await pausa(1500);
  diz('Você acorda em pé, no meio do quintal, sem sapato, e não sabe há quanto tempo.','perigo');
  await pausa(1600);
  const perdeu=[];
  if(mochila().itens.length){
    const q=Math.ceil(mochila().itens.length/2);
    for(let i=0;i<q;i++)perdeu.push(mochila().itens.pop());
  }
  S.comida=Math.max(0,S.comida-2);
  const f=ferirPor('queda');
  S.sanidade=28;
  diz(`Metade do que estava na mochila está espalhada no chão${f?', e você está com '+f.n:''}.`,'perigo');
  await pausa(1400);
  diz('Você volta pra dentro e ninguém comenta. Isso é pior do que se comentassem.','sist');
  if(typeof mexerCredito==='function')mexerCredito(-10);
  await pausa(1200);
  AC.innerHTML='';
  botao('Sentar um pouco',()=>menuComodo(4),{cls:'chave'});
}

<script>

   Ela só existia dentro de casa. Lá fora, onde você está
   sozinho e no escuro, ela não fazia nada. */

const VISOES=[
 {min:.10,t:'Tem uma pessoa parada na esquina, olhando pra você. Quando você pisca, é um poste.'},
 {min:.10,t:'Alguém chama o seu nome de dentro de uma casa fechada. Só o primeiro nome.'},
 {min:.22,t:'A rua que você conhece tem uma casa a mais do que devia ter.'},

 {min:.48,t:'A casa que você está indo saquear é a sua casa. Você reconhece a porta antes de reconhecer a rua.'},

}

/* ---------- coisas que acontecem no caminho ---------- */
const ROTA=[
 {id:'chuva',t:'Começa a chover forte no meio do caminho.',

      return 'Duas horas parado vendo a água descer. É quase descanso.';}}]},
 {id:'cachorro',t:'Um cachorro magro te segue há três quadras. Não late.',

    return 'Ele come e senta. Você segue sozinho.';}return 'Você não tem nada pra dar.';}},
   {n:'Espantar',h:0,f:()=>{mexerSan(-3);return 'Ele sai. Fica olhando de longe até você sumir.';}},
   {n:'Ignorar',h:0,f:()=>'Ele desiste na quarta quadra.'}]},
 {id:'crianca',t:'Tem um desenho de giz na calçada. Feito hoje. Uma casa, três bonecos e uma coisa alta no canto.',

<script>
/* ================= A GRAMÁTICA DAS BATIDAS =================
   Antes toda batida era igual. Agora o SOM já te diz quem é —
   se você souber ouvir. */
const BATIDAS={
 educada:{n:'três batidas curtas',d:'Ritmo educado e pausado.',
   origem:'comerciante ou alguém neutro',mimico:.15,
   som:(p)=>{[0,.42,.84].forEach(o=>bater(p,.55,o));}},
 irregular:{n:'batidas irregulares',d:'Som de alguém se escorando na madeira.',
   origem:'ferido, criança ou alguém exausto',mimico:.30,
   som:(p)=>{[0,.31,.9,1.15].forEach((o,i)=>bater(p,.35+i*.05,o));}},
 violenta:{n:'punho fechado',d:'Batidas rápidas, sem pausa pra resposta.',
   origem:'saqueadores ou os Três Caras',mimico:.10,
   som:(p)=>{for(let i=0;i<7;i++)bater(p,.85,i*.16);}},
 palma:{n:'palma aberta',d:'Três batidas fortes e secas. Autoridade.',
   origem:'patrulha estatal — ou quem imita patrulha',mimico:.45,
   som:(p)=>{[0,.5,1].forEach(o=>bater(p,.95,o,'palma'));}},
 unica:{n:'batida única e alta',d:'Um estrondo seco, seguido de silêncio.',
   origem:'reconhecimento: alguma coisa testando a estrutura',mimico:.85,
   som:(p)=>{bater(p,1,0,'grave');}},
 metronomo:{n:'ritmo de metrônomo',d:'Perfeição desumana na repetição.',
   origem:'ANOMALIA. Gente nunca mantém o tempo exato',mimico:.98,
   som:(p)=>{for(let i=0;i<8;i++)bater(p,.6,i*.5);}},
 unhas:{n:'unhas arranhando',d:'Procura constante por frestas ou bordas.',
   origem:'anomalia tátil, procurando por onde entrar',mimico:.95,
   som:(p)=>{arranhar(p);}}
};
function bater(pan,f,off,tipo){
  if(!A.ctx)return;
  const t=A.ctx.currentTime+off;
  const o=A.ctx.createOscillator(),g=A.ctx.createGain(),fl=A.ctx.createBiquadFilter();
  o.type='sine';
  o.frequency.setValueAtTime(tipo==='grave'?58:tipo==='palma'?150:92,t);
  o.frequency.exponentialRampToValueAtTime(tipo==='grave'?24:38,t+.16);
  fl.type='lowpass';fl.frequency.value=tipo==='palma'?900:260;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12*f,t+.008);
  g.gain.exponentialRampToValueAtTime(.001,t+.22);
  o.connect(fl);fl.connect(g);saida(g,{pan,rev:.5});
  o.start(t);o.stop(t+.25);
  const s=src(),g2=A.ctx.createGain(),f2=A.ctx.createBiquadFilter();
  f2.type='bandpass';f2.frequency.value=1200;f2.Q.value=1.5;
  g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(.04*f,t+.005);
  g2.gain.exponentialRampToValueAtTime(.001,t+.09);
  s.connect(f2);f2.connect(g2);saida(g2,{pan,rev:.4});s.start(t);s.stop(t+.1);
}
function arranhar(pan){
  if(!A.ctx)return;
  const t=A.ctx.currentTime;
  for(let i=0;i<6;i++){
    const s=src(),g=A.ctx.createGain(),f=A.ctx.createBiquadFilter();
    const tt=t+i*.34+Math.random()*.08;
    f.type='bandpass';f.frequency.setValueAtTime(2400,tt);
    f.frequency.linearRampToValueAtTime(1100,tt+.25);f.Q.value=6;
    g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(.035,tt+.05);
    g.gain.exponentialRampToValueAtTime(.001,tt+.28);
    s.connect(f);f.connect(g);saida(g,{pan,rev:.35});s.start(tt);s.stop(tt+.3);
  }
}
/* qual batida esse visitante faz */
function batidaDe(v){
  if(v._bat)return v._bat;
  const ks=Object.keys(BATIDAS);
  /* mímico tende às batidas de mímico; gente às de gente */
  const pesos=ks.map(k=>{
    const b=BATIDAS[k];
    return v.mimico?b.mimico:(1-b.mimico);
  });
  const tot=pesos.reduce((a,b)=>a+b,0);
  let r=Math.random()*tot;
  for(let i=0;i<ks.length;i++){r-=pesos[i];if(r<=0)return (v._bat=ks[i]);}
  return (v._bat='educada');
}
async function tocarBatida(v){
  const k=batidaDe(v);
  const b=BATIDAS[k];
  if(b.som)try{b.som(0)}catch(e){}
  diz(b.d,'perigo');
  await pausa(1400);
  /* quem já ouviu essa batida antes reconhece */
  S.batOuvidas=S.batOuvidas||{};
  S.batOuvidas[k]=(S.batOuvidas[k]||0)+1;
  if(S.batOuvidas[k]>=2){
    diz(`◈ Você já ouviu isso antes: ${b.origem}.`,b.mimico>.7?'perigo':'sist');
    if(typeof adicionarSinal==='function'&&b.mimico>.7)
      adicionarSinal(v,'◈ A batida é de anomalia. Você reconhece o padrão.');
  }else diz('Você não reconhece esse jeito de bater.','fraco');
  return k;
}

/* ---------- OBSERVAR A SOMBRA: ação grátis ---------- */
function observarSombra(v){
  const luz=(S.hora>=6&&S.hora<19)||S.lanterna||!S.gerQuebrado;
  if(!luz)return {t:'Está escuro demais lá fora pra ter sombra de alguma coisa.',nada:true};
  v.sombraVista=true;
  /* anomalia frequentemente não bloqueia luz como matéria sólida */
  if(v.mimico&&chance(.62))
    return {t:'Tem luz batendo do poste, e não tem sombra debaixo da porta. Nenhuma.',sinal:true};
  if(!v.mimico&&chance(.85))
    return {t:'A sombra dela corta a fresta de baixo, e se mexe quando ela se mexe.',ok:true};
  return {t:'A sombra está lá, mas ela não se mexe junto. Ou você imaginou.',duvida:true};
}

 eco:{n:'eco',d:'Você ouve a própria voz atrasada. Às vezes o que você lê não aconteceu.'}

function talvezSequela(){
  if(typeof san!=='function')return null;

  const livres=Object.keys(SEQUELAS).filter(k=>!sequelas().includes(k));
  if(!livres.length)return null;
  const k=sortear(livres);
  S.seq=sequelas().concat([k]);
  return SEQUELAS[k];
}
/* o eco faz o log repetir linha falsa */
if(typeof diz==='function'){
  const _dzE=diz;
  let _ult='';

<script>
/* ================= v48 — O SOM MENTE =================
   Duas coisas num bloco só.

   PARTE A: o motor de áudio (gerador, porta, passos, casa quieta).
   PARTE B: a sanidade deixa de mentir só no texto e passa a mentir
            no ouvido. O jogo é sobre vozes imitadas — mas até agora
            a loucura só acontecia em número e em letra dobrada.

   Este bloco é aditivo: redefine funções por cima das que já existem
   e não exige apagar nada.
   ===================================================== */

/* =====================================================
   PARTE A — MOTOR DE ÁUDIO
   ===================================================== */

const SOM = window.SOM = {
  gerador  : { vol:.055, pan:-.22, rev:.26, rpm:29, engasgo:true },
  casa     : { vento:.070, inquietacao:.25 },
  porta    : { vol:.9 },
  passos   : { vol:1.30, superficie:'madeira' },
  transicao: { escuro:1000, fade:280 },
  mental   : { vol:1 }
};

function somOk(){
  if(!A.ctx||!A.ruido)return false;
  if(A.ctx.state==='suspended'){
    try{ const r=A.ctx.resume(); if(r&&r.catch) r.catch(()=>{}); }catch(e){}
  }
  try{ reforcarSaida(); }catch(e){}
  return true;
}
function agoraS(){ return A.ctx.currentTime; }
function ruidoS(){ const s=A.ctx.createBufferSource(); s.buffer=A.ruido; s.loop=true; return s; }
function lfoS(f){ const o=A.ctx.createOscillator(); o.type='sine'; o.frequency.value=f; return o; }
function ligaS(fonte,destino,ganho){
  const g=A.ctx.createGain(); g.gain.value=ganho; fonte.connect(g); g.connect(destino); return g;
}
function esperaS(ms){ return new Promise(r=>setTimeout(r,ms)); }

/* saturação suave: troca o corte duro por compressão de fita */
function curvaSuave(k){
  const n=1024,c=new Float32Array(n),d=Math.tanh(k);
  for(let i=0;i<n;i++){ const x=i/(n-1)*2-1; c[i]=Math.tanh(x*k)/d; }
  return c;
}
/* pulso arredondado e limitado em banda: troca a onda quadrada do
   pistão antigo, que era um degrau de tensão e estourava o alto-falante */
function ondaPulso(){
  const h=[0,1,.78,.52,.30,.14,.06];
  const re=new Float32Array(h.length), im=new Float32Array(h.length);
  for(let i=0;i<h.length;i++) re[i]=h[i];
  return A.ctx.createPeriodicWave(re,im);
}
/* passeio aleatório puxado por uma base móvel: o tremor irregular que
   faz o rangido soar como madeira e não como sintetizador */
function curvaTremida(n,de,ate,amp,puxa){
  const c=new Float32Array(n); let v=de;
  for(let i=0;i<n;i++){
    const b=de+(ate-de)*(n>1?i/(n-1):1);
    v += (Math.random()*2-1)*amp;
    v += (b-v)*puxa;
    c[i]=Math.max(20,v);
  }
  return c;
}
/* envelope que engasga: a dobradiça prende e solta */
function curvaRangido(n){
  const c=new Float32Array(n); let g=1;
  for(let i=0;i<n;i++){
    const t=n>1?i/(n-1):1;
    if(Math.random()<.035) g=.25+Math.random()*.9;
    g += (1-g)*.06;
    c[i]=Math.sin(Math.PI*Math.pow(t,.75))*g;
  }
  return c;
}

/* ---------- gerador ---------- */

function tossida(t,vol){
  const o=A.ctx.createOscillator(),g=A.ctx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(96,t);
  o.frequency.exponentialRampToValueAtTime(38,t+.15);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(.28*vol,t+.008);
  g.gain.exponentialRampToValueAtTime(.0008,t+.30);
  o.connect(g); saida(g,{pan:SOM.gerador.pan,rev:.45});
  o.start(t); o.stop(t+.32);

  const s=ruidoS(),f=A.ctx.createBiquadFilter(),ng=A.ctx.createGain();
  f.type='lowpass'; f.frequency.value=300;
  ng.gain.setValueAtTime(0,t);
  ng.gain.linearRampToValueAtTime(.16*vol,t+.010);
  ng.gain.exponentialRampToValueAtTime(.0008,t+.22);
  s.connect(f); f.connect(ng); saida(ng,{pan:SOM.gerador.pan,rev:.40});
  s.start(t); s.stop(t+.24);
}

window.ligarGerador = function(){
  if(!somOk()||A.ger)return;
  const t=agoraS(), f0=SOM.gerador.rpm;

  /* barramento do motor: é aqui que o estouro morre */
  const hp=A.ctx.createBiquadFilter();
  hp.type='highpass'; hp.frequency.value=26; hp.Q.value=.6;   // tira o sub que bate no cone
  const lp=A.ctx.createBiquadFilter();
  lp.type='lowpass'; lp.frequency.value=430; lp.Q.value=.4;   // motor é grave, não é serra
  const forma=A.ctx.createWaveShaper();
  forma.curve=curvaSuave(1.35); forma.oversample='2x';
  const lim=A.ctx.createDynamicsCompressor();
  lim.threshold.value=-20; lim.knee.value=8; lim.ratio.value=12;
  lim.attack.value=.004;   lim.release.value=.14;
  const mestre=A.ctx.createGain(); mestre.gain.value=0;
  mestre.connect(hp); hp.connect(lp); lp.connect(forma); forma.connect(lim);
  saida(lim,{pan:SOM.gerador.pan,rev:SOM.gerador.rev});

  const oRot=A.ctx.createOscillator(); oRot.type='triangle';
  const gRot=A.ctx.createGain(); gRot.gain.value=.30;
  oRot.connect(gRot); gRot.connect(mestre);

  const oH=A.ctx.createOscillator(); oH.type='sine';
  const gH=A.ctx.createGain(); gH.gain.value=.12;
  oH.connect(gH); gH.connect(mestre);

  const oAlt=A.ctx.createOscillator(); oAlt.type='sine';   // alternador
  const gAlt=A.ctx.createGain(); gAlt.gain.value=.028;
  oAlt.connect(gAlt); gAlt.connect(mestre);

  /* combustão: ruído de banda modulado por pulso arredondado */
  const sN=ruidoS();
  const bpN=A.ctx.createBiquadFilter();
  bpN.type='bandpass'; bpN.frequency.value=165; bpN.Q.value=1.05;
  const amN=A.ctx.createGain(); amN.gain.value=.42;
  const oAM=A.ctx.createOscillator(); oAM.setPeriodicWave(ondaPulso());
  ligaS(oAM,amN.gain,.40);
  const gN=A.ctx.createGain(); gN.gain.value=.30;
  sN.connect(bpN); bpN.connect(amN); amN.connect(gN); gN.connect(mestre);

  /* deriva de rotação: motor vivo, sem vibrato de teclado */
  const dr1=lfoS(.055), dr2=lfoS(.017);
  ligaS(dr1,oRot.frequency,.55); ligaS(dr2,oRot.frequency,.35);
  ligaS(dr1,oH.frequency ,1.10); ligaS(dr2,oH.frequency ,.70);
  ligaS(dr1,oAM.frequency,.16 ); ligaS(dr2,oAM.frequency,.10);

  /* partida: pega, acelera demais, assenta */
  oRot.frequency.setValueAtTime(f0*.35,t);
  oRot.frequency.exponentialRampToValueAtTime(f0*1.06,t+1.5);
  oRot.frequency.linearRampToValueAtTime(f0,t+2.4);
  oH.frequency.setValueAtTime(f0*.70,t);
  oH.frequency.exponentialRampToValueAtTime(f0*2,t+1.6);
  oAlt.frequency.setValueAtTime(58,t);
  oAlt.frequency.exponentialRampToValueAtTime(118,t+1.8);
  oAM.frequency.setValueAtTime(f0*.175,t);
  oAM.frequency.exponentialRampToValueAtTime(f0/2,t+1.6);

  mestre.gain.setValueAtTime(0,t);
  mestre.gain.linearRampToValueAtTime(SOM.gerador.vol*1.18,t+1.9);
  mestre.gain.linearRampToValueAtTime(SOM.gerador.vol,t+3.2);

  tossida(t+.10,.9); tossida(t+.42,.7); tossida(t+.78,.5);

  [oRot,oH,oAlt,oAM,dr1,dr2].forEach(o=>o.start(t));
  sN.start(t);

  A.ger={t0:t,f0,fAtual:f0,carga:1,mestre,oRot,oH,oAlt,oAM,dr1,dr2,sN,gN,lp,engasgo:null};
  if(SOM.gerador.engasgo) programarEngasgo();
};

window.ajustarGerador = function(pct){
  if(!A.ctx||!A.ger)return;
  const t=agoraS(), p=trava(pct/100,0,1), G=A.ger;
  const f=G.f0*(.84+.16*p);          // tanque baixo, motor mais lento
  G.fAtual=f; G.carga=p;
  G.oRot.frequency.linearRampToValueAtTime(f,t+1.2);
  G.oH  .frequency.linearRampToValueAtTime(f*2,t+1.2);
  G.oAM .frequency.linearRampToValueAtTime(f/2,t+1.2);
  G.oAlt.frequency.linearRampToValueAtTime(100+22*p,t+1.2);
  G.lp  .frequency.linearRampToValueAtTime(300+170*p,t+1.2);
  G.gN  .gain.linearRampToValueAtTime(.24+.12*p,t+1.2);
  G.mestre.gain.linearRampToValueAtTime(SOM.gerador.vol*(.72+.28*p),t+1.2);
};

/* falha de ignição quando o diesel está no fim */
function programarEngasgo(){
  if(!A.ger)return;
  A.ger.engasgo=setTimeout(()=>{
    if(!A.ger)return;
    const G=A.ger;
    if(G.carga<.30&&Math.random()<.6){
      const t=agoraS(), v=G.mestre.gain.value, f=G.fAtual;
      G.mestre.gain.cancelScheduledValues(t);
      G.mestre.gain.setValueAtTime(v,t);
      G.mestre.gain.linearRampToValueAtTime(v*.35,t+.07);
      G.mestre.gain.linearRampToValueAtTime(v,t+.55);
      G.oRot.frequency.cancelScheduledValues(t);
      G.oRot.frequency.setValueAtTime(f,t);
      G.oRot.frequency.linearRampToValueAtTime(f*.62,t+.09);
      G.oRot.frequency.linearRampToValueAtTime(f,t+.70);
    }
    programarEngasgo();
  },7000+Math.random()*11000);
}

window.desligarGerador = function(){
  if(!A.ctx||!A.ger)return;
  const t=agoraS(), G=A.ger; A.ger=null;
  if(G.engasgo) clearTimeout(G.engasgo);
  const f=G.fAtual||G.f0;

  G.oRot.frequency.cancelScheduledValues(t);
  G.oRot.frequency.setValueAtTime(f,t);
  G.oRot.frequency.exponentialRampToValueAtTime(Math.max(4,f*.14),t+2.6);
  G.oH.frequency.cancelScheduledValues(t);
  G.oH.frequency.setValueAtTime(f*2,t);
  G.oH.frequency.exponentialRampToValueAtTime(Math.max(6,f*.30),t+2.6);
  G.oAM.frequency.cancelScheduledValues(t);
  G.oAM.frequency.setValueAtTime(f/2,t);
  G.oAM.frequency.exponentialRampToValueAtTime(.7,t+2.8);
  G.oAlt.frequency.cancelScheduledValues(t);
  G.oAlt.frequency.setValueAtTime(Math.max(20,G.oAlt.frequency.value),t);
  G.oAlt.frequency.exponentialRampToValueAtTime(20,t+2.2);

  const v=G.mestre.gain.value;
  G.mestre.gain.cancelScheduledValues(t);
  G.mestre.gain.setValueAtTime(v,t);
  G.mestre.gain.setValueAtTime(v*.9,t+1.4);   // o motor segura, depois entrega
  G.mestre.gain.linearRampToValueAtTime(0,t+3.0);

  setTimeout(()=>{
    [G.oRot,G.oH,G.oAlt,G.oAM,G.dr1,G.dr2,G.sN].forEach(x=>{try{x.stop()}catch(e){}});
  },3400);
};

/* ---------- porta ---------- */

function ferrolho(t,pan,vol,rev){
  const s=ruidoS(),f=A.ctx.createBiquadFilter(),g=A.ctx.createGain();
  f.type='bandpass'; f.frequency.value=1900+Math.random()*900; f.Q.value=6;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(.78*vol,t+.004);
  g.gain.exponentialRampToValueAtTime(.0008,t+.075);
  s.connect(f); f.connect(g); saida(g,{pan,rev:rev*.6});
  s.start(t); s.stop(t+.10);

  const o=A.ctx.createOscillator(),og=A.ctx.createGain();
  o.type='triangle';
  o.frequency.setValueAtTime(1150,t);
  o.frequency.exponentialRampToValueAtTime(520,t+.05);
  og.gain.setValueAtTime(.28*vol,t);
  og.gain.exponentialRampToValueAtTime(.0008,t+.09);
  o.connect(og); saida(og,{pan,rev:rev*.7}); o.start(t); o.stop(t+.11);
}

function rangido(t,dur,pan,vol,rev){
  const n=Math.max(64,Math.round(dur*180));

  // madeira sob tensão: o agudo, limitado antes do filtro ressonante
  const o=A.ctx.createOscillator(); o.type='sawtooth';
  const pre=A.ctx.createBiquadFilter(); pre.type='lowpass'; pre.frequency.value=2600;
  const bp=A.ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=13;
  const g=A.ctx.createGain(); g.gain.value=0;
  o.frequency.setValueCurveAtTime(curvaTremida(n,52,96,3.2,.10),t,dur);
  bp.frequency.setValueCurveAtTime(curvaTremida(n,430,1250,90,.12),t,dur);
  const e1=curvaRangido(n); for(let i=0;i<n;i++) e1[i]*=.24*vol;
  g.gain.setValueCurveAtTime(e1,t,dur);
  o.connect(pre); pre.connect(bp); bp.connect(g); saida(g,{pan,rev});
  o.start(t); o.stop(t+dur+.05);

  // grão da madeira raspando
  const s=ruidoS(),nf=A.ctx.createBiquadFilter(),ng=A.ctx.createGain();
  nf.type='bandpass'; nf.Q.value=5;
  nf.frequency.setValueCurveAtTime(curvaTremida(n,600,1700,140,.12),t,dur);
  const e2=curvaRangido(n); for(let i=0;i<n;i++) e2[i]*=.15*vol;
  ng.gain.value=0;
  ng.gain.setValueCurveAtTime(e2,t,dur);
  s.connect(nf); nf.connect(ng); saida(ng,{pan,rev});
  s.start(t); s.stop(t+dur+.05);
}

function arrasto(t,dur,pan,vol,rev){
  const s=ruidoS(),f=A.ctx.createBiquadFilter(),g=A.ctx.createGain();
  f.type='lowpass'; f.Q.value=1.2;
  f.frequency.setValueAtTime(180,t);
  f.frequency.linearRampToValueAtTime(420,t+dur*.5);
  f.frequency.linearRampToValueAtTime(200,t+dur);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(.36*vol,t+dur*.28);
  g.gain.linearRampToValueAtTime(.14*vol,t+dur*.80);
  g.gain.linearRampToValueAtTime(0,t+dur);
  s.connect(f); f.connect(g); saida(g,{pan,rev:rev*.8});
  s.start(t); s.stop(t+dur+.05);
}

/* o ar de fora entrando: vai quase todo para a reverberação */
function lufada(t,dur,pan,vol){
  const s=ruidoS(),f=A.ctx.createBiquadFilter(),g=A.ctx.createGain();
  f.type='bandpass'; f.frequency.value=340; f.Q.value=.5;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(.28*vol,t+dur*.35);
  g.gain.linearRampToValueAtTime(0,t+dur);
  s.connect(f); f.connect(g); saida(g,{pan,rev:.85});
  s.start(t); s.stop(t+dur+.05);
}

function batente(t,pan,vol,rev){
  const o=A.ctx.createOscillator(),g=A.ctx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(74,t);
  o.frequency.exponentialRampToValueAtTime(41,t+.14);
  g.gain.setValueAtTime(.56*vol,t);
  g.gain.exponentialRampToValueAtTime(.0008,t+.30);
  o.connect(g); saida(g,{pan,rev:rev*.9}); o.start(t); o.stop(t+.34);

  const s=ruidoS(),f=A.ctx.createBiquadFilter(),ng=A.ctx.createGain();
  f.type='lowpass'; f.frequency.value=520;
  ng.gain.setValueAtTime(0,t);
  ng.gain.linearRampToValueAtTime(.39*vol,t+.005);
  ng.gain.exponentialRampToValueAtTime(.0008,t+.18);
  s.connect(f); f.connect(ng); saida(ng,{pan,rev});
  s.start(t); s.stop(t+.20);
}

window.somPortaAbrindo = function(op){
  op=op||{};
  if(!somOk())return 0;
  const t0  = agoraS()+(op.atraso||0);
  const pan = op.pan!==undefined?op.pan:0;
  const rev = op.rev!==undefined?op.rev:.5;
  const vol = (op.vol!==undefined?op.vol:1)*SOM.porta.vol;
  const dur = op.dur||2.4;

  if(op.tranca!==false){ ferrolho(t0,pan,vol,rev); ferrolho(t0+.17,pan,vol*.8,rev); }
  const tc=t0+(op.tranca===false?.05:.42);
  rangido(tc,dur*.62,pan,vol,rev);
  arrasto(tc,dur*.70,pan,vol*.7,rev);
  if(op.vento!==false) lufada(tc+dur*.25,dur*.9,pan,vol*.55);
  batente(t0+dur*.95,pan,vol*.6,rev);
  return dur+.6;
};

window.somPortaFechando = function(op){
  op=op||{};
  if(!somOk())return 0;
  const t0  = agoraS()+(op.atraso||0);
  const pan = op.pan!==undefined?op.pan:0;
  const rev = op.rev!==undefined?op.rev:.5;
  const vol = (op.vol!==undefined?op.vol:1)*SOM.porta.vol;
  const dur = op.dur||1.6;

  rangido(t0,dur*.55,pan,vol*.8,rev);
  arrasto(t0,dur*.6,pan,vol*.6,rev);
  batente(t0+dur*.72,pan,vol*1.25,rev);         // o baque de encostar
  if(op.tranca!==false){ ferrolho(t0+dur*.90,pan,vol,rev); ferrolho(t0+dur*.90+.19,pan,vol*.85,rev); }
  return dur+.6;
};

/* ---------- passos ---------- */

const SUP={
  madeira : {corte:900 ,q:.9 ,corpo:88,res:[150,230],resVol:.10,scuff:.045},
  escada  : {corte:1100,q:1.0,corpo:96,res:[190,300],resVol:.13,scuff:.050},
  concreto: {corte:1700,q:1.1,corpo:74,res:[380,620],resVol:.03,scuff:.075},
  terra   : {corte:480 ,q:.7 ,corpo:66,res:[110,160],resVol:.02,scuff:.055}
};

function passo(t,op){
  const S2=SUP[op.superficie]||SUP.madeira;
  const f=op.forca, pan=op.pan, rev=op.rev;

  // o peso do corpo chegando no chão
  const o=A.ctx.createOscillator(),og=A.ctx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(S2.corpo*(.9+Math.random()*.2),t);
  o.frequency.exponentialRampToValueAtTime(S2.corpo*.52,t+.085);
  og.gain.setValueAtTime(0,t);
  og.gain.linearRampToValueAtTime(.30*f,t+.006);
  og.gain.exponentialRampToValueAtTime(.0008,t+.16);
  o.connect(og); saida(og,{pan,rev:rev*.7}); o.start(t); o.stop(t+.18);

  // o solado batendo
  const s=ruidoS(),nf=A.ctx.createBiquadFilter(),ng=A.ctx.createGain();
  nf.type='lowpass'; nf.frequency.value=S2.corte*(.85+Math.random()*.3); nf.Q.value=S2.q;
  ng.gain.setValueAtTime(0,t);
  ng.gain.linearRampToValueAtTime(.24*f,t+.004);
  ng.gain.exponentialRampToValueAtTime(.0008,t+.10);
  s.connect(nf); nf.connect(ng); saida(ng,{pan,rev}); s.start(t); s.stop(t+.12);

  // a tábua respondendo depois: é isso que dá o assoalho velho
  if(S2.resVol>0){
    const r=A.ctx.createOscillator(),rg=A.ctx.createGain();
    r.type='triangle';
    r.frequency.value=S2.res[0]+Math.random()*(S2.res[1]-S2.res[0]);
    rg.gain.value=0;                                   // sem isso o nó toca em escala cheia
    rg.gain.setValueAtTime(0,t);                       // até a primeira automação
    rg.gain.linearRampToValueAtTime(S2.resVol*f,t+.010);
    rg.gain.exponentialRampToValueAtTime(.0008,t+.34);
    r.connect(rg); saida(rg,{pan,rev:rev*1.15}); r.start(t); r.stop(t+.36);
  }

  // o pé arrastando ao sair
  const t2=t+.05+Math.random()*.04;
  const s2=ruidoS(),hf=A.ctx.createBiquadFilter(),hg=A.ctx.createGain();
  hf.type='highpass'; hf.frequency.value=1800;
  hg.gain.setValueAtTime(0,t2);
  hg.gain.linearRampToValueAtTime(S2.scuff*f,t2+.012);
  hg.gain.exponentialRampToValueAtTime(.0008,t2+.07);
  s2.connect(hf); hf.connect(hg); saida(hg,{pan,rev:rev*.6}); s2.start(t2); s2.stop(t2+.09);
}

window.somPassos = function(op){
  op=op||{};
  if(!somOk())return 0;
  const n     = op.passos||6;
  const ritmo = op.ritmo ||.46;
  const sup   = op.superficie||SOM.passos.superficie;
  const base  = (op.forca!==undefined?op.forca:.85)*SOM.passos.vol;
  const pan0  = op.pan||0;
  const apro  = !!op.aproximando, afast = !!op.afastando;
  let t = agoraS()+(op.atraso!==undefined?op.atraso:.08);

  for(let i=0;i<n;i++){
    const p = n>1 ? i/(n-1) : 1;
    let f = base, rev = op.rev!==undefined?op.rev:.40;
    if(apro)       { f=base*(.32+.85*p); rev=.85-.55*p; }   // chegando: mais perto, menos eco
    else if(afast) { f=base*(1.05-.75*p); rev=.28+.60*p; }
    /* passo de anomalia: tempo exato demais, sem variação de força.
       É o mesmo tell do ritmo de metrônomo nas batidas. */
    const exato = !!op.desumano;
    passo(t,{forca:exato?base:f,pan:pan0+(i%2?.13:-.13),rev,superficie:sup});
    const longo = exato ? 1 : ((i%2)?1.06:.94);
    t += ritmo*longo*(exato?1:(.94+Math.random()*.12));
  }
  return t-agoraS();
};

/* ---------- transição de tela preta ---------- */

function garantirEscuro(){
  let el=document.getElementById('escuro-passos');
  if(el)return el;
  const st=document.createElement('style');
  st.textContent=
  '#escuro-passos{position:fixed;inset:0;z-index:95;background:#000;opacity:0;'+
  'pointer-events:none;transition:opacity .28s ease;display:flex;'+
  'align-items:center;justify-content:center;padding:34px}'+
  '#escuro-passos.vis{opacity:1;pointer-events:auto}'+
  '#escuro-passos p{font-family:var(--corpo,Georgia,serif);font-style:italic;'+
  'color:#6A6273;font-size:17px;text-align:center;max-width:26ch;line-height:1.6;'+
  'opacity:0;transition:opacity .5s ease .35s}'+
  '#escuro-passos.vis p{opacity:1}'+
  '@media(prefers-reduced-motion:reduce){#escuro-passos{transition:none}}';
  document.head.appendChild(st);
  el=document.createElement('div');
  el.id='escuro-passos';
  el.innerHTML='<p></p>';
  document.body.appendChild(el);
  return el;
}

/* escurece -> 1s de breu -> passos -> aoFim() ainda no escuro -> volta */
window.transicaoPassos = function(op){
  op=op||{};
  const el=garantirEscuro();
  const alvo=el.querySelector('p');
  const fade=SOM.transicao.fade;
  const breu=op.escuro!==undefined?op.escuro:SOM.transicao.escuro;

  alvo.textContent=op.texto||'';
  el.classList.add('vis');

  return esperaS(fade+40)
    .then(()=>esperaS(breu))
    .then(()=>{
      const dur=window.somPassos({
        passos:op.passos, ritmo:op.ritmo, superficie:op.superficie,
        aproximando:op.aproximando, afastando:op.afastando,
        desumano:op.desumano, forca:op.forca, pan:op.pan, atraso:.05
      });
      return esperaS(Math.round(dur*1000)+(op.sobra!==undefined?op.sobra:420));
    })
    .then(()=>{
      if(typeof op.aoFim==='function'){ try{op.aoFim()}catch(e){console.error(e)} }
      el.classList.remove('vis');
      return esperaS(fade+40);
    })
    .then(()=>{ alvo.textContent=''; });
};

function estaloLeve(){
  if(!somOk())return;
  const t=agoraS();
  const o=A.ctx.createOscillator(),g=A.ctx.createGain();
  o.type='triangle';
  o.frequency.setValueAtTime(260+Math.random()*260,t);
  o.frequency.exponentialRampToValueAtTime(95,t+.11);
  g.gain.setValueAtTime(.035,t);
  g.gain.exponentialRampToValueAtTime(.0006,t+.17);
  o.connect(g); saida(g,{pan:Math.random()*1.4-.7,rev:.7});
  o.start(t); o.stop(t+.19);
}

window.ligarAmbiente = function(){
  if(!somOk()||A.amb.on)return;
  A.amb.on=true;
  const t=agoraS();
  const s=ruidoS();
  const hp=A.ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=60;
  const f =A.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=260; f.Q.value=.4;
  const g =A.ctx.createGain(); g.gain.value=0;
  g.gain.linearRampToValueAtTime(SOM.casa.vento,t+6);
  const l=lfoS(.035); ligaS(l,f.frequency,70); l.start(t);
  s.connect(hp); hp.connect(f); f.connect(g); saida(g,{rev:.5}); s.start(t);
  A.amb.vento={s,g,f,lfo:l};
  window.agendarInquietacao();
  leitoMental();
};

window.agendarInquietacao = function(){
  if(!A.ctx)return;
  clearTimeout(A.amb.timer);
  if(SOM.casa.inquietacao<=0)return;
  const espera=(26000+Math.random()*34000)/(1+A.tensao*1.6);
  A.amb.timer=setTimeout(()=>{
    // a casa só fala quando a tensão justifica; o resto do tempo é o gerador
    if(A.tensao>.42 && chance(SOM.casa.inquietacao)) estaloLeve();
    window.agendarInquietacao();
  },Math.max(9000,espera));
};

window.acalmarCasa = function(){
  if(!A.ctx)return;
  clearTimeout(A.amb.timer);
  if(A.amb.vento) A.amb.vento.g.gain.linearRampToValueAtTime(SOM.casa.vento,agoraS()+3);
  window.agendarInquietacao();
};


/* =====================================================
   PARTE B — A SANIDADE MENTE NO OUVIDO

   O jogo inteiro é sobre vozes imitadas, mas a loucura só
   acontecia em número e em letra dobrada. Daqui pra frente
   ela acontece onde dói: no que você escuta.
   ===================================================== */

/* ---------- 1. o leito mental ----------
   Zumbido de ouvido e pressão de sub que crescem com o estágio.
   Nunca é anunciado no texto. A pessoa só percebe quando some. */

const MENTAL={nos:null,ctx:null};
function leitoMental(){
  if(!somOk())return;
  if(MENTAL.nos&&MENTAL.ctx===A.ctx)return;   // nós de outro contexto não servem
  const t=agoraS();

  // zumbido agudo, com deriva pra não virar tom de teste
  const oz=A.ctx.createOscillator(); oz.type='sine'; oz.frequency.value=3120;
  const gz=A.ctx.createGain(); gz.gain.value=0;
  const dz=lfoS(.031); ligaS(dz,oz.frequency,26); dz.start(t);
  oz.connect(gz); saida(gz,{pan:.10,rev:.05});

  // pressão: sub pulsante, quase infrassônico mas com corpo
  const os=A.ctx.createOscillator(); os.type='sine'; os.frequency.value=43;
  const gs=A.ctx.createGain(); gs.gain.value=0;            // nível, vem do estágio
  /* A respiração é um estágio à parte, multiplicando o nível. Ligar o LFO
     direto em gs.gain somava profundidade absoluta: com alvo .045 e LFO de
     .5, o ganho ia a .545 — dez vezes o pretendido. */
  const resp=A.ctx.createGain(); resp.gain.value=.72;
  const ps=lfoS(.19); ligaS(ps,resp.gain,.28); ps.start(t); // .44 .. 1.00
  const hs=A.ctx.createBiquadFilter(); hs.type='highpass'; hs.frequency.value=30;
  os.connect(gs); gs.connect(resp); resp.connect(hs); saida(hs,{rev:.30});

  // sopro sem direção: o barulho que a cabeça faz no silêncio
  const sv=ruidoS();
  const fv=A.ctx.createBiquadFilter(); fv.type='bandpass'; fv.frequency.value=1600; fv.Q.value=.7;
  const gv=A.ctx.createGain(); gv.gain.value=0;
  sv.connect(fv); fv.connect(gv); saida(gv,{rev:.65});

  oz.start(t); os.start(t); sv.start(t);
  MENTAL.nos={gz,gs,gv}; MENTAL.ctx=A.ctx;
  atualizarMental();
}

/* quanto de leito cada estágio carrega */
const LEITO={ 'lúcido':[0,0,0], 'tenso':[.0022,.010,.004],
  'fissurado':[.0045,.020,.009], 'rachado':[.0075,.032,.015],
  'desfeito':[.0110,.045,.022], 'ruptura':[.0160,.062,.032] };

function atualizarMental(){
  if(!MENTAL.nos||!A.ctx)return;
  const e=(typeof estagio==='function')?estagio():null;
  const L=LEITO[e&&e.n]||LEITO['lúcido'];
  const t=agoraS(), v=SOM.mental.vol;
  MENTAL.nos.gz.gain.linearRampToValueAtTime(L[0]*v,t+4);
  MENTAL.nos.gs.gain.linearRampToValueAtTime(L[1]*v,t+4);
  MENTAL.nos.gv.gain.linearRampToValueAtTime(L[2]*v,t+4);
}

/* a sanidade também empurra o coração: baixo é taquicardia de base */
if(typeof mexerSan==='function'){
  const _ms=mexerSan;
  window.mexerSan=function(n,motivo){
    const r=_ms(n,motivo);
    atualizarMental();
    if(typeof tensao==='function'){
      const piso=trava((100-san())/100*.45,0,.45);
      if(A.tensao<piso)tensao(piso);
    }
    return r;
  };
}

/* ---------- 2. a casa cresce por dentro ----------
   Débito de realidade alto = a reverberação abre. A casa passa a
   soar maior do que é. Ninguém avisa; conferir a realidade fecha. */
function ajustarSalaMental(){
  if(!A.ctx||!A.conv)return;
  const d=trava((typeof debito==='function'?debito():0)/8,0,1);
  A.molhado.gain.linearRampToValueAtTime(.30+d*.34,agoraS()+3);
}

/* ---------- 3. a voz de quem morreu ----------
   Usa a síntese de fala que o jogo já carrega, mas com o timbre
   puxado pra baixo e um sussurro por baixo. É o mesmo truque que o
   jogo usa no mímico — aqui aplicado à própria cabeça do jogador. */
function vozDeMorto(txt,nome){
  if(!A.ctx)return falar(txt,{dist:'longe'});
  const semente=(nome||'').split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  const t=agoraS();

  // um sopro que sobe antes da voz: o ar sendo puxado
  const s=ruidoS(),f=A.ctx.createBiquadFilter(),g=A.ctx.createGain();
  f.type='bandpass'; f.frequency.setValueAtTime(180,t);
  f.frequency.exponentialRampToValueAtTime(900,t+1.1);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(.05,t+.8);
  g.gain.linearRampToValueAtTime(0,t+1.3);
  s.connect(f); f.connect(g); saida(g,{rev:.9}); s.start(t); s.stop(t+1.4);

  if(typeof sussurro==='function')
    sussurro(Math.max(5,Math.round(txt.length/8)),(semente%2?-.4:.4),.030);

  return falar(txt,{dist:'longe',vozIdx:semente,
    pitch:.72+((semente%7)*.015), rate:.80, vol:1.25});
}
