<script>
/* ================= TEMPERAMENTO =================
   Todo morador era mecanicamente igual: mudava a habilidade e
   o objetivo, e só. Agora cada um reage do jeito dele — e é
   isso que faz a casa ser um lugar e não uma lista. */

const TEMPER={
 cetico:{n:'cético',
   d:'Não acredita em nada que não viu. Isso protege e atrapalha.',
   crê:-.35,vê:-.20,panico:-.30,
   fala:['"Você tem certeza que viu isso? Certeza mesmo?"',
         '"Tem explicação. Sempre tem. A gente é que não achou."',
         '"Eu vou lá olhar. Se tiver alguma coisa, eu volto correndo."']},
 nervoso:{n:'nervoso',
   d:'Vê coisa que não tem, e às vezes vê antes de todo mundo.',
   crê:.35,vê:.30,panico:.40,falso:.30,
   fala:['"Tem uma coisa na casa. Eu sei que tem."',
         '"Não me manda ficar calmo. Não fala isso comigo."',
         '"Eu não vou dormir hoje. Não adianta insistir."']},
 firme:{n:'firme',
   d:'Não entra em pânico e segura os outros quando desanda.',
   crê:0,vê:0,panico:-.45,segura:.30,
   fala:['"Se for verdade, a gente resolve. Se não for, dormimos."',
         '"Senta. Respira. Conta de novo do começo."',
         '"Eu fico acordado essa parte da noite. Você dorme."']},
 supersticioso:{n:'supersticioso',
   d:'Acredita em tudo e tem um jeito próprio de lidar.',
   crê:.45,vê:.15,panico:.10,ritual:true,
   fala:['"Minha avó falava disso. Eu achava história."',
         '"Deixa eu botar sal na soleira. Não custa nada."',
         '"Tem coisa que não é pra entender. É pra respeitar."']},
 curioso:{n:'curioso',
   d:'Quer olhar de perto. Isso ajuda e é perigoso.',
   crê:.20,vê:.35,panico:-.10,arrisca:.35,
   fala:['"Deixa eu ver. Eu quero ver."',
         '"Se a gente entender como funciona, a gente ganha."',
         '"Eu anotei tudo que aconteceu essa semana. Olha aqui."']},
 calado:{n:'calado',
   d:'Repara em tudo e conta pouco. Você tem que perguntar.',
   crê:.10,vê:.40,panico:-.20,guarda:.50,
   fala:['"..."','"Nada."','"Depois eu falo."']}
};
const TEMPER_IDS=Object.keys(TEMPER);

function temper(p){
  if(!p)return TEMPER.firme;
  if(!p.temper||!TEMPER[p.temper]){
    p.temper=TEMPER_IDS[hashNome(p.n+p.id)%TEMPER_IDS.length];
  }
  return TEMPER[p.temper];
}

/* ================= CREDIBILIDADE =================
   A casa acredita em você? Isso muda tudo. */
function credito(){
  if(S.credito==null)S.credito=60;
  return trava(S.credito,0,100);
}
function mexerCredito(n){
  S.credito=trava(credito()+n,0,100);
}
function estadoCredito(){
  const c=credito();
  if(c>=78)return {n:'a casa confia em você',cls:'bom'};
  if(c>=50)return {n:'a casa te escuta',cls:'sist'};
  if(c>=28)return {n:'começaram a duvidar',cls:'alerta'};
  return {n:'ninguém acredita mais em você',cls:'perigo'};
}
/* o que a credibilidade muda de verdade */
function ajudaDaCasa(){
  return trava((credito()-50)/100,-.35,.35);
}

/* ================= ELES TAMBÉM VEEM =================
   Uma anomalia acontece com OUTRA pessoa. Você não estava lá.
   Agora você decide se acredita. */
async function testemunho(){
  if(!S.abrigo.length||S.testeHoje===S.dia)return false;
  const base=.14+(memAnom().nivel*.05)+(S.dia*.006);
  if(!chance(trava(base,.08,.42)))return false;
  S.testeHoje=S.dia;

  const p=sortear(S.abrigo);
  const T=temper(p);
  /* nervoso inventa às vezes; calado nunca inventa mas conta pouco */
  const inventou=chance(trava((T.falso||0)+(memAnom().nivel<2?.08:0),0,.42));
  const an=sortearAnomalia();

  limpar();AC.innerHTML='';cap(p.n+' viu alguma coisa');
  await pausa(700);
  fichaRosto(p,T.n,T.d,'vivo');
  await pausa(900);

  const relato=inventou
    ?sortear(['"Tinha alguém no corredor. Eu vi. Não me olha assim."',
      '"A porta do quarto abriu sozinha. Eu tava olhando pra ela."',
      '"Alguém falou o meu nome. Não foi ninguém daqui."',
      '"Tem uma coisa embaixo da casa. Eu ouvi cavando."'])
    :'"'+an.txt(cena.casa?cena.casa.voce:4).replace(/^Você /,'Eu ')+'"';
  diz(relato,'fala');
  await pausa(1300);
  if(T.guarda&&chance(.5))diz(`${p.n} conta e para no meio. Não quer falar mais.`,'fraco');

  return new Promise(res=>{
    AC.innerHTML='';
    botao('Acreditar e ir olhar com ela',acaoDia(1,async()=>{
      await pausa(1200);
      if(inventou){
        diz('Não tem nada. E dá pra ver na cara dela que ela sabia disso.','fraco');
        mexerMoral(-4,p);aproximar(p,S.abrigo.find(x=>x!==p)||p,-4);
        mexerCredito(-4);
      }else{
        diz('◈ '+an.real,'alerta');
        S.anomPegas=(S.anomPegas||0)+1;
        if(an.efeito)an.efeito();
        mexerCredito(+10);
        p.moral=trava((p.moral||60)+14,0,100);
        aproximar(p,S.abrigo.find(x=>x!==p)||p,8);
        diz(`${p.n} fica do seu lado depois disso. Você foi o único que foi olhar.`,'bom');
        S.confianca=trava(S.confianca+6,0,100);
      }
      res();
    }),{cls:'prim',custo:'1 hora'});

    botao('Dizer que ela imaginou',async()=>{
      AC.innerHTML='';
      if(inventou){
        diz(`${p.n} discute um pouco e desiste. No fundo ela concorda.`,'sist');
        mexerCredito(+3);
      }else{
        diz(`${p.n} para de falar sobre isso. E era verdade.`,'perigo');
        p.moral=trava((p.moral||60)-16,0,100);
        aproximar(p,S.abrigo.find(x=>x!==p)||p,-12);
        mexerCredito(-9);
        p.calou=(p.calou||0)+1;
        if(p.calou>=2)diz(`${p.n} não vai te contar da próxima vez.`,'alerta');
        S.confianca=trava(S.confianca-8,0,100);
      }
      res();
    });

    botao('Pedir pra outra pessoa ir junto',acaoDia(1,async()=>{
      const o=sortear(S.abrigo.filter(x=>x!==p));
      if(!o){diz('Não tem mais ninguém.','fraco');return res();}
      const To=temper(o);
      await pausa(1200);
      const confirma=!inventou&&chance(trava(.5+(To.vê||0)-(To.crê<0?.25:0),.1,.9));
      if(confirma){
        diz(`${o.n} volta branco e confirma tudo.`,'perigo');
        mexerCredito(+6);mexerMoral(-8);
        S.anomPegas=(S.anomPegas||0)+1;
        aproximar(p,o,14);
      }else if(inventou){
        diz(`${o.n} não vê nada e diz isso na frente de todo mundo.`,'sist');
        aproximar(p,o,-10);mexerMoral(-4,p);
      }else{
        diz(`${o.n} não vê nada. ${p.n} olha pra você esperando você tomar um lado.`,'alerta');
        mexerCredito(-3);
      }
      res();
    }),{custo:'1 hora · duas versões'});
  });
}

/* ================= REAGIR AO QUE ACONTECE =================
   Uma anomalia identificada mexe com a casa toda. */
function casaReage(forca){
  const r=[];
  const aj=ajudaDaCasa();
  S.abrigo.forEach(p=>{
    const T=temper(p);
    const abalo=trava(forca*.06*(1+(T.panico||0))-(aj*.25),0,.5);
    p.moral=trava((p.moral||60)-Math.round(abalo*30),0,100);
    if(T.segura&&chance(.4)){
      S.abrigo.forEach(o=>{if(o!==p)o.moral=trava((o.moral||60)+5,0,100);});
      r.push(`${p.n} junta todo mundo na sala e fala baixo até a casa acalmar.`);
    }
    if(T.ritual&&chance(.35)){
      S.ruido=Math.max(0,S.ruido-2);
      r.push(`${p.n} bota sal na soleira e reza uma coisa curta. Ninguém ri.`);
    }
    if(T.arrisca&&chance(.30)){
      if(chance(.5)){
        S.estudo=(S.estudo||0)+1;
        r.push(`${p.n} foi olhar de perto por conta própria e anotou tudo. Isso ajuda.`);
      }else{
        const f=ferirPor('bicho',p);
        r.push(`${p.n} foi olhar de perto sozinha.${f?' Voltou com '+f.n+'.':' Voltou calada.'}`);
      }
    }
    if((T.panico||0)>.3&&p.moral<=25&&chance(.25)){
      S.ruido=trava(S.ruido+7,0,100);
      r.push(`${p.n} teve um ataque no meio da noite. A casa inteira acordou.`);
    }
  });
  return r;
}

/* ================= ANOMALIA QUE FICA =================
   Antes era: aparece, investiga, acabou. Algumas agora moram
   aqui e pioram. */
const MORADORAS=[
 {id:'mancha',n:'a mancha',
  fases:['Tem uma mancha escura na parede da sala do tamanho de uma moeda.',
         'A mancha está do tamanho de uma mão. Ninguém lembra dela pequena.',
         'A mancha cobre metade da parede e a parede está fria naquele ponto.',
         'Não é mancha. É uma abertura, e ela está do tamanho de uma pessoa.'],
  fim:()=>{abrirAvaria('rachadura','a mancha que cresceu');
    return 'A parede cede num pedaço. O que estava atrás dela não estava atrás dela.';},
  cura:'tapar com cimento'},
 {id:'contagem',n:'a contagem',
  fases:['Você conta os pratos e dá um a mais.',
         'Sobra um prato, uma colher e um colchão. Sempre um.',
         'Todo mundo já reparou e ninguém fala.',
         'Você conta as pessoas dormindo e dá certo. Conta de novo e dá um a mais.'],
  fim:()=>{mexerMoral(-18);S.confianca=trava(S.confianca-14,0,100);
    return 'Alguém está morando aqui há dias e comendo do que é de vocês.';},
  cura:'anotar a casa inteira'},
 {id:'som',n:'o som do porão',
  fases:['Tem um som baixo vindo do porão à noite.',
         'O som tem hora certa agora: começa às duas.',
         'O som tem ritmo. É alguma coisa raspando de baixo pra cima.',
         'O som parou. Fazia nove noites que ele fazia parte da casa.'],
  fim:()=>{S.dentroCasa=S.dentroCasa||[];
    S.dentroCasa.push({id:'fundo',onde:6,visto:false});
    return 'Parou porque terminou.';},
  cura:'concreto no porão'}
];
function moradoras(){
  /* save sujo ou entrada nula derrubava o jogo aqui */
  if(!Array.isArray(S.moradoras))S.moradoras=[];
  S.moradoras=S.moradoras.filter(a=>a&&MORADORAS.some(x=>x.id===a.id));
  S.moradoras.forEach(a=>{
    const M=MORADORAS.find(x=>x.id===a.id);
    a.fase=trava(a.fase|0,0,M.fases.length-1);
    a.dias=Math.max(0,a.dias|0);
  });
  return S.moradoras;
}
async function passarMoradoras(){
  const r=[];
  /* nasce uma nova */
  if(moradoras().length<2&&S.dia>=4&&chance(.10)){
    const livres=MORADORAS.filter(m=>!moradoras().some(x=>x.id===m.id));
    if(livres.length){
      const m=sortear(livres);
      moradoras().push({id:m.id,fase:0,dias:0});
      r.push(m.fases[0]);
    }
  }
  const L=moradoras();
  for(let i=L.length-1;i>=0;i--){
    const a=L[i];if(!a)continue;
    const M=MORADORAS.find(x=>x.id===a.id);
    if(!M){L.splice(i,1);continue;}
    a.dias++;
    if(a.dias>=3&&chance(.45)){
      a.dias=0;a.fase++;
      if(a.fase>=M.fases.length){
        L.splice(i,1);
        r.push('⚠ '+M.fim());
        continue;
      }
      r.push('⚠ '+M.fases[a.fase]);
    }
  }
  return r;
}
function menuMoradoras(volta){
  AC.innerHTML='';limpar();cap('O que está na casa');
  const L=moradoras();
  if(!L.length)diz('Nada crescendo aqui dentro. Que você tenha reparado.','bom');
  L.forEach(a=>{
    if(!a)return;
    const M=MORADORAS.find(x=>x.id===a.id);
    if(!M)return;
    ficha(M.n,'fase '+(a.fase+1)+' de '+M.fases.length,M.fases[a.fase]);
    diz('  Pra parar isso: '+M.cura+'.','sist');
    if(a.id==='mancha')botao('Tapar a mancha com cimento',acaoDia(2,async()=>{
      if(!temMat('cimento',1))return diz('Precisa de cimento.','perigo');
      gastarMat('cimento',1);
      if(chance(.55)){moradoras().splice(moradoras().indexOf(a),1);
        diz('Você raspa, passa massa e pinta por cima. Sumiu.','bom');}
      else{a.dias=0;diz('Você tapa. De manhã está do mesmo tamanho, por cima da massa.','perigo');}
    }),{custo:'2h · 1 cimento · 55%'});
    if(a.id==='contagem')botao('Anotar a casa inteira de novo',acaoDia(4,async()=>{
      S.anotouCasa=true;
      if(chance(.6)){moradoras().splice(moradoras().indexOf(a),1);
        diz('Você conta tudo três vezes e escreve. Bate. Bateu de novo no dia seguinte.','bom');}
      else diz('Você conta, anota, e o número muda entre a contagem e a anotação.','perigo');
    }),{custo:'4 horas · 60%'});
    if(a.id==='som')botao('Jogar concreto no chão do porão',acaoDia(3,async()=>{
      if(!temMat('cimento',2))return diz('Precisa de 2 sacos de cimento.','perigo');
      gastarMat('cimento',2);
      if(chance(.5)){moradoras().splice(moradoras().indexOf(a),1);
        diz('Você joga uma camada grossa e espera secar. O som não voltou.','bom');}
      else{a.dias=0;diz('Você joga o concreto. Na noite seguinte o som está mais alto — e mais perto.','perigo');}
    }),{custo:'3h · 2 cimento · 50%'});
  });
  botao('Voltar',volta,{cls:'chave'});
}

<script>
/* ================= O EPÍLOGO =================
   O final era o mesmo texto desde a v5, com 9 variações. Uma
   partida de 30 dias com cidade caída, gente enterrada e uma
   coisa trancada no porão merecia mais que um parágrafo. */

function tempoDeCasa(){
  const d=S.dia;
  if(d<=5)return 'Cinco dias. Mal deu pra aprender o nome de todo mundo.';
  if(d<=12)return `${d} dias. O tempo que a maioria não teve.`;
  if(d<=20)return `${d} dias. Você viu a cidade mudar duas vezes.`;
  if(d<=32)return `${d} dias. Você durou mais que quase todo o rádio.`;
  return `${d} dias. Não sobrou ninguém pra saber que você durou tanto.`;
}

function destinoDe(p){
  const l=[];
  l.push('era '+temper(p).n);
  const o=(S.objetivos||[]).find(x=>x.dono===p.n);
  if(o&&o.feito)l.push(`conseguiu ${o.n}`);
  else if(o)l.push(`nunca teve ${o.n}`);
  const am=amigos(p);
  if(am.length)l.push(`ficou perto de ${am[0].n}`);
  if(saude(p).length)l.push('não estava bem no fim');
  if(p.moral>=75)l.push('estava inteiro');
  else if(p.moral<=25)l.push('estava no fundo');
  if(p===S.infiltrado)l.push('nunca foi quem dizia ser');
  return l.length?l.join(', ')+'.':'passou por aqui.';
}

function epilogoPessoas(){
  const vivos=S.abrigo||[], mortos=S.mortos||[];
  if(vivos.length){
    diz('─── quem estava com você no fim ───','fraco');
    vivos.forEach(p=>{
      fichaRosto(p,p.hab,destinoDe(p),'vivo');
    });
  }
  if(S.legado&&LEGADO[S.legado]){
    diz('─── dez anos depois ───','fraco');
    diz(LEGADO[S.legado],'sist');
  }
  if(S.pedidoFinal){
    diz('─── o que te pediram ───','fraco');
    diz(`${S.pedidoFinal.n}: ${S.pedidoFinal.t}`,'fala');
  }
  if(mortos.length){
    diz('─── quem não chegou ───','fraco');
    mortos.slice(0,8).forEach(p=>{
      const v=(S.vozesRoubadas||[]).find(x=>x.p&&x.p.n===p.n);
      fichaRosto(p,p.hab,
        (p.comoMorreu||'ficou pelo caminho')+(v?' · e voltou batendo na sua porta':''),'morto');
    });
    if(mortos.length>8)diz(`E mais ${mortos.length-8}.`,'fraco');
  }
  if((S.mortosFora||0))
    diz(`Outras ${S.mortosFora} pessoas morreram na cidade sem você saber o nome.`,'fraco');
}

function epilogoCasa(){
  diz('─── a casa ───','fraco');
  const l=[];
  l.push('No fim, '+estadoCredito().n+'.');
  if(moradoras().length)l.push('E '+moradoras().map(a=>{
    const M=MORADORAS.find(x=>x.id===a.id);return M?M.n:'alguma coisa';}).join(' e ')+' continuava crescendo.');
  l.push(`Porta com reforço ${S.porta.reforco}${S.porta.tranca?' e tranca':', sem tranca'}.`);
  l.push(estadoMuro()[0].toUpperCase()+estadoMuro().slice(1)+'.');
  const av=avarias();
  if(av.length)l.push(`${av.length} ${av.length===1?'coisa quebrada':'coisas quebradas'} que ficaram assim: ${av.map(a=>AVARIAS[a.id].n).join(', ')}.`);
  else l.push('Nada quebrado. Você consertou tudo que apareceu.');
  const ct=canteiros().length;
  if(ct)l.push(`${ct} ${ct===1?'canteiro':'canteiros'} no quintal.`);
  const H=agua();
  if(H.calha||H.cisterna)l.push(`Calha ${H.calha}/4, cisterna ${H.cisterna}/3${H.bomba?', com bomba':''}.`);
  if((S.trancados||0))l.push(`${S.trancados} ${S.trancados===1?'coisa trancada':'coisas trancadas'} no porão. Ainda estão lá.`);
  if(dentro().length)l.push(`E ${dentro().map(d=>CRIATURAS[d.id].n).join(' e ')} nunca saiu.`);
  const v=melhorVeic();
  if(v)l.push(`${VEIC[v].n[0].toUpperCase()+VEIC[v].n.slice(1)} no quintal, funcionando.`);
  l.forEach(x=>diz('· '+x,'sist'));
}

function epilogoMundo(){
  diz('─── lá fora ───','fraco');
  const E=estagioMundo();
  diz(`O rádio parou em: ${E.n}.`,'sist');
  const vivas=(S.casas||[]).filter(c=>c.viva).length;
  diz(vivas?`${vivas} ${vivas===1?'casa ainda transmitia':'casas ainda transmitiam'} quando acabou.`
    :'Nenhuma casa transmitia mais.','sist');
  const cid=(S.cidadesVistas||['cacoal']);
  if(cid.length>1)
    diz(`Você esteve em ${cid.length} cidades: ${cid.map(k=>CIDADES[k]?CIDADES[k].n:k).join(', ')}.`,'sist');
  Object.keys(CIDADES).forEach(k=>{
    if(!cid.includes(k))return;
    diz(`   ${CIDADES[k].n} ficou ${estagioDe(k).n}.`,'fraco');
  });
  const am=ameacasVivas().length;
  if(am)diz(`${am} ${am===1?'ameaça continuava solta':'ameaças continuavam soltas'}.`,'perigo');
}

function epilogoSaber(){
  const vis=S.vistos?Object.keys(S.vistos).filter(k=>CRIATURAS[k]):[];
  const sab=vis.filter(k=>S.vistos[k]>=2);
  diz('─── o que você aprendeu ───','fraco');
  const l=[];
  if(S.escutasCertas||S.escutasErradas)
    l.push(`Encostou o ouvido na porta ${(S.escutasCertas||0)+(S.escutasErradas||0)} vezes e acertou ${S.escutasCertas||0}.`);
  if(vis.length)l.push(`Viu ${vis.length} tipos de perto. Sabe a fraqueza de ${sab.length}.`);
  if(S.anomPegas)l.push(`Identificou ${S.anomPegas} anomalias que ninguém mais viu.`);
  if((S.locaisLib||[]).length)l.push(`Aprendeu ${S.locaisLib.length} perguntas que só quem é daqui responde.`);
  if(S.estudo)l.push(`Leu o que achou. Investigar ficou ${Math.round(bonusEstudo()*100)}% mais fácil.`);
  if((S.ouviu||[]).length)l.push(`Acompanhou ${S.ouviu.length} das ${ESTAGIOS_MUNDO.length} viradas do rádio.`);
  if(!l.length)diz('Você sobreviveu sem descobrir nada. Também é uma forma.','fraco');
  else l.forEach(x=>diz('· '+x,'sist'));
  if(sab.length){
    diz('Se alguém perguntasse, você saberia dizer:','fraco');
    sab.slice(0,4).forEach(k=>diz(`   ${CRIATURAS[k].n} — ${CRIATURAS[k].fraco}`,'bom'));
  }
}

function epilogoNumeros(){
  diz('─── a conta ───','fraco');
  const l=[];
  l.push(`${S.dia} dias.`);
  l.push(`${(S.mortos||[]).length} ${(S.mortos||[]).length===1?'morto':'mortos'} nesta casa.`);
  if((S.vozesRoubadas||[]).length)
    l.push(`${S.vozesRoubadas.length} ${S.vozesRoubadas.length===1?'voz roubada':'vozes roubadas'}.`);
  if(S.saq&&S.saq.mortos.length)l.push(`${S.saq.mortos.length} de gente viva.`);
  if(S.ameacasMortas)l.push(`${S.ameacasMortas} ameaças enfrentadas.`);
  if(S.gambiarras)l.push(`${S.gambiarras} consertos na gambiarra que aguentaram.`);
  diz(l.join(' · '),'sist');
}

/* uma frase de fecho que muda com o que aconteceu */
function fraseFinal(tipo){
  if(dentro().length)
    return 'A casa ficou. E o que estava dentro dela ficou também.';
  if((S.trancados||0))
    return 'Tem uma porta no porão que ninguém vai abrir. Foi você que trancou.';
  if((S.mortos||[]).length>=4)
    return 'Você aprendeu o nome de todo mundo que morreu aqui. É a única coisa que você não vai esquecer.';
  if(S.dia>=25&&(S.abrigo||[]).length>=3)
    return 'Vocês fizeram uma casa funcionar num lugar onde nada funcionava.';
  if(!(S.abrigo||[]).length)
    return 'No fim você fez o que sabia fazer sozinho, do jeito que sempre soube.';
  if((S.escutasCertas||0)>=5)
    return 'Você aprendeu a ouvir. Foi isso que segurou essa casa em pé.';
  return 'A porta aguentou o quanto deu.';
}

/* ---------- entra no final que já existe ---------- */
const _fimBase=fim;
fim=async function(tipo){
  const r=_fimBase(tipo);
  try{
    await pausa(1400);

/* ================= MAIS VOZ PRA QUEM MORA AQUI =================
   As falas eram genéricas. Agora elas sabem o que aconteceu. */
const FALAS_CONTEXTO=[
 {q:()=>dentro().length,
  t:()=>`"Eu não durmo com aquilo andando aí. Você dorme?"`},
 {q:()=>saude().some(m=>MALES[m.id].urgente),
  t:()=>`"Você tá pior do que admite. Deixa outro ir hoje."`},
 {q:()=>S.gerQuebrado,
  t:()=>`"Sem o motor a gente é só uma casa no escuro igual todas as outras."`},
 {q:()=>avarias().some(a=>a.grave),
  t:()=>`"Aquilo ali não vai aguentar mais uma chuva. Você sabe qual."`},
 {q:()=>(S.trancados||0)>0,
  t:()=>`"Eu passo pela porta do porão e ando mais rápido. Todo mundo faz isso."`},
 {q:()=>S.dia>=15,
  t:()=>`"Quinze dias. Eu apostava três."`},
 {q:()=>(S.cidadesVistas||[]).length>=2,
  t:()=>`"Como é lá fora? Não, esquece. Não quero saber."`},
 {q:()=>estagioMundo().id>=4,
  t:()=>`"Aquela mulher do rádio parou de falar. Alguém mais reparou?"`},
 {q:()=>S.comida<=2,
  t:()=>`"Tem comida pra hoje. Eu contei três vezes achando que ia dar outro número."`},
 {q:()=>(S.escutasCertas||0)>=4,
  t:()=>`"Você acerta demais na porta. Isso me deixa calmo e me assusta junto."`},
 {q:()=>S.secaAte&&S.dia<=S.secaAte,
  t:()=>`"Se não chover essa semana a horta se perde. Toda ela."`},
 {q:()=>(S.abrigo||[]).length===1,
  t:()=>`"Sobrou eu e você. Não sei o que fazer com isso."`}
];
const _falaDeBase=falaDe;
falaDe=function(p){
  const val=FALAS_CONTEXTO.filter(f=>{try{return f.q()}catch(e){return false}});
  if(val.length&&chance(.42))return sortear(val).t().replace(/^"|"$/g,'');
  return _falaDeBase(p);
};

<script>
/* ================= REDE DE SEGURANÇA =================
   O que te travou foi um erro dentro de uma função async: em
   async, exceção não aparece na tela, o jogo só PARA — sem
   botão, sem aviso, sem saída. Isso não pode acontecer de
   novo, seja qual for a causa. */

let _wd=null,_wdUlt=0;
function acoesNaTela(){
  if(!AC||!AC.children)return 0;
  /* contar por tagName era frágil: qualquer coisa que não fosse
     BUTTON zerava a conta e o vigia disparava à toa */
  return AC.children.length;
}
function ligarVigia(){
  if(_wd)return;
  _wd=setInterval(()=>{
    try{
      if(document.visibilityState==='hidden')return;
      if(!AC||$('#boot'))return;
      if(cena&&['fim','mochila'].includes(cena.modo))return;
      if(acoesNaTela()>0){_wdUlt=Date.now();return;}
      if(!_wdUlt){_wdUlt=Date.now();return;}
      /* 14 segundos sem nenhuma ação e sem estar em cena de
         pausa longa: o jogo travou */
      if(Date.now()-_wdUlt<14000)return;
      _wdUlt=Date.now();
      socorro();
    }catch(e){}
  },2000);
}
function socorro(){
  if(acoesNaTela()>0)return;
  diz('O jogo travou aqui. Isso é bug meu, não é você.','perigo');
  AC.innerHTML='';
  const h=S.hora;
  if(h>=19||h<6){
    _botaoCru('Passar a noite e amanhecer',()=>{
      S.dia++;S.hora=7;cenaDia();
    },{cls:'chave',custo:'continua a partida'});
  }else{
    _botaoCru('Voltar pra dentro de casa',()=>{
      cena.modo='casa';
      cena.casa=cena.casa||{voce:4,monstro:null,visivel:false};
      dimensionar();menuComodo(cena.casa.voce);
    },{cls:'chave'});
    _botaoCru('Encerrar o dia',()=>{S.hora=19;anoitecer();},{});
  }
  _botaoCru('Salvar e recarregar',()=>{
    try{salvarAgora()}catch(e){}
    location.reload();
  },{custo:'o save está a salvo'});
}
/* botão sem os envelopes, pra funcionar mesmo se algo quebrou */
function _botaoCru(txt,fn,op){
  const b=document.createElement('button');
  if(op&&op.cls)b.className=op.cls;
  b.innerHTML='<span>'+esc(txt)+'</span>'+(op&&op.custo?'<span class="custo">'+esc(op.custo)+'</span>':'');
  b.onclick=()=>{[...AC.children].forEach(x=>x.disabled=true);try{fn()}catch(e){location.reload()}};
  AC.appendChild(b);return b;
}

/* qualquer erro solto vira aviso em vez de silêncio */
addEventListener('error',e=>{
  try{if(acoesNaTela()===0)setTimeout(socorro,400);}catch(x){}
});
addEventListener('unhandledrejection',e=>{
  try{if(acoesNaTela()===0)setTimeout(socorro,400);}catch(x){}
});

</script>
<script>
/* ================= SOM PARA TUDO QUE ENTROU DEPOIS =================
   Só as 6 criaturas originais tinham assinatura. As 10 que
   entraram desde a v15 eram mudas. E o ambiente soava igual
   às 7 da manhã e às 3 da madrugada. */

function _osc(tipo,f0,f1,t,dur,vol,pan,rev,filtro){
  if(!A.ctx)return;
  const o=A.ctx.createOscillator(),g=A.ctx.createGain();
  o.type=tipo;
  o.frequency.setValueAtTime(f0,t);
  if(f1!=null)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+dur*.2);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  let no=o;
  if(filtro){
    const f=A.ctx.createBiquadFilter();
    f.type=filtro.tipo||'lowpass';f.frequency.value=filtro.f||800;
    if(filtro.q)f.Q.value=filtro.q;
    o.connect(f);f.connect(g);
  }else o.connect(g);
  saida(g,{pan:pan||0,rev:rev==null?.5:rev});
  o.start(t);o.stop(t+dur+.05);
}
function _ruido(t,dur,vol,pan,rev,filtro){
  if(!A.ctx)return;
  const s=src(),g=A.ctx.createGain();
  const f=A.ctx.createBiquadFilter();
  f.type=(filtro&&filtro.tipo)||'bandpass';
  f.frequency.setValueAtTime((filtro&&filtro.f0)||900,t);
  if(filtro&&filtro.f1)f.frequency.linearRampToValueAtTime(filtro.f1,t+dur);
  f.Q.value=(filtro&&filtro.q)||1;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+dur*.25);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);saida(g,{pan:pan||0,rev:rev==null?.5:rev});
  s.start(t);s.stop(t+dur+.05);
}

/* as 10 que faltavam */
const _assinBase=assinatura;
assinatura=function(bicho,pan,vol){
  if(!A.ctx)return;
  const t=A.ctx.currentTime,v=vol==null?1:vol;
  marcarCamada('evento',2);
  switch(bicho){
    case 'casca':
      /* couro esticando e uma costura rangendo */
      for(let i=0;i<3;i++)
        _ruido(t+i*.55,.42,.045*v,pan,.55,{tipo:'bandpass',f0:520+i*90,f1:300,q:3});
      _osc('sine',70,52,t+.3,1.1,.03*v,pan,.6);
      break;
    case 'crianca':
      /* choro que não respira entre os soluços */
      for(let i=0;i<5;i++){
        const tt=t+i*.42;
        _osc('sine',430+((i*37)%60),330,tt,.30,.055*v,pan,.6,{tipo:'bandpass',f:700,q:2});
      }
      break;
    case 'dobra':
      /* estalo molhado, muitos, enquanto ela se ajeita */
      for(let i=0;i<9;i++){
        const tt=t+i*.17+Math.random()*.05;
        _ruido(tt,.07,.075*v,pan+(Math.random()-.5)*.3,.45,{tipo:'bandpass',f0:1600,f1:600,q:9});
      }
      break;
    case 'raiz':
      /* terra rachando devagar, sempre no mesmo canto */
      _ruido(t,2.6,.05*v,pan,.75,{tipo:'lowpass',f0:260,f1:120});
      for(let i=0;i<4;i++)
        _ruido(t+.5+i*.6,.13,.04*v,pan,.6,{tipo:'bandpass',f0:340,f1:180,q:5});
      break;
    case 'fome':
      /* mastigação sem pausa */
      for(let i=0;i<12;i++){
        const tt=t+i*.23;
        _ruido(tt,.11,.055*v,pan,.4,{tipo:'bandpass',f0:700+((i*53)%400),f1:280,q:2.5});
      }
      _osc('sine',48,40,t,3,.04*v,pan,.7);
      break;
    case 'coro2':
      /* todas as vozes que já bateram aqui, juntas */
      [0,.05,.11,.16,.23].forEach((off,i)=>
        _osc('sawtooth',96+i*7,90+i*7,t+off,1.9,.022*v,pan+(i-2)*.28,.7,{tipo:'lowpass',f:520}));
      break;
    case 'batedor':
      /* pancada surda de cinco em cinco segundos */
      for(let i=0;i<3;i++){
        const tt=t+i*1.05;
        _osc('sine',58,26,tt,.34,.13*v,pan,.55);
        _ruido(tt,.18,.05*v,pan,.6,{tipo:'lowpass',f0:400,f1:150});
      }
      break;
    case 'fundo':
      /* raspagem funda embaixo do assoalho */
      _ruido(t,3.4,.07*v,0,.85,{tipo:'lowpass',f0:180,f1:70});
      _osc('sine',31,22,t+.4,2.8,.08*v,0,.9);
      break;
    case 'vizinho': case 'alto': case 'mae':
      /* as que fingem quase não fazem som — e é isso que assusta */
      _ruido(t+.2,.5,.018*v,pan,.5,{tipo:'highpass',f0:2400});
      _osc('sine',96,92,t,.7,.012*v,pan,.4);
      break;
    case 'matilhaC':
      latido(pan-.4,true);
      setTimeout(()=>latido(pan+.5,true),260);
      setTimeout(()=>latido(pan,false),620);
      break;
    default:
      return _assinBase(bicho,pan,vol);
  }
};

/* ================= O AMBIENTE MUDA ================= */
let _amb={cam:[],hora:-1,clima:null,cid:null};
function camadaAmb(f,vol,tipoF,ff){
  if(!A.ctx)return null;
  const s=src(),g=A.ctx.createGain(),fl=A.ctx.createBiquadFilter();
  fl.type=tipoF||'lowpass';fl.frequency.value=ff||600;
  g.gain.value=0;
  g.gain.linearRampToValueAtTime(vol,A.ctx.currentTime+2.5);
  s.connect(fl);fl.connect(g);saida(g,{pan:0,rev:.8});
  s.start();
  return {s,g};
}
function pararAmb(){
  _amb.cam.forEach(c=>{
    try{
      c.g.gain.linearRampToValueAtTime(0,A.ctx.currentTime+1.5);
      setTimeout(()=>{try{c.s.stop()}catch(e){}},1800);
    }catch(e){}
  });
  _amb.cam=[];
}
function ambienteDoMomento(){
  if(!A.ctx)return;
  const h=S.hora, cl=S.clima||'limpo', cid=cidadeAtual();
  if(_amb.hora===h&&_amb.clima===cl&&_amb.cid===cid)return;
  _amb.hora=h;_amb.clima=cl;_amb.cid=cid;
  pararAmb();
  marcarCamada('ambiente');
  const noite=h>=19||h<6;
  /* base: o ar da casa */
  _amb.cam.push(camadaAmb(0,noite?.020:.012,'lowpass',noite?260:420));
  /* de dia, vida lá fora; de noite, o vazio */
  if(!noite){
    _amb.cam.push(camadaAmb(0,.008,'bandpass',1800));
    if(chance(.5))setTimeout(()=>{if(A.ctx&&chance(.6))latido(chance(.5)?-.8:.8,false)},4000+Math.random()*9000);
  }else{
    _amb.cam.push(camadaAmb(0,.010,'lowpass',140));
  }
  /* clima por cima */
  if(cl==='chuva')_amb.cam.push(camadaAmb(0,.030,'highpass',900));
  else if(cl==='tempestade'){
    _amb.cam.push(camadaAmb(0,.045,'highpass',700));
    _amb.cam.push(camadaAmb(0,.020,'lowpass',180));
  }
  else if(cl==='vento')_amb.cam.push(camadaAmb(0,.024,'bandpass',420));
  else if(cl==='neblina')_amb.cam.push(camadaAmb(0,.014,'lowpass',300));
  /* a cidade tem timbre */
  const C=CIDADES[cid];
  if(C&&C.risco>=2)_amb.cam.push(camadaAmb(0,.009,'lowpass',95));
  /* a casa esvaziando soa mais oca */
  if(!S.abrigo.length&&noite)_amb.cam.push(camadaAmb(0,.012,'bandpass',210));
}

/* ================= A VOZ ACOMPANHA O CORPO =================
   Quem está doente, ferido ou com medo não fala igual. */
const _tomBase=tomDaHora;
tomDaHora=function(op){
  const T=Object.assign({},_tomBase(op));
  const alvo=op&&op.pessoa;
  if(alvo){
    if((alvo.doente||0)>0||saude(alvo).some(m=>MALES[m.id].tipo==='doenca')){
      T.pitch*=.93;T.rate*=.88;T.pausa=Math.round(T.pausa*1.35);
    }
    if(saude(alvo).some(m=>MALES[m.id].urgente)){
      T.pitch*=.90;T.rate*=.80;T.pausa=Math.round(T.pausa*1.6);
    }
    if((alvo.moral||60)<=25){T.pitch*=.95;T.rate*=.90;}
  }
  /* você também: ferido fala pior */
  if(!alvo&&pesoFerido()>.2){T.rate*=.9;T.pausa=Math.round(T.pausa*1.2);}
  return T;
};

/* o mímico degrada conforme fala */
const _falarNat=falarNatural;
falarNatural=async function(txt,op={}){
  if(op.mimico){
    op=Object.assign({},op);
    const n=(S.visitante&&S.visitante.turnos)||0;
    /* quanto mais ele fala, mais escapa o defeito */
    op.pitch=(op.pitch||1)*(1+n*.012*(chance(.5)?1:-1));
    op.rate=(op.rate||1)*(1+n*.010);
  }
  return _falarNat(txt,op);
};

/* ================= SONS DOS SISTEMAS NOVOS ================= */
function somCerco(via){
  if(!A.ctx)return;
  const t=A.ctx.currentTime;
  marcarCamada('evento',1.6);
  const p={porta:0,muro:.7,janela:-.6,telhado:.2,porao:0}[via]||0;
  if(via==='porta'){_osc('sine',72,30,t,.28,.12,p,.5);_ruido(t,.2,.05,p,.5,{tipo:'lowpass',f0:500,f1:180});}
  if(via==='muro'){_ruido(t,.5,.06,p,.6,{tipo:'bandpass',f0:600,f1:280,q:3});_osc('sine',90,44,t+.3,.3,.07,p,.5);}
  if(via==='janela')_ruido(t,.35,.07,p,.4,{tipo:'highpass',f0:2600});
  if(via==='telhado'){for(let i=0;i<3;i++)_ruido(t+i*.28,.14,.05,p,.7,{tipo:'bandpass',f0:900,f1:400,q:4});}
  if(via==='porao'){_osc('sine',40,26,t,1.4,.10,0,.85);_ruido(t,1.2,.05,0,.8,{tipo:'lowpass',f0:200,f1:80});}
}
function somMoradora(id){
  if(!A.ctx)return;
  const t=A.ctx.currentTime;
  if(id==='som'){_ruido(t,2.2,.05,0,.85,{tipo:'lowpass',f0:230,f1:90});
    for(let i=0;i<5;i++)_ruido(t+i*.42,.1,.03,0,.7,{tipo:'bandpass',f0:300,f1:150,q:6});}
  if(id==='mancha')_osc('sine',34,28,t,2.4,.05,0,.9);
  if(id==='contagem'){for(let i=0;i<4;i++)_osc('sine',700-i*40,660-i*40,t+i*.35,.12,.03,0,.6);}
}
function somSaude(mal){
  if(!A.ctx)return;
  const t=A.ctx.currentTime;
  const M=MALES[mal];if(!M)return;
  if(mal==='tosse'){tossir(t,0);setTimeout(()=>tossir(A.ctx.currentTime,0),900);}
  else if(M.tipo==='ferida')_ruido(t,.25,.05,0,.4,{tipo:'bandpass',f0:400,f1:200,q:2});
  else _osc('sine',180,120,t,.5,.04,0,.5);
}
</script>
<script>
/* ================= O QUE SE OUVE COM FONE =================
   Camadas que ninguém percebe conscientemente, mas que a
   pessoa sente. Tudo sutil de propósito: se você notar, eu
   errei a mão. */

/* ---------- cada cômodo soa como o cômodo que é ---------- */
const ACUSTICA={
 0:{rev:2.6,dec:2.4,mol:.50,tom:520,n:'sótão: madeira, teto baixo, eco curto'},
 1:{rev:1.5,dec:1.6,mol:.30,tom:420,n:'quarto: pano e colchão abafam tudo'},
 2:{rev:1.1,dec:1.2,mol:.26,tom:380,n:'despensa: apertada, som morre perto'},
 3:{rev:2.0,dec:1.9,mol:.42,tom:900,n:'oficina: metal e concreto, brilha'},
 4:{rev:1.9,dec:1.8,mol:.36,tom:600,n:'sala: o cômodo mais neutro da casa'},
 5:{rev:2.3,dec:2.0,mol:.44,tom:1100,n:'cozinha: azulejo, tudo volta'},
 6:{rev:3.4,dec:3.2,mol:.62,tom:240,n:'porão: cavernoso, grave, longo'},
 7:{rev:1.7,dec:1.5,mol:.34,tom:560,n:'entrada: corredor, som corre'},
 8:{rev:0.6,dec:0.5,mol:.10,tom:800,n:'quintal: aberto, quase sem reflexo'}
};
let _acuAtual=-1;
function acusticaDe(id){
  if(!A.ctx||!A.conv)return;
  if(_acuAtual===id)return;
  _acuAtual=id;
  const a=ACUSTICA[id]||ACUSTICA[4];
  try{
    A.conv.buffer=gerarImpulso(a.rev,a.dec);
    /* transição de reverb, não corte seco */
    const t=A.ctx.currentTime;
    A.molhado.gain.cancelScheduledValues(t);
    A.molhado.gain.linearRampToValueAtTime(a.mol,t+.8);
  }catch(e){}
}

/* ---------- o que está fora chega abafado ---------- */
function oclusao(){
  const id=cena.casa?cena.casa.voce:4;
  if(cena.modo==='rua'||cena.modo==='casafora')return 1;
  if(id===8)return .82;          // quintal: quase nada barra
  if(id===7)return .62;          // entrada: perto da porta
  if(id===0)return .55;          // sótão: telha fina
  if(id===6)return .28;          // porão: enterrado
  return .42;
}
/* usado por quem toca som vindo de fora */
function volDeFora(v){return (v==null?1:v)*oclusao();}

/* ---------- a casa respira sozinha ---------- */
let _vivo=null;
const RUIDOS_CASA=[
 {n:'madeira',peso:22,f:(pan)=>{
   const t=A.ctx.currentTime;
   const s=src(),fl=A.ctx.createBiquadFilter(),g=A.ctx.createGain();
   fl.type='bandpass';fl.frequency.setValueAtTime(340+Math.random()*260,t);
   fl.frequency.linearRampToValueAtTime(180,t+.5);fl.Q.value=9;
   g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.020,t+.08);
   g.gain.exponentialRampToValueAtTime(.001,t+.55);
   s.connect(fl);fl.connect(g);saida(g,{pan,rev:.6});s.start(t);s.stop(t+.6);}},
 {n:'pingo',peso:14,cond:()=>avariaEm('cano')||avariaEm('calha')||S.chuva,f:(pan)=>{
   const t=A.ctx.currentTime;
   const o=A.ctx.createOscillator(),g=A.ctx.createGain();
   o.type='sine';o.frequency.setValueAtTime(1400,t);
   o.frequency.exponentialRampToValueAtTime(600,t+.06);
   g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.030,t+.005);
   g.gain.exponentialRampToValueAtTime(.001,t+.14);
   o.connect(g);saida(g,{pan,rev:.7});o.start(t);o.stop(t+.16);}},
 {n:'lona',peso:12,cond:()=>S.clima==='vento'||S.clima==='tempestade',f:(pan)=>{
   const t=A.ctx.currentTime;
   const s=src(),fl=A.ctx.createBiquadFilter(),g=A.ctx.createGain();
   fl.type='highpass';fl.frequency.value=1800;
   g.gain.setValueAtTime(0,t);
   for(let i=0;i<4;i++)g.gain.linearRampToValueAtTime(.012+Math.random()*.014,t+.2+i*.22);
   g.gain.linearRampToValueAtTime(0,t+1.3);
   s.connect(fl);fl.connect(g);saida(g,{pan,rev:.5});s.start(t);s.stop(t+1.4);}},
 {n:'metal',peso:8,cond:()=>cena.casa&&cena.casa.voce===3,f:(pan)=>{
   const t=A.ctx.currentTime;
   const o=A.ctx.createOscillator(),g=A.ctx.createGain();
   o.type='triangle';o.frequency.value=1700+Math.random()*900;
   g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.014,t+.01);
   g.gain.exponentialRampToValueAtTime(.001,t+.5);
   o.connect(g);saida(g,{pan,rev:.75});o.start(t);o.stop(t+.55);}},
 {n:'bicho',peso:10,cond:()=>{const h=S.hora;return h>=20||h<5;},f:(pan)=>{
   const t=A.ctx.currentTime;
   for(let i=0;i<3;i++){
     const s=src(),fl=A.ctx.createBiquadFilter(),g=A.ctx.createGain();
     fl.type='bandpass';fl.frequency.value=2600+Math.random()*900;fl.Q.value=12;
     const tt=t+i*.09;
     g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(.010,tt+.01);
     g.gain.exponentialRampToValueAtTime(.001,tt+.07);
     s.connect(fl);fl.connect(g);saida(g,{pan,rev:.4});s.start(tt);s.stop(tt+.08);}}},
 {n:'gente',peso:9,cond:()=>S.abrigo.length>0&&S.hora>=7&&S.hora<22,f:(pan)=>{
   const t=A.ctx.currentTime;
   const s=src(),fl=A.ctx.createBiquadFilter(),g=A.ctx.createGain();
   fl.type='bandpass';fl.frequency.setValueAtTime(300,t);
   fl.frequency.linearRampToValueAtTime(220,t+.7);fl.Q.value=1.6;
   g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.014,t+.25);
   g.gain.linearRampToValueAtTime(0,t+.9);
   s.connect(fl);fl.connect(g);saida(g,{pan,rev:.65});s.start(t);s.stop(t+1);}}
];
function ligarCasaViva(){
  if(_vivo)return;
  const passo=()=>{
    _vivo=setTimeout(passo,4500+Math.random()*11000);
    if(!A.ctx||document.visibilityState==='hidden')return;
    if(['fim','mochila','mapa'].includes(cena.modo))return;
    const val=RUIDOS_CASA.filter(r=>!r.cond||r.cond());
    if(!val.length)return;
    const tot=val.reduce((s,r)=>s+r.peso,0);
    let x=Math.random()*tot,esc=val[0];
    for(const r of val){x-=r.peso;if(x<=0){esc=r;break;}}
    try{
      marcarCamada('ambiente');
      esc.f((Math.random()-.5)*1.5);
    }catch(e){}
  };
  _vivo=setTimeout(passo,6000);
}

/* ---------- o seu corpo ---------- */
let _cor=null;
function ligarCorpo(){
  if(_cor)return;
  const passo=()=>{
    const tensao=trava(
      (S.ruido/100)*.5
      +((cena.casa&&cena.casa.monstro!=null)?.45:0)
      +(cena.modo==='porta'?.22:0)
      +(cena.modo==='escuta'?.30:0)
      +pesoFerido()*.6
      +((S.cerco&&S.cerco.ativo)?.35:0),0,1);
    /* o coração só entra quando aperta de verdade */
    const bpm=62+tensao*46;
    _cor=setTimeout(passo,60000/bpm);
    if(!A.ctx||document.visibilityState==='hidden')return;
    if(tensao<.42)return;
    if(['fim','mochila','mapa'].includes(cena.modo))return;
    try{
      const t=A.ctx.currentTime, v=(tensao-.42)*.055;
      [0,.16].forEach((off,i)=>{
        const o=A.ctx.createOscillator(),g=A.ctx.createGain(),f=A.ctx.createBiquadFilter();
        o.type='sine';
        o.frequency.setValueAtTime(58,t+off);
        o.frequency.exponentialRampToValueAtTime(34,t+off+.13);
        f.type='lowpass';f.frequency.value=110;
        g.gain.setValueAtTime(0,t+off);
        g.gain.linearRampToValueAtTime(v*(i?.62:1),t+off+.02);
        g.gain.exponentialRampToValueAtTime(.001,t+off+.17);
        o.connect(f);f.connect(g);saida(g,{pan:0,rev:.12});
        o.start(t+off);o.stop(t+off+.2);
      });
    }catch(e){}
  };
  _cor=setTimeout(passo,3000);
}

/* ---------- o gerador vira personagem ---------- */
const _subirBase=typeof subirDrone==='function'?subirDrone:null;
function pulsoGerador(){
  if(!A.ctx||S.gerQuebrado)return;
  const s=trava(S.gerSaude/100,0,1);
  const t=A.ctx.currentTime;
  /* o compasso desanda junto com a saúde do motor */
  const falha=chance((1-s)*.35);
  const o=A.ctx.createOscillator(),g=A.ctx.createGain(),f=A.ctx.createBiquadFilter();
  o.type='sine';
  o.frequency.setValueAtTime(falha?44:52,t);
  o.frequency.exponentialRampToValueAtTime(falha?24:30,t+.10);
  f.type='lowpass';f.frequency.value=130;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime((falha?.018:.030)*volDeFora(1),t+.012);
  g.gain.exponentialRampToValueAtTime(.001,t+.15);
  o.connect(f);f.connect(g);saida(g,{pan:-.35,rev:.55});
  o.start(t);o.stop(t+.17);
}
let _ger=null;
function ligarPulsoGerador(){
  if(_ger)return;
  const passo=()=>{
    const s=trava((S.gerSaude||100)/100,0,1);
    const per=(60/ (168+ s*26))*1000;   /* mais lento quando o motor cansa */
    _ger=setTimeout(passo,per*(1+(1-s)*.25));
    if(document.visibilityState==='hidden')return;
    if(S.gerQuebrado||S.diesel<=0)return;
    if(['fim','mochila','mapa'].includes(cena.modo))return;
    pulsoGerador();
  };
  _ger=setTimeout(passo,2000);
}

/* ---------- liga tudo junto com a acústica do cômodo ---------- */
const _irParaSom=irPara;
irPara=function(id,semTexto){
  const r=_irParaSom(id,semTexto);
  try{acusticaDe(cena.casa?cena.casa.voce:4)}catch(e){}
  return r;
};
function ligarFone(){
  ligarCasaViva();
  ligarCorpo();
  ligarPulsoGerador();
  try{acusticaDe(cena.casa?cena.casa.voce:4)}catch(e){}
}
</script>
<script>
/* ================= CADA UMA TEM O SEU DEFEITO =================
   Na v32 as 10 criaturas novas ganharam som próprio. Na lente
   continuavam todas iguais — o mesmo punhado de defeitos
   genéricos. Agora o que você vê depende de QUEM está lá. */

const DEFEITO_CRIATURA={
 vizinho:[
  {id:'brilho',t:'A pupila não fecha na luz. Ela olha direto pro reflexo e não muda de tamanho.'},
  {id:'pele',t:'A pele do rosto é lisa demais. Nenhum poro, nenhuma marca, nenhuma idade.'},

/* quem está na porta agora, se der pra saber */
function criaturaDoVisitante(v){
  if(v._cri)return v._cri;
  if(!v.mimico)return (v._cri=null);
  const l=Object.keys(CRIATURAS).filter(k=>{
    const c=CRIATURAS[k];
    if(S.dia<c.noite)return false;
    if(c.porta===false&&!c.fam)return false;
    /* quem bate na porta é quem tem forma pra isso */
    return c.fam==='falsa'||c.forca<=4||c.quebra==='porta';
  });
  return (v._cri=l.length?sortear(l):'vizinho');
}

/* os defeitos da lente passam a vir da criatura */
const _montarBase=montarLente;
montarLente=function(v){
  /* o modelo só nascia DENTRO da função original, então a
     troca de defeitos nunca acontecia na primeira chamada */
  if(!v._modelo)v._modelo=modeloVisitante(v);
  const cri=criaturaDoVisitante(v);
  if(cri&&DEFEITO_CRIATURA[cri]&&v._modelo&&v._modelo.anomalias){
    const proprios=DEFEITO_CRIATURA[cri];
    const quantos=v._modelo.anomalias.length;
    if(quantos>0){
      /* troca os genéricos pelos dela, mantendo a quantidade
         que o balanceamento já definiu */
      const escolhidos=proprios.slice().sort(()=>Math.random()-.5).slice(0,quantos);
      const faltam=quantos-escolhidos.length;
      if(faltam>0)escolhidos.push(...v._modelo.anomalias.slice(0,faltam));
      v._modelo.anomalias=escolhidos;
    }
  }
  return _montarBase(v);
};

/* ================= O CADERNO =================
   Você aprende a fraqueza de cada uma e não tinha onde
   consultar. Agora tem. */
function telaCaderno(volta){
  AC.innerHTML='';limpar();cap('O caderno');
  const V=S.vistos||{};
  const ids=Object.keys(CRIATURAS);
  const vistos=ids.filter(k=>V[k]>0);
  diz(`Você viu ${vistos.length} de ${ids.length} tipos de perto.`,'sist');
  if(!vistos.length){
    diz('Nada anotado ainda. Encontrar uma vez já rende alguma coisa; duas, rende a fraqueza.','fraco');
    return botao('Voltar',volta,{cls:'chave'});
  }
  ['falsa','aberta','surda'].forEach(fam=>{
    const doGrupo=vistos.filter(k=>CRIATURAS[k].fam===fam);
    if(!doGrupo.length)return;
    diz('─── '+FAM[fam].n+' ───','fraco');
    doGrupo.forEach(k=>{
      const c=CRIATURAS[k],n=V[k];
      ficha(c.n,n===1?'vista 1 vez':'vista '+n+' vezes',c.d);
      diz('  Como chega: '+c.como,'sist');
      if(n>=1){
        diz('  Se vê: '+c.ver,'sist');
        diz('  Se ouve: '+c.ouvir,'sist');
        const df=DEFEITO_CRIATURA[k];
        if(df)diz('  Na lente: '+df[0].t,'sist');
      }
      if(n>=2)diz('  ◈ FRAQUEZA: '+c.fraco,'bom');
      else diz('  (encontra mais uma vez pra descobrir a fraqueza)','fraco');
    });
  });
  const naoVistos=ids.length-vistos.length;
  if(naoVistos)diz(`Faltam ${naoVistos} que você nunca viu de perto.`,'fraco');
  botao('Voltar',volta,{cls:'chave'});
}

  S.pend=S.pend.filter(p=>p&&(ATIVAS.some(a=>a.id===p.id)||ANOM.some(a=>a.id===p.id)));
  return S.pend;
}
function marcarPendencia(id){
  const L=pendencias();
  const j=L.find(p=>p.id===id);
  if(j){j.vezes++;j.dias=0;}
  else L.push({id,vezes:1,dias:0});
}
function passarPendencias(){
  const r=[];
  pendencias().forEach(p=>{
    p.dias++;
    if(p.dias>=3&&chance(.35)){
      p.dias=0;p.vezes++;
      const a=ATIVAS.find(x=>x.id===p.id);
      if(a){

          t:'Aconteceu de novo. '+(p.vezes>=3?'Pela terceira vez, e agora sem disfarce nenhum.':'E você reconhece.')});

    }
  });
  return r;
}

function oficioDe(p){return OFICIO[p.hab]||null;}

/* o que eles fazem TODO DIA, sem você mandar */
function trabalhoDaCasa(){
  const r=[];
  S.abrigo.forEach(p=>{
    if(p.fora||saude(p).some(m=>MALES[m.id].urgente))return;
    const o=oficioDe(p);
    if(!o||!o.diario)return;
    if((p.moral||60)<30&&chance(.5))return;
    /* eles não rendem todo santo dia — senão a casa se
       resolve sozinha e você vira espectador */
    if(!chance(.45))return;
    const t=o.diario();
    if(t)r.push(`${p.n} ${t}.`);
  });
  return r;
}

/* ---------- mandar buscar ---------- */
function podeSair(p){
  if(p.fora)return 'já está fora';
  if(saude(p).some(m=>MALES[m.id].urgente))return 'está mal demais pra ir';
  if((p.moral||60)<20)return 'não vai a lugar nenhum nesse estado';
  return null;
}
function mandarSair(p,l){
  const o=oficioDe(p);
  const risco=trava((l.risco||2)+(o&&o.fora&&o.fora.risco?o.fora.risco:0)
    +(escassez()>.5?1:0)-(p.hab==='corrida'?1:0),0,6);
  p.fora={local:l.id,nome:l.n,dias:1+Math.floor(distDe(l)/2),risco};
  return p.fora;
}
async function voltarDeFora(p){
  const f=p.fora;if(!f)return null;
  const o=oficioDe(p);
  /* 100% de retorno tirava a decisão: virava lucro grátis.
     Agora sair é aposta, e o ofício reduz o risco, não anula. */
  const pe=trava(.62-f.risco*.075+((p.moral||60)/650)+(escassez()<.4?.06:0),.25,.88);
  p.fora=null;
  if(!chance(pe)){
    /* não volta, ou volta quebrado */
    if(chance(.45)){
      morreuAlguem(p,`saiu pra buscar coisa em ${f.nome} e não voltou`);
      return {morreu:true,t:`${p.n} saiu pra ${f.nome} e não voltou. Ninguém foi atrás.`};
    }
    const fer=ferirPor('bicho',p);
    p.moral=trava((p.moral||60)-18,0,100);
    return {t:`${p.n} voltou de ${f.nome} sem nada e ${fer?'com '+fer.n:'sem falar com ninguém'}.`};
  }
  /* voltou com coisa */
  const g={},txt=[];
  const F=(o&&o.fora)||{comida:[2,5]};
  const mult=1+(escassez()<.4?.2:0);
  if(F.comida){const q=Math.round((F.comida[0]+Math.random()*(F.comida[1]-F.comida[0]))*mult);
    if(q>0){S.comida+=q;g.comida=q;txt.push(q+' de comida');}}
  if(F.diesel){const q=Math.round(F.diesel[0]+Math.random()*(F.diesel[1]-F.diesel[0]));
    if(q>0){S.diesel=trava(S.diesel+q,0,100);g.diesel=q;txt.push(q+' de diesel');}}
  if(F.agua){const q=Math.round(F.agua[0]+Math.random()*(F.agua[1]-F.agua[0]));
    if(q>0){S.agua+=q;g.agua=q;txt.push(q+' de água');}}
  if(F.remedio){const q=Array.isArray(F.remedio)
      ?Math.round(F.remedio[0]+Math.random()*(F.remedio[1]-F.remedio[0]))
      :(chance(F.remedio)?1:0);
    if(q>0){S.remedio+=q;g.remedio=q;txt.push(q+' remédio');}}
  if(F.mat){const m=sortear(F.mat),q=2+Math.floor(Math.random()*3);
    darMat(m,q);txt.push(q+' '+MATE[m].un);}
  if(F.semente&&chance(F.semente)){S.temSemente=true;txt.push('semente boa');}
  if(F.peca&&chance(F.peca)){S.temPeca=true;txt.push('uma peça do gerador');}
  if(F.achado&&chance(F.achado)){
    const it=sortear(['documento','foto','celular','livro']);
    if(typeof guardar==='function')guardar(it,1);
    txt.push('alguma coisa pra ler');
  }
  if(Object.keys(g).length)ganhou(g);
  p.moral=trava((p.moral||60)+8,0,100);
  mexerCredito(+3);
  return {t:`${p.n} voltou de ${f.nome} com ${txt.length?txt.join(', '):'as mãos vazias, mas inteiro'}.`};
}
async function passarFora(){
  const r=[];
  for(const p of S.abrigo.slice()){
    if(!p.fora)continue;
    p.fora.dias--;
    if(p.fora.dias>0){r.push(`${p.n} continua fora, em ${p.fora.nome}.`);continue;}
    const v=await voltarDeFora(p);
    if(v)r.push(v.t);
  }
  return r;
}
function menuMandar(volta){
  AC.innerHTML='';limpar();cap('Mandar alguém buscar');
  const livres=S.abrigo.filter(p=>!podeSair(p));
  const foraAgora=S.abrigo.filter(p=>p.fora);
  if(foraAgora.length)foraAgora.forEach(p=>
    diz(`${p.n} está em ${p.fora.nome}, volta em ${p.fora.dias} ${p.fora.dias===1?'dia':'dias'}.`,'sist'));
  if(!livres.length){
    diz('Ninguém em condição de sair hoje.','fraco');
    return botao('Voltar',volta,{cls:'chave'});
  }
  diz('Quem sai não faz o trabalho de casa nesses dias. E pode não voltar.','fraco');
  const pool=poolDeLocais().filter(l=>(S.esgotados[l.id]||0)<2).slice(0,5);
  livres.forEach(p=>{
    const o=oficioDe(p);
    ficha(p.n,o?o.n:p.hab,o?o.faz:'não tem ofício definido');
    pool.forEach(l=>{
      const risco=trava((l.risco||2)+(o&&o.fora&&o.fora.risco?o.fora.risco:0),0,6);
      const pe=Math.round(trava(.62-risco*.075+((p.moral||60)/650),.25,.88)*100);
      botao(`${p.n} → ${l.n}`,()=>{
        AC.innerHTML='';
        const f=mandarSair(p,l);
        diz(`${p.n} sai amanhã cedo pra ${l.n}. Volta em ${f.dias} ${f.dias===1?'dia':'dias'}.`,'sist');
        const fl=[];
        if(o&&o.fora){
          if(o.fora.comida)fl.push('comida');
          if(o.fora.diesel)fl.push('diesel');
          if(o.fora.remedio)fl.push('remédio');
          if(o.fora.agua)fl.push('água');
          if(o.fora.mat)fl.push('material');
        }
        if(fl.length)diz(`Ela sabe procurar ${fl.join(', ')}.`,'fraco');
        botao('Voltar',volta,{cls:'chave'});
      },{custo:pe+'% de voltar · '+(1+Math.floor(distDe(l)/2))+'d'});
    });
  });
  botao('Voltar',volta,{cls:'chave'});
}

/* ---------- a tela cara a cara ---------- */
function desenharPessoa(w,h,t){
  const p=cena.falandoCom;
  if(!p)return;
  CX.fillStyle='#0A0810';CX.fillRect(0,0,w,h);
  /* fundo: o cômodo atrás dela, escuro */
  const g=CX.createRadialGradient(w*.5,h*.42,h*.08,w*.5,h*.5,h*1.1);
  g.addColorStop(0,'rgba(60,50,44,.5)');
  g.addColorStop(1,'rgba(6,5,9,1)');
  CX.fillStyle=g;CX.fillRect(0,0,w,h);
  /* o rosto grande, respirando */
  const tam=Math.min(w*.62,h*.86);
  const resp=Math.sin(t*(p.doente>0?2.2:1.1))*tam*.006;
  CX.save();
  CX.translate(w*.5-tam*.5,h*.5-tam*.5+resp);
  pintarRosto(CX,tam,p,'vivo',{resp:0,pisca:cena._pisca||0,olha:cena._olha||0});
  CX.restore();
  /* nome e ofício embaixo */
  CX.fillStyle='rgba(232,226,212,.75)';
  CX.font=Math.max(11,h*.045)+'px "Share Tech Mono",monospace';
  CX.textAlign='center';
  CX.fillText(p.n.toUpperCase(),w*.5,h*.94);
  const o=oficioDe(p);
  CX.fillStyle='rgba(122,139,127,.6)';
  CX.font=Math.max(9,h*.032)+'px "Share Tech Mono",monospace';
  CX.fillText((o?o.n:p.hab)+' · '+temper(p).n,w*.5,h*.985);
}
/* pisca e olha, no ritmo dela */
let _pTimer=null;
function animarConversa(){
  if(_pTimer)return;
  _pTimer=setInterval(()=>{
    if(cena.modo!=='conversa'){clearInterval(_pTimer);_pTimer=null;return;}
    if(chance(.22)){cena._pisca=1;setTimeout(()=>cena._pisca=0,140);}
    if(chance(.10)){cena._olha=(Math.random()-.5)*2;
      setTimeout(()=>cena._olha=0,700+Math.random()*800);}
  },900);
}

function falaDo(p,assunto){
  const a=arquetipo(p);
  const banco=(FALAS[a]&&FALAS[a][assunto])||FALAS.traumatizado[assunto]||['...'];
  /* não repete a mesma fala pra mesma pessoa */
  p._ditas=p._ditas||[];
  const novas=banco.filter(f=>!p._ditas.includes(f));
  const f=novas.length?sortear(novas):sortear(banco);
  p._ditas.push(f);
  if(p._ditas.length>40)p._ditas.shift();
  return f;
}

async function conversar(p,volta){
  const antes=cena.modo;
  cena.modo='conversa';cena.falandoCom=p;
  dimensionar();animarConversa();
  limpar();AC.innerHTML='';
  cap(p.n);
  const A=ARQUETIPOS[arquetipo(p)];
  diz(A.d,'fraco');
  const o=oficioDe(p);
  if(o)diz(`Ela ${o.faz}.`,'sist');
  const est=[];
  if(saude(p).length)est.push(saude(p).map(m=>MALES[m.id].n).join(' e '));
  est.push((p.moral||60)>=65?'está firme':(p.moral||60)>=35?'está abalada':'está no limite');
  diz(est.join(' · ')+'.',saude(p).length?'alerta':'sist');

  const sair=()=>{
    cena.modo=antes==='conversa'?'casa':antes;
    cena.falandoCom=null;dimensionar();
    volta?volta():menuComodo(cena.casa?cena.casa.voce:4);
  };
  const menu=()=>{
    AC.innerHTML='';
    ASSUNTOS.filter(x=>x.sempre||(x.cond&&x.cond())).forEach(x=>{
      botao('— '+x.n,async()=>{
        AC.innerHTML='';
        diz('— '+x.n,'fraco');
        await pausa(500);
        const f=falaDo(p,x.id);
        diz(f,f.startsWith('[')?'narr':'fala');
        if(!S.semVoz&&A.n&&chance(.85)){
          const vz=vozDe(p);
          await falarV5(f.replace(/^\[|\]$/g,''),
            {vozIdx:vz.vozIdx,pitch:vz.pitch,rate:vz.rate,dist:'perto',pessoa:p});
        }
        /* conversar aproxima e revela */
        mexerMoral(6,p);
        p.conversas=(p.conversas||0)+1;
        if(chance(.35)&&typeof talvezRevelar==='function')talvezRevelar(p);
        else if(chance(.30)&&typeof liberarPerguntaLocal==='function')liberarPerguntaLocal(p);
        await pausa(600);
        menu();
      },{custo:''});
    });
    botao('Sair de perto',sair,{cls:'chave'});
  };
  menu();
}

 {id:'saude',q:()=>saude().length>0,uma:true,

 {id:'gente',q:()=>S.abrigo.length>=1,uma:true,

 {id:'expedicao',q:()=>S.dia>=2&&S.hora<=10,uma:true,

  S.guiaVisto=S.guiaVisto||[];

  S.guiaVisto.push(p.id);
  diz('— '+p.t,'sist');

/* ================= A PRIMEIRA NOITE =================
   Em vez de tutorial, uma noite que ensina sozinha. */
async function abertura(){

  S.abriuJogo=true;
  limpar();AC.innerHTML='';cena.modo='vazio';dimensionar();
  await pausa(900);

  await pausa(1100);

   'Você trancou a porta faz três dias e não abriu mais.',
   'O gerador no barracão roda a noite inteira. O barulho dele enche a rua e faz uma casa parecer com a outra — é por isso que ele importa mais que a luz.',

   'E de noite alguém bate.',

   'Não tem como saber olhando. Só dá pra checar, uma coisa de cada vez, e decidir com o que você juntou.'

  for(const l of linhas){diz(l,'narr');await pausa(1500);}
  await pausa(600);

<script>
/* ================= NOITE ================= */
function gastoDiesel(){
  let g=13+S.dia*1.3+S.abrigo.length*1.1;
  if(tem('química'))g*=.8;
  if(S.gerBaixo)g*=.62;
  return Math.round(g);
}
function gastoComida(){
  let c=Math.ceil((S.abrigo.length+1)/2);
  if(tem('cozinha'))c=Math.max(1,c-1);
  return c;
}

async function anoitecer(){
  S.hora=19;limpar();AC.innerHTML='';cena.modo='vazio';
  cap(`Dia ${S.dia} · anoitecer`);
  ligarAmbiente();
  S.chuva=chance(.3);
  if(S.viradaChuva>0){S.viradaChuva--;S.chuva=true;}
  if(S.chuva){
    ligarChuva();
    diz('Começa a chover. A água no telhado abafa a casa inteira — hoje é mais difícil te acharem.','bom');
    S.ruido=Math.max(0,S.ruido-12);
    setTimeout(()=>trovao(),3500+Math.random()*8000);
  }else desligarChuva();
  if(Object.keys(S.tarefas||{}).length||S.resultados.length){
    resolverTarefas();
    if(S.resultados.length){
      diz('O que cada um fez hoje:','sist');
      S.resultados.forEach(r=>diz(r,'narr'));
      S.resultados=[];
      await pausa(900);
    }
  }
  reacaoDaCasa();
  if(S.agua>0){S.agua--;}
  else{mexerMoral(-11);diz('Os galões estão secos. Ninguém dorme bem com sede.','perigo');}
  diz('Vocês tampam as frestas. Alguém confere a tranca três vezes e finge que foi a primeira.','narr');
  await pausa(1200);
  if(S.gerQuebrado){
    diz('O gerador está morto no porão desde ontem. A casa passa a noite muda.','perigo');
    S.ruido=trava(S.ruido+30,0,100);
    atualizarPainel();
    await pausa(1400);
    return invasao(2);
  }
  if(S.viradaChuva>0&&!S.gerQuebrado){
    S.gerSaude=Math.max(0,S.gerSaude-6);
    if(chance(.3))diz('A chuva entra no barracão e o diesel está molhando. O motor tosse mais que ontem.','perigo');
  }
  if(desgastarGerador()){
    desligarGerador();
    diz('No meio da noite o gerador engasga três vezes e para. Queimou alguma coisa lá dentro.','perigo');
    await pausa(1200);reagir('geradorQuebrou');
    anotar('O gerador queimou.');
    S.ruido=trava(S.ruido+25,0,100);
    await pausa(1800);
    diz('Tem uma peça dessas no Hospital Municipal. É o único lugar.','sist');
    await pausa(1200);
    atualizarPainel();
    return chance(.7)?noiteDeCerco():invasao(chance(.5)?2:1);
  }
  /* a batida que você ignorou era real */
  if(S.invadeHoje){S.invadeHoje=false;
    diz('Aquelas três batidas nos fundos eram reais. Ela já está dentro.','perigo');
    return invasao(1);}
  const g=gastoDiesel();S.diesel-=g;
  if(S.diesel<=0){S.diesel=0;atualizarPainel();return semDiesel();}
  atualizarPainel();
  diz(`Gerador ligado a noite toda. −${g} litros.${S.gerBaixo?' (rodando baixo)':''}`,'sist');
  if(S.gerBaixo)S.ruido=trava(S.ruido+9,0,100);
  ganhou({diesel:-g});
  await pausa(1000);S.hora=22;

  if(S.saq&&S.saq.fase===3&&!S.saq.tregua&&S.dia>=7&&chance(.55)){
    await cercoSaqueador();
    await pausa(900);
  }
  /* algumas noites são de agir, não de investigar */
  if(chance(trava(.10+memAnom().nivel*.05+(S.dia>=6?.06:0),.08,.34))){
    await anomaliaAtiva(null);
  }else if(chance(.55))await eventoNoturno();
  if(infiltradoNoPrazo()&&chance(.6))return aberturaPorDentro();
  if(moralMedia()<20&&S.abrigo.length&&chance(.5)){
    const p=sortear(S.abrigo);
    if(S.porta.tranca){
      metalPesado(0);
      diz(`Três da manhã. ${p.n} está puxando a barra de ferro com as duas mãos e a barra não sai. Você acorda com o barulho e tira ele de lá.`,'sist');
      mexerMoral(-6,p);
      await pausa(1600);return seguirNoite();
    }
    batida(2,.7);
    diz(`Três da manhã. Você acorda com o som da tranca. ${p.n} está com a mão nela.`,'perigo');
    await pausa(1500);AC.innerHTML='';
    botao(`Parar ${p.n}`,async()=>{
      mexerMoral(-8,p);mexerMoral(4);
      diz(`Vocês lutam em silêncio no escuro. ${p.n} desiste e chora sentado até amanhecer.`,'sist');
      await pausa(1400);seguirNoite();
    });
    botao('Deixar acontecer',async()=>{
      rugido(.4);
      morreuAlguem(p,`abriu a tranca de madrugada na noite ${S.dia} e saiu`);
      mexerMoral(-12);S.ruido=trava(S.ruido+22,0,100);
      diz(`${p.n} abre. Não entra nada. ${p.n} sai. A porta bate sozinha depois de um tempo.`,'perigo');
      await pausa(1500);seguirNoite();
    },{cls:'prim'});
    return;
  }
  seguirNoite();
}

async function seguirNoite(){
  atualizarPainel();
  let visitas=chance(.68)?1:(chance(.35)?2:0);
  if(S.avisoRadio==='ruim')visitas=Math.max(visitas,1);
  S.filaVisitas=visitas;
  if(!visitas){
    diz('Ninguém bate. Isso devia ser bom.','narr');
    await pausa(1400);
    return checarInvasao();
  }
  cenaPorta();
}
function resolverNoite(){
  S.filaVisitas--;
  if(S.filaVisitas>0){S.hora=3;return cenaPorta();}
  return checarInvasao();
}

async function checarInvasao(){
  if(S.dia>1&&chance(riscoInvasao()))return invasao();
  desligarDrone();
  await talvezSonhar();
  S.hora=5;limpar();AC.innerHTML='';cena.modo='vazio';
  cap('Amanhecer');
  diz('O céu fica cinza antes de ficar claro. Vocês sobreviveram a mais uma.','bom');
  await pausa(900);
  if(S.dia>=3&&S.dia%ritmoQueda()===0&&!S.viradaEsvaziou)await caiUmaCasa();
  salvar();
  if(!S.abrigo.length&&S.jaTeveGente&&!S.ultimoAvisado){S.ultimoAvisado=true;reagir('ultimoMorreu');}
  if(S.abrigo.length)S.jaTeveGente=true;
  if(S.dia>=12&&!S.diaLivre)return telaResgate();
  if(S.diaLivre&&S.proxResgate&&S.dia>=S.proxResgate&&chance(.55)){
    S.proxResgate=null;S.diaLivre=false;
    return telaResgate();
  }
  await pausa(600);
  botao('Continuar',()=>{S.dia++;cenaDia();},{cls:'chave'});
}

async function telaResgate(){
  limpar();AC.innerHTML='';cena.modo='vazio';
  cap('Décimo terceiro dia');
  diz('Passa um caminhão do Exército na rua, devagar, com um homem em pé na caçamba gritando pra quem estiver vivo aparecer.','bom');
  await pausa(2000);
  if(S.confianca<25&&S.abrigo.length>=2){
    diz('Os outros saem na frente e sobem primeiro. Quando você chega na traseira, ninguém abre espaço.','perigo');
    await pausa(1800);
    return fim('virou');

  diz('Você tem uns quarenta segundos pra decidir.','sist');
  AC.innerHTML='';
  botao('Subir com todo mundo',()=>fim(S.abrigo.length>=3?'cheia':S.abrigo.length?'sozinho':'ninguem'),{cls:'prim'});
  botao('Deixar o caminhão ir embora',async()=>{
    limpar();cap('Você ficou');
    diz('Você vê a poeira baixar na rua e entra de novo. Tranca a porta atrás de você.','narr');
    await pausa(1800);
    diz('A casa é sua. Enquanto o gerador roncar, ela continua sendo.','sist');

    S.proxResgate=S.dia+9+Math.floor(Math.random()*5);
    diz('Ele disse que passa de novo. Não disse quando.','fraco');
    AC.innerHTML='';
    botao('Continuar vivendo',()=>cenaDia(),{cls:'chave'});
  },{custo:'o jogo continua sem fim'});
}

async function semDiesel(){
  desligarGerador();limpar();AC.innerHTML='';cena.modo='vazio';

async function invasao(qtd){
  marcarNoite({invasao:true});
  const B=sortearBicho();
  qtd=qtd||(B.dois?2:(riscoInvasao()>.45?2:1));
  desligarDrone();
  limpar();AC.innerHTML='';cena.modo='casa';ambientePorao();
  const inicio=cena.casa?cena.casa.voce:7;
  cena.casa={voce:inicio,monstro:7,monstro2:qtd>1?5:null,visivel:true};
  const I={escondido:false,ruidoEm:null,memoria:0,folego:folegoPorta()+B.folego*-1,
    bloqueio:null,bloqTurnos:0,acompanha:[],escondidos:[],bicho:B};
  I.folego=Math.max(1,folegoPorta()-B.folego);
  cap('Dentro de casa');
  batida(5,1.35);
  const r=S.porta.reforco;
  diz(r>=4?'Levaram muito tempo pra arrancar as tábuas. Você teve tempo de acordar todo mundo.'
    :r>=2?'As tábuas cedem uma de cada vez. A porta racha no meio.'
    :'A porta racha no primeiro empurrão. Não bateram dessa vez. Entraram.','perigo');
  danificarPorta(60);S.porta.reforco=Math.max(0,S.porta.reforco-2);
  await pausa(1500);
  diz(`Você aguenta ${I.folego} ${I.folego===1?'encontro':'encontros'} com ele antes de acabar.`,'sist');
  await pausa(900);
  if(S.armadilha){
    rugido(1.4);
    diz('A armadilha do quintal pega. Alguma coisa berra lá fora e a que entrou vem mancando.','bom');
    I.lento=true;
  }
  assinatura(B.id,0,1);
  await pausa(2200);
  diz('É '+B.n+'.',B.id==='primordial'?'perigo':'sist');
  diz(B.ap,B.id==='primordial'?'perigo':'narr');
  if(B.id==='primordial'){
    silencioSubito(3);await pausa(2600);
    diz('Nada que você construiu importa hoje. Corre.','perigo');
  }else{await pausa(1400);diz(B.fraco,'bom');}
  if(qtd>1)diz('São dois. Você ouve dois pesos diferentes andando na casa.','perigo');
  if(S.cachorro&&S.cachorro.vivo){
    latido(0,true);
    diz(`${S.cachorro.n} late e se joga em cima da coisa. Você ganha um tempo que ninguém te daria.`,'bom');
    if(chance(.5)){S.cachorro.vivo=false;
      diz(`Depois o latido para.`,'perigo');mexerMoral(-8);
      anotar(`${S.cachorro.n} morreu na invasão.`);}
  }
  await pausa(900);
  if(S.abrigo.length)return escolherQuemVem(I,qtd);
  diz('Chegue ao QUINTAL. Ele caça pelo som — corra e ele te acha, rasteje e ele te perde.','sist');
  await pausa(900);
  cena.casa.visivel=false;
  turnoJogador(I);
}

function escolherQuemVem(I,qtd){
  AC.innerHTML='';
  diz('Todo mundo está acordado e olhando pra você.','sist');
  botao('Mandar todo mundo se esconder',()=>{
    I.escondidos=S.abrigo.slice();
    diz('Eles se enfiam nos armários e embaixo das camas. Você vai sozinho pro quintal.','narr');
    comecarFuga(I);
  },{custo:'cada um por si'});
  botao('Levar todo mundo comigo',()=>{
    I.acompanha=S.abrigo.slice();
    diz('Vocês correm juntos. Sete pés no assoalho fazem barulho de sete pés.','perigo');
    comecarFuga(I);
  },{custo:'mais barulho'});
  if(S.abrigo.length>=2)botao('Levar só quem corre',()=>{
    I.acompanha=S.abrigo.filter(p=>p.moral>=40||p.hab==='corrida');
    I.escondidos=S.abrigo.filter(p=>!I.acompanha.includes(p));
    diz('Você escolhe quem aguenta correr. Os outros ficam onde dá.','sist');
    comecarFuga(I);
  },{cls:'prim'});
}

async function comecarFuga(I){
  AC.innerHTML='';
  await pausa(1400);
  diz(`Chegue ao QUINTAL. Correr faz barulho e ele lembra por dois turnos. Rastejar é lento e silencioso.`,'sist');
  await pausa(900);
  cena.casa.visivel=false;
  turnoJogador(I);
}

function turnoJogador(I){
  const c=cena.casa;AC.innerHTML='';
  const vz=vizinhos(c.voce);
  vz.forEach(n=>botao('Correr para '+PLANTA[n].nome,()=>mover(I,n,false),{custo:'faz barulho'}));
  vz.filter(n=>n!==c.monstro).forEach(n=>botao('Rastejar até '+PLANTA[n].nome,()=>mover(I,n,true),{custo:'silêncio'}));
  if(PLANTA[c.voce].esconde)botao('Se esconder aqui',()=>esconder(I));
  if(!I.bloqueio)botao('Empurrar o armário na passagem',()=>bloquear(I),{custo:'trava 3 turnos'});
  botao('Escutar onde ele está',()=>escutar(I),{custo:'perde um turno'});
  if(S.lanterna&&distancia(c.voce,c.monstro)<=1)
    botao('Acender a lanterna na cara dele',()=>usarLanterna(I),{cls:'prim',custo:'só uma vez'});
  if(S.coquetel>0&&distancia(c.voce,c.monstro)<=1)
    botao('Jogar uma garrafa nele',async()=>{
      AC.innerHTML='';S.coquetel--;
      diz('O vidro estoura na parede e o corredor pega fogo. Ele recua berrando.','bom');
      I.lento=true;cena.casa.monstro=0;I.memoria=0;I.ruidoEm=null;
      await pausa(1600);turnoJogador(I);
    },{cls:'prim',custo:'gasta 1 garrafa'});
}

async function bloquear(I){
  AC.innerHTML='';
  I.bloqueio=cena.casa.voce;I.bloqTurnos=(I.bicho&&I.bicho.id==='inchado')?6:3;
  I.ruidoEm=cena.casa.voce;
  const t=A.ctx?A.ctx.currentTime:0;
  arranhao(0,1.2);
  diz('Você empurra o que tem de mais pesado contra o vão. Faz um barulho horrível e vale a pena.','sist');
  await pausa(1500);
  await turnoMonstro(I);
}

async function escutar(I){
  AC.innerHTML='';const c=cena.casa;
  const d=distancia(c.voce,c.monstro),pan=panDe(c.voce,c.monstro);
  passo(trava(1.1-d*.22,.2,1),pan);await pausa(380);
  passo(trava(1-d*.22,.15,.9),pan);
  diz(d===0?'Ele está no mesmo cômodo que você. Não se mexa.'
     :d===1?`Passos do lado ${pan<0?'esquerdo':pan>0?'direito':'de lá'}. Muito perto.`
     :d===2?'Ele revira alguma coisa a dois cômodos daqui.'
     :'Longe. Do outro canto da casa.',d<=1?'perigo':'narr');
  c.visivel=true;setTimeout(()=>{c.visivel=false},2400);
  I.ruidoEm=null;await pausa(1300);
  await turnoMonstro(I);
}

async function usarLanterna(I){
  AC.innerHTML='';S.lanterna=false;
  const c=cena.casa;
  diz('Você acende o facho na direção dele. A coisa se encolhe e recua três cômodos de uma vez.','bom');
  c.monstro=0;I.ruidoEm=null;
  await pausa(1600);
  turnoJogador(I);
}

async function mover(I,dest,rastejar){
  AC.innerHTML='';I.escondido=false;
  const antes=cena.casa.voce;cena.casa.voce=dest;
  if(rastejar){
    if(!I.acompanha.length)I.memoria=0,I.ruidoEm=null;
    else{I.memoria=1;I.ruidoEm=dest;}
    if(I.bicho&&I.bicho.vel<.8&&chance(.35)){
      diz('Ele é lento. Você ganha uma passada de vantagem.','bom');
      I.memoria=Math.max(0,I.memoria-1);
    }
    diz(I.acompanha.length
      ?'Vocês se arrastam. Alguém esbarra em alguma coisa no escuro.'
      :'Você se arrasta. As tábuas quase não reclamam.','narr');
    await pausa(1400);
  }else{
    I.ruidoEm=dest;I.memoria=I.bicho?I.bicho.mem:2;passo(1,panDe(antes,dest));
    diz(I.acompanha.length
      ?`Vocês correm. ${I.acompanha.length+1} pares de pés no assoalho.`
      :'Você corre. O assoalho grita o seu caminho inteiro.','perigo');
    if(I.acompanha.length)I.memoria=(I.bicho?I.bicho.mem:2)+1;
    await pausa(650);
  }
  if(PLANTA[dest].saida)return escapou(I);
  await turnoMonstro(I);
}

async function esconder(I){
  AC.innerHTML='';I.escondido=true;I.ruidoEm=null;
  diz('Você se enfia no vão e para de respirar.','narr');
  await pausa(1400);
  await turnoMonstro(I);
}

function moverMonstro(pos,I){
  let opts=vizinhos(pos);
  if(I.bloqTurnos>0&&I.bloqueio!==null)opts=opts.filter(o=>o!==I.bloqueio);
  if(!opts.length)return pos;
  if(I.memoria>0&&I.ruidoEm!==null){
    let melhor=pos,d=99;
    opts.forEach(o=>{const dd=distancia(o,I.ruidoEm);if(dd<d){d=dd;melhor=o;}});
    return melhor;
  }
  return sortear([...opts,pos]);
}

async function turnoMonstro(I){
  /* toda ação do jogador desemboca aqui: é o lugar certo pra
     contar o turno. Sem isso a noite não terminava nunca. */
  I.turno=(I.turno||0)+1;
  const c=cena.casa;
  if(I.bloqTurnos>0)I.bloqTurnos--;
  if(I.lento&&chance(.3)){
    diz('Você ouve ele parar e arrastar a perna ferida. Ganhou tempo.','bom');
    await pausa(900);return turnoJogador(I);
  }
  c.monstro=moverMonstro(c.monstro,I);
  if(c.monstro2!=null)c.monstro2=moverMonstro(c.monstro2,I);
  if(I.memoria>0)I.memoria--;
  if(I.memoria===0)I.ruidoEm=null;
  const perto=(c.monstro2!=null&&distancia(c.voce,c.monstro2)<distancia(c.voce,c.monstro))?c.monstro2:c.monstro;
  const pan=panDe(c.voce,perto),dist=distancia(c.voce,perto);
  passo(trava(1-dist*.24,.15,1),pan);
  if(c.monstro2!=null){
    await pausa(200);
    passo(trava(1-distancia(c.voce,c.monstro)*.24,.12,.8),panDe(c.voce,c.monstro));
  }
  await pausa(430);
  if(c.monstro===c.voce||c.monstro2===c.voce){
    c.visivel=true;
    /* esconder era 60% e o resto era encontro perdido. Agora o
       cômodo importa e ficar parado de propósito ajuda. */
    let chanceEsconder=(S.esconderijo&&c.voce===11)?.88:.62;
    if(PLANTA[c.voce]&&PLANTA[c.voce].esconde)chanceEsconder+=.12;
    if(I.ruidoEm==null&&I.memoria<=0)chanceEsconder+=.14;
    if(I.bicho&&I.bicho.id==='rastejante')chanceEsconder-=.15;
    chanceEsconder=trava(chanceEsconder,.35,.94);
    if(I.escondido&&chance(chanceEsconder)){
      arranhao(pan,.8);
      diz('Ele entra. Você ouve a respiração dele a um metro de você por muito tempo. Depois ele sai.','perigo');
      await pausa(2100);c.visivel=false;
    }else{
      I.folego--;
      if(I.folego<=0)return fim('morto');
      rugido(.5,pan);
      const arm=I.acompanha.find(p=>p.armado);
      if(arm&&chance(.55)){
        const a=ITENS.find(i=>i.id===arm.armado);
        diz(`${arm.n} entra na frente com ${a?a.n.toLowerCase():'o que tem na mão'} e acerta ele três vezes. Ele recua.`,'bom');
        c.visivel=false;I.folego++;
        await pausa(1800);return turnoJogador(I);
      }
      const heroi=I.acompanha.length?sortear(I.acompanha):null;
      if(heroi){
        I.acompanha=I.acompanha.filter(p=>p!==heroi);
        morreuAlguem(heroi,`comprou dez segundos com a vida na invasão da noite ${S.dia}`);
        diz(`Ele te alcança. ${heroi.n} aparece com um pé de cabra e compra dez segundos com a vida inteira.`,'perigo');
      }else diz('Ele te alcança. Você acerta a lanterna na altura da boca e ele recua um passo. Um passo é tudo.','perigo');
      await pausa(1900);c.visivel=false;
    }
  }else if(I.bicho&&I.bicho.chama&&chance(.35)&&(S.vozesRoubadas.length||S.abrigo.length)){
    const alvo=S.vozesRoubadas.length?sortear(S.vozesRoubadas).p:sortear(S.abrigo);
    const dest=sortear(vizinhos(c.voce));
    diz(`Você ouve ${alvo.n} chamando você lá do ${PLANTA[dest].nome.toLowerCase()}: “Vem pra cá, é seguro aqui.”`,'perigo');
    diz(alvo.n+(S.abrigo.some(p=>p.n===alvo.n)?' está do outro lado da casa.':' está morto.'),'alerta');
  }else if(dist===1)diz(`Ele está no cômodo ${pan<0?'à esquerda':pan>0?'à direita':'ao lado'}. A madeira vibra.`,'perigo');
  else diz('Você ouve ele longe, revirando alguma coisa.','narr');
  turnoJogador(I);
}

async function escapou(I){
  AC.innerHTML='';cena.modo='vazio';desligarGerador();
  diz('Você pula o muro dos fundos e o mato molhado te engole.','bom');
  await pausa(1600);
  if(S.carro){
    diz('O Opala do tio do Wesley está no quintal com a chave na ignição. Pega de primeira.','bom');
    await pausa(1400);
    diz('Cabe todo mundo. Ninguém fica.','bom');
  }else (I.escondidos||[]).forEach(p=>{
    if(chance(.45))morreuAlguem(p,`ficou escondido na casa na invasão da noite ${S.dia}`);
  });
  S.abrigo=(I.acompanha||[]).filter(p=>S.abrigo.includes(p))
    .concat((I.escondidos||[]).filter(p=>S.abrigo.includes(p)));
  const salvos=S.abrigo.length;
  diz(salvos?`${salvos===1?'Uma pessoa vem':salvos+' pessoas vêm'} atrás de você. O resto ficou.`
    :'Ninguém vem atrás de você.','narr');
  await pausa(1300);
  diz('A casa fica pra trás com a luz ainda acesa. Alguma coisa continua batendo na porta, chamando um nome que era seu.','narr');
  await pausa(1100);
  botao('Ver o que sobrou',()=>fim('fuga'),{cls:'chave'});
}

/* ================= MODO APLICATIVO ================= */
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
let _wake=null;
async function segurarTela(){
  try{if('wakeLock'in navigator){_wake=await navigator.wakeLock.request('screen');
    _wake.addEventListener('release',()=>{_wake=null;});}}catch(e){}
}
async function telaCheia(){
  try{const el=document.documentElement;
    if(!document.fullscreenElement&&el.requestFullscreen)await el.requestFullscreen({navigationUI:'hide'});
    if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('portrait').catch(()=>{});
  }catch(e){}
}
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='hidden'){
    calar();if(A.ctx&&A.ctx.state==='running')A.ctx.suspend();
  }else{
    if(A.ctx&&A.ctx.state==='suspended'&&S.nomeJogador)A.ctx.resume();
    if(!_wake&&S.nomeJogador)segurarTela();
  }
});

function pedirNome(b){
  b.innerHTML=`<h1 style="font-size:clamp(30px,10vw,44px)">Como<em>te chamam?</em></h1>
    <input id="nm" maxlength="14" placeholder="seu nome" autocomplete="off"
      style="background:#16131A;border:1px solid #322A38;color:#E8E2D4;padding:14px;
      font-family:'Crimson Pro',serif;font-size:20px;text-align:center;width:260px;max-width:80vw">
    <p class="aviso">Elas vão aprender isso.</p>
    <button class="chave" id="go" style="max-width:280px">Trancar a porta</button>`;
  setTimeout(()=>$('#nm').focus(),200);
  const ir=()=>{
    S.nomeJogador=($('#nm').value||'Você').trim().slice(0,14);
    S.pool=PESSOAS.map(p=>({...p,moral:70,lacos:{}}));
    iniciarCasas();
    b.remove();dimensionar();requestAnimationFrame(laco);
    montarSetas();montarBarra();aplicarCfg();ligarVigia();ligarFone();
    ligarGerador();ligarAmbiente();
    anotar('Você trancou a porta pela primeira vez.');
    abertura().then(()=>cenaDia());
  };
  $('#go').onclick=ir;
  $('#nm').addEventListener('keydown',e=>{if(e.key==='Enter')ir();});
}
