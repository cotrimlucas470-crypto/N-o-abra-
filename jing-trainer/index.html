<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#05060a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Sistema geral de treino para Honor of Kings — mecânica, precisão, percepção, reflexo, decisão, controle sob pressão e movimentação, com rotas afinadas para Jing e Luna.">
<title>ESPELHO · Treino HoK</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="fundo"></div>

<div id="girar">
  <div>
    <div class="ic">📱</div>
    <h2 style="margin:12px 0 6px">Vire o aparelho</h2>
    <p class="mini">Este painel foi desenhado para a tela deitada, do mesmo jeito que você joga.</p>
  </div>
</div>

<div id="app">
  <nav id="rail">
    <div class="marca"><b>◈</b>ESPELHO</div>
    <button class="railbtn on" data-tela="agora"><span class="ic">◉</span><span class="tx">Agora</span></button>
    <button class="railbtn" data-tela="herois"><span class="ic">❖</span><span class="tx">Heróis</span></button>
    <button class="railbtn" data-tela="estado"><span class="ic">◈</span><span class="tx">Estado</span></button>
    <button class="railbtn" data-tela="progresso"><span class="ic">▤</span><span class="tx">Progresso</span></button>
    <button class="railbtn" data-tela="hud"><span class="ic">✥</span><span class="tx">HUD</span></button>
    <button class="railbtn" data-tela="metodo"><span class="ic">✎</span><span class="tx">Método</span></button>
    <button class="railbtn" data-tela="config"><span class="ic">⚙</span><span class="tx">Config</span></button>
  </nav>

  <div id="main">
    <section class="tela on" id="tela-agora"></section>
    <section class="tela" id="tela-herois"></section>
    <section class="tela" id="tela-estado"></section>
    <section class="tela" id="tela-progresso"></section>
    <section class="tela" id="tela-hud"></section>
    <section class="tela" id="tela-metodo"></section>
    <section class="tela" id="tela-config"></section>

    <section id="treino">
      <div class="tfaixa">
        <button class="sair" id="tf-sair">✕</button>
        <div class="nome" id="tf-nome">—</div>
        <div class="flex wrap espaco" id="tf-chips"></div>
      </div>
      <div id="palco">
        <canvas id="hudcv"></canvas>
        <div id="dica"></div>
        <div id="fb"></div>

        <div id="brief">
          <div class="corpo" id="brief-corpo"></div>
          <div class="pe">
            <button class="btn sec sm" id="brief-volta">Voltar</button>
            <button class="btn full" id="brief-ir">Começar</button>
          </div>
        </div>

        <div id="res">
          <div class="corpo rolagem" id="res-corpo"></div>
          <div class="pe"></div>
        </div>
      </div>
    </section>
  </div>
</div>

<div id="toast"></div>
<div id="modal"><div class="cx" id="modal-cx"></div></div>

<script src="js/util.js"></script>
<script src="js/estat.js"></script>
<script src="js/ciencia.js"></script>
<script src="js/musica.js"></script>
<script src="js/hud.js"></script>
<script src="js/toque.js"></script>
<script src="js/conteudo.js"></script>
<script src="js/modelo.js"></script>
<script src="js/controlador.js"></script>
<script src="js/gemeo.js"></script>
<script src="js/evolucao.js"></script>
<script src="js/indice.js"></script>
<script src="js/otimiza.js"></script>
<script src="js/escada.js"></script>
<script src="js/engines.js"></script>
<script src="js/mapa.js"></script>
<script src="js/motor-mapa.js"></script>
<script src="js/motor-mira.js"></script>
<script src="js/motor-reset.js"></script>
<script src="js/motor-punir.js"></script>
<script src="js/motor-antecipa.js"></script>
<script src="js/emblema.js"></script>
<script src="js/herois.js"></script>
<script src="dados/herois/_roster.js"></script>
<script src="dados/herois/jing.js"></script>
<script src="dados/herois/_funcoes.js"></script>
<script src="dados/herois/_tier.js"></script>
<script src="dados/herois/_stats.js"></script>
<script src="dados/herois/_habilidades.js"></script>
<script src="dados/herois/_builds.js"></script>
<script src="dados/itens/_catalogo.js"></script>
<script src="js/pratica.js"></script>
<script src="js/drills.js"></script>
<script src="js/decisao.js"></script>
<script src="js/graf.js"></script>
<script src="js/ui.js"></script>
<script src="js/cartas.js"></script>
<script src="js/treino.js"></script>
<script src="js/app.js"></script>
</body>
</html>
